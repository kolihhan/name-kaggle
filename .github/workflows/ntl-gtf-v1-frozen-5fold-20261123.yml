name: NTL GTF-v1 genuine class-conditioned token transition causal test, CPU
on:
  push:
    branches: [research/ntl-generative-transition-fingerprint-v1-20261123]
    paths: [.github/workflows/ntl-gtf-v1-frozen-5fold-20261123.yml]
permissions: {contents: read}
concurrency:
  group: ntl-generative-transition-fingerprint-v1-20261123
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify frozen contract; prepare CPU-only dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/research/ntl-generative-transition-v1-contract-20261123.md
          python -m py_compile scripts/ntl_generator_transition_fingerprint_v1_20261123.py
          python -m pip install -q --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.13,<2' 'scikit-learn>=1.4,<2' 'pandas>=2,<3' threadpoolctl
      - name: Real 18-class fixed five-fold model-fit and negative control (TRAIN only)
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.ntl_generator_transition_fingerprint_v1_20261123
          echo NTL_GTF_V1_NO_GPU_NO_TEST_NO_KAGGLE_SUBMISSION=TRUE
