name: One-shot submit public Evgen NTL forensic notebook to our Kaggle account
on:
  push:
    branches:
      - work/ntl-user-forensic-eda-20261123
    paths:
      - .github/workflows/ntl-evgen-submit-once-20261123.yml
permissions:
  contents: read
concurrency:
  group: ntl-evgen-public-20261123-one-shot
  cancel-in-progress: false
jobs:
  exact-public-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Kaggle CLI
        run: python -m pip install -q 'kaggle==2.2.5' 'six==1.17.0'
      - name: Freeze, private fork, preview and one official Code Competition submission
        shell: bash
        run: |
          set -euo pipefail
          : "${KAGGLE_API_TOKEN:?KAGGLE_API_TOKEN secret missing}"
          python -u - <<'PY'
          import json, hashlib, os, re, subprocess, sys, time
          from pathlib import Path
          src='evgendvorkin/name-that-llm-deep-forensic-eda-with-analogie'
          dst='kolihhan/ntl-evgen-forensic-eda-repro-20261123'
          target='name-that-llm'
          message='Owner-requested public Evgen forensic EDA inference reproduction 2026-11-23'
          folder=Path('/tmp/ntl_evgen_submit')
          folder.mkdir(parents=True,exist_ok=True)
          def run(args,timeout=180,check=True):
              p=subprocess.run(args,capture_output=True,text=True,timeout=timeout)
              msg=(p.stdout+'\n'+p.stderr).strip()
              if msg: print('COMMAND', args[:3], 'OUTPUT_TAIL',msg[-1500:],flush=True)
              if check and p.returncode: raise RuntimeError('command failed: '+repr(args[:3]))
              return p,msg
          # Unique destination slug is a one-shot idempotency gate.
          p,s=run(['kaggle','kernels','status',dst],check=False)
          if p.returncode==0:
              raise SystemExit('DESTINATION_ALREADY_EXISTS: no rerun, no duplicate competition submission')
          run(['kaggle','kernels','pull',src,'-p',str(folder),'-m'])
          nb=folder/'name-that-llm-deep-forensic-eda-with-analogie.ipynb'
          meta=folder/'kernel-metadata.json'
          assert nb.exists() and meta.exists(), 'Pull did not produce notebook and metadata'
          sha=hashlib.sha256(nb.read_bytes()).hexdigest()
          print('ORIGINAL_SOURCE_SHA256',sha,flush=True)
          assert sha=='74d86affa9f55464ab39f735f392b54e47e2d8a2b631a0bca45de9435c600c56', 'Public notebook changed since verified source audit; abort'
          parsed=json.loads(nb.read_text())
          code='\n'.join(''.join(c.get('source',[])) if isinstance(c.get('source',[]),list) else str(c.get('source','')) for c in parsed.get('cells',[]) if c.get('cell_type')=='code')
          assert 'submission.parquet' in code and '.to_parquet(' in code and 'test.csv' in code, 'Source is not a scoring notebook'
          m=json.loads(meta.read_text())
          print('ORIGINAL_METADATA',json.dumps({k:(len(v) if isinstance(v,list) else v) for k,v in m.items() if k not in ['dataset_sources','kernel_sources','model_sources']},default=str)[:3000],flush=True)
          assert m.get('language','python').lower()=='python'
          assert m.get('kernel_type','notebook')=='notebook'
          m.pop('id_no',None)
          m['id']=dst
          m['title']='ntl evgen forensic eda repro 20261123'
          m['is_private']=True
          m['enable_internet']=False
          if target not in m.get('competition_sources',[]):
              m['competition_sources']=list(dict.fromkeys(m.get('competition_sources',[])+[target]))
          meta.write_text(json.dumps(m,indent=2)+'\n')
          p,s=run(['kaggle','kernels','push','-p',str(folder)],timeout=300)
          ver_match=re.search(r'[Kk]ernel version\s*(\d+)',s)
          version=int(ver_match.group(1)) if ver_match else 1
          print('PUSHED_PRIVATE_KERNEL',dst,'VERSION',version,flush=True)
          for i in range(960):
              _,status=run(['kaggle','kernels','status',dst],timeout=45)
              l=status.lower()
              if 'complete' in l or 'success' in l:
                  print('PREVIEW_COMPLETE',flush=True); break
              if any(x in l for x in ['error','failed','cancelled','canceled']):
                  raise RuntimeError('PREVIEW_FAILED: no official submission')
              if i%12==0: print('PREVIEW_PENDING_CYCLE',i,flush=True)
              time.sleep(15)
          else: raise TimeoutError('Preview did not complete within polling budget')
          _,files=run(['kaggle','kernels','files',dst],timeout=90)
          if not re.search(r'(^|\s)submission\.parquet(\s|$)',files,re.M):
              raise RuntimeError('NO_SUBMISSION_PARQUET: refuse Kaggle competition submission')
          # On a unique private fork, version comes from push; never submit parent/foreign account.
          _,receipt=run(['kaggle','competitions','submit',target,'-k',dst,'-v',str(version),'-f','submission.parquet','-m',message],timeout=180)
          print('OFFICIAL_COMPETITION_SUBMISSION_REQUEST_ACCEPTED',flush=True)
          print('OFFICIAL_RECEIPT_TAIL',receipt[-1700:],flush=True)
          _,ledger=run(['kaggle','competitions','submissions',target],timeout=90,check=False)
          print('OFFICIAL_LEDGER_TAIL',ledger[:2500],flush=True)
          PY
