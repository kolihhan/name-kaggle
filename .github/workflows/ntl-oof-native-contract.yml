name: NTL pinned upstream score and nested fold contract audit
on:
  push:
    branches: [research/ntl-ensemble-decomposition-20261127]
    paths: ['.github/workflows/ntl-oof-native-contract.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/ntl_oof_native_contract_20261127.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Inspect exact public scorer and actual fold cache schemas
        run: |
          set -euo pipefail
          test ! -e data/train.csv
          python -m pip install -q kaggle==2.2.5 six==1.17.0 numpy pandas
          python scripts/ntl_oof_native_contract_20261127.py
