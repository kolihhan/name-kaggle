name: NTL V47 Live Private Preflight and My Submissions Read Only
on:
  push:
    branches: [exp/dct-temporal-fingerprint-v3]
    paths: [.github/workflows/ntl-v47-live-scoring-status.yml]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q 'kaggle==2.2.5' 'six==1.17.0'
      - name: Actual private kernel status, official competition submissions
        run: |
          set -euo pipefail
          kaggle kernels status kolihhan/ntl-lightning-v47-genuine-preflight-20261105 || true
          echo MY_PRIVATE_V47_KERNELS
          kaggle kernels list --mine -v | grep -Ei 'ntl-lightning|ntl-private-permission' | head -12 || true
          kaggle competitions submissions name-that-llm -v -q > /tmp/my-submissions.csv
          python - <<'PY'
          import csv,json
          with open('/tmp/my-submissions.csv') as f:rows=list(csv.DictReader(f))
          rows.sort(key=lambda x:int(x['ref']),reverse=True)
          print('CURRENT_OFFICIAL_SUBMISSIONS',len(rows))
          for r in rows[:4]:
              print('MY_SUBMISSION',json.dumps({k:r.get(k) for k in ('ref','status','publicScore','description','date')},sort_keys=True))
          PY
