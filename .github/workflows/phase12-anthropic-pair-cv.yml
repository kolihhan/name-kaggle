name: Phase 12 frozen HealthBench Anthropic pair CV

on:
  push:
    branches:
      - exp/first-kaggle-submission
    paths:
      - .github/workflows/phase12-anthropic-pair-cv.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cv:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen CV and source dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'datasets>=3,<5' 'huggingface_hub>=0.30,<3'

      - name: Materialize immutable HealthBench v1.0.0 responses
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from datasets import load_dataset
          from huggingface_hub import HfApi

          repo_id = 'mindbench-ai/healthbench-psych'
          tag = 'v1.0.0'
          expected_sha = '7a116ea7b4fefe0c72eabb8398ec390c6375f823'

          info = HfApi().dataset_info(repo_id, revision=tag)
          if info.sha != expected_sha:
              raise SystemExit(f'v1.0.0 revision drifted: {info.sha} != {expected_sha}')

          ds = load_dataset(repo_id, 'responses', split='train', revision=tag)
          frame = ds.to_pandas()
          output_path = Path('/tmp/healthbench_psych_v1_responses.parquet')
          frame.to_parquet(output_path, index=False)

          out = Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a', encoding='utf-8') as handle:
              handle.write(f'sha={info.sha}\n')
              handle.write(f'parquet={output_path}\n')
          print('resolved_sha:', info.sha)
          print('rows:', len(frame))
          PY

      - name: Re-run frozen admission gate and extract pair responses
        shell: bash
        run: |
          set -euo pipefail
          python scripts/phase12_audit_healthbench_anthropic.py \
            --responses-parquet '${{ steps.source.outputs.parquet }}' \
            --official-train data/train.csv \
            --admitted-external data/external/gpt_gemini_generations.parquet \
            --source-revision '${{ steps.source.outputs.sha }}' \
            --output /tmp/phase12_healthbench_anthropic_audit.json \
            --responses-output /tmp/phase12_healthbench_anthropic_responses.parquet
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          report = json.loads(Path('/tmp/phase12_healthbench_anthropic_audit.json').read_text())
          responses = pd.read_parquet('/tmp/phase12_healthbench_anthropic_responses.parquet')
          assert report['decision']['training_authorized'] is True
          assert report['extraction']['retained_rows_by_model'] == {
              'claude-opus-5': 600,
              'claude-sonnet-5': 610,
          }
          assert len(responses) == 1210
          assert responses['text'].nunique() == 1210
          assert set(responses['model'].astype(str)) == {
              'claude-opus-5',
              'claude-sonnet-5',
          }
          print('admission gate: PASS; responses:', len(responses))
          PY

      - name: Run the one frozen Phase 12 permanent-fold shot
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.run_phase12_anthropic_pair_specialist \
            --healthbench-external /tmp/phase12_healthbench_anthropic_responses.parquet \
            --output /tmp/phase12_anthropic_pair_specialist.json \
            --oof-output /tmp/phase12_anthropic_pair_specialist_oof.csv
          echo '--- PHASE12_RESULT ---'
          cat /tmp/phase12_anthropic_pair_specialist.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/phase12_anthropic_pair_specialist.json').read_text())
          print('phase7_ba:', report['phase7_reference']['balanced_accuracy'])
          print('phase12_ba:', report['phase12_final']['balanced_accuracy'])
          print('pair_mean_recall:', report['pair_mean_recall'])
          print('decision:', report['decision'])
          assert report['invariants']['other_16_recalls_exactly_preserved'] is True
          assert report['invariants']['every_changed_prediction_stays_inside_pair'] is True
          PY

      - name: Upload frozen Phase 12 result bundle
        uses: actions/upload-artifact@v4
        with:
          name: phase12-healthbench-anthropic-pair-frozen-shot
          path: |
            /tmp/phase12_healthbench_anthropic_audit.json
            /tmp/phase12_healthbench_anthropic_responses.parquet
            /tmp/phase12_anthropic_pair_specialist.json
            /tmp/phase12_anthropic_pair_specialist_oof.csv
          retention-days: 30
