name: NTL Ozertuu 58022340 Fresh Official Score Read Only
on:
  push:
    branches: [exp/dct-temporal-fingerprint-v3]
    paths: [.github/workflows/ntl-ozertuu-v3-score-status-20261105-2204.yml]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q kaggle==2.2.5 six==1.17.0
      - name: Exact competition submission 58022340 and My Submissions
        shell: bash
        run: |
          set -euo pipefail
          : "${KAGGLE_API_TOKEN:?Kaggle credential missing}"
          kaggle competitions submission 58022340
          kaggle competitions submissions name-that-llm -v -q > /tmp/ntl.csv
          python - <<'PY'
          import csv,datetime,json
          with open('/tmp/ntl.csv',newline='') as f: rows=list(csv.DictReader(f))
          matches=[r for r in rows if r.get('ref')=='58022340']
          assert len(matches)==1,('Exact submission not found',len(matches))
          r=matches[0]
          print('VERIFIED_AT_UTC',datetime.datetime.now(datetime.timezone.utc).isoformat(),flush=True)
          print('TARGET_SUBMISSION',json.dumps({k:r.get(k) for k in ['ref','status','publicScore','privateScore','date','description']},sort_keys=True),flush=True)
          print('TOTAL_SUBMISSIONS',len(rows),flush=True)
          best=[x for x in rows if x.get('publicScore')]
          if best:
              best.sort(key=lambda x:float(x['publicScore']),reverse=True)
              print('OWN_CURRENT_BEST',json.dumps({k:best[0].get(k) for k in ['ref','status','publicScore','description']},sort_keys=True),flush=True)
          if r.get('publicScore'):
              score=float(r['publicScore'])
              print('ACTUAL_V3_SCORE',score,'DELTA_FROM_0666',round(score-.666,4),flush=True)
          elif 'ERROR' in (r.get('status') or '').upper():
              print('ERROR_NO_SCORE',r.get('status'),flush=True)
          else:
              print('NO_SCORE_YET',r.get('status'),flush=True)
          PY
