name: NTL CDA v2 Real-time Training and Official Submission Status
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-cda-now-verify-official-submit-state.yml]
permissions: {contents: read}
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q kaggle==2.2.5 six==1.17.0
      - name: Read exact C1 C0 GPU states and official ledger - no new work
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          for ref in             kolihhan/ntl-cda-l24-v2-original-source-training-c1/2             kolihhan/ntl-cda-l24-v2-original-source-training-c0-r1/1             kolihhan/ntl-cda-l24-v2-final; do
            echo "CHECKING_KAGGLE_KERNEL $ref"
            kaggle kernels status "$ref" 2>&1 | grep -E 'KernelWorkerStatus\.|version|not found|Error' | tail -6 || true
          done
          kaggle competitions submissions name-that-llm -v -q > /tmp/submission-check.csv
          python - <<'PY'
          import csv,json
          with open('/tmp/submission-check.csv',newline='') as f:rows=list(csv.DictReader(f))
          exact=[r for r in rows if 'CDA-L24 v2' in r.get('description','') or
                'source-adversarial LoRA24' in r.get('description','')]
          print('CDA_V2_REAL_OFFICIAL_ENTRIES',len(exact))
          for r in exact:
              print('CDA_V2_OFFICIAL_LEDGER',json.dumps({k:r.get(k) for k in
                  ('ref','status','publicScore','description','date')},sort_keys=True))
          PY
      - name: Read bounded C0 C1 GPU log progress without printing private text
        shell: bash
        run: |
          set -euo pipefail
          for ref in \
            kolihhan/ntl-cda-l24-v2-original-source-training-c1/2 \
            kolihhan/ntl-cda-l24-v2-original-source-training-c0-r1/1; do
            temp_file="$(mktemp)"
            if kaggle kernels logs "$ref" > "$temp_file" 2>/dev/null; then
              python - "$temp_file" "$ref" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path
          source = Path(sys.argv[1])
          size = source.stat().st_size
          with source.open("rb") as f:
              f.seek(max(0, size - 2000000))
              tail = f.read().decode("utf-8", errors="replace")
          # Only numeric progress and milestone booleans; never print training logs, passages or IDs.
          fractions = [(int(a), int(b)) for a,b in re.findall(r"(?<!\d)(\d{1,7})/(\d{1,7})\s*\[", tail)]
          fractions = [(a,b) for a,b in fractions if b > 0 and 0 <= a <= b]
          print("CDA_GPU_SAFE_PROGRESS", json.dumps({
              "ref": sys.argv[2],
              "log_bytes": size,
              "last_tqdm_fraction": fractions[-1] if fractions else None,
              "checkpoint_finished_marker": "CDA_STAGE_A_NEW_PRIVATE_CHECKPOINT" in tail,
              "traceback_marker": "Traceback (most recent call last)" in tail
          }, sort_keys=True))
          PY
            else
              echo "CDA_GPU_SAFE_PROGRESS_UNAVAILABLE $ref"
            fi
            rm -f "$temp_file"
          done
      - name: Validate standby duplicate-preflight response shapes without mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          probes = {
              "checkpoint_dataset": [
                  "kaggle","datasets","status","kolihhan/ntl-cda-l24-v2-c1-weights","--format","json"
              ],
              "final_kernel": [
                  "kaggle","kernels","status","kolihhan/ntl-cda-l24-v2-final"
              ],
          }
          for name, cmd in probes.items():
              p=subprocess.run(cmd,capture_output=True,text=True)
              response=(p.stdout+"\n"+p.stderr).lower()
              print("CDA_STANDBY_PREFLIGHT_SHAPE",json.dumps({
                  "probe":name,
                  "return_code":p.returncode,
                  "contains_notfound_marker":any(s in response for s in (
                      "not found","404","does not exist"
                  )),
                  "contains_kernel_status": "kernelworkerstatus." in response,
                  "response_bytes":len(response)
              },sort_keys=True),flush=True)
          PY
      - name: Check authenticated private resource inventories for standby
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, re, subprocess
          probes=[
              ("dataset", ["kaggle","datasets","list","-m","-s",
                           "ntl-cda-l24-v2-c1-weights","-v"],
               "kolihhan/ntl-cda-l24-v2-c1-weights"),
              ("kernel", ["kaggle","kernels","list","-m","-s",
                          "ntl-cda-l24-v2-final","-v"],
               "kolihhan/ntl-cda-l24-v2-final"),
          ]
          for kind,cmd,ref in probes:
              p=subprocess.run(cmd,capture_output=True,text=True)
              rows=list(csv.DictReader(p.stdout.splitlines())) if p.returncode==0 else []
              exact=sum(any(str(v).lower().strip()==ref for v in row.values())
                        for row in rows)
              error=(p.stdout+"\n"+p.stderr).lower()
              print("CDA_STANDBY_INVENTORY_SHAPE",json.dumps({
                  "kind":kind,"return_code":p.returncode,"rows":len(rows),
                  "fields":list(rows[0])[:12] if rows else [],
                  "exact_ref_matches":exact,
                  "error_flags":{word:(word in error) for word in
                      ("usage:","unrecognized","error","403","404","forbidden",
                       "permission","invalid","not found")},
              },sort_keys=True),flush=True)
          PY
      - name: Diagnose final-kernel dataset attachment and private dataset filenames
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, subprocess, tempfile
          from pathlib import Path
          dataset="kolihhan/ntl-cda-l24-v2-c1-weights"
          kernel="kolihhan/ntl-cda-l24-v2-final"
          def run(argv):
              return subprocess.run(argv, capture_output=True, text=True)
          listing=run(["kaggle","datasets","files",dataset,"-v"])
          files=list(csv.DictReader(listing.stdout.splitlines())) if listing.returncode==0 else []
          print("CDA_V2_DATASET_FILE_INVENTORY",json.dumps({
              "success":listing.returncode==0,
              "file_count":len(files),
              "filenames":[str(row.get("name") or row.get("Name") or "") for row in files],
              "archive_present":any("cda-v2-C1-checkpoint.zip" in str(row)
                                    for row in files),
          },sort_keys=True),flush=True)
          with tempfile.TemporaryDirectory() as tmp:
              pull=run(["kaggle","kernels","pull",kernel,"-p",tmp,"-m"])
              metadata=Path(tmp)/"kernel-metadata.json"
              data=json.loads(metadata.read_text()) if metadata.is_file() else {}
              print("CDA_V2_KERNEL_ATTACHED_SOURCE_INVENTORY",json.dumps({
                  "pull_ok":pull.returncode==0,
                  "metadata_found":metadata.is_file(),
                  "dataset_sources":data.get("dataset_sources"),
                  "competition_sources":data.get("competition_sources"),
                  "model_sources":data.get("model_sources"),
                  "kernel_type":data.get("kernel_type"),
                  "enable_internet":data.get("enable_internet"),
              },sort_keys=True),flush=True)
          PY
      - name: Inspect completed final v2 outputs and error class only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, re, subprocess
          ref="kolihhan/ntl-cda-l24-v2-final"
          p=subprocess.run(["kaggle","kernels","files",ref,"-v"],
                           capture_output=True,text=True)
          rows=list(csv.DictReader(p.stdout.splitlines())) if p.returncode==0 else []
          names=[str(row.get("name") or row.get("Name") or
                     row.get("fileName") or "") for row in rows]
          print("CDA_V2_FINAL_OUTPUT_INVENTORY",json.dumps({
              "query_return_code":p.returncode,
              "files":names[:120],
              "contains_submission_parquet":any("submission.parquet" in s for s in names),
              "stdout_bytes":len(p.stdout),"stderr_bytes":len(p.stderr)
          },sort_keys=True),flush=True)
          log=subprocess.run(["kaggle","kernels","logs",ref],
                             capture_output=True,text=True)
          content=log.stdout
          try:
              items=json.loads(content)
              if isinstance(items,list):
                  streams=[str(x.get("data","")) for x in items if isinstance(x,dict)]
                  content="\n".join(streams)
          except (ValueError,TypeError):
              pass
          errors=[]
          for line in content.splitlines():
              ln=line.strip()
              if re.match(r"^(?:[A-Za-z_]+(?:Error|Exception)|RuntimeError|SystemExit|OSError|AssertionError|ImportError|KeyError|TypeError|ValueError|FileNotFoundError):",ln):
                  errors.append(ln[:220])
          print("CDA_V2_FINAL_LOG_DIAGNOSTICS",json.dumps({
              "logs_return_code":log.returncode,
              "raw_log_bytes":len(log.stdout),
              "traceback_marker":"Traceback (most recent call last)" in content,
              "error_classes":errors[-10:],
              "has_final_fit_marker":"submission_lineage.json" in content,
              "has_submission_marker":"submission.parquet" in content
          },sort_keys=True),flush=True)
          PY
      - name: Audit final-v2 output schema and terminal kernel log categories
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json,re,subprocess
          ref="kolihhan/ntl-cda-l24-v2-final"
          p=subprocess.run(["kaggle","kernels","files",ref,"-v"],capture_output=True,text=True)
          rows=list(csv.DictReader(p.stdout.splitlines())) if p.returncode==0 else []
          print("CDA_FINAL_RAW_FILE_SCHEMA",json.dumps({
              "headers":list(rows[0]) if rows else [],
              "sample_rows":[{str(k):str(v)[:130] for k,v in row.items()}
                             for row in rows[:22]],
              "raw_contains_submission": "submission.parquet" in p.stdout
          },sort_keys=True),flush=True)
          q=subprocess.run(["kaggle","kernels","logs",ref],capture_output=True,text=True)
          try: payload=json.loads(q.stdout)
          except Exception: payload=q.stdout
          print("CDA_FINAL_LOG_SCHEMA",json.dumps({
              "payload_type":type(payload).__name__,
              "entry_types":[type(x).__name__ for x in payload[:5]] if isinstance(payload,list) else [],
              "entry_keys":[list(x) for x in payload[:3] if isinstance(x,dict)] if isinstance(payload,list) else (list(payload) if isinstance(payload,dict) else []),
              "contains_error":bool(re.search(r"exception|error|out.of.memory|traceback",q.stdout,re.I)),
              "contains_parquet":"submission.parquet" in q.stdout,
              "contains_predict":"prediction" in q.stdout.lower(),
          },sort_keys=True),flush=True)
          PY
      - name: Check full final v2 output inventory with 200-file pagination
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json,subprocess
          ref="kolihhan/ntl-cda-l24-v2-final/2"
          p=subprocess.run(["kaggle","kernels","files",ref,"-v","--page-size","200"],capture_output=True,text=True)
          lines=[s.strip() for s in p.stdout.splitlines() if s.strip()]
          # The CSV output may prepend 'Next Page Token = ...' before headers.
          start=next((i for i,s in enumerate(lines) if s.lower().startswith("name,")
                      or s.lower()=="name"),None)
          parsed=list(csv.DictReader(lines[start:])) if start is not None else []
          names=[str(x.get("name") or x.get("Name") or "") for x in parsed]
          print("CDA_V2_PAGED_FINAL_INVENTORY",json.dumps({
              "return_code":p.returncode,"column_header_found":start is not None,
              "parsed_files":len(names),"names":names[:200],
              "has_submission_parquet":"submission.parquet" in p.stdout,
              "has_lineage":"submission_lineage.json" in p.stdout,
              "has_next_page_token":"Next Page Token =" in p.stdout,
          },sort_keys=True),flush=True)
          PY
      - name: No-training Kaggle existing notebook and official score inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json,re,subprocess
          def run(args):
              return subprocess.run(args,capture_output=True,text=True)
          # Read-only: inspect existing kernels/official ledger; no kernels push
          # and no training or model fitting.
          ls=run(["kaggle","kernels","list","-m","-v","--page-size","100"])
          if ls.returncode:
              print("EXISTING_KERNEL_LIST_UNAVAILABLE",json.dumps({
                  "return_code":ls.returncode,"stderr_tail":ls.stderr[-300:]
              }),flush=True)
          else:
              lines=[x for x in ls.stdout.splitlines() if x.strip()]
              header=next((i for i,s in enumerate(lines)
                           if s.strip().lower().startswith("ref,")),None)
              rows=list(csv.DictReader(lines[header:])) if header is not None else []
              refs=sorted(set(str(x.get("ref") or "") for x in rows
                              if any(t in str(x.get("ref") or "").lower()
                                     for t in ("ntl","name-that-llm","name-the-llm"))))
              print("EXISTING_KERNEL_CANDIDATES",json.dumps({
                  "query_ok":True,"total_rows":len(rows),"matching_refs":refs[:90],
                  "pagination_flag":"Next Page Token" in ls.stdout
              },sort_keys=True),flush=True)
          led=run(["kaggle","competitions","submissions","name-that-llm","-v","-q"])
          if led.returncode:
              raise RuntimeError("official ledger unavailable")
          rows=list(csv.DictReader(led.stdout.splitlines()))
          good=[]
          for row in rows:
              if row.get("status")!="SubmissionStatus.COMPLETE":
                  continue
              try:score=float(row.get("publicScore") or "")
              except ValueError:continue
              good.append({"ref":row.get("ref"),"score":score,
                           "description":str(row.get("description") or "")[:80]})
          good.sort(key=lambda r:r["score"],reverse=True)
          print("HISTORICAL_OFFICIAL_BEST_ENTRIES",json.dumps({
              "completed_scored":len(good),"top":good[:12]
          },sort_keys=True),flush=True)
          PY
      - name: Page through archived Kaggle kernels for existing complete candidates only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json,subprocess
          allrows=[]
          for page in (1,2,3):
              cmd=["kaggle","kernels","list","-m","-v","--page-size","100",
                   "--page",str(page)]
              x=subprocess.run(cmd,capture_output=True,text=True)
              if x.returncode:
                  print("ARCHIVE_PAGE_UNAVAILABLE",json.dumps({
                      "page":page,"return_code":x.returncode,
                      "stderr_tail":x.stderr[-200:]
                  }),flush=True)
                  break
              lines=[line for line in x.stdout.splitlines() if line.strip()]
              header=next((i for i,s in enumerate(lines)
                           if s.strip().lower().startswith("ref,")),None)
              rows=list(csv.DictReader(lines[header:])) if header is not None else []
              allrows.extend(rows)
              print("ARCHIVE_KERNEL_PAGE",json.dumps({
                  "page":page,"rows":len(rows),
                  "has_next":"Next Page Token" in x.stdout
              }),flush=True)
              if len(rows)<100:break
          hits=[]
          for r in allrows:
              ref=str(r.get("ref") or "")
              if ref.startswith("kolihhan/") and any(
                  token in ref.lower() for token in (
                      "ntl","name-that-llm","name-the-llm"
                  )):
                  hits.append(ref)
          print("ARCHIVE_KERNEL_FROZEN_REFS",json.dumps({
              "scanned":len(allrows),"matching_count":len(set(hits)),
              "matching_refs":sorted(set(hits))[:180]
          },sort_keys=True),flush=True)
          PY
