name: V3 Exact CPU Resume Static

on:
  push:
    branches:
      - infra/v3-exact-cpu-resume
    paths:
      - 'scripts/exact_cpu_resume_state.py'
      - 'scripts/exact_cpu_resume_equivalence.py'
      - 'scripts/dct_v3_cpu_chunk.py'
      - 'tests/test_exact_cpu_resume_state.py'
      - 'tests/test_exact_cpu_resume_equivalence.py'
      - 'tests/test_dct_v3_cpu_chunk.py'
      - '.github/workflows/v3-exact-cpu-resume-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test runtime
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q pytest numpy
      - name: Run exact-resume tests
        run: |
          PYTHONPATH=. pytest -q tests/test_exact_cpu_resume_state.py tests/test_exact_cpu_resume_equivalence.py
          if [ -f tests/test_dct_v3_cpu_chunk.py ]; then
            PYTHONPATH=. pytest -q tests/test_dct_v3_cpu_chunk.py
          fi
      - name: Run equivalence probe when available
        run: |
          if [ -f scripts/exact_cpu_resume_equivalence.py ]; then
            PYTHONPATH=. python scripts/exact_cpu_resume_equivalence.py
          fi
