name: NTL one-shot real syntax order falsifier CPU no paid model
on:
  push:
    branches: [research/ntl-syntax-order-falsifier-20261123]
    paths:
      - .github/workflows/ntl-syntax-order-falsifier-20261123.yml
permissions: {contents: read}
concurrency:
  group: ntl-syntax-order-once-20261123
  cancel-in-progress: false
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Pin dependencies and POS tagger, run zero-source-leak compile gate
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          test -s data/train.csv
          test -s artifacts/phase1/folds.csv
          python -m py_compile scripts/ntl_syntax_order_falsifier_20261123.py
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0 'numpy==2.3.4' 'scikit-learn==1.7.2' 'pandas==2.3.3' 'pyarrow==22.0.0' 'nltk==3.9.2'
          python -c "import nltk; assert nltk.download('averaged_perceptron_tagger_eng', quiet=True, raise_on_error=True)"
      - name: Recover PINNED historical Oleg216 and full 0.691 strong predictions
        run: |
          set -euo pipefail
          mkdir -p /tmp/ntl-syntax-source /tmp/ntl-syntax-old
          kaggle kernels output kolihhan/ntl-oleg18-frozen0691-probe-nov16 -p /tmp/ntl-syntax-old -o >/dev/null
          for f in external_short_wide.parquet external_cell_metadata.parquet; do
            kaggle datasets download -d olegzholobov/name-that-llm-response-corpus -f "$f" -p /tmp/ntl-syntax-source --unzip -o -q >/dev/null
          done
          test -s /tmp/ntl-syntax-old/submission.parquet
      - name: Pre-frozen label-free POS features; same-row 5fold and historical external controls
        run: |
          set -euo pipefail
          python -m scripts.ntl_syntax_order_falsifier_20261123 --train data/train.csv --folds artifacts/phase1/folds.csv --external /tmp/ntl-syntax-source --old-pred /tmp/ntl-syntax-old/submission.parquet
          echo NTL_NO_PAID_API_NO_GQA_NO_QLORA_NO_GPU_NO_COMPETITION_SUBMISSION=TRUE
      - name: Remove transient source and raw predictions
        if: always()
        run: rm -rf /tmp/ntl-syntax-source /tmp/ntl-syntax-old
