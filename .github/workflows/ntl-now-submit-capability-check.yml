name: NTL Official Submission Capability Check One Shot
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-now-submit-capability-check.yml]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install Kaggle CLI only
        run: python -m pip install -q kaggle==2.2.5 six==1.17.0
      - name: Verify quota, submission history and pretrained owned assets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          echo '--- GPU_AND_INFERENCE_QUOTA ---'
          kaggle quota || true
          echo '--- OFFICIAL_SUBMISSIONS ---'
          kaggle competitions submissions name-that-llm -v -q > /tmp/ntl-snapshot.csv
          python - <<'PY'
          import csv,json
          rows=list(csv.DictReader(open('/tmp/ntl-snapshot.csv')))
          print('SUBMISSION_COUNT',len(rows))
          for x in sorted(rows,key=lambda r:int(r['ref']),reverse=True)[:12]:
              print('OFFICIAL_SUBMISSION',json.dumps({k:x.get(k) for k in ('ref','status','publicScore','description','date')},sort_keys=True))
          # Exact refs keep our new experimental candidate visible even if other
          # submissions arrive; listing is read-only and never submits a model.
          for ref in ('58233227','58210835','58167751'):
              hits=[x for x in rows if str(x.get('ref','')).strip()==ref]
              if len(hits)>1:
                  raise RuntimeError('ambiguous official submission ref '+ref)
              x=hits[0] if hits else {'ref':ref,'status':'NOT_IN_RETURNED_LEDGER'}
              print('NTL_EXACT_STATUS',json.dumps({k:x.get(k) for k in ('ref','status','publicScore','privateScore','date')},sort_keys=True))
          PY
          echo '--- OWNED_STAGE_A_MODEL_AND_WHEELHOUSE ---'
          for ref in kolihhan/name-that-llm-two-stage-lora24-v1-a1-checkpoint kolihhan/name-that-llm-two-stage-lora24-v1-runtime-py313-v2; do
            kaggle datasets status "$ref" --format json | python -c 'import sys,json;d=json.load(sys.stdin);print("OWNED_DATASET",d.get("ref"),d.get("status"),d.get("current_version_number"))'
          done
          echo '--- EXISTING_OWN_MODEL_KAGGLE_NOTEBOOK ---'
          kaggle kernels status kolihhan/name-that-llm-lora24-v1-final || true
          echo '--- FROZEN MGT-V1 PRIVATE NOTEBOOK STATUS ---'
          kaggle kernels status kolihhan/ntl-margin-gated-transport-v1 || true

      - name: Read public competition leaderboard top 20 (no submissions)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          kaggle competitions leaderboard name-that-llm --show -v -q > /tmp/ntl-public-lb.csv
          python - <<'PY'
          import csv, io, json
          with open('/tmp/ntl-public-lb.csv', encoding='utf-8-sig') as fh:
              raw=fh.read().splitlines()
          # Older Kaggle CLI prints pagination metadata ahead of CSV rows.
          # It must not be parsed as a leaderboard team.
          data=[line for line in raw if line.strip() and
                not line.lstrip().startswith(("Next Page Token", "Next Page"))]
          print("NTL_PUBLIC_LB_FIRST_ROWS",json.dumps(data[:4],ensure_ascii=False))
          rows=list(csv.DictReader(io.StringIO(chr(10).join(data))))
          if not rows or not any("score" in str(k).lower() for k in rows[0]):
              raise RuntimeError("Kaggle leaderboard rows could not be safely parsed")
          print("NTL_PUBLIC_LB_COLUMNS",json.dumps(list(rows[0].keys())))
          for rank, row in enumerate(rows[:20], 1):
              print("NTL_PUBLIC_LB_RANK",json.dumps({"rank":rank,**row},ensure_ascii=False))
          PY
