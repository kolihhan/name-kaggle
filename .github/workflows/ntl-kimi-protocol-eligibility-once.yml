name: NTL Kimi same-prompt high-vs-off strict eligibility without model
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-kimi-protocol-eligibility-once.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/ntl_kimi_protocol_pair_source.py
            artifacts/research/ntl-kimi-protocol-pair/CONTRACT.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check -q kaggle==2.2.5 six==1.17.0
      - name: Check no official data in checkout and frozen contract
        shell: bash
        run: |
          set -euo pipefail
          test ! -e data/train.csv
          test ! -e data/test.csv
          test -f artifacts/research/ntl-kimi-protocol-pair/CONTRACT.md
          python -m py_compile scripts/ntl_kimi_protocol_pair_source.py
      - name: Check exact dataset rights and run matched-pair preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          mkdir -p /tmp/kimi-dataset /tmp/kimi-meta
          kaggle datasets metadata willrice/name-that-llm-openrouter-harvest \
            -p /tmp/kimi-meta >/dev/null
          python - <<'PY'
          import json,pathlib
          files=list(pathlib.Path('/tmp/kimi-meta').glob('*.json'))
          assert len(files)==1
          m=json.loads(files[0].read_text())
          print("NTL_KIMI_METADATA_PUBLIC_KEYS",sorted(m.keys()),flush=True)
          print("NTL_KIMI_DATASET_LICENSE",json.dumps({
             "dataset":m.get("id"),"licenses":m.get("licenses"),
             "title":m.get("title")},sort_keys=True),flush=True)
          PY
          kaggle datasets download willrice/name-that-llm-openrouter-harvest \
            -f README.md -p /tmp/kimi-dataset --unzip -q
          python - <<'PY'
          import pathlib,re,json
          s=(pathlib.Path('/tmp/kimi-dataset')/'README.md').read_text()
          lines=[line.strip()[:250] for line in s.splitlines() if
                 re.search(r'(?i)license|licence|copyright|attribution|cc.by|mit|apache',line)]
          print("NTL_KIMI_README_LICENSE_LINES",json.dumps(lines[:25]),flush=True)
          PY
          kaggle datasets download willrice/name-that-llm-openrouter-harvest \
            -f calls.jsonl -p /tmp/kimi-dataset --unzip -q
          python scripts/ntl_kimi_protocol_pair_source.py \
            --calls /tmp/kimi-dataset/calls.jsonl \
            --private-output /tmp/kimi-selected-pairs-do-not-upload.jsonl
          test -s /tmp/kimi-selected-pairs-do-not-upload.jsonl
          rm -f /tmp/kimi-selected-pairs-do-not-upload.jsonl
          echo NTL_KIMI_PAIR_ELIGIBILITY_PASS_NO_TRAIN_NO_INFERENCE
