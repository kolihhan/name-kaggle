name: V2 Source Recon Zeminglii

on:
  push:
    branches:
      - exp/prompt-invariant-contrastive-v2
    paths:
      - .github/workflows/v2-source-recon-zeminglii.yml

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      DATASET_REF: zeminglii/ntl-own-exact-route-generations
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/prompt-invariant-contrastive-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Kaggle CLI
        run: python -m pip install -q 'kaggle==2.2.5' six
      - name: Download source bytes only
        shell: bash
        run: |
          set -euo pipefail
          : "${KAGGLE_API_TOKEN:?KAGGLE_API_TOKEN secret is not available}"
          rm -rf /tmp/zemi && mkdir -p /tmp/zemi/data
          kaggle datasets files "$DATASET_REF" -v > /tmp/zemi/files.txt
          kaggle datasets download -d "$DATASET_REF" -p /tmp/zemi/data --unzip
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/zemi')
          files=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              files.append({'path':p.relative_to(root).as_posix(),'size':p.stat().st_size,'sha256':h})
          (root/'manifest.json').write_text(json.dumps({'dataset':'zeminglii/ntl-own-exact-route-generations','files':files},indent=2,sort_keys=True))
          print((root/'manifest.json').read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v2-source-recon-zeminglii
          path: /tmp/zemi
          if-no-files-found: error
          retention-days: 30
