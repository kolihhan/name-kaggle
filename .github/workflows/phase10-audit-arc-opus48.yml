name: Phase 10 audit ARC Opus 4.8

on:
  push:
    branches:
      - exp/first-kaggle-submission
    paths:
      - .github/workflows/phase10-audit-arc-opus48.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install audit dependencies
        run: python -m pip install 'pandas>=2,<3' 'pyarrow>=15,<27' 'huggingface_hub>=0.30,<3'

      - name: Download immutable ARC Opus 4.8 snapshot
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import snapshot_download

          repo_id = 'arcprize/arc_agi_v2_public_eval'
          revision = '026789c1c12a4c34580a32e84dcaf5630d7e8f31'
          root = snapshot_download(
              repo_id=repo_id,
              repo_type='dataset',
              revision=revision,
              allow_patterns=[
                  'claude-opus-4-8-high/*.json',
                  'claude-opus-4-8-medium/*.json',
                  'claude-opus-4-8-max/*.json',
              ],
          )
          print('snapshot_root:', root)
          output = Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as handle:
              handle.write(f'root={root}\n')
              handle.write(f'revision={revision}\n')
          PY

      - name: Run response-only admission audit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/phase10_audit_arc_opus48.py \
            --snapshot-root '${{ steps.source.outputs.root }}' \
            --official-train data/train.csv \
            --admitted-external data/external/gpt_gemini_generations.parquet \
            --source-revision '${{ steps.source.outputs.revision }}' \
            --output /tmp/arc_opus48_audit.json \
            --responses-output /tmp/arc_opus48_responses.parquet
          echo '--- PHASE10_ARC_OPUS48_AUDIT ---'
          cat /tmp/arc_opus48_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          report = json.loads(Path('/tmp/arc_opus48_audit.json').read_text())
          responses = pd.read_parquet('/tmp/arc_opus48_responses.parquet')
          print('response_rows:', len(responses))
          print('response_columns:', responses.columns.tolist())
          print('authorized:', report['decision']['training_authorized'])
          print('sample response lengths:')
          print(responses['text'].str.len().describe().to_string())
          PY
