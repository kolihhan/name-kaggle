name: NTL Read Current Competition Daily Limit (No Submission)
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-confirm-contest-daily-cap-readonly-20261118.yml]
permissions: {contents: read}
jobs:
  daily_cap:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Read authenticated Kaggle competition metadata, zero submissions
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
          python - <<'PY'
          import json,subprocess,csv,io
          from kaggle.api.kaggle_api_extended import KaggleApi
          api=KaggleApi()
          api.authenticate()
          print('NTL_KAGGLE_METADATA_SUPPORTED_READ_METHODS='+json.dumps(
              [z for z in dir(api) if z.startswith(('competition','competitions')) and ('list' in z or 'get' in z or 'view' in z or 'info' in z)]),flush=True)
          for meth in ('competitions_list','competition_list'):
              fn=getattr(api,meth,None)
              if not callable(fn):continue
              try:
                  rows=fn(search='Name That LLM')
              except Exception as exc:
                  print('NTL_KAGGLE_META_'+meth+'_STATUS=FAIL_'+type(exc).__name__,flush=True)
                  continue
              for x in list(getattr(rows,'competitions',[]) or [])[:20]:
                  d=x.to_dict() if hasattr(x,'to_dict') else vars(x)
                  if not isinstance(d,dict):continue
                  label=str(d.get('ref') or d.get('title') or '')
                  if 'name-that-llm' not in label.lower() and 'name that llm' not in label.lower():
                      continue
                  vals={}
                  for k,v in d.items():
                      if ('submission' in str(k).lower() and
                          ('daily' in str(k).lower() or 'max' in str(k).lower())) or str(k).lower() in ('deadline','ref','id','title'):
                          vals[str(k)]=str(v)[:160]
                  print('NTL_KAGGLE_VERIFIED_CONTEST_META='+json.dumps(vals,sort_keys=True),flush=True)
          print('NTL_AUTHENTICATED_QUOTA_PROBE_MUTATIONS=ZERO',flush=True)
          PY

      - name: Direct authenticated team quota CLI for this competition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess,json,re
          a=subprocess.run(['kaggle','competitions','submission-limits','name-that-llm'],
                           capture_output=True,text=True,timeout=80)
          print('NTL_TEAM_SUBMISSION_LIMITS_CLI_EXIT='+str(a.returncode),flush=True)
          if a.returncode!=0:
              print('NTL_TEAM_SUBMISSION_LIMITS=UNAVAILABLE',flush=True)
              raise SystemExit(0)
          src=a.stdout.strip()
          # CLI prints only the team submission allowance; redact any team name and
          # URLs in logs. Print numeric values with their exact field labels only.
          entries={}
          for line in src.splitlines():
              match=re.match(r'^\s*([A-Za-z ]*(?:Submissions?|Remaining|Limit|Count|Today)[A-Za-z ]*)\s*[:=]\s*(\d+)\s*$',line,re.I)
              if match:
                  entries[match.group(1).strip()]=int(match.group(2))
          print('NTL_TEAM_SUBMISSION_LIMITS_NUMERIC_FIELDS='+json.dumps(entries,sort_keys=True),flush=True)
          if not entries:
              # Keep low-risk sanitized table without names, IDs, or tokens.
              safe=[]
              for line in src.splitlines():
                  if re.search(r'daily|remaining|submissions|used',line,re.I):
                      safe.append(re.sub(r'\S+@\S+','[REDACTED]',line)[:150])
              print('NTL_TEAM_SUBMISSION_LIMITS_SAFE_TEXT='+json.dumps(safe[:12]),flush=True)
          PY
