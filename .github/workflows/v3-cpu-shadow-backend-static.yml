name: V3 CPU Shadow Backend Static

on:
  push:
    branches:
      - infra/v3-cpu-shadow-resume
    paths:
      - scripts/cpu_shadow_backend.py
      - tests/test_cpu_shadow_backend.py
      - .github/workflows/v3-cpu-shadow-backend-static.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runtime
        run: |
          python -m pip install -q pytest
      - name: Run backend contract tests
        run: PYTHONPATH=. pytest -q tests/test_cpu_shadow_backend.py
