name: NTL semantic-set joint decoding actual pretrained CPU (one run)
on:
  push:
    branches: [research/ntl-semantic-set-decoding-20261122]
    paths:
      - scripts/ntl_semantic_set_decoding_20261122.py
      - .github/workflows/ntl_semantic_set_decoding_real_cpu_20261122.yml
permissions:
  contents: read
concurrency:
  group: ntl-ssd-20261122
  cancel-in-progress: false
jobs:
  real-pretrained-mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install immutable-ish CPU scientific stack
        run: |
          python -m pip install --disable-pip-version-check -q 'numpy>=1.26,<3' 'scipy>=1.13,<2' 'scikit-learn>=1.4,<2' 'pandas>=2,<3' 'fastembed>=0.6,<1' threadpoolctl
      - name: Self-test real assignment and clustering
        run: python -m scripts.ntl_semantic_set_decoding_20261122 --synthetic-only --summary /tmp/unused.json
      - name: Real pretrained embedding / 5 folds / sparse 5 per prompt / joint decoding
        run: |
          python -m scripts.ntl_semantic_set_decoding_20261122 --summary /tmp/ntl-ssd-20261122.json
          python -c 'import json; r=json.load(open("/tmp/ntl-ssd-20261122.json")); assert r["rows"]==2699 and r["classes"]==18 and len(r["details"]["full"])==5; print("NTL_SSD_REAL_GATE="+str(r["preregistered_gate_pass"]))'
      - name: Confirm aggregate-only result, no competition rows or prediction export
        if: always()
        run: |
          if [ -f /tmp/ntl-ssd-20261122.json ]; then
            python -c 'import json; x=json.load(open("/tmp/ntl-ssd-20261122.json")); assert "text" not in x and "row_ids" not in x and "predictions" not in x; print("NTL_SSD_NO_RAW_DATA_EXPORTED=TRUE")'
          fi
