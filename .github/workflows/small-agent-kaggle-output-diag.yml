name: Diagnose Small Agent Kaggle failure (read-only)
on:
  push:
    branches: [infra/small-agent-kaggle-relay-20261121]
    paths: [.github/SMALL_AGENT_KAGGLE_OUTPUT_DIAG_START]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - name: Check latest private kernel logs and artifact filenames only
        shell: bash
        run: |
          set -uo pipefail
          python -m pip install -q 'kaggle==2.2.5' 'six==1.17.0'
          slug="kolihhan/private-small-agent-qwen9b-v8-step70-to100"
          python - <<'PY'
          from kaggle.api.kaggle_api_extended import KaggleApi
          a=KaggleApi();a.authenticate()
          for version in ('', '/3'):
              try:
                  result=a.kernels_status('kolihhan/private-small-agent-qwen9b-v8-step70-to100'+version)
                  print('KAGGLE_V3_PROVIDER_STATUS',version or 'LATEST',str(result)[:450],flush=True)
              except Exception as e:
                  print('KAGGLE_V3_PROVIDER_READ_ERROR',type(e).__name__,flush=True)
          PY
          timeout 100 kaggle kernels logs "$slug" > /tmp/small-agent-kaggle.log 2>&1
          echo "KAGGLE_LOGS_READ_EXIT=$?"
          timeout 100 kaggle kernels files "$slug" -v --page-size 100 > /tmp/small-agent-files.csv 2>&1
          echo "KAGGLE_FILES_READ_EXIT=$?"
          python - <<'PY'
          from pathlib import Path
          import re
          lines=Path('/tmp/small-agent-kaggle.log').read_text(errors='replace').splitlines()
          print('KAGGLE_LOG_LINES',len(lines))
          # Never export full private logs; print tightly allowlisted diagnostic codes only.
          patterns={
            'TRAINING_STEP100':'KAGGLE_ORIGINAL_QWEN9B_V8_STAGE100_FULL_STATE_VERIFIED',
            'ORIGINAL_TRAIN_CODE_LOADED':'QLORA_T4_TRL_NATIVE_FP32_GEMM_FALLBACK_ENABLED',
            'MODEL_STARTED':'KAGGLE_ORIGINAL_QWEN9B_V8_STEP70_TO100_START',
            'RESTORED_CHECKPOINT':'KAGGLE_STAGE70_SOURCE_OPTIMIZER_SCHEDULER_RNG_INTACT',
            'MISSING_DATASET':'FileNotFoundError',
            'CUDA_OOM':'CUDA out of memory',
            'PYTORCH_OOM':'torch.OutOfMemoryError',
            'RUNTIME_ERROR':'RuntimeError:',
            'IMPORT_ERROR':'ModuleNotFoundError:',
            'PYTHON_TRACEBACK':'Traceback (most recent call last)',
            'T4_START':'NVIDIA T4',
            'MODEL_DOWNLOAD_FAIL':'GatedRepoError',
            'TRAINING_FAILURE':'NO_CHECKPOINT100_CANNOT_CLAIM_COMPLETED',
            'SOURCE_FAIL':'original verified 70-step full-state training contract drift',
          }
          for name,pat in patterns.items():
            print('KAGGLE_LOG_SIGNATURE_'+name, sum(pat.lower() in x.lower() for x in lines))
          filelog=Path('/tmp/small-agent-files.csv').read_text(errors='replace').splitlines()
          print('KAGGLE_OUTPUT_METADATA_LINE_COUNT',len(filelog))
          for name in ('qlora-v8-stage100-checkpoint.zip','stage100-verified-report.json'):
            print('KAGGLE_OUTPUT_LISTS_'+name.replace('.','_').replace('-','_'),any(name in x for x in filelog))
          # Avoid logging contents/paths of any other user file.
          print('KAGGLE_OUTPUT_LIST_ERROR',any(x.lower().startswith('error') or '403' in x for x in filelog))
          PY
      - name: Version-specific safe file-error and dataset attachment diagnosis
        shell: bash
        run: |
          set -uo pipefail
          slug="kolihhan/private-small-agent-qwen9b-v8-step70-to100"
          for version in 1 2; do
            timeout 45 kaggle kernels logs "$slug/$version" > "/tmp/sa-v$version.log" 2>&1
            echo "KAGGLE_VERSION_${version}_LOG_READ_EXIT=$?"
          done
          python - <<'PY'
          import hashlib,re
          from pathlib import Path
          for v in (1,2):
              txt=Path(f'/tmp/sa-v{v}.log').read_text(errors='replace')
              print('KAGGLE_VERSION',v,'LINES',len(txt.splitlines()),'LOG_SHA256',hashlib.sha256(txt.encode()).hexdigest())
              for ln in txt.splitlines():
                  if 'FileNotFoundError' in ln or 'No such file or directory' in ln:
                      safe=re.sub(r'(?i)(token|secret|password|key)[=:]\\S+',r'\\1=REDACTED',ln)
                      print('KAGGLE_SAFE_MISSING_INPUT',v,safe[:300])
          PY
          mkdir -p /tmp/sa-latest-metadata
          timeout 60 kaggle kernels pull -k "$slug" -m -p /tmp/sa-latest-metadata >/dev/null 2>&1
          echo "KAGGLE_METADATA_READ_EXIT=$?"
          python - <<'PY'
          import pathlib,json
          p=pathlib.Path('/tmp/sa-latest-metadata/kernel-metadata.json')
          print('KAGGLE_METADATA_PRESENT',p.is_file())
          if p.is_file():
              d=json.loads(p.read_text())
              print('KAGGLE_LATEST_DATASET_SOURCES',d.get('dataset_sources'))
              print('KAGGLE_LATEST_GPU',d.get('enable_gpu'),'MACHINE',d.get('machine_shape'))
          PY
      - name: Verify private Kaggle dataset file names only
        shell: bash
        run: |
          set -uo pipefail
          ds="kolihhan/qlora-v8-stage70-verified-20261121"
          timeout 60 kaggle datasets files "$ds" -v > /tmp/sa-dataset-files.csv 2>&1
          echo "KAGGLE_DATASET_FILES_READ_EXIT=$?"
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/sa-dataset-files.csv').read_text(errors='replace')
          lines=s.splitlines()
          print('KAGGLE_DATASET_FILES_ROW_COUNT',len(lines))
          for name in ('qlora-v8-train.jsonl','qlora-v8-audit.json','qlora-v8-stage70-checkpoint.zip','stage70-kaggle-transport-manifest.json'):
              print('KAGGLE_PRIVATE_DATASET_HAS_'+name.replace('-','_').replace('.','_'),any(name in ln for ln in lines))
          for name in ('adapter_model.safetensors','adapter_config.json','optimizer.pt','scheduler.pt','rng_state.pth','trainer_state.json','run_config.json','stage70-verified-report.json'):
              print('KAGGLE_UNPACKED_CHECKPOINT_HAS_'+name.replace('-','_').replace('.','_'),any(name in ln for ln in lines))
          # Don't emit user file names or contents.
          print('KAGGLE_DATASET_FILES_LIST_ERROR', any('error' in ln.lower() or '403' in ln for ln in lines))
          PY
