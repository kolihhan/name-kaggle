name: Phase 14 audit 75k public passage pool

on:
  push:
    branches:
      - exp/first-kaggle-submission
    paths:
      - .github/workflows/phase14-audit-public-pool.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      DATASET_REF: nishantdahal/ntl-handwriting-blend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'kaggle==2.2.5' pandas pyarrow
      - name: Download only public passage pool
        run: |
          set -euo pipefail
          : "${KAGGLE_API_TOKEN:?missing Kaggle token}"
          rm -rf /tmp/public-pool && mkdir -p /tmp/public-pool
          kaggle datasets download -d "$DATASET_REF" -f pool_v4.parquet -p /tmp/public-pool --unzip
          find /tmp/public-pool -type f -printf '%P\t%s bytes\n'
      - name: Audit schema, labels, sources and prompt overlap
        run: |
          python - <<'PY'
          import hashlib, json, re, unicodedata
          from pathlib import Path
          import pandas as pd

          paths=list(Path('/tmp/public-pool').rglob('pool_v4.parquet'))
          if len(paths)!=1: raise SystemExit(f'expected one pool_v4.parquet, found {paths}')
          pool=pd.read_parquet(paths[0])
          official=pd.read_csv('data/train.csv')

          def norm(x):
              x=unicodedata.normalize('NFKC',str(x)).lower()
              x=re.sub(r'\s+',' ',x).strip()
              return x

          cols=list(pool.columns)
          text_col='text'; label_col='model'
          if text_col not in cols or label_col not in cols: raise SystemExit(f'unexpected pool schema: {cols}')
          off_text_col='text' if 'text' in official.columns else 'answer'
          if off_text_col not in official.columns: raise SystemExit(f'unexpected official schema: {list(official.columns)}')

          norm_pool=pool[text_col].astype(str).map(norm)
          norm_off=official[off_text_col].astype(str).map(norm)
          off_set=set(norm_off)

          source_counts={str(k):int(v) for k,v in pool['source'].astype(str).value_counts().items()}
          label_counts={str(k):int(v) for k,v in pool[label_col].astype(str).value_counts().sort_index().items()}
          setting_counts={str(k):int(v) for k,v in pool['setting'].astype(str).value_counts().head(100).items()}

          official_prompt_ids=set(official['prompt_id'].astype(str)) if 'prompt_id' in official.columns else set()
          pool_prompt_ids=set(pool['prompt_id'].astype(str))
          direct_prompt_id_overlap=sorted(official_prompt_ids & pool_prompt_ids)
          prompt_keys=pool['prompt_key'].astype(str)
          pool_prompt_id_counts=pool['prompt_id'].astype(str).value_counts()
          prompt_key_counts=prompt_keys.value_counts()

          # Check whether the same prompt_key is shared across sources/models; this is useful
          # for deciding whether fold-local purging can be done from the external pool itself.
          key_source_n=pool.groupby('prompt_key')['source'].nunique()
          key_model_n=pool.groupby('prompt_key')['model'].nunique()
          source_prompt_stats={}
          for src,g in pool.groupby('source'):
              source_prompt_stats[str(src)]={
                'rows':int(len(g)),
                'unique_prompt_ids':int(g['prompt_id'].astype(str).nunique()),
                'unique_prompt_keys':int(g['prompt_key'].astype(str).nunique()),
                'unique_models':int(g['model'].astype(str).nunique()),
                'settings':sorted(g['setting'].astype(str).unique().tolist())[:50],
                'sample_prompt_ids':g['prompt_id'].astype(str).drop_duplicates().head(3).tolist(),
                'sample_prompt_keys':g['prompt_key'].astype(str).drop_duplicates().head(3).tolist(),
              }

          report={
            'dataset_ref':'nishantdahal/ntl-handwriting-blend',
            'file':'pool_v4.parquet',
            'scope':'audit_only_no_training_no_permanent_folds',
            'rows':int(len(pool)),
            'columns':cols,
            'dtypes':{c:str(pool[c].dtype) for c in cols},
            'label_counts':label_counts,
            'label_count':len(label_counts),
            'source_counts':source_counts,
            'source_count':len(source_counts),
            'setting_counts':setting_counts,
            'null_text_rows':int(pool[text_col].isna().sum()),
            'empty_text_rows':int((pool[text_col].astype(str).str.strip()=='').sum()),
            'normalized_unique_texts':int(norm_pool.nunique()),
            'normalized_duplicate_rows':int(len(pool)-norm_pool.nunique()),
            'normalized_official_overlap_rows':int(norm_pool.isin(off_set).sum()),
            'official_rows':int(len(official)),
            'official_unique_prompt_ids':len(official_prompt_ids),
            'pool_unique_prompt_ids':int(len(pool_prompt_ids)),
            'pool_unique_prompt_keys':int(prompt_keys.nunique()),
            'direct_official_pool_prompt_id_overlap_count':len(direct_prompt_id_overlap),
            'direct_official_pool_prompt_id_overlap_examples':direct_prompt_id_overlap[:20],
            'prompt_keys_shared_across_multiple_sources':int((key_source_n>1).sum()),
            'prompt_keys_shared_across_multiple_models':int((key_model_n>1).sum()),
            'max_sources_per_prompt_key':int(key_source_n.max()),
            'max_models_per_prompt_key':int(key_model_n.max()),
            'max_rows_per_prompt_id':int(pool_prompt_id_counts.max()),
            'max_rows_per_prompt_key':int(prompt_key_counts.max()),
            'source_prompt_stats':source_prompt_stats,
            'text_length_chars':{
              'min':int(pool[text_col].astype(str).str.len().min()),
              'median':float(pool[text_col].astype(str).str.len().median()),
              'mean':float(pool[text_col].astype(str).str.len().mean()),
              'max':int(pool[text_col].astype(str).str.len().max()),
            },
            'file_sha256':hashlib.sha256(paths[0].read_bytes()).hexdigest(),
          }
          Path('/tmp/phase14_public_pool_audit.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase14-public-pool-audit
          path: /tmp/phase14_public_pool_audit.json
          retention-days: 30
