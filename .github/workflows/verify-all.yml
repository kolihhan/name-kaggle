name: Verify all tests

on:
  push:
    branches:
      - exp/strong-sparse-external
      - exp/phase7-gated-specialist
      - exp/phase8-maniceet-audit
      - exp/phase9-precompetition-specialist
    paths:
      - scripts/**
      - tests/**
      - requirements.txt
      - requirements-encoder.txt
      - .github/workflows/verify-all.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.48,<6'
      - name: Run full test suite
        run: python -m pytest -q
