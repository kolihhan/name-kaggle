name: Phase 11 frozen Fable binary CV

on:
  push:
    branches:
      - exp/first-kaggle-submission
    paths:
      - .github/workflows/phase11-fable-binary-cv.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'huggingface_hub>=0.30,<3'

      - name: Download immutable FusionCube Fable 5 source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import snapshot_download

          repo_id = 'TheFusionCube/Fable-5-CoT-Traces'
          revision = '3624e3a8aab36a89dc3b89aebef0e034a64ea04e'
          root = snapshot_download(
              repo_id=repo_id,
              repo_type='dataset',
              revision=revision,
              allow_patterns=['train.jsonl', 'README.md'],
          )
          source = Path(root) / 'train.jsonl'
          if not source.is_file():
              raise SystemExit(f'pinned train.jsonl missing: {source}')
          output = Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as handle:
              handle.write(f'source={source}\n')
              handle.write(f'revision={revision}\n')
          print('source_jsonl:', source)
          PY

      - name: Re-run frozen Fable admission gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/phase11_audit_fusioncube_fable5.py \
            --source-jsonl '${{ steps.source.outputs.source }}' \
            --official-train data/train.csv \
            --admitted-external data/external/gpt_gemini_generations.parquet \
            --source-revision '${{ steps.source.outputs.revision }}' \
            --output /tmp/phase11_fable_audit.json \
            --responses-output /tmp/phase11_fable_responses.parquet
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          report = json.loads(Path('/tmp/phase11_fable_audit.json').read_text())
          responses = pd.read_parquet('/tmp/phase11_fable_responses.parquet')
          assert report['extraction']['rows_seen'] == 468
          assert report['extraction']['decoy_rows_excluded'] == 115
          assert report['extraction']['singleton_model_dict_rows'] == 13
          assert report['extraction']['ambiguous_model_rows_excluded'] == 9
          assert report['extraction']['empty_response_rows'] == 0
          assert report['extraction']['responses_extracted'] == 344
          assert len(responses) == 344
          assert report['response_duplicates']['normalized_duplicate_groups'] == 0
          assert report['official_overlap']['normalized'] == 0
          assert report['cross_label_overlap']['normalized'] == 0
          assert report['decision']['training_authorized'] is True
          print('frozen admission gate: PASS')
          PY

      - name: Run the single frozen Phase 11 permanent-fold evaluation
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.run_phase11_fable_binary_override \
            --fable-external /tmp/phase11_fable_responses.parquet \
            --output /tmp/phase11_fable_binary_override.json \
            --oof-output /tmp/phase11_fable_binary_override_oof.csv

      - name: Verify and summarize frozen result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/phase11_fable_binary_override.json').read_text())
          expected_fp = 'bf6f47bfaeebdf817a1f7972b54deabbe5e54fb087c77753b6361970d0c9ee0d'
          assert report['validation']['fold_fingerprint'] == expected_fp
          assert report['data']['fable_external_rows'] == 344
          assert report['invariants']['no_phase7_fable_prediction_removed'] is True
          assert report['invariants']['every_changed_prediction_changes_to_fable'] is True

          print('phase7_ba:', report['phase7_reference']['balanced_accuracy'])
          print('phase7_fable_recall:', report['phase7_reference']['fable_recall'])
          print('detector_binary_ba:', report['detector']['balanced_accuracy'])
          print('detector_fable_recall:', report['detector']['per_binary_label_recall']['claude-fable-5'])
          print('final_ba:', report['phase11_final']['balanced_accuracy'])
          print('final_fable_recall:', report['phase11_final']['per_model_recall']['claude-fable-5'])
          print('delta_ba:', report['deltas_vs_phase7']['balanced_accuracy'])
          print('delta_fable_recall:', report['deltas_vs_phase7']['fable_recall'])
          print('override_stats:', report['override_stats'])
          print('decision:', report['decision'])
          PY

      - name: Upload frozen Phase 11 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase11-fable-binary-frozen-shot
          path: |
            /tmp/phase11_fable_audit.json
            /tmp/phase11_fable_binary_override.json
            /tmp/phase11_fable_binary_override_oof.csv
          retention-days: 30
