name: V3 Static Tests

on:
  push:
    branches:
      - exp/dct-temporal-fingerprint-v3
    paths:
      - .github/workflows/v3-static-tests.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/dct-temporal-fingerprint-v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install builder RED-test dependencies
        run: python -m pip install -q pytest
      - name: Verify transfer-builder test is RED before implementation
        run: PYTHONPATH=. pytest -q tests/test_build_dct_v3_transfer_kernel.py
