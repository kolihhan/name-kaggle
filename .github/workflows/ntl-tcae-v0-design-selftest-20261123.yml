name: NTL TCAE-v0 causal identity mechanism — synthetic selftest only
on:
  push:
    branches: [research/ntl-onepass-generative-identity-design-20261123]
    paths:
      - .github/workflows/ntl-tcae-v0-design-selftest-20261123.yml
      - scripts/ntl_tcae_v0.py
permissions: {contents: read}
concurrency:
  group: ntl-tcae-design-synthetic-20261123
  cancel-in-progress: false
jobs:
  math-and-causal-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
      USE_TF: '0'
      USE_FLAX: '0'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install CPU-only PyTorch — no external model or competition data
        run: |
          python -m pip install -q --disable-pip-version-check 'torch==2.6.0+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Execute actual differentiable mechanism invariants — synthetic data ONLY
        run: |
          set -euo pipefail
          python -m py_compile scripts/ntl_tcae_v0.py
          python -m scripts.ntl_tcae_v0 --selftest
          echo 'NTL_TCAE_V0_NO_ACTUAL_TRAINING_NO_MODEL_SCORE_NO_HIDDEN_TEST_NO_SUBMISSION=TRUE'
