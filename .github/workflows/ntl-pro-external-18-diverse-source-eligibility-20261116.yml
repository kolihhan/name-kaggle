name: NTL five missing actual-served-model IDs source audit (metadata only)
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-pro-external-18-diverse-source-eligibility-20261116.yml]
permissions: {contents: read}
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Count externally asserted served-model IDs per class without reading or logging passages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0 pyarrow==22.0.0 pandas==2.3.3
          mkdir -p /tmp/ntl-label-provenance
          kaggle datasets download -d crtproduction/name-that-llm-open-pool -f ntl_open_pool.parquet -p /tmp/ntl-label-provenance --unzip -q
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          import pandas as pd
          p=Path('/tmp/ntl-label-provenance/ntl_open_pool.parquet')
          h=hashlib.file_digest(p.open('rb'),'sha256').hexdigest()
          if h!='5a3dc82288328abedf49b7dd5e866e5c69eb922f9d6008e6fd78cf5153c12332':
              raise RuntimeError('PROVENANCE_INPUT_HASH_DRIFT')
          frame=pd.read_parquet(p,columns=['model','gen_served_model','source_dataset'])
          labels=sorted(frame.model.dropna().astype(str).unique())
          if len(labels)!=18:raise RuntimeError('NOT_18_CLASS_OPEN_POOL')
          model=frame.model.fillna('').astype(str).str.strip().str.lower()
          served=frame.gen_served_model.fillna('').astype(str).str.strip().str.lower()
          exact=(served==model)&served.ne('')
          per={m:int((model.eq(m.lower())&exact).sum()) for m in labels}
          missing=sorted(k for k,v in per.items() if not v)
          # Keep only aggregate metadata: source counts and label names, no text.
          near={}
          for lab in missing:
              rows=frame[model.eq(lab.lower())]
              src=rows.source_dataset.fillna('').value_counts()
              nonempty=rows.gen_served_model.fillna('').astype(str).str.strip().ne('')
              near[lab]={'rows_total':len(rows),'served_nonempty':int(nonempty.sum()),
                'top5_sources':{str(k):int(v) for k,v in src.head(5).items()}}
          print('NTL_OPENPOOL_EXACT_SERVED_ID_COVERAGE='+json.dumps({
              'rows_total':len(frame),'classes':len(labels),'classes_with_exact':sum(v>0 for v in per.values()),
              'classes_missing_exact':missing,'per_class_exact':per,
              'missing_class_source_metadata':near,
              'source_label_claim_not_independent_identity_verification':True,
              'no_competition_data_or_text_read':True,'no_training_no_gpu_no_submission':True},sort_keys=True),flush=True)
          PY
          rm -rf /tmp/ntl-label-provenance
