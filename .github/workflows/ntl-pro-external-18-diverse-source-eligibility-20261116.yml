name: NTL free Kaggle Benchmarks proxy GPT gap source metadata audit
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-pro-external-18-diverse-source-eligibility-20261116.yml]
permissions: {contents: read}
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Read only public free-proxy provenance labels and metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0 pandas==2.3.3
          mkdir -p /tmp/ntl-free-gpt-proxy
          kaggle datasets download -d zakirkhanaleemi/name-that-llm-benchmarks-proxy-generations -f ntl_proxy_generations.csv -p /tmp/ntl-free-gpt-proxy --unzip -q
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          import pandas as pd
          p=Path('/tmp/ntl-free-gpt-proxy/ntl_proxy_generations.csv')
          names=list(pd.read_csv(p,nrows=0).columns)
          # Never materialize or print generated passages or source prompt text.
          unsafe={'text','response','content','prompt','raw_response','raw_request','body','completion','output','prompt_text','response_text'}
          cols=[x for x in names if x.lower() not in unsafe]
          frame=pd.read_csv(p,usecols=cols).fillna('')
          def counts(k):
              if k not in frame:return {}
              return {str(a):int(v) for a,v in frame[k].astype(str).value_counts().head(35).items()}
          target={'gpt-5.5','gpt-5.6-luna','gpt-5.6-sol','gpt-5.6-terra','gpt-6-astra'}
          label_cols=[x for x in cols if any(y in x.lower() for y in ('model','slug','label','provider'))]
          split={k:counts(k) for k in label_cols}
          candidates={}
          for k in label_cols:
              c=frame[k].astype(str).str.strip().str.lower()
              candidates[k]={name:int(c.eq(name).sum()) for name in sorted(target)}
          print('NTL_FREE_GPT_BENCHMARKS_PROXY_META='+json.dumps({
              'source':'zakirkhanaleemi/name-that-llm-benchmarks-proxy-generations',
              'source_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
              'n_rows':len(frame),'csv_columns':names,
              'model_label_counts':split,'target_exact_label_matches':candidates,
              'protocol_runs':counts('run'),
              'published_license_cc_by4_not_independently_audited':True,
              'free_proxy_model_slug_not_original_served_api_reply':True,
              'new_source_heldout_contamination_not_audited':True,
              'no_passages_logged_no_training_no_GPU_no_submission':True
          },sort_keys=True),flush=True)
          PY
          rm -rf /tmp/ntl-free-gpt-proxy
