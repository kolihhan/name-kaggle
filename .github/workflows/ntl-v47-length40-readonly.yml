name: NTL V47 Length40 Read Only Verification
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-v47-length40-readonly.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q 'kaggle==2.2.5' 'six==1.17.0'
      - name: Read candidate v2 and any official submission record
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, io, json, subprocess
          def read(*args):
              return subprocess.run(['kaggle', *args], capture_output=True, text=True, timeout=60)
          ref = 'kolihhan/ntl-v47-length40/2'
          status = read('kernels', 'status', ref)
          print('EXACT_PRIVATE_STATUS', status.stdout.strip(), status.returncode)
          result = read('competitions', 'submissions', 'name-that-llm', '-v', '-q')
          assert result.returncode == 0
          rows = list(csv.DictReader(io.StringIO(result.stdout)))
          exact = [r for r in rows if r.get('description','').startswith('Research V47 length40 SVC ')]
          print('EXACT_OFFICIAL_RECORDS', json.dumps([{k:r.get(k) for k in ('ref','status','publicScore','date')} for r in exact]))
          if any(v in status.stdout for v in ('COMPLETE', 'ERROR')):
              result = read('kernels', 'logs', ref)
              try:
                  records = json.loads(result.stdout)
              except json.JSONDecodeError:
                  records = []
              for record in records:
                  if isinstance(record, dict):
                      for line in record.get('data','').splitlines():
                          if line.startswith(('V47_HUB_ROOT','V47_FAILED_STAGE','V47_STAGE_TRACE','V47_LENGTH40_REAL_PREFLIGHT_PASS')):
                              print('EXACT_PRIVATE_EVIDENCE', line[:450])
          PY
      - name: Read live startup events without changing the Kaggle session
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python - <<'PY'
          import subprocess
          args = ['kaggle','kernels','logs','kolihhan/ntl-v47-length40/2','--follow']
          try:
              result = subprocess.run(args,capture_output=True,text=True,timeout=45)
              output = result.stdout
              print('LIVE_STREAM_CLIENT_EXIT',result.returncode)
          except subprocess.TimeoutExpired as error:
              output = error.stdout or ''
              if isinstance(output,bytes):
                  output=output.decode(errors='replace')
              print('LIVE_STREAM_SAMPLE_SECONDS',45)
          print('LIVE_STREAM_OUTPUT_BYTES',len(output.encode()))
          prefixes = ('V47_HUB_ROOT','Writing /kaggle/','V47_FAILED_STAGE','V47_STAGE_TRACE','V47_LENGTH40_REAL_PREFLIGHT_PASS','{"mode":')
          for line in output.splitlines():
              if line.startswith(prefixes):
                  print('LIVE_STREAM_EVENT',line[:350])
          PY
