name: NTL V47 Length40 Read Only Verification
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-v47-length40-readonly.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q 'kaggle==2.2.5' 'six==1.17.0'
      - name: Verify exact official submission 58078151, read only
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, datetime, io, json, subprocess
          ref = '58078151'
          result = subprocess.run(
              ['kaggle','competitions','submissions','name-that-llm','-v','-q'],
              capture_output=True,text=True,timeout=90,check=True)
          rows = list(csv.DictReader(io.StringIO(result.stdout)))
          matches = [r for r in rows if r.get('ref') == ref]
          print('STATUS_CHECK_UTC',datetime.datetime.now(datetime.timezone.utc).isoformat(),flush=True)
          print('SUBMISSION_RECORD_MATCHES',len(matches),flush=True)
          assert len(matches) == 1, 'Exact submission record missing; no score conclusion'
          r = matches[0]
          print('V47_LENGTH40_OFFICIAL',json.dumps(
              {k:r.get(k) for k in ('ref','status','publicScore','privateScore','date','description')},
              sort_keys=True),flush=True)
          score = (r.get('publicScore') or '').strip()
          if score:
              delta = float(score) - 0.666
              decision = 'FOLLOW_UP' if float(score) >= 0.671 else (
                  'CLOSE' if float(score) <= 0.661 else 'INCONCLUSIVE')
              print('V47_LENGTH40_DELTA_VS_FROZEN_CONTROL',round(delta,6),flush=True)
              print('V47_LENGTH40_FROZEN_DECISION',decision,flush=True)
          else:
              print('V47_LENGTH40_FROZEN_DECISION','NO_SCORE_YET',flush=True)
          PY
