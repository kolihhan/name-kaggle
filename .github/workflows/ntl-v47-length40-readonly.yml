name: NTL V47 Length40 Read Only Verification
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-v47-length40-readonly.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q 'kaggle==2.2.5' 'six==1.17.0'
      - name: Read the exact Kaggle run and official record
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, io, json, re, subprocess
          ref = 'kolihhan/ntl-v47-length40/1'
          def run(*args):
              return subprocess.run(['kaggle', *args], capture_output=True, text=True, timeout=80)
          status = run('kernels','status',ref)
          print('EXACT_PRIVATE_STATUS', status.stdout.strip())
          result = run('kernels','logs',ref)
          assert result.returncode == 0, result.stderr[-300:]
          body = result.stdout.strip()
          # Kaggle stores notebook stdout and stderr as JSON log records.
          records = []
          try:
              records = json.loads(body)
          except json.JSONDecodeError:
              for line in body.splitlines():
                  try:
                      records.append(json.loads(line.lstrip(',').rstrip(',')))
                  except json.JSONDecodeError:
                      pass
          if isinstance(records, list) and records and isinstance(records[0], dict):
              stderr = ''.join(r.get('data','') for r in records if r.get('stream_name') == 'stderr')
          else:
              stderr = body
          stderr = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', stderr)
          for line in stderr.splitlines()[-32:]:
              if re.search(r'Cell In|Traceback|AssertionError|FileNotFoundError|RuntimeError|assert |--->|Errno|^ *[0-9]+ ', line):
                  print('EXACT_KERNEL_TRACE', line[:600])
          result = run('competitions','submissions','name-that-llm','-v','-q')
          assert result.returncode == 0
          rows = list(csv.DictReader(io.StringIO(result.stdout)))
          matched = [r for r in rows if r.get('description','').startswith('Research V47 length40 SVC ')]
          print('EXACT_OFFICIAL_RECORDS', json.dumps([{k:r.get(k) for k in ('ref','status','publicScore','date')} for r in matched]))
          PY
      - name: Locate the exact V47 numeric cache by size and dataset version
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from concurrent.futures import ThreadPoolExecutor
          from urllib.parse import unquote, urlsplit
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.datasets.types.dataset_api_service import ApiDownloadDatasetRequest, ApiGetDatasetRequest
          owner = 'lightningv08'
          slug = 'ntl-olmo2-native24-final-inference-assets'
          api = KaggleApi()
          api.authenticate()
          with api.build_kaggle_client() as client:
              req = ApiGetDatasetRequest()
              req.owner_slug = owner
              req.dataset_slug = slug
              view = client.datasets.dataset_api_client.get_dataset(req)
          latest = view.current_version_number
          print('CACHE_HUB_LATEST_VERSION', latest, 'DATASET_ID', view.id)
          print('CACHE_HUB_DATES', json.dumps([{ 'version':v.version_number, 'created':str(v.creation_date)} for v in (view.versions or []) if v.version_number >= 16]))
          expected = {f'ntl660-prefit.part{i:03d}.bin': 25165824 if i < 11 else 963274 for i in range(12)}
          def check(version):
              files, token = {}, None
              for _ in range(12):
                  page = api.dataset_list_files(f'{owner}/{slug}/{version}', page_token=token, page_size=100)
                  for file in page.files:
                      name = file.name.rsplit('/', 1)[-1]
                      if name in expected or name == 'ntl666-cache-parts.json':
                          files[name] = [file.name, file.total_bytes]
                  token = page.next_page_token
                  if not token:
                      break
              id_value = None
              if 'ntl660-prefit.part000.bin' in files:
                  with api.build_kaggle_client() as client:
                      req = ApiDownloadDatasetRequest()
                      req.owner_slug, req.dataset_slug = owner, slug
                      req.dataset_version_number = version
                      req.file_name = files['ntl660-prefit.part000.bin'][0]
                      response = client.datasets.dataset_api_client.download_dataset(req)
                  path = unquote(urlsplit(response.url).path)
                  # No query parameters or signed path components are logged.
                  parts = [p if p.isdecimal() else '_' for p in path.split('/') if p]
                  print('CACHE_HUB_REDIRECT_COMPONENTS', version, parts, flush=True)
                  found = re.search(r'(?:/kaggle-data-sets)?/' + str(view.id) + r'/(\d+)/', path)
                  if found:
                      id_value = int(found.group(1))
              return {'version':version, 'version_id':id_value, 'parts':files,
                      'exact_660_parts':all(files.get(name, [None, None])[1] == size for name,size in expected.items()),
                      'has_666_manifest':'ntl666-cache-parts.json' in files}
          versions = sorted({n for n in (16,17,18,19,20,latest) if n <= latest})
          with ThreadPoolExecutor(max_workers=4) as pool:
              for entry in pool.map(check, versions):
                  print('CACHE_HUB_VERSION', json.dumps(entry, sort_keys=True))
          PY
