name: LoRA24 Submission 3

on:
  push:
    branches:
      - exp/first-kaggle-submission
    paths:
      - .github/workflows/lora24-submission3.yml

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      CHECKPOINT_REF: kolihhan/name-that-llm-two-stage-lora24-v1-a1-checkpoint
      RUNTIME_REF: kolihhan/name-that-llm-two-stage-lora24-v1-offline-runtime
      KERNEL_REF: kolihhan/name-that-llm-two-stage-lora24-v1-submission-preflight
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/first-kaggle-submission

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install orchestration dependencies
        run: |
          python -m pip install -q -r requirements.txt pytest 'kaggle==2.2.5' six

      - name: Verify focused submission implementation
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_two_stage_lora24_submission.py \
            tests/test_two_stage_lora24_offline_inputs.py \
            tests/test_two_stage_lora24_kaggle_model_kernel.py
          python -m py_compile \
            scripts/two_stage_lora24_submission.py \
            scripts/build_two_stage_lora24_kaggle_model_kernel.py

      - name: Verify exact Stage-1 checkpoint is ready version 1
        shell: bash
        run: |
          set -euo pipefail
          : "${KAGGLE_API_TOKEN:?KAGGLE_API_TOKEN secret is not available}"
          status_json="$(kaggle datasets status "$CHECKPOINT_REF" --format json)"
          echo "$status_json"
          STATUS_JSON="$status_json" python - <<'PY'
          import json, os
          p=json.loads(os.environ['STATUS_JSON'])
          assert p['status']=='ready', p
          assert int(p['current_version_number'])==1, p
          PY

      - name: Create frozen CPython 3.13 offline runtime dataset if absent
        shell: bash
        run: |
          set -euo pipefail
          if kaggle datasets status "$RUNTIME_REF" --format json >/tmp/runtime-status.json 2>/tmp/runtime-status.err; then
            cat /tmp/runtime-status.json
            python - <<'PY'
          import json
          p=json.load(open('/tmp/runtime-status.json'))
          assert p['status']=='ready', p
          assert int(p['current_version_number'])==1, p
          PY
            rm -rf /tmp/runtime-existing
            mkdir -p /tmp/runtime-existing
            kaggle datasets download -d "$RUNTIME_REF" -p /tmp/runtime-existing --unzip -q
            python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/runtime-existing')
          lineage=json.loads((root/'runtime_lineage.json').read_text())
          assert lineage['dataset_ref']=='kolihhan/name-that-llm-two-stage-lora24-v1-offline-runtime'
          assert lineage.get('python_abi')=='cp313', lineage
          assert lineage['dataset_version_expected']==1
          print('existing runtime manifest', lineage['file_manifest_sha256'])
          PY
          else
            cat /tmp/runtime-status.err || true
            rm -rf /tmp/lora24-runtime
            mkdir -p /tmp/lora24-runtime
            python -m pip download \
              --dest /tmp/lora24-runtime \
              --no-deps \
              --only-binary=:all: \
              --platform manylinux2014_x86_64 \
              --python-version 313 \
              --implementation cp \
              'transformers==4.57.1' 'peft==0.17.1' safetensors
            python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('/tmp/lora24-runtime')
          files=[]
          for path in sorted(p for p in root.iterdir() if p.is_file()):
              data=path.read_bytes()
              files.append({'path':path.name,'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)})
          assert files
          encoded=json.dumps(files,sort_keys=True,separators=(',',':')).encode()
          manifest=hashlib.sha256(encoded).hexdigest()
          lineage={
            'purpose':'two_stage_lora24_v1_offline_wheelhouse',
            'dataset_ref':'kolihhan/name-that-llm-two-stage-lora24-v1-offline-runtime',
            'dataset_version_expected':1,
            'python_abi':'cp313',
            'kaggle_observed_python':'3.13',
            'wheel_specs':['transformers==4.57.1','peft==0.17.1','safetensors'],
            'files':files,
            'file_manifest_sha256':manifest,
            'competition_train_rows_included':0,
            'competition_test_rows_included':0,
          }
          (root/'runtime_lineage.json').write_text(json.dumps(lineage,indent=2,sort_keys=True))
          metadata={
            'title':'NTL LoRA24 offline runtime py313',
            'id':'kolihhan/name-that-llm-two-stage-lora24-v1-offline-runtime',
            'licenses':[{'name':'other'}],
            'isPrivate':True,
          }
          (root/'dataset-metadata.json').write_text(json.dumps(metadata,indent=2))
          print(json.dumps(lineage,indent=2))
          PY
            kaggle datasets create -p /tmp/lora24-runtime
            ready=0
            for i in $(seq 1 90); do
              status_json="$(kaggle datasets status "$RUNTIME_REF" --format json 2>/dev/null || true)"
              echo "[$i] $status_json"
              if STATUS_JSON="$status_json" python - <<'PY'
          import json, os, sys
          try: p=json.loads(os.environ['STATUS_JSON'])
          except Exception: sys.exit(1)
          sys.exit(0 if p.get('status')=='ready' and int(p.get('current_version_number',-1))==1 else 1)
          PY
              then ready=1; break; fi
              sleep 10
            done
            test "$ready" = 1
          fi

      - name: Build private internet-off T4 final-fit kernel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/lora24-kernel
          python scripts/build_two_stage_lora24_kaggle_model_kernel.py \
            --output-dir /tmp/lora24-kernel \
            --repo-root .
          python -m py_compile /tmp/lora24-kernel/kernel_main.py
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/lora24-kernel')
          meta=json.loads((root/'kernel-metadata.json').read_text())
          source=(root/'kernel_main.py').read_text()
          assert meta['id']=='kolihhan/name-that-llm-two-stage-lora24-v1-submission-preflight'
          assert meta['is_private'] is True
          assert meta['enable_internet'] is False
          assert meta['machine_shape']=='NvidiaTeslaT4'
          assert meta['competition_sources']==['name-that-llm']
          assert meta['dataset_sources']==[
            'kolihhan/name-that-llm-two-stage-lora24-v1-a1-checkpoint',
            'kolihhan/name-that-llm-two-stage-lora24-v1-offline-runtime',
          ]
          assert meta['model_sources']==['qwen-lm/qwen-3/transformers/8b-base/1']
          assert 'kaggle competitions submit' not in source
          assert len(source.encode()) < 1_000_000
          print(json.dumps(meta,indent=2))
          print('kernel_main_bytes',len(source.encode()))
          PY

      - name: Push final-fit kernel to Kaggle T4
        shell: bash
        run: |
          set -euo pipefail
          push_output="$(kaggle kernels push -p /tmp/lora24-kernel --accelerator NvidiaTeslaT4 --timeout 32400)"
          echo "$push_output"
          kernel_version="$(printf '%s\n' "$push_output" | sed -nE 's/.*Kernel version ([0-9]+) successfully pushed.*/\1/p' | tail -n1)"
          test -n "$kernel_version"
          echo "KERNEL_VERSION=$kernel_version" >> "$GITHUB_ENV"

      - name: Wait for final fit and hidden-test inference
        shell: bash
        run: |
          set -euo pipefail
          complete=0
          for i in $(seq 1 600); do
            s="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            echo "[$i] $s"
            if grep -Eqi '(^|[^a-z])(complete|completed|success|successful|succeeded)([^a-z]|$)' <<<"$s"; then
              complete=1
              break
            fi
            if grep -Eqi '(^|[^a-z])(error|failed|failure|cancelled|canceled)([^a-z]|$)' <<<"$s"; then
              echo '--- Kaggle kernel logs ---'
              kaggle kernels logs "$KERNEL_REF" || true
              exit 1
            fi
            sleep 30
          done
          if [[ "$complete" != 1 ]]; then
            kaggle kernels logs "$KERNEL_REF" || true
            exit 1
          fi
          echo '--- final kernel logs ---'
          kaggle kernels logs "$KERNEL_REF" || true

      - name: Download and mechanically verify submission artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/lora24-output
          mkdir -p /tmp/lora24-output
          kaggle kernels output "$KERNEL_REF" -p /tmp/lora24-output -o
          find /tmp/lora24-output -maxdepth 2 -type f -printf '%p %s\n'
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('/tmp/lora24-output')
          sp=next(root.rglob('submission.parquet'))
          lp=next(root.rglob('submission_lineage.json'))
          s=pd.read_parquet(sp)
          l=json.loads(lp.read_text())
          allowed=set(pd.read_csv('data/train.csv')['model'].astype(str))
          assert s.columns.tolist()==['id','model']
          assert len(s)>3, len(s)
          assert s['id'].is_unique
          assert not s[['id','model']].isna().any().any()
          assert set(s['model'].astype(str)) <= allowed
          assert l['candidate']=='two-stage-lora24-v1'
          assert l['primary_head']=='plain'
          assert l['centered_head_used_for_submission'] is False
          assert l['competition_test_rows_used_for_training']==0
          assert l['competition_test_rows_used_for_model_selection']==0
          assert l['public_lb_tuning'] is False
          assert l['official_train_sha256']=='40a22ce8d88c5f46feb4637a099db815bef5f713ffe53e89dbe1b7b21de77707'
          assert l['base_manifest_sha256']=='kaggle-model-source:qwen-lm/qwen-3/transformers/8b-base/1'
          assert int(l['submission_rows'])==len(s)==int(l['test_rows'])
          print('VERIFIED_SUBMISSION_ROWS',len(s))
          print('SUBMISSION_SHA256',l['submission_sha256'])
          print('RUNTIME_MANIFEST',l['runtime_manifest_sha256'])
          print(s['model'].value_counts().sort_index().to_string())
          PY

      - name: Submit verified notebook version to competition
        shell: bash
        run: |
          set -euo pipefail
          : "${KERNEL_VERSION:?KERNEL_VERSION missing}"
          kaggle competitions submit name-that-llm \
            -f submission.parquet \
            -k "$KERNEL_REF" \
            -v "$KERNEL_VERSION" \
            -m 'two-stage-lora24-v1 plain final fit' \
            --wait 3600 \
            --poll-interval 15

      - name: Show resulting submission state
        if: always()
        run: |
          echo '--- submissions ---'
          kaggle competitions submissions name-that-llm -v || true
