name: V3 TPU Status Read

on:
  push:
    branches:
      - infra/v3-tpu-feasibility
    paths:
      - '.github/workflows/v3-tpu-status-read.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
  KERNEL_REF: kolihhan/ntl-v3-tpu-environment-probe

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q six 'kaggle==2.2.5'
      - name: Read actual probe status, outputs and quota
        run: |
          set -u
          : "${KAGGLE_API_TOKEN:?KAGGLE_API_TOKEN secret is not available}"
          echo '--- direct status ---'
          kaggle kernels status "$KERNEL_REF" || true
          echo '--- output files ---'
          kaggle kernels files "$KERNEL_REF" -v || true
          echo '--- output download ---'
          rm -rf /tmp/tpu-status-output
          mkdir -p /tmp/tpu-status-output
          kaggle kernels output "$KERNEL_REF" -p /tmp/tpu-status-output -o || true
          find /tmp/tpu-status-output -maxdepth 2 -type f -print || true
          if [ -f /tmp/tpu-status-output/environment_probe.json ]; then
            cat /tmp/tpu-status-output/environment_probe.json
          fi
          echo '--- logs ---'
          kaggle kernels logs "$KERNEL_REF" | tail -n 300 || true
          echo '--- quota ---'
          kaggle quota --format json
