name: V3 TPU Status Read

on:
  push:
    branches:
      - infra/v3-tpu-feasibility
    paths:
      - '.github/workflows/v3-tpu-status-read.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
  KERNEL_REF: kolihhan/ntl-v3-tpu-env-probe

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q six 'kaggle==2.2.5'
      - name: Discover my probe kernel and read quota
        run: |
          set -u
          : "${KAGGLE_API_TOKEN:?KAGGLE_API_TOKEN secret is not available}"
          echo '--- mine/search ---'
          kaggle kernels list --mine --search 'NTL V3 TPU Environment Probe' --page-size 20 -v || true
          echo '--- mine/recent ---'
          kaggle kernels list --mine --page-size 20 -v --sort-by dateRun || true
          echo '--- direct status (may fail for private kernels) ---'
          kaggle kernels status "$KERNEL_REF" || true
          echo '--- quota ---'
          kaggle quota --format json
