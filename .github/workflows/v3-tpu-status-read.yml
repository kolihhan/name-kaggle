name: V3 TPU Status Read

on:
  push:
    branches:
      - infra/v3-tpu-feasibility
    paths:
      - '.github/workflows/v3-tpu-status-read.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
  KERNEL_REF: kolihhan/ntl-v3-tpu-env-probe

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q six 'kaggle==2.2.5'
      - name: Read current kernel status only
        run: |
          set -euo pipefail
          : "${KAGGLE_API_TOKEN:?KAGGLE_API_TOKEN secret is not available}"
          kaggle kernels status "$KERNEL_REF"
          echo '--- quota ---'
          kaggle quota --format json
