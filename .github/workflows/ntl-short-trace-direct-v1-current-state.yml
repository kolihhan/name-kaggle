name: NTL Short TRACE V1 Exact Current State
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-short-trace-direct-v1-current-state.yml]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q 'kaggle==2.2.5' 'six==1.17.0'
      - name: Read current v1 status and official submission history (no GPU)
        shell: bash
        run: |
          set -euo pipefail
          : "${KAGGLE_API_TOKEN:?missing token}"
          echo 'NTL_SHORT_TRACE_V1_STATUS_BEGIN'
          kaggle kernels status kolihhan/ntl-short-trace-8b-direct-18class || true
          echo 'NTL_SHORT_TRACE_V1_SUBMISSION_HISTORY_BEGIN'
          kaggle competitions submissions name-that-llm -v | head -n 12
          echo 'NTL_SHORT_TRACE_V1_STATUS_END'
