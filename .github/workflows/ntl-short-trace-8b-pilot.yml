name: NTL Short-TRACE 8B Frozen Pilot
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths:
      - .github/workflows/ntl-short-trace-8b-pilot.yml
permissions: {contents: read}
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: kolihhan/ntl-short-trace-8b-pilot
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/short_trace_core.py
            scripts/run_short_trace_8b_pilot.py
            scripts/build_short_trace_8b_pilot.py
            tests/test_short_trace_core.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install CPU test and Kaggle-only CLI deps
        run: python -m pip install -q pytest numpy pandas scikit-learn "kaggle==2.2.5" "six==1.17.0"
      - name: Frozen unit checks no real source/competition data
        run: |
          python -m pytest -q tests/test_short_trace_core.py
          python -m py_compile scripts/short_trace_core.py scripts/run_short_trace_8b_pilot.py scripts/build_short_trace_8b_pilot.py
      - name: Build a private internet-disabled frozen GPU kernel
        run: |
          python scripts/build_short_trace_8b_pilot.py --repo-root . --output-dir /tmp/ntl-short-trace
          python -m py_compile /tmp/ntl-short-trace/kernel_main.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/ntl-short-trace/kernel-metadata.json').read_text())
          assert p['competition_sources']==[] and p['is_private'] is True and p['enable_internet'] is False
          assert p['model_sources']==['qwen-lm/qwen-3/transformers/8b-base/1']
          assert p['dataset_sources']==['nishantdahal/ntl-handwriting-blend','kolihhan/name-that-llm-two-stage-lora24-v1-runtime-py313-v2']
          print("SHORT_TRACE_BUNDLE_PREFLIGHT_PASS")
          PY
      - name: Push exactly one Kaggle 8B pilot kernel
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN" || { echo "BLOCKED_NO_KAGGLE_SECRET"; exit 2; }
          if ! kaggle kernels push -p /tmp/ntl-short-trace > /tmp/short-trace-push.log 2>&1; then
            echo "SHORT_TRACE_PUSH_BLOCKED"
            tail -c 1700 /tmp/short-trace-push.log | sed -E 's/[A-Za-z0-9_-]{40,}/[redacted]/g'
            exit 2
          fi
          echo "SHORT_TRACE_KAGGLE_KERNEL_PUSH_ACCEPTED"
          tail -c 850 /tmp/short-trace-push.log
      - name: Observe first execution without modifying science
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 28); do
            status="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            echo "pilot_poll=$i $status"
            if grep -Eqi '(^|[^a-z])(complete|completed|success|succeeded)([^a-z]|$)' <<<"$status"; then
              echo "SHORT_TRACE_KAGGLE_KERNEL_COMPLETE"
              kaggle kernels logs "$KERNEL_REF" || true
              exit 0
            fi
            if grep -Eqi '(^|[^a-z])(error|failed|failure|cancelled|canceled)([^a-z]|$)' <<<"$status"; then
              echo "SHORT_TRACE_KAGGLE_KERNEL_ERROR"
              kaggle kernels logs "$KERNEL_REF" || true
              exit 1
            fi
            sleep 15
          done
          echo "SHORT_TRACE_SUBMITTED_PENDING_EXECUTION_RESULT"
          exit 0
