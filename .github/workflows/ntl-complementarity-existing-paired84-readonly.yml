name: "NTL Yuanzhe-style real paired 84 rescue/regression and 18-label gate"
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-complementarity-existing-paired84-readonly.yml]
permissions: {contents: read}
jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate 12-label blocker and paired arithmetic with synthetic unit tests
        run: |
          set -euo pipefail
          python -m unittest -q tests.test_ntl_complementarity_gate
          python -m py_compile scripts/ntl_complementarity_gate.py
      - name: Evaluate existing authenticated private paired 84 aggregate, NO model inference
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
          TARGET=kolihhan/ntl-areeb8-wemm-paired84-nov13
          # This private kernel was authenticated COMPLETE in Action 43454221159.
          # A transient status API failure must not block the read-only output request.
          mkdir -p /tmp/ntl-paired84-readonly
          kaggle kernels output "$TARGET" -p /tmp/ntl-paired84-readonly -o >/tmp/ntl-paired84-readonly-pull.log 2>&1
          test -s /tmp/ntl-paired84-readonly/paired84-summary.json
          python -m scripts.ntl_complementarity_gate --aggregate /tmp/ntl-paired84-readonly/paired84-summary.json
          echo "NTL_COMPLEMENTARITY_READ_ONLY=TRUE;NEW_GPU=FALSE;TRAINING=FALSE;SUBMISSION=FALSE"
