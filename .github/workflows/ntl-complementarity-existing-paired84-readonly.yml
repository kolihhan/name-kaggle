name: "NTL Yuanzhe-style real paired 84 rescue/regression and 18-label gate"
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-complementarity-existing-paired84-readonly.yml]
permissions: {contents: read}
jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Replay previously authenticated Kaggle aggregate, no private data or new GPU
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -q tests.test_ntl_complementarity_gate
          python -m py_compile scripts/ntl_complementarity_gate.py
          # Immutable numeric-only snapshot was copied from verified Kaggle
          # Action 43454221159, job 131983985764 (not re-scored here).
          INPUT=artifacts/research/ntl-areeb8-vs-wemm-paired84/verified-aggregates-43454221159.json
          test -s "$INPUT"
          python -m scripts.ntl_complementarity_gate --aggregate "$INPUT"
          echo "NTL_COMPLEMENTARITY_REPLAY_FROM_AUTHENTICATED_PRIOR_RUN=TRUE"
          echo "NTL_COMPLEMENTARITY_NEW_GPU=FALSE;TRAINING=FALSE;SUBMISSION=FALSE"
