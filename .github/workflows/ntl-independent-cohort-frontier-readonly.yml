name: NTL source-disjoint cohort and public frontier survey (read only)
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-independent-cohort-frontier-readonly.yml]
permissions: {contents: read}
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
      - name: Survey official leaderboard and public datasets, no downloads
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python - <<'PY'
          import csv,io,json,re,subprocess,math
          def call(args,timeout=90):
              x=subprocess.run(["kaggle",*args],capture_output=True,text=True,timeout=timeout)
              if x.returncode:
                  print("NTL_DISCOVERY_COMMAND_BLOCKED",
                        json.dumps({"command":args[:3],"returncode":x.returncode}),flush=True)
                  return []
              return list(csv.DictReader(io.StringIO(x.stdout.lstrip("\ufeff"))))
          # Never touch official competition examples/answers or download leaderboard.
          leaders=call(["competitions","leaderboard","name-that-llm","--show","--public","-v"])
          print("NTL_LEADERBOARD_FIELDS",json.dumps(list(leaders[0]) if leaders else []),flush=True)
          print("NTL_LEADERBOARD_TOP",json.dumps([
              {k:row.get(k) for k in list(row)[:8]} for row in leaders[:20]
          ],ensure_ascii=False),flush=True)
          corp=["name-that-llm","llm-generations","model-attribution","gpt-5.6","glm-5.3"]
          allrows={}
          for search in corp:
              args=["datasets","list","--sort-by","updated","-s",search,"-v"]
              rows=call(args)
              print("NTL_DATASET_SEARCH",json.dumps({"query":search,"count":len(rows),
                     "fields":list(rows[0]) if rows else []}),flush=True)
              for x in rows:
                  slug=(x.get("ref") or x.get("id") or "").strip()
                  if not re.fullmatch(r"[A-Za-z0-9_-]+/[A-Za-z0-9_-]+",slug):continue
                  allrows[slug]=x
          def brief(x):
              allowed=("ref","title","size","lastUpdated","downloadCount",
                       "voteCount","usabilityRating","license","licenseName",
                       "totalBytes","created","last_updated")
              return {k:str(x.get(k,""))[:180] for k in allowed if x.get(k) is not None}
          print("NTL_PUBLIC_DATASET_CANDIDATES",json.dumps(
              [brief(x) for x in list(allrows.values())[:100]],
              ensure_ascii=False),flush=True)
          print("NTL_SCIENCE_QUALIFICATION",
            "dataset listings are discovery leads only; no license, source-disjointness or exact 18-label eligibility has been verified",
            flush=True)
          PY
      - name: Verify fresh candidate metadata, licenses and filenames (no dataset rows)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python - <<'PY'
          import csv,io,json,pathlib,subprocess,tempfile
          refs=[
            "nimithashreea/ntl-proxy-candidate-generations-20261110",
            "toanplam/ntl-fresh-generation-pilot-nov08",
            "emmanuelocheme/ntl-oof-mistral-olmo-lora",
            "alessandrolair/ntl-kaggle-benchmarks-generated-passages",
            "zeminglii/ntl-own-exact-route-generations"
          ]
          for ref in refs:
              out={"ref":ref,"public_metadata_only":True,"rows_downloaded":False}
              d=pathlib.Path(tempfile.mkdtemp(prefix="ntl-meta-"))
              try:
                  p=subprocess.run(["kaggle","datasets","metadata",ref,"-p",str(d)],
                                   capture_output=True,text=True,timeout=55)
                  out["meta_rc"]=p.returncode
                  mdfile=d/"dataset-metadata.json"
                  if mdfile.exists():
                      m=json.loads(mdfile.read_text())
                      out["license"]=m.get("licenses")
                      out["title"]=m.get("title")
                      out["subtitle"]=str(m.get("subtitle",""))[:300]
                      out["description"]=str(m.get("description",""))[:550]
                      out["resources"]=[{"path":v.get("path"),
                                         "schema":v.get("schema",{}).get("fields",[])[:25]}
                                        for v in m.get("resources",[])[:20]]
                  p=subprocess.run(["kaggle","datasets","files",ref,"-v"],
                                   capture_output=True,text=True,timeout=55)
                  out["files_rc"]=p.returncode
                  if p.returncode==0:
                      rows=list(csv.DictReader(io.StringIO(p.stdout.lstrip("\ufeff"))))
                      out["files_fields"]=list(rows[0]) if rows else []
                      out["files"]=[{k:v for k,v in row.items()
                                    if k in ("name","size","creationDate","ref")}
                                   for row in rows[:25]]
              except Exception as e:
                  out["error_type"]=type(e).__name__
              print("NTL_SOURCE_LICENSE_MANIFEST",json.dumps(out,ensure_ascii=False),flush=True)
          PY
      - name: Read fresh dataset READMEs and manifests only, keep row text out of logs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,re,subprocess,tempfile
          probes={
             "nimithashreea/ntl-proxy-candidate-generations-20261110":
                ("README.md","generated_proxy_candidates_manifest.json",
                 "generation_manifest.json"),
             "toanplam/ntl-fresh-generation-pilot-nov08":
                ("README.md","qc_report.json","publication_checksums.json"),
          }
          def load_file(ref,name):
              dest=pathlib.Path(tempfile.mkdtemp(prefix="ntl-meta-file-"))
              p=subprocess.run(["kaggle","datasets","download",ref,"-f",name,
                "-p",str(dest),"--unzip","-q"],capture_output=True,text=True,timeout=75)
              hits=list(dest.rglob(name))
              if p.returncode!=0 or len(hits)!=1:
                  return None,{"rc":p.returncode,"files_found":len(hits)}
              b=hits[0].read_bytes()
              return b,{"rc":0,"bytes":len(b)}
          for ref,names in probes.items():
              for name in names:
                  b,info=load_file(ref,name)
                  summary={"ref":ref,"file":name,"result":info}
                  if b and name.lower().endswith(".md"):
                      s=b.decode("utf-8","replace")
                      summary["sections"]=[x.strip()[:140] for x in s.splitlines()
                          if x.lstrip().startswith("#")][:25]
                      summary["license_provenance_lines"]=[
                          x.strip()[:250] for x in s.splitlines()
                          if re.search(r"(?i)licen[sc]e|model.version|model.version|generat|source|date|condition|sampl|prompt|temperature",x)][:28]
                  elif b and name.endswith(".json"):
                      try:
                          j=json.loads(b)
                          if isinstance(j,dict):
                              summary["keys"]=list(j.keys())
                              allow=("rows","row_count","count","models","model_ids",
                                     "labels","source","sources","provider","license",
                                     "generation_date","created_at","prompts","num_prompts",
                                     "temperature","top_p","max_tokens","seed","publications",
                                     "status","duplicates","unique_prompt_count")
                              summary["safe_fields"]={k:str(v)[:450] for k,v in j.items()
                                  if k.lower() in allow}
                          elif isinstance(j,list):
                              summary["top_level_list_length"]=len(j)
                      except Exception as e:summary["parse_error"]=type(e).__name__
                  print("NTL_FRESH_COHORT_PROVENANCE",
                        json.dumps(summary,ensure_ascii=False),flush=True)
          print("NTL_NO_NEW_DATASET_ROWS_READ",True,flush=True)
          PY
      - name: Resolve 18-label eligibility from small public generation manifests only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,subprocess,tempfile
          cases=[
             ("nimithashreea/ntl-proxy-candidate-generations-20261110",
              "generated_proxy_candidates_manifest.json",
              ("rows","counts_by_label","excluded_exact_text_matches_to_official_train",
               "excluded_exact_text_matches_to_existing_proxy_pool","deduplication","license_note")),
             ("toanplam/ntl-fresh-generation-pilot-nov08",
              "qc_report.json",
              ("rows","per_label_rows","target_labels","missing_labels",
               "complete_18_label_panels","prompt_count","domains",
               "training_admission","host_rows_screened","limitations"))
          ]
          for ref,filename,allowed in cases:
              dest=pathlib.Path(tempfile.mkdtemp(prefix="ntl-candidate-aggregate-"))
              p=subprocess.run(["kaggle","datasets","download",ref,"-f",filename,
                "-p",str(dest),"--unzip","-q"],capture_output=True,text=True,timeout=60)
              files=list(dest.rglob(filename))
              if p.returncode or len(files)!=1:
                  print("NTL_COHORT_SCHEMA_BLOCKED",
                    json.dumps({"ref":ref,"rc":p.returncode,"files":len(files)}),flush=True)
                  continue
              j=json.loads(files[0].read_text(encoding="utf-8"))
              payload={key:j.get(key) for key in allowed if key in j}
              payload["ref"]=ref
              payload["metadata_only"]=True
              print("NTL_COHORT_ELIGIBILITY_AGGREGATES",
                json.dumps(payload,ensure_ascii=False,default=str),flush=True)
          PY
