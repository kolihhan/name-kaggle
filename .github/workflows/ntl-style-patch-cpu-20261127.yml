name: NTL frozen style patch CPU
on:
  push:
    branches: [research/ntl-style-patch-cpu-20261127]
    paths: ['.github/workflows/ntl-style-patch-cpu-20261127.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.ref == 'refs/heads/research/ntl-style-patch-cpu-20261127'
    env:
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/ntl_style_patch_cpu_20261127.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU runtime
        run: |
          python -m pip install -q torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q sentence-transformers==4.1.0 transformers==4.51.3 pandas scikit-learn kaggle==2.2.5 six==1.17.0
          python scripts/ntl_style_patch_cpu_20261127.py --selftest
      - name: Real frozen diagnostic
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          test ! -e data/train.csv
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          kaggle competitions download -c name-that-llm -f train.csv -p "$work" -q
          if [ -f "$work/train.csv.zip" ]; then unzip -q "$work/train.csv.zip" -d "$work"; fi
          test -f "$work/train.csv"
          python scripts/ntl_style_patch_cpu_20261127.py "$work/train.csv"
