name: NTL WeMM Private Fullpath Smoke Status (read only)
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-wemm-smoke-status-readonly-20261112.yml]
permissions: {contents: read}
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check -q kaggle==2.2.5 six==1.17.0
      - name: Inspect private diagnostic status without submitting or using GPU
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python - <<'PY'
          import json,re,subprocess
          ref="kolihhan/ntl-wemm-fullpath-3row-smoke-v1"
          x=subprocess.run(["kaggle","kernels","status",ref],capture_output=True,text=True,timeout=65)
          m=re.search(r"KernelWorkerStatus\.([A-Z_]+)",x.stdout+"\n"+x.stderr)
          state=m.group(1) if m else "UNKNOWN"
          print("NTL_WEMM_PRIVATE_SMOKE_STATE",json.dumps({"ref":ref,"state":state,"status_rc":x.returncode}),flush=True)
          if state in ("COMPLETE","ERROR","CANCELLED"):
              y=subprocess.run(["kaggle","kernels","files",ref,"-v","--page-size","200"],
                  capture_output=True,text=True,timeout=65)
              print("NTL_WEMM_PRIVATE_SMOKE_OUTPUT_FLAGS",json.dumps({
                  "files_rc":y.returncode,
                  "submission_parquet":y.returncode==0 and "submission.parquet" in y.stdout,
                  "log_related_names": [line.split(",",1)[0][:180] for line in y.stdout.splitlines()
                        if line.lower().startswith(("log","__output","__results"))][:12],
              }),flush=True)
          PY
