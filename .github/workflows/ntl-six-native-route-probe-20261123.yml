name: NTL actual six missing proxy models — bounded native route check
on:
  push:
    branches: [research/ntl-fresh18-crosssource-identity-20261123]
    paths: [.github/workflows/ntl-six-native-route-probe-20261123.yml]
permissions: {contents: read}
concurrency:
  group: ntl-six-native-route-probe-20261123
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/ntl_proxy_six_native_probe_20261123.py
            scripts/ntl_probe_kaggle_served_models.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install official Kaggle SDK, no GPU
        run: python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
      - name: Static source test and public-repo privacy gate
        shell: bash
        run: |
          set -euo pipefail
          test ! -e data/train.csv
          test ! -e data/test.csv
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m py_compile scripts/ntl_proxy_six_native_probe_20261123.py scripts/ntl_probe_kaggle_served_models.py
          echo NTL_SIX_PROXY_STATIC_PREFLIGHT=PASS
      - name: One provider-native request per missing target, capped at 256 tokens each
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.ntl_proxy_six_native_probe_20261123
      - name: Never retain generated response text
        if: always()
        run: |
          rm -rf __pycache__ scripts/__pycache__
          echo NTL_SIX_PROXY_NO_RAW_TEXT_LOGGED_OR_ARTIFACTED=TRUE
