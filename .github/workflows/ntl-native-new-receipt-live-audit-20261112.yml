name: NTL Native one-shot private Notebook + exact owned submission read-only state
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-native-new-receipt-live-audit-20261112.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Read exact Kaggle kernel and last official ledger only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q kaggle==2.2.5 six==1.17.0
          python - <<'PY'
          import subprocess,csv,io,json,datetime
          k="kolihhan/ntl-native-frozen-nov12-one-shot"
          status=subprocess.run(["kaggle","kernels","status",k],capture_output=True,text=True,timeout=100)
          print("NTL_NATIVE_PRIVATE_WORKER_STATUS="+json.dumps({"rc":status.returncode,
                "summary":" ".join((status.stdout or status.stderr or "").split())[:220]}),flush=True)
          rows=subprocess.run(["kaggle","competitions","submissions","name-that-llm","-v","-q"],
               capture_output=True,text=True,check=True,timeout=120)
          ledger=list(csv.DictReader(io.StringIO(rows.stdout)))
          matches=[{field:x.get(field) for field in ("ref","description","status","publicScore","privateScore","date")}
                   for x in ledger if "NTL frozen native pretrained ensemble guarded" in (x.get("description") or "")]
          print("NTL_NATIVE_ACTUAL_OWNED_LEDGER="+json.dumps(matches,sort_keys=True),flush=True)
          print("NTL_NATIVE_STATUS_SNAPSHOT_UTC="+datetime.datetime.now(datetime.timezone.utc).isoformat(),flush=True)\n          print("NTL_NATIVE_SECOND_CHECK_NO_MUTATIONS=TRUE",flush=True)
          PY
