name: V2 Paired Status

on:
  push:
    branches:
      - exp/prompt-invariant-contrastive-v2
    paths:
      - .github/workflows/v2-paired-status.yml

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      # The second paired-transfer attempt already pushed this scientific kernel.
      # Attach/read only: do not push or retrain.
      KERNEL_REF: kolihhan/ntl-v2-transfer-a-b
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Kaggle CLI
        run: python -m pip install -q 'kaggle==2.2.5' six
      - name: Read existing kernel only
        shell: bash
        run: |
          set -euo pipefail
          : "${KAGGLE_API_TOKEN:?KAGGLE_API_TOKEN secret is not available}"
          kaggle kernels status "$KERNEL_REF" || true
          echo '--- latest logs ---'
          kaggle kernels logs "$KERNEL_REF" || true
