name: NTL real historical OOF expert complementarity CPU audit
on:
  push:
    branches: [research/ntl-ensemble-decomposition-20261127]
    paths: ['.github/workflows/ntl-v90-cached-oof-evidence.yml']
permissions: {contents: read}
jobs:
  cached-oof:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/ntl_v90_cached_oof_evidence.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Execute actual cached score and provenance audit
        run: |
          set -euo pipefail
          test ! -e data/train.csv
          python -m pip install -q kaggle==2.2.5 six==1.17.0 numpy pandas
          python -m py_compile scripts/ntl_v90_cached_oof_evidence.py
          python scripts/ntl_v90_cached_oof_evidence.py
