name: NTL real historical OOF sparse prompt k2 retrospective test
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-retrospective-sparse-k2-once-20261120.yml]
permissions: {contents: read, actions: read}
concurrency: {group: ntl-sparse-k2-historical-one-20261120, cancel-in-progress: false}
jobs:
  real_historical_k2:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            scripts/ntl_retrospective_sparse_prompt_k2_ruler_20261120.py
            data/train.csv
            artifacts/phase1/folds.csv
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Retrieve authentic paired Phase7/Phase15 original OOF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ntl-original-p7 /tmp/ntl-original-p15
          gh run download 41195328534 -R kolihhan/name-kaggle -n phase7-gated-specialist -D /tmp/ntl-original-p7
          gh run download 41270900644 -R kolihhan/name-kaggle -n phase15-terms-clean-frozen-shot -D /tmp/ntl-original-p15
          python -m pip install -q --disable-pip-version-check numpy==2.3.4 pandas==2.3.3
      - name: 5000 exact paired prompt subsamples for k 1,2,4, no model execution
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t a < <(find /tmp/ntl-original-p7 -type f -name gated_specialist_oof.csv)
          mapfile -t b < <(find /tmp/ntl-original-p15 -type f -name oof.csv)
          test "${#a[@]}" -eq 1
          test "${#b[@]}" -eq 1
          python scripts/ntl_retrospective_sparse_prompt_k2_ruler_20261120.py \
            --train data/train.csv --folds artifacts/phase1/folds.csv \
            --phase7 "${a[0]}" --phase15 "${b[0]}" \
            --out ntl-k2-retrospective-aggregate-only.json
      - name: Erase local original prediction/data files
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/ntl-original-p7 /tmp/ntl-original-p15
          rm -f data/train.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ntl-sparse-k2-aggregate-${{ github.run_id }}
          path: ntl-k2-retrospective-aggregate-only.json
          retention-days: 14
          if-no-files-found: warn
