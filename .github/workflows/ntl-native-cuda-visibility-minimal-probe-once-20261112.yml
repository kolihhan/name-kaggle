name: NTL minimal Kaggle T4 parent child CUDA visibility probe one shot
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-native-cuda-visibility-minimal-probe-once-20261112.yml]
permissions: {contents: read}
concurrency:
  group: ntl-single-20261112-minimal-t4-visibility-probe
  cancel-in-progress: false
jobs:
  test:
    if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'GO_NTL_MINIMAL_T4_CUDA_VISIBILITY_ONE_SHOT_20261112' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      REF: kolihhan/ntl-native-cuda-visibility-v1
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Preflight Kaggle quota and exact nonduplicate, create no-data kernel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
          python - <<'PY'
          import os,subprocess,json
          p=subprocess.run(["kaggle","quota","--format","json"],capture_output=True,text=True,check=True,timeout=90)
          gpu=[x for x in json.loads(p.stdout) if x.get("resource")=="GPU"]
          if len(gpu)!=1:raise SystemExit("STOP_NO_AUTHENTICATED_GPU_QUOTA")
          hours=float(str(gpu[0]["remaining"]).rstrip("h"))
          print("NTL_MINIMAL_CUDA_GPU_BALANCE_HOURS="+str(hours),flush=True)
          if hours<1.5:raise SystemExit("STOP_GPU_QUOTA_LOW")
          p=subprocess.run(["kaggle","kernels","status",os.environ["REF"]],capture_output=True,text=True,timeout=90)
          if p.returncode==0 or "KernelWorkerStatus." in p.stdout+p.stderr:raise SystemExit("STOP_ALREADY_CREATED_PROBE")
          print("NTL_MINIMAL_CUDA_PROBE_NON_DUPLICATE=TRUE")
          PY
          mkdir -p /tmp/ntl-cuda-minimal-probe
          cat > /tmp/ntl-cuda-minimal-probe/probe.py <<'PY'
          import os,sys,subprocess,json
          from pathlib import Path
          import torch
          def local():
              return {"torch_version":torch.__version__,"torch_built_cuda":torch.version.cuda,
                "cuda_is_available":bool(torch.cuda.is_available()),
                "device_count":int(torch.cuda.device_count()),
                "device_names":[torch.cuda.get_device_name(i) for i in range(torch.cuda.device_count())],
                "cuda_visible_devices":os.environ.get("CUDA_VISIBLE_DEVICES")}
          results={"parent":local(),"children":{}}
          code="import torch,os,json;print(json.dumps({'torch_built_cuda':torch.version.cuda,'cuda_is_available':torch.cuda.is_available(),'device_count':torch.cuda.device_count(),'cuda_visible_devices':os.environ.get('CUDA_VISIBLE_DEVICES')}))"
          for mask in ("0,1","0","1",""):
              env=os.environ.copy();env["CUDA_VISIBLE_DEVICES"]=mask
              child=subprocess.run([sys.executable,"-c",code],env=env,capture_output=True,text=True,timeout=90)
              try:data=json.loads(child.stdout.strip().splitlines()[-1])
              except Exception:data={"parse_failed":True}
              results["children"][mask if mask else "empty"]={"rc":child.returncode,**data}
          nvidia=subprocess.run(["nvidia-smi","-L"],capture_output=True,text=True,timeout=30)
          results["nvidia_smi"]={"return_code":nvidia.returncode,
              "gpu_line_count":sum("GPU " in x for x in nvidia.stdout.splitlines())}
          print("NTL_MINIMAL_CUDA_VISIBILITY="+json.dumps(results,sort_keys=True),flush=True)
          Path("/kaggle/working/ntl_cuda_visibility.json").write_text(json.dumps(results,sort_keys=True))
          PY
          python -m py_compile /tmp/ntl-cuda-minimal-probe/probe.py
          python - <<'PY'
          import os,json
          meta={
           "id":os.environ["REF"],
           "title":"ntl-native-cuda-visibility-v1",
           "code_file":"probe.py",
           "language":"python",
           "kernel_type":"script",
           "is_private":True,
           "enable_gpu":True,
           "enable_tpu":False,
           "enable_internet":False,
           "machine_shape":"NvidiaTeslaT4",
           "competition_sources":["name-that-llm"],
           "dataset_sources":[],
           "kernel_sources":[],
           "model_sources":[],
          }
          p="/tmp/ntl-cuda-minimal-probe/kernel-metadata.json"
          open(p,"w").write(json.dumps(meta,indent=2,sort_keys=True)+"\n")
          PY
          echo NTL_CUDA_MINIMAL_NO_MODEL_OR_COMPETITION_DATA=TRUE
      - name: Launch one private GPU hardware-only diagnostic, no inference/training/competition submission
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p /tmp/ntl-cuda-minimal-probe --accelerator NvidiaTeslaT4 --timeout 800 >/tmp/ntl-minimal-probe-push.log 2>&1 || {
            echo STOP_MINIMAL_CUDA_PROBE_PUSH_FAILED
            exit 1
          }
          echo NTL_MINIMAL_T4_PROBE_PUSH_ACCEPTED=TRUE
      - name: Poll one existing private probe for terminal evidence
        id: terminal
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 55); do
            s="$(kaggle kernels status "$REF" 2>&1 || true)"
            upper="$(printf '%s' "$s" | tr '[:lower:]' '[:upper:]')"
            if grep -q 'KERNELWORKERSTATUS.COMPLETE' <<<"$upper"; then
              echo 'outcome=complete' >> "$GITHUB_OUTPUT"
              echo NTL_MINIMAL_CUDA_PROBE_TERMINAL=COMPLETE
              exit 0
            fi
            if grep -Eq 'KERNELWORKERSTATUS.(ERROR|FAILED|CANCELLED)' <<<"$upper"; then
              echo 'outcome=error' >> "$GITHUB_OUTPUT"
              echo NTL_MINIMAL_CUDA_PROBE_TERMINAL=ERROR
              exit 0
            fi
            if [ "$i" -eq 1 ] || [ $((i%10)) -eq 0 ]; then echo NTL_MINIMAL_CUDA_POLL="$i"; fi
            sleep 15
          done
          echo 'outcome=pending' >> "$GITHUB_OUTPUT"
          echo NTL_MINIMAL_CUDA_PROBE_TERMINAL=PENDING
      - name: Read allowlisted hardware counters from private output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ntl-minimal-probe-existing-result
          kaggle kernels output "$REF" -p /tmp/ntl-minimal-probe-existing-result -o >/tmp/ntl-minimal-probe-get.log 2>&1 || {
            echo NTL_MINIMAL_CUDA_PROBE_NO_OUTPUT; exit 1;
          }
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/ntl-minimal-probe-existing-result/ntl_cuda_visibility.json")
          if not p.is_file():raise SystemExit("STOP_NO_NATIVE_CUDA_HARDWARE_PROBE_JSON")
          d=json.loads(p.read_text())
          if set(d["children"])!={"0,1","0","1","empty"}:raise SystemExit("STOP_CUDA_CHILD_MATRIX_INCOMPLETE")
          print("NTL_NATIVE_GPU_AND_MASK_CHECK="+json.dumps(d,sort_keys=True),flush=True)
          print("NTL_GPU_VISIBILITY_ONLY_NO_WEIGHTS_TRAINING_OR_SUBMISSION=TRUE")
          PY
