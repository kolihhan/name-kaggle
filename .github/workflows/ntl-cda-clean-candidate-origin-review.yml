name: NTL CDA Alternative Unscored Source Provenance Review
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-cda-clean-candidate-origin-review.yml]
permissions: {contents: read}
jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q kaggle==2.2.5 requests==2.32.3 six==1.17.0
      - name: Inspect four preselected non-scored source origins, README and license only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ntl-source-review
          python - <<'PY'
          import requests, subprocess, pathlib, json, hashlib, re
          # Selected from previously frozen capacity artifact by coverage and
          # not using ANY new attribution model scores. Not a new holdout contract.
          refs=['kilupy/ntl-18-model-corpus','trnhip/ntl-api-gen',
                'lxdlxdlxd/ntl-synth-generations-v1','philipvallen/ntl-pools']
          docs=[]
          pat=re.compile(r'model|serv|provider|api|source|licen|prompt|generat|train|test|host|reason|fidelity|validation|filter|leak|reuse|origin|OpenRouter',re.I)
          for ref in refs:
            r={'source':ref}
            try:
              res=requests.get('https://www.kaggle.com/api/v1/datasets/view/'+ref,timeout=30)
              r['rest_status']=res.status_code
              if res.ok:
                d=res.json()
                r['title']=str(d.get('title',''))[:150]
                r['license']=str(d.get('licenseName',''))[:180]
                r['description_length']=len(str(d.get('description','')))
            except Exception as e:r['api_error']=type(e).__name__
            dir=pathlib.Path('/tmp/ntl-source-review')/ref.split('/')[-1]
            dir.mkdir(exist_ok=True)
            fs=subprocess.run(['kaggle','datasets','files',ref],capture_output=True,text=True,timeout=20)
            r['file_list_returncode']=fs.returncode
            names=[s.split()[0] for s in fs.stdout.splitlines() if s.strip()]
            r['has_README_md']='README.md' in names
            if r['has_README_md']:
              down=subprocess.run(['kaggle','datasets','download','-d',ref,'-f','README.md','-p',str(dir),'--unzip','-q'],
                                  capture_output=True,text=True,timeout=40)
              p=dir/'README.md'
              r['readme_download_ok']=down.returncode==0 and p.is_file()
              if p.is_file():
                txt=p.read_text(errors='replace')
                r['README_sha256']=hashlib.sha256(p.read_bytes()).hexdigest()
                lines=[(i+1,line[:210]) for i,line in enumerate(txt.splitlines()) if pat.search(line)]
                for i,line in lines[:54]:
                  print('ORIGIN_README',ref,i,line,flush=True)
            print('ORIGIN_METADATA',json.dumps(r,sort_keys=True),flush=True)
            docs.append(r)
          pathlib.Path('/tmp/ntl-source-review/summary.json').write_text(json.dumps({
            'purpose':'NON_SCORED_PROVENANCE_REVIEW',
            'original_CDA_v1_holdout_invalid_due_host_tuning':True,
            'scientific_training_authorized':False,
            'sources':docs},sort_keys=True,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cda-unscored-clean-source-provenance-aggregate-only
          path: /tmp/ntl-source-review/summary.json
          if-no-files-found: warn
          retention-days: 14
