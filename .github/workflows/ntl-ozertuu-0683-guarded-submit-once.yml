name: NTL Ozertuu 0683 guarded private one-shot submission
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-ozertuu-0683-guarded-submit-once.yml]
permissions: {contents: read}
jobs:
  one-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/ntl_public_ozertuu_0683_one_shot.py
            artifacts/candidates/public-ozertuu-0683-guarded-repro/CONTRACT.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify privacy, frozen public source contract and no official data in checkout
        shell: bash
        run: |
          set -euo pipefail
          test ! -e data/train.csv
          test ! -e data/test.csv
          test ! -e data/sample_submission.parquet
          python -m py_compile scripts/ntl_public_ozertuu_0683_one_shot.py
          test -f artifacts/candidates/public-ozertuu-0683-guarded-repro/CONTRACT.md
      - name: Install official Kaggle CLI
        run: python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
      - name: Exactly one private, attribution-preserving, inference-only reproduction
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python -u scripts/ntl_public_ozertuu_0683_one_shot.py
