name: NTL 0.719 GLM Fable decision-scope read-only audit
on:
  push:
    branches: [research/ntl-highscore-0715-0719-source-audit-20261123]
    paths:
      - .github/workflows/ntl-highscore-decision-scope-20261123.yml
permissions: {contents: read}
jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install metadata/source client only
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
      - name: Inspect real GLM/Fable decision modules (never execute them)
        run: |
          set -euo pipefail
          python -m py_compile scripts/ntl_highscore_decision_scope_20261123.py
          python -m scripts.ntl_highscore_decision_scope_20261123
          echo NTL_SOURCE_ONLY_NO_MODEL_TRAINING_NO_GPU_NO_OFFICIAL_TEST_NO_SUBMISSION=TRUE
