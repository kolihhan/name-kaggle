name: NTL real external 216 family versus sibling oracle ceilings diagnostic
on:
  push:
    branches: [research/ntl-highscore-realprediction-drift-20261123]
    paths:
      - .github/workflows/ntl-real-216-oracle-bottleneck-20261123.yml
permissions: {contents: read}
concurrency:
  group: ntl-real216-oracle-20261123
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install Kaggle metadata and CPU aggregation only
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0 pandas==2.3.3 pyarrow==22.0.0 numpy==2.3.4
      - name: Fetch frozen external labels and historical complete strong predictions
        run: |
          set -euo pipefail
          mkdir -p /tmp/ntl-real216-source /tmp/ntl-real216-pred
          kaggle kernels output kolihhan/ntl-oleg18-frozen0691-probe-nov16 -p /tmp/ntl-real216-pred -o >/dev/null
          for f in external_short_wide.parquet external_cell_metadata.parquet; do
            kaggle datasets download -d olegzholobov/name-that-llm-response-corpus -f "$f" -p /tmp/ntl-real216-source --unzip -o -q >/dev/null
          done
          test -s /tmp/ntl-real216-pred/submission.parquet
      - name: Run 18-label actual error decomposition and oracle ceilings; print aggregates
        run: |
          set -euo pipefail
          python -m py_compile scripts/ntl_real_external216_oracle_bottleneck_20261123.py
          python -m scripts.ntl_real_external216_oracle_bottleneck_20261123 --external /tmp/ntl-real216-source --pred /tmp/ntl-real216-pred/submission.parquet
          echo NTL_NO_NEW_0715_EVALUATION_NO_TRAINING_NO_GPU_NO_OFFICIAL_SUBMISSION=TRUE
      - name: Remove private raw response/prediction data
        if: always()
        run: rm -rf /tmp/ntl-real216-source /tmp/ntl-real216-pred
