name: NTL 0679 frozen private fresh-source full inference ONCE
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-0679-transfer-private-inference-once.yml]
permissions: {contents: read}
concurrency:
  group: ntl-0679-external-one-private-inference
  cancel-in-progress: false
jobs:
  infer:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/ntl_0679_transfer_private_once.py
            artifacts/research/ntl-0679-transfer-diagnostic/CONTRACT.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Frozen source and public data guard
        shell: bash
        run: |
          set -euo pipefail
          test ! -e data/train.csv
          test ! -e data/test.csv
          test ! -e data/sample_submission.parquet
          python -m py_compile scripts/ntl_0679_transfer_private_once.py
      - name: Official Kaggle CLI
        run: python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
      - name: Push private diagnostic, run 347 full-model inferences, no competition submission
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python -u scripts/ntl_0679_transfer_private_once.py --run
