name: NTL Phase15 size matched nearest fix empty missing-label quantile
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-phase15-size-match-neighbor-fixed-once-20261120.yml]
permissions: {contents: read}
jobs:
  near_neighbor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install pinned CPU runtime
        run: |
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0 numpy==2.3.4 pandas==2.3.3 scipy==1.16.3 scikit-learn==1.7.2 pyarrow==22.0.0
          python -m py_compile scripts/ntl_phase15_size_matched_nearest_audit_20261120.py
      - name: Download original SHA-pinned Phase 15 external source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          mkdir -p /tmp/p15-nearfixed
          kaggle datasets download -d nishantdahal/ntl-handwriting-blend -f pool_v4.parquet -p /tmp/p15-nearfixed --unzip -q >/dev/null
      - name: Compute paired 30 draw size matched word content cosine with missing classes null
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.ntl_phase15_size_matched_nearest_audit_20261120 \
            --train data/train.csv --folds artifacts/phase1/folds.csv \
            --pool /tmp/p15-nearfixed/pool_v4.parquet \
            --out ntl-phase15-neighbor-aggregate.json
      - name: Cleanup public data copy
        if: always()
        run: rm -rf /tmp/p15-nearfixed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ntl-phase15-near-matched-diagnostic-${{ github.run_id }}
          path: ntl-phase15-neighbor-aggregate.json
          retention-days: 10
          if-no-files-found: warn
