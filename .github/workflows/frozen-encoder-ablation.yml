name: Frozen encoder ablation

on:
  push:
    branches:
      - exp/frozen-encoder-ablation
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/frozen-encoder-ablation.yml
      - requirements-encoder.txt
      - artifacts/phase3/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: pip install pytest numpy pandas scikit-learn
      - name: Run unit tests
        run: python -m pytest -q tests/test_frozen_encoder_ablation.py

  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'
      - name: Install encoder dependencies
        run: pip install -r requirements-encoder.txt pytest
      - name: Run tiny-model encoder integration smoke
        run: python -m pytest -q tests/test_encoder_integration.py

  full:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-encoder]')
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'
      - name: Install encoder dependencies
        run: pip install -r requirements-encoder.txt
      - name: Recreate frozen folds
        run: python scripts/make_folds.py
      - name: Run full frozen ModernBERT A/B
        run: >-
          python scripts/run_frozen_encoder_ablation.py
          --model answerdotai/ModernBERT-base
          --batch-size 16
          --max-length 256
          --device cpu
          --output artifacts/phase3/frozen_modernbert_ablation.json
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-modernbert-ablation
          path: artifacts/phase3/frozen_modernbert_ablation.json
