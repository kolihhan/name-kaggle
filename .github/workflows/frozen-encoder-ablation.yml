name: Frozen encoder ablation

on:
  push:
    branches:
      - exp/frozen-encoder-ablation
    paths:
      - scripts/**
      - tests/test_frozen_encoder_ablation.py
      - .github/workflows/frozen-encoder-ablation.yml
      - requirements-encoder.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: pip install pytest numpy pandas scikit-learn
      - name: Run unit tests
        run: pytest -q tests/test_frozen_encoder_ablation.py
