name: NTL exact Native CUDA context one GPU-no-weights private diagnostic
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-native-cuda-context-exact-one-private-20261112.yml]
permissions: {contents: read}
concurrency:
  group: ntl-native-context-probe-nov12-single-run
  cancel-in-progress: false
jobs:
  diagnostic:
    if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'GO_NTL_NATIVE_CORE_CUDA_CONTEXT_EXACT_ONCE_20261112' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      DEST: kolihhan/ntl-native-context-probe-nov12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/ntl_native_fullpath_smoke_20261112.py
            scripts/ntl_native_gpu_mapfix_realpath_20261112.py
            scripts/ntl_native_cuda_context_exact_20261112.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Verify exact unchanged weights, no duplicate and bounded GPU quota
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/ntl_native_cuda_context_exact_20261112.py
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install -q kaggle==2.2.5 six==1.17.0
          python - <<'PY'
          import json,os,subprocess
          p=subprocess.run(["kaggle","quota","--format","json"],capture_output=True,text=True,check=True,timeout=90)
          gpu=[v for v in json.loads(p.stdout) if v.get("resource")=="GPU"]
          if len(gpu)!=1:raise SystemExit("STOP_NO_GPU_QUOTA_RECORD")
          balance=float(str(gpu[0].get("remaining")).rstrip("h"))
          print("NTL_CONTEXT_QUOTA_REMAINING_HOURS="+str(balance),flush=True)
          if balance<1.5:raise SystemExit("STOP_GPU_QUOTA_LT_1POINT5_HOURS")
          p=subprocess.run(["kaggle","kernels","status",os.environ["DEST"]],capture_output=True,text=True,timeout=90)
          if p.returncode==0 or "KernelWorkerStatus." in p.stdout+p.stderr:
            raise SystemExit("STOP_CONTEXT_KERNEL_ALREADY_EXISTS")
          PY
          python -u -m scripts.ntl_native_cuda_context_exact_20261112 --out /tmp/ntl-native-context-exact | tail -n 1
          echo NTL_CONTEXT_NO_MODEL_WEIGHTS_OR_NEW_TRAINING=TRUE
      - name: Launch exactly one private Kaggle hardware context diagnostic
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p /tmp/ntl-native-context-exact/kernel --accelerator NvidiaTeslaT4 --timeout 900 >/tmp/ntl-context-push.log 2>&1 || {
            echo STOP_NTL_CONTEXT_PRIVATE_PUSH_FAILED
            exit 1
          }
          echo NTL_CONTEXT_PRIVATE_GPU_DIAGNOSTIC_ACCEPTED=TRUE
      - name: Poll only existing controlled-stop diagnostic kernel
        id: terminal
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            t="$(kaggle kernels status "$DEST" 2>&1 || true)"
            s="$(printf '%s' "$t" | tr '[:lower:]' '[:upper:]')"
            if grep -q 'KERNELWORKERSTATUS.COMPLETE' <<<"$s";then
              echo 'status=complete' >> "$GITHUB_OUTPUT"
              echo NTL_CONTEXT_PRIVATE_STATUS=COMPLETE
              exit 0
            fi
            if grep -Eq 'KERNELWORKERSTATUS.(ERROR|FAILED|CANCELLED)' <<<"$s";then
              echo 'status=error' >> "$GITHUB_OUTPUT"
              echo NTL_CONTEXT_PRIVATE_STATUS=CONTROLLED_ERROR_EXPECTED
              exit 0
            fi
            if [ "$i" -eq 1 ] || [ $((i%10)) -eq 0 ];then echo NTL_CONTEXT_POLL="$i";fi
            sleep 12
          done
          echo 'status=pending' >> "$GITHUB_OUTPUT"
          echo NTL_CONTEXT_PRIVATE_STATUS=PENDING
      - name: Read allowlisted CUDA numbers from already-run private logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ntl-context-private-outputs
          kaggle kernels output "$DEST" -p /tmp/ntl-context-private-outputs -o >/tmp/ntl-context-output-fetch.log 2>&1 || true
          python - <<'PY'
          import re,json
          from pathlib import Path
          root=Path("/tmp/ntl-context-private-outputs")
          markers=("NTL_EARLY_NOTEBOOK_CUDA_CONTEXT=",
                   "NTL_ENSEMBLE_PARENT_CUDA_CONTEXT=",
                   "NTL_CORE_CONTEXT_PROBE=")
          findings={key:[] for key in markers}
          controlled=False
          for file in root.rglob("*"):
            if not file.is_file() or file.suffix not in (".log",".txt",".json"):continue
            if file.stat().st_size>10_000_000:continue
            lines=file.read_text(encoding="utf-8",errors="replace").splitlines()
            for line in lines:
              line=re.sub(r'\x1b\[[0-9;]*m','',line)
              if "NTL_CORE_CONTEXT_PROBE_CONTROLLED_STOP_NO_WEIGHTS" in line:controlled=True
              for marker in markers:
                if marker in line:
                  candidate=line.split(marker,1)[1].strip()
                  try:
                    data=json.loads(candidate)
                  except Exception:
                    continue
                  allowed=("cuda_available","device_count","cuda_visible_devices",
                    "cuda_build","torch_version","nvidia_smi_gpu_count","nvidia_smi_exit",
                    "torch_cuda_build","mask","parent_mask","requested_child_mask","torch_build")
                  findings[marker].append({k:data.get(k) for k in allowed if k in data})
          report={"snapshots":findings,"controlled_stop":controlled,
            "new_training":False,"official_submission":False,
            "model_weights_loaded":False}
          print("NTL_EXACT_NATIVE_PROCESS_CUDA_SNAPSHOTS="+json.dumps(report,sort_keys=True),flush=True)
          PY
      - name: Confirm this was an actual terminal diagnostic, not a score
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.terminal.outputs.status }}" != pending
          echo NTL_NO_NEW_KAGGLE_COMPETITION_SUBMISSION=TRUE
