name: NTL V47 Frozen SVC Real Weight Check
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-v47-length40-cpu-proof.yml, .github/ntl/v47-length40-cpu-proof.py]
permissions: {contents: read}
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/ntl/v47-length40.py
            .github/ntl/v47-length40-payload.json
            .github/ntl/v47-length40-cpu-proof.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q 'kaggle==2.2.5' 'six==1.17.0' 'cryptography==46.0.3' 'numpy==2.2.6' 'scipy==1.15.3' 'scikit-learn==1.6.1' 'joblib==1.5.1'
      - name: Run frozen treatment on original SVC state
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python -u .github/ntl/v47-length40-cpu-proof.py
