name: NTL frozen champion small-cohort schema & entrypoint preflight
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-frozen-champion-cohort-preflight.yml]
permissions: {contents: read}
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install Kaggle CLI & schema tools
        run: python -m pip install -q --disable-pip-version-check 'kaggle==2.2.5' 'six==1.17.0' pandas
      - name: Inspect public cohort schema and frozen notebook entrypoint (no data committed)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,hashlib,json,pathlib,re,subprocess,tempfile
          ref="kolihhan/ntl-ozertuu-0683-guarded-no-train"
          dest=pathlib.Path(tempfile.mkdtemp(prefix="ntl-public-nb-"))
          p=subprocess.run(["kaggle","kernels","pull",ref,"-p",str(dest),"-m"],
                            capture_output=True,text=True,timeout=120)
          if p.returncode:
              print("NTL_CHAMPION_SOURCE_FETCH_BLOCKED",json.dumps({
                  "returncode":p.returncode,
                  "http_403":"403" in p.stderr,"http_429":"429" in p.stderr,
                  "not_found":"not found" in p.stderr.lower(),
                  "auth_required":"auth" in p.stderr.lower(),
                  "error_class":p.stderr.splitlines()[-1][:160] if p.stderr else ""
              }),flush=True)
              nb={"cells":[]}
          else:
              nb=json.loads(next(dest.glob("*.ipynb")).read_text())
          for ix in (0,1,2,3,4,5,6,7,45,46,47,48,49,50,51,52,53):
              if ix>=len(nb["cells"]):continue
              c=nb["cells"][ix]
              s="".join(c.get("source",[]))
              print("NTL_NOTEBOOK_BOUNDARY",json.dumps({"idx":ix,"type":c.get("cell_type"),
                   "lines":len(s.splitlines()),"source":s[:1800] if ix<=7 or ix>=45 else ""}),flush=True)
          code=["".join(c.get("source",[])) for c in nb.get("cells",[]) if c.get("cell_type")=="code"]
          digest=hashlib.sha256(json.dumps(code,ensure_ascii=False,separators=(",",":")).encode("utf-8")).hexdigest()
          print("NTL_CHAMPION_CODE_CELL_SHA256",digest,flush=True)
          print("NTL_CHAMPION_SAFETY_GUARDS",json.dumps({
              "gauss":sum("gauss.fit = _no_new_supervised_gaussian_fit" in c for c in code),
              "atlas":sum("NO_NEW_TRAINING: Atlas train mode forbidden" in c for c in code),
              "core":sum("NO_NEW_TRAINING: core worker train_final forbidden" in c for c in code)
          }),flush=True)
          for ix in (5,7,8,52):
              if ix>=len(nb["cells"]):continue
              lines="".join(nb["cells"][ix].get("source",[])).splitlines()
              filtered=[{"n":i+1,"s":line[:240]}
                  for i,line in enumerate(lines)
                  if ("preview" in line or "DATA" in line or "OUTPUT" in line or
                      "_ntl_audit" in line or "RUNTIME/'config.json'" in line or
                      "RUNTIME / 'config.json'" in line or "CONFIG['paths']" in line or
                      "if not" in line or "CONFIG, EXPLICIT" in line)]
              print("NTL_CHAMPION_CONTROLLED_LINES",
                  json.dumps({"cell":ix,"filtered":filtered[:60]},ensure_ascii=False),flush=True)
          # Read-only static audit of final decision rule and all Sinkhorn call sites.
          for ix,c in enumerate(nb.get("cells",[])):
              if c.get("cell_type")!="code":continue
              body="".join(c.get("source",[]))
              if not any(t in body for t in ("%%writefile /kaggle/temp/ntl-gsq-v27-runtime/ensemble.py",
                                            "def soft_sinkhorn", "def sinkhorn",
                                            "sinkhorn_target", "target_mix")):continue
              lines=body.splitlines()
              hits=[j for j,line in enumerate(lines) if re.search(
                  r"(?i)sinkhorn|target_mix|native_mixture|argmax|softmax|score|predict|output|calibrat",line)]
              selected=set()
              for j in hits:
                  for k in range(max(0,j-3),min(len(lines),j+4)):selected.add(k)
              filtered=[{"n":j+1,"s":lines[j][:190]} for j in sorted(selected)]
              print("NTL_NEW_CANDIDATE_DECISION_PATH",json.dumps({
                  "cell":ix,"total_lines":len(lines),
                  "hits":len(hits),"selected":filtered[:185]
              },ensure_ascii=False),flush=True)
          print("NTL_CHAMPION_METADATA",json.dumps({
              "id":json.loads((dest/"kernel-metadata.json").read_text()).get("id"),
              "dataset_source_count":len(json.loads((dest/"kernel-metadata.json").read_text()).get("dataset_sources") or []),
              "code_file":json.loads((dest/"kernel-metadata.json").read_text()).get("code_file")
          }),flush=True)
          for ref,file in (
              ("nimithashreea/ntl-proxy-candidate-generations-20261110","generated_proxy_candidates.csv"),
              ("toanplam/ntl-fresh-generation-pilot-nov08","passages.jsonl")
          ):
              d=pathlib.Path(tempfile.mkdtemp(prefix="ntl-public-cohort-"))
              p=subprocess.run(["kaggle","datasets","download",ref,"-f",file,"-p",str(d),"--unzip","-q"],
                  capture_output=True,text=True,timeout=90)
              info={"dataset":ref,"file":file,"download_rc":p.returncode}
              matches=list(d.rglob(file))
              if p.returncode==0 and len(matches)==1:
                  data=matches[0]
                  if file.endswith(".csv"):
                      with data.open(encoding="utf-8-sig",newline="") as ff:
                          reader=csv.DictReader(ff)
                          info["columns"]=reader.fieldnames
                          n=0; counts={}
                          for row in reader:
                              n+=1
                              for k in ("model","model_label","label"):
                                  if k in row:counts[row[k]]=counts.get(row[k],0)+1;break
                          info["count"]=n;info["label_counts"]=counts
                  else:
                      with data.open(encoding="utf-8") as ff:
                          n=0;counts={};keys=set()
                          for line in ff:
                              v=json.loads(line);n+=1;keys.update(v.keys())
                              for k in ("model","model_label","label","competition_label"):
                                  if k in v:counts[str(v[k])]=counts.get(str(v[k]),0)+1;break
                          info["columns"]=sorted(keys);info["count"]=n;info["label_counts"]=counts
              print("NTL_COHORT_SCHEMA",json.dumps(info,sort_keys=True),flush=True)
          PY
