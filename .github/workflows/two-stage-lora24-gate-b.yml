name: Two-stage LoRA24 Gate B

on:
  push:
    branches:
      - exp/first-kaggle-submission
    paths:
      - .github/workflows/two-stage-lora24-gate-b.yml
      - .github/workflows/two-stage-lora24-gate-b-runtime.yml
      - scripts/run_two_stage_lora24_gate_b.py
      - scripts/run_two_stage_lora24_gate_b_gpu.py
      - tests/test_two_stage_lora24_gate_b.py
      - tests/test_two_stage_lora24_gate_b_gpu_contract.py
      - tests/test_two_stage_lora24_gate_b_workflow.py
      - tests/test_two_stage_lora24_gate_b_runtime_workflow.py
      - artifacts/candidates/two-stage-lora24-v1/CONTRACT.md
      - artifacts/candidates/two-stage-lora24-v1/GATE_B_CHECKPOINT_LOCK.md
      - artifacts/candidates/two-stage-lora24-v1/GATE_B_RUNTIME_LOCK.md
      - artifacts/candidates/two-stage-lora24-v1/GATE_B_RUN_AUTHORIZATION.md

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight Gate B dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile Gate B modules
        run: >-
          python -m py_compile
          scripts/run_two_stage_lora24_gate_b.py
          scripts/run_two_stage_lora24_gate_b_gpu.py
      - name: Run frozen Gate B contract tests
        run: >-
          python -m pytest -q
          tests/test_two_stage_lora24_gate_b.py
          tests/test_two_stage_lora24_gate_b_gpu_contract.py
          tests/test_two_stage_lora24_gate_b_workflow.py
          tests/test_two_stage_lora24_gate_b_runtime_workflow.py

  kaggle-gpu:
    if: contains(github.event.head_commit.message, '[gate-b-run]')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 480
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      DATASET_REF: kolihhan/name-that-llm-two-stage-lora24-v1-a1-checkpoint
      RUNTIME_DATASET_REF: kolihhan/name-that-llm-two-stage-lora24-v1-gate-b-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kaggle and verification dependencies
        run: pip install -r requirements.txt 'kaggle==2.2.5' kagglehub six

      - name: Verify locked checkpoint and runtime datasets remain ready version 1
        shell: bash
        run: |
          set -euo pipefail
          : "${KAGGLE_API_TOKEN:?KAGGLE_API_TOKEN secret is not available}"
          for ref in "$DATASET_REF" "$RUNTIME_DATASET_REF"; do
            status_json="$(kaggle datasets status "$ref" --format json)"
            echo "$ref $status_json"
            STATUS_JSON="$status_json" python - <<'PY'
          import json
          import os
          status = json.loads(os.environ['STATUS_JSON'])
          assert status['status'] == 'ready', status
          assert int(status['current_version_number']) == 1, status
          PY
          done

      - name: Build private official-OOF-only Kaggle kernel
        id: kernel
        shell: bash
        run: |
          set -euo pipefail
          USERNAME="$(python - <<'PY'
          import kagglehub
          print(kagglehub.whoami(verbose=False)["username"])
          PY
          )"
          KERNEL_REF="${USERNAME}/name-that-llm-two-stage-lora24-gate-b"
          KERNEL_DIR=".kaggle/two-stage-lora24-gate-b"
          rm -rf "$KERNEL_DIR"
          mkdir -p "$KERNEL_DIR"

          cat > "$KERNEL_DIR/kernel_main.py" <<'PY'
          import hashlib
          import json
          import pathlib
          import shutil
          import subprocess
          import sys

          CANDIDATE = "two-stage-lora24-v1"
          EXPECTED_TRAIN_SHA256 = "40a22ce8d88c5f46feb4637a099db815bef5f713ffe53e89dbe1b7b21de77707"
          EXPECTED_FOLD_FINGERPRINT = "bf6f47bfaeebdf817a1f7972b54deabbe5e54fb087c77753b6361970d0c9ee0d"
          EXPECTED_RUNTIME_SOURCE_COMMIT = "1d466f4c756394aea4b57f056238ff457f9f0852"
          EXPECTED_RUNTIME_FILE_MANIFEST_SHA256 = "8d6c05d5ec29841d4a25cbf7c903c5d0414d3bf754b4bdd80b1cfdba64c1a933"
          EXPECTED_RUNTIME_TRANSPORT_SHA256 = "f818750300838089f3610347074da52a8340d74a57f54b698ce6c65ea68c3785"
          RUNTIME_PURPOSE = "gate_b_official_oof_runtime_transport_only"
          EXPECTED_RUNTIME_FILES = {
              "data/train.csv",
              "artifacts/phase1/folds.csv",
              "scripts/__init__.py",
              "scripts/run_two_stage_lora24_gate_b_gpu.py",
              "scripts/run_two_stage_lora24_gate_b.py",
              "scripts/run_two_stage_lora24_gate_a.py",
              "scripts/run_style_baseline.py",
              "scripts/run_strong_sparse_anchor.py",
          }

          input_root = pathlib.Path("/kaggle/input")
          lineage_paths = sorted(input_root.rglob("runtime_lineage.json"))
          if len(lineage_paths) != 1:
              raise RuntimeError(
                  f"expected exactly one mounted Gate-B runtime lineage; found {lineage_paths}"
              )
          runtime_lineage_path = lineage_paths[0]
          lineage = json.loads(runtime_lineage_path.read_text(encoding="utf-8"))

          exact_lineage = {
              "candidate": CANDIDATE,
              "purpose": RUNTIME_PURPOSE,
              "source_commit": EXPECTED_RUNTIME_SOURCE_COMMIT,
              "official_train_sha256": EXPECTED_TRAIN_SHA256,
              "fold_fingerprint": EXPECTED_FOLD_FINGERPRINT,
              "official_rows": 2699,
              "file_manifest_sha256": EXPECTED_RUNTIME_FILE_MANIFEST_SHA256,
              "transport_sha256": EXPECTED_RUNTIME_TRANSPORT_SHA256,
              "competition_test_rows_included": 0,
              "public_stage1_rows_included": 0,
              "scientific_configuration_changed": False,
          }
          for key, expected in exact_lineage.items():
              if lineage.get(key) != expected:
                  raise RuntimeError(
                      f"runtime lineage drift for {key}: {lineage.get(key)!r} != {expected!r}"
                  )

          files = lineage.get("files")
          if not isinstance(files, list) or len(files) != 8:
              raise RuntimeError(f"runtime lineage files missing or unexpected: {files}")
          declared_paths = {str(entry.get("path")) for entry in files}
          if declared_paths != EXPECTED_RUNTIME_FILES:
              raise RuntimeError(
                  f"runtime file set drift: {sorted(declared_paths)} != "
                  f"{sorted(EXPECTED_RUNTIME_FILES)}"
              )

          first_rel = pathlib.PurePosixPath(str(files[0]["path"]))
          candidate_roots = set()
          for match in runtime_lineage_path.parent.rglob(first_rel.name):
              if not match.as_posix().endswith("/" + first_rel.as_posix()):
                  continue
              root = match
              for _ in first_rel.parts:
                  root = root.parent
              candidate_roots.add(root)
          runtime_roots = [
              root
              for root in candidate_roots
              if all(
                  root.joinpath(*pathlib.PurePosixPath(str(entry["path"])).parts).is_file()
                  for entry in files
              )
          ]
          if len(runtime_roots) != 1:
              raise RuntimeError(f"expected one expanded Gate-B runtime root; found {runtime_roots}")
          runtime_root = runtime_roots[0]

          observed_files = []
          for entry in files:
              rel = pathlib.PurePosixPath(str(entry["path"]))
              source_path = runtime_root.joinpath(*rel.parts)
              observed_sha = hashlib.sha256(source_path.read_bytes()).hexdigest()
              observed_size = source_path.stat().st_size
              if observed_sha != entry.get("sha256") or observed_size != int(entry.get("size", -1)):
                  raise RuntimeError(f"runtime file byte drift: {rel.as_posix()}")
              observed_files.append({
                  "path": rel.as_posix(),
                  "sha256": observed_sha,
                  "size": observed_size,
              })
          manifest_bytes = json.dumps(
              observed_files, sort_keys=True, separators=(",", ":")
          ).encode("utf-8")
          observed_manifest = hashlib.sha256(manifest_bytes).hexdigest()
          if observed_manifest != EXPECTED_RUNTIME_FILE_MANIFEST_SHA256:
              raise RuntimeError(
                  f"runtime manifest SHA drift: {observed_manifest} != "
                  f"{EXPECTED_RUNTIME_FILE_MANIFEST_SHA256}"
              )

          package_root = pathlib.Path("/kaggle/working/gate_b_pkg")
          if package_root.exists():
              shutil.rmtree(package_root)
          package_root.mkdir(parents=True, exist_ok=True)
          for entry in files:
              rel = pathlib.PurePosixPath(str(entry["path"]))
              source_path = runtime_root.joinpath(*rel.parts)
              target_path = package_root.joinpath(*rel.parts)
              target_path.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source_path, target_path)

          train_path = package_root / "data" / "train.csv"
          folds_path = package_root / "artifacts" / "phase1" / "folds.csv"
          if hashlib.sha256(train_path.read_bytes()).hexdigest() != EXPECTED_TRAIN_SHA256:
              raise RuntimeError("mounted official train SHA drift")

          sys.path.insert(0, str(package_root))
          subprocess.check_call([
              sys.executable,
              "-m",
              "pip",
              "install",
              "-q",
              "transformers==4.57.1",
              "peft==0.17.1",
              "safetensors",
          ])

          from scripts.run_strong_sparse_anchor import load_train
          from scripts.run_style_baseline import fold_fingerprint
          from scripts.run_two_stage_lora24_gate_b_gpu import main

          train = load_train(train_path, folds_path)
          if len(train) != 2699:
              raise RuntimeError(f"mounted official row drift: {len(train)} != 2699")
          if fold_fingerprint(train) != EXPECTED_FOLD_FINGERPRINT:
              raise RuntimeError("mounted permanent fold fingerprint drift")

          output_dir = pathlib.Path("/kaggle/working/gate_b_output")
          sys.argv = [
              "run_two_stage_lora24_gate_b_gpu",
              "--orchestrate",
              "--train",
              str(train_path),
              "--folds",
              str(folds_path),
              "--output-dir",
              str(output_dir),
          ]
          main()
          output_dir.mkdir(parents=True, exist_ok=True)
          shutil.copy2(runtime_lineage_path, output_dir / "runtime_lineage.json")
          PY

          python -m py_compile "$KERNEL_DIR/kernel_main.py"
          kernel_main_bytes="$(wc -c < "$KERNEL_DIR/kernel_main.py")"
          echo "kernel_main_bytes: $kernel_main_bytes"
          if (( kernel_main_bytes >= 1000000 )); then
            echo "Kaggle kernel source must stay below 1,000,000 bytes"
            exit 1
          fi

          python - "$KERNEL_DIR/kernel-metadata.json" "$KERNEL_REF" <<'PY'
          import json
          import sys

          path, kernel_ref = sys.argv[1:]
          payload = {
              "id": kernel_ref,
              "title": "Name That LLM Two-stage LoRA24 Gate B",
              "code_file": "kernel_main.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_internet": True,
              "machine_shape": "NvidiaTeslaT4",
              "competition_sources": [],
              "dataset_sources": [
                  "kolihhan/name-that-llm-two-stage-lora24-v1-a1-checkpoint",
                  "kolihhan/name-that-llm-two-stage-lora24-v1-gate-b-runtime",
              ],
              "kernel_sources": [],
              "model_sources": [],
          }
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
          PY
          echo "kernel_ref=$KERNEL_REF" >> "$GITHUB_OUTPUT"
          cat "$KERNEL_DIR/kernel-metadata.json"

      - name: Push frozen Gate B kernel to Kaggle GPU
        run: >-
          kaggle kernels push
          -p .kaggle/two-stage-lora24-gate-b
          --accelerator NvidiaTeslaT4
          --timeout 18000

      - name: Poll kernel until terminal state
        shell: bash
        env:
          KERNEL_REF: ${{ steps.kernel.outputs.kernel_ref }}
        run: |
          set -euo pipefail
          complete=0
          for _ in $(seq 1 900); do
            status="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            echo "$status"
            if grep -Eqi 'complete|successful' <<<"$status"; then
              complete=1
              break
            fi
            if grep -Eqi 'error|failed|cancel' <<<"$status"; then
              kaggle kernels logs "$KERNEL_REF" || true
              exit 1
            fi
            sleep 30
          done
          if [[ "$complete" != "1" ]]; then
            echo "Kaggle Gate B kernel did not reach a successful terminal state"
            kaggle kernels logs "$KERNEL_REF" || true
            exit 1
          fi

      - name: Download Gate B OOF evidence
        shell: bash
        env:
          KERNEL_REF: ${{ steps.kernel.outputs.kernel_ref }}
        run: |
          set -euo pipefail
          rm -rf gate-b-download
          mkdir -p gate-b-download
          kaggle kernels output "$KERNEL_REF" -p gate-b-download -o
          test -n "$(find gate-b-download -name gate_b_candidate.json -print -quit)"
          test -n "$(find gate-b-download -name gate_b_candidate_oof.csv -print -quit)"
          test -n "$(find gate-b-download -name runtime_lineage.json -print -quit)"

      - name: Verify complete candidate OOF and locked lineage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          import pandas as pd
          from scripts.run_strong_sparse_anchor import load_train

          root = Path('gate-b-download')
          report_path = next(root.rglob('gate_b_candidate.json'))
          oof_path = next(root.rglob('gate_b_candidate_oof.csv'))
          runtime_lineage_path = next(root.rglob('runtime_lineage.json'))
          report = json.loads(report_path.read_text(encoding='utf-8'))
          runtime_lineage = json.loads(runtime_lineage_path.read_text(encoding='utf-8'))
          oof = pd.read_csv(oof_path)
          train = load_train(Path('data/train.csv'), Path('artifacts/phase1/folds.csv'))

          assert runtime_lineage['candidate'] == 'two-stage-lora24-v1'
          assert runtime_lineage['purpose'] == 'gate_b_official_oof_runtime_transport_only'
          assert runtime_lineage['source_commit'] == '1d466f4c756394aea4b57f056238ff457f9f0852'
          assert runtime_lineage['official_train_sha256'] == '40a22ce8d88c5f46feb4637a099db815bef5f713ffe53e89dbe1b7b21de77707'
          assert runtime_lineage['fold_fingerprint'] == 'bf6f47bfaeebdf817a1f7972b54deabbe5e54fb087c77753b6361970d0c9ee0d'
          assert runtime_lineage['official_rows'] == 2699
          assert runtime_lineage['file_manifest_sha256'] == '8d6c05d5ec29841d4a25cbf7c903c5d0414d3bf754b4bdd80b1cfdba64c1a933'
          assert runtime_lineage['transport_sha256'] == 'f818750300838089f3610347074da52a8340d74a57f54b698ce6c65ea68c3785'
          assert runtime_lineage['competition_test_rows_included'] == 0
          assert runtime_lineage['public_stage1_rows_included'] == 0
          assert runtime_lineage['scientific_configuration_changed'] is False

          assert report['candidate'] == 'two-stage-lora24-v1'
          assert report['scope'] == 'gate_b_official_oof'
          assert report['official_oof_rows_expected'] == 2699
          assert report['public_stage1_rows_mixed_into_stage2'] == 0
          assert report['competition_test_rows_used'] == 0
          assert report['public_lb_tuning'] is False
          assert report['kaggle_submission_authorized'] is False
          assert report['model']['id'] == 'Qwen/Qwen3-8B-Base'
          assert report['model']['revision'] == '49e3418fbbbca6ecbdf9608b4d22e5a407081db4'
          assert report['model']['transformers'] == '4.57.1'
          assert report['model']['peft'] == '0.17.1'
          assert report['validation']['fold_fingerprint'] == 'bf6f47bfaeebdf817a1f7972b54deabbe5e54fb087c77753b6361970d0c9ee0d'
          assert report['validation']['primary_head'] == 'plain'
          assert report['validation']['centered_head_role'] == 'diagnostic_only'

          checkpoint = report['checkpoint']
          assert checkpoint['dataset_ref'] == 'kolihhan/name-that-llm-two-stage-lora24-v1-a1-checkpoint'
          assert checkpoint['dataset_version'] == 1
          assert checkpoint['manifest_sha256'] == 'c9ba8f77cc0ec84800a8d3508c15939396353772189c573c597bdcf223eaafc0'
          assert checkpoint['source_artifact_id'] == 13094069155
          assert checkpoint['source_artifact_digest'] == 'sha256:a2c4dca4ca5de2b283e5e6806526485f0d92377584d7e621b35a717770c95e66'

          assert len(oof) == 2699
          assert oof['id'].is_unique
          assert oof['plain_prediction'].notna().all()
          assert oof['centered_prediction'].notna().all()
          labels = set(train['model'].astype(str))
          assert set(oof['plain_prediction'].astype(str)) <= labels
          assert set(oof['centered_prediction'].astype(str)) <= labels

          keys = ['id', 'prompt_id', 'model', 'fold_id']
          expected = train[keys].sort_values('id').reset_index(drop=True).astype(
              {'id': str, 'prompt_id': str, 'model': str, 'fold_id': int}
          )
          observed = oof[keys].sort_values('id').reset_index(drop=True).astype(
              {'id': str, 'prompt_id': str, 'model': str, 'fold_id': int}
          )
          assert expected.equals(observed)

          fold_reports = report['fold_reports']
          assert set(fold_reports) == {'0', '1', '2', '3', '4'}
          fold_json_names = ['fold_0.json', 'fold_1.json', 'fold_2.json', 'fold_3.json', 'fold_4.json']
          fold_prediction_names = [
              'fold_0_predictions.csv',
              'fold_1_predictions.csv',
              'fold_2_predictions.csv',
              'fold_3_predictions.csv',
              'fold_4_predictions.csv',
          ]
          available_names = {path.name for path in root.rglob('*') if path.is_file()}
          assert set(fold_json_names) <= available_names
          assert set(fold_prediction_names) <= available_names

          for fold in range(5):
              fold_report = fold_reports[str(fold)]
              assert fold_report['fold'] == fold
              assert fold_report['checkpoint']['manifest_sha256'] == checkpoint['manifest_sha256']
              assert fold_report['checkpoint']['source_artifact_id'] == 13094069155
              assert fold_report['competition_test_rows_used'] == 0
              assert fold_report['public_lb_tuning'] is False
              assert fold_report['kaggle_submission_authorized'] is False
              assert fold_report['invariants']['fresh_stage1_checkpoint_loaded_for_worker'] is True
              assert fold_report['invariants']['validation_used_for_training'] is False
              assert fold_report['invariants']['post_stage2_checkpoint_saved'] is False

          print('OOF_ROWS', len(oof))
          print('PLAIN_BA', report['candidate_oof']['plain_balanced_accuracy'])
          print('CENTERED_BA_DIAGNOSTIC', report['candidate_oof']['centered_balanced_accuracy'])
          print('RUNTIME_MANIFEST_SHA256', runtime_lineage['file_manifest_sha256'])
          print('RUNTIME_TRANSPORT_SHA256', runtime_lineage['transport_sha256'])
          PY

      - name: Upload Gate B candidate OOF evidence only
        uses: actions/upload-artifact@v4
        with:
          name: two-stage-lora24-gate-b-evidence
          path: gate-b-download
          retention-days: 90
