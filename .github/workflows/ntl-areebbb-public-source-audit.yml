name: NTL Areebbb Public Source Static Audit
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-areebbb-public-source-audit.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q 'kaggle==2.2.5' 'six==1.17.0'
      - name: Pull public source only and print static manifest
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${KAGGLE_API_TOKEN:?Missing Kaggle token}"
          mkdir -p /tmp/areebbb-public
          kaggle kernels pull areebbb/0-670-this-actually-works -p /tmp/areebbb-public -m
          python - <<'PY'
          import json, pathlib, hashlib, re, os, glob
          d=pathlib.Path('/tmp/areebbb-public')
          mdpath=d/'kernel-metadata.json'
          if mdpath.exists():
              md=json.loads(mdpath.read_text())
              print('UPSTREAM_METADATA',json.dumps({k:md.get(k) for k in ('id','id_no','title','competition_sources','dataset_sources','kernel_sources','model_sources','enable_gpu','enable_internet','machine_shape','code_file')},ensure_ascii=False,default=str))
          nbfiles=list(d.glob('*.ipynb'))
          pyfiles=list(d.glob('*.py'))
          print('PULLED_FILES',[(p.name,p.stat().st_size) for p in d.iterdir()])
          if nbfiles:
              assert len(nbfiles)==1
              data=nbfiles[0].read_bytes()
              nb=json.loads(data)
              cells=nb['cells']
              print('NOTEBOOK_SHA256',hashlib.sha256(data).hexdigest())
              print('CELL_COUNTS',json.dumps({x:sum(c.get('cell_type')==x for c in cells) for x in ('code','markdown')}))
              for i,c in enumerate(cells):
                  src=c.get('source','')
                  src=''.join(src) if isinstance(src,list) else src
                  if c.get('cell_type') not in ('code','markdown'):continue
                  # Print public notebook source only; exclude output, large embedded objects and accidental literals.
                  matches=re.findall(r'(?:/kaggle/input/[A-Za-z0-9_./-]+|kagglehub\.[A-Za-z0-9_]+|(?:\b(?:train|predict|fit|infer|read_csv|read_parquet|to_parquet|softmax|classify|tokenize|load_model|load_state_dict|joblib|pickle|torch|transformers|sklearn|SVC|LogisticRegression|TFIDF|tqdm|sentence_transformers|enable_gpu)\b))',src,re.I)
                  print('CELL_META',json.dumps({'index':i,'kind':c['cell_type'],'chars':len(src),'sha256':hashlib.sha256(src.encode()).hexdigest(),'key_tokens':sorted(set(matches))[:80]}))
                  if c.get('cell_type')=='code':
                      # Keep a readable but bounded public-source transcript for methodological review.
                      if len(src)>18000:
                          print('CELL_SOURCE_HEAD',i,src[:9000])
                          print('CELL_SOURCE_TAIL',i,src[-5000:])
                      else:print('CELL_SOURCE',i,src)
                  else:
                      print('MARKDOWN',i,src[:5000])
          elif pyfiles:
              assert len(pyfiles)==1
              txt=pyfiles[0].read_text()
              print('PY_SHA256',hashlib.sha256(txt.encode()).hexdigest())
              print('SOURCE_TEXT',txt[:125000])
          else:
              raise AssertionError('No public notebook source returned')
          PY


      - name: Compare public predecessor and check upstream score metadata
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/areebbb-previous
          kaggle kernels pull areebbb/ntl-we-back-0-666 -p /tmp/areebbb-previous -m
          python - <<'PY'
          import json,hashlib,pathlib,difflib,re
          from kaggle.api.kaggle_api_extended import KaggleApi
          a=pathlib.Path('/tmp/areebbb-previous')
          b=pathlib.Path('/tmp/areebbb-public')
          p=json.loads(next(a.glob('*.ipynb')).read_text())
          n=json.loads(next(b.glob('*.ipynb')).read_text())
          def summary(nb):
              return [''.join(c.get('source',[])) if isinstance(c.get('source'),list) else str(c.get('source','')) for c in nb.get('cells',[]) if c.get('cell_type')=='code']
          aa=summary(p);bb=summary(n)
          print('PREDECESSOR_METADATA',json.dumps(json.loads((a/'kernel-metadata.json').read_text()),default=str)[:7000])
          print('PREDECESSOR_SHA256',hashlib.sha256(next(a.glob('*.ipynb')).read_bytes()).hexdigest())
          print('DIFF_CODE_CELL_COUNTS',len(aa),len(bb))
          for key in ('DEB_CLS_DIR','hf_cls','ATLAS_BUDGET','ours_svc_w','svc_w','--top34_w','--atlas_w','--sinkhorn','FAST_COMMIT','--comp_w'):
              prev=[(i,len(re.findall(re.escape(key),v))) for i,v in enumerate(aa) if key in v]
              cur=[(i,len(re.findall(re.escape(key),v))) for i,v in enumerate(bb) if key in v]
              print('KEYWORD_DIFF',key,'previous',prev,'new',cur)
          pre='\n'.join(aa)
          post='\n'.join(bb)
          u=list(difflib.unified_diff(pre.splitlines(),post.splitlines(),n=1,fromfile='areebbb_0666',tofile='areebbb_0670'))
          changes=[x for x in u if x.startswith(('+++','---','@@','+','-'))]
          print('UNIFIED_DIFF_LINES',len(u),'CHANGED_LINES',len(changes))
          print('CODE_DIFF_PREVIEW_START')
          print('\n'.join(changes[:260])[:26000])
          print('CODE_DIFF_PREVIEW_END')
          api=KaggleApi();api.authenticate()
          try:
              hits=[r for r in api.kernels_list(user='areebbb',page_size=100) if '0-670-this-actually-works' in str(getattr(r,'ref',''))]
              for k in hits:
                  d={}
                  for name in ('ref','title','best_public_score','bestPublicScore','score','version_number','versionNumber','last_run_time','lastRunTime','total_votes','totalVotes'):
                      if hasattr(k,name):d[name]=str(getattr(k,name))
                  print('AREEBBB_PUBLIC_KAGGLE_LISTING',json.dumps(d))
          except Exception as e:
              print('PUBLIC_SCORE_LOOKUP_ERROR',type(e).__name__,str(e)[:400])
          PY
