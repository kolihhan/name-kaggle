name: NTL real sparse k5 transfer fixed original set decoder (one CPU)
on:
  push:
    branches: [research/ntl-sparse-set-transfer-20261122]
    paths:
      - .github/workflows/ntl_sparse_set_transfer_cpu_once_20261122.yml
permissions:
  contents: read
jobs:
  one:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install only CPU pretrained embedding tools
        run: python -m pip install -q --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.13,<2' 'scikit-learn>=1.4,<2' 'pandas>=2,<3' 'fastembed>=0.6,<1' threadpoolctl
      - name: Execute exact frozen original method on 750 incomplete-prompt examples
        run: |
          python -m scripts.ntl_sparse_set_transfer_report_20261122
          echo 'NTL_SPARSE_NO_RAW_TEXT_NO_KAGGLE_SUBMISSION=TRUE'
