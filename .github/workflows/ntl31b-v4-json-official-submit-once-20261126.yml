name: NTL Gemma4 31B v4 constrained-json no-training one-shot submit
on:
  push:
    branches: [research/ntl-fable252-nameerror-recovery-20261125]
    paths: [.github/workflows/ntl31b-v4-json-official-submit-once-20261126.yml]
permissions: {contents: read}
concurrency:
  group: ntl-gemma4-31b-no-train-official-unique-20261126
  cancel-in-progress: false
jobs:
  v4:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/__init__.py
            scripts/ntl_gemma4_31b_ensemble_stage_20261126.py
            scripts/ntl_gemma4_31b_ensemble_submit_once_20261126.py
            scripts/ntl31b_v4_constrained_json_submit_once.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate immutable 31B attribution and only JSON response interface changed
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0 pandas==2.2.3 numpy==1.26.4 pyarrow==17.0.0
          python -m py_compile scripts/ntl_gemma4_31b_ensemble_stage_20261126.py scripts/ntl_gemma4_31b_ensemble_submit_once_20261126.py scripts/ntl31b_v4_constrained_json_submit_once.py
          python - <<'PY'
          from scripts import ntl_gemma4_31b_ensemble_submit_once_20261126 as base
          from scripts import ntl31b_v4_constrained_json_submit_once as v4
          from kaggle.api.kaggle_api_extended import KaggleApi
          assert v4.BASE_BUILD is base.build
          assert v4.DEST_VERSION==4
          assert base.SOURCE_SHA=='b4c9715e32d27463a399f8715684c8403f057c83f1f77e0039ff0da2427df343'
          assert hasattr(KaggleApi,"competition_submit_code")
          src=base.STAGE_PATH.read_text()
          assert src.count('"max_tokens":28,"temperature":0,"stream":False')==1
          assert src.count('guess=parse_label(result["choices"][0]["message"].get("content") or "")')==1
          print('NTL31_V4_STATIC_CONTRACT_PASS=TRUE',flush=True)
          PY
      - name: Push one repaired private v4, actual 31B schema-valid preview, then exactly one official Kaggle Code submission
        shell: bash
        run: |
          set -euo pipefail
          test ! -e data/train.csv
          test ! -e data/test.csv
          python -u -m scripts.ntl31b_v4_constrained_json_submit_once
