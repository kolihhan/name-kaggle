name: Submit existing LoRA24 v2 once

on:
  push:
    branches:
      - exp/first-kaggle-submission

permissions:
  contents: read

jobs:
  submit-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: kolihhan/name-that-llm-lora24-v1-final
      KERNEL_VERSION: '2'
      EXPECTED_SUBMISSION_SHA256: 6e8b2a61d98c415c39e09815fe83482407ce7ff27bd64f1c617003d9e51b3ab4
      EXPECTED_RUNTIME_MANIFEST: 2ede08586490ab65e52d57bc95ea95580a6c3ea0c7b269d57bef6fe117b39275
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Kaggle CLI
        run: python -m pip install -q 'kaggle==2.2.5' six
      - name: Verify frozen existing kernel output
        shell: bash
        run: |
          set -euo pipefail
          status="$(kaggle kernels status "$KERNEL_REF" 2>&1)"
          echo "$status"
          grep -Eqi '(^|[^a-z])(complete|completed|success|successful|succeeded)([^a-z]|$)' <<<"$status"
          rm -rf /tmp/lora24-existing && mkdir -p /tmp/lora24-existing
          kaggle kernels output "$KERNEL_REF" -p /tmp/lora24-existing -o
          test -f /tmp/lora24-existing/submission.parquet
          test -f /tmp/lora24-existing/submission_lineage.json
          observed_sha="$(sha256sum /tmp/lora24-existing/submission.parquet | awk '{print $1}')"
          echo "submission_sha256=$observed_sha"
          test "$observed_sha" = "$EXPECTED_SUBMISSION_SHA256"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path('/tmp/lora24-existing/submission_lineage.json').read_text())
          assert p['candidate']=='two-stage-lora24-v1'
          assert p['primary_head']=='plain'
          assert p['centered_head_used_for_submission'] is False
          assert p['competition_test_rows_used_for_training']==0
          assert p['competition_test_rows_used_for_model_selection']==0
          assert p['public_lb_tuning'] is False
          assert p['official_training_rows']==2699
          assert p['stage2_epochs']==2
          assert p['submission_rows']==3
          assert p['test_rows']==3
          assert p['submission_sha256']==os.environ['EXPECTED_SUBMISSION_SHA256']
          assert p['runtime_manifest_sha256']==os.environ['EXPECTED_RUNTIME_MANIFEST']
          print('VERIFIED_EXISTING_KERNEL_V2')
          PY
      - name: Submit existing kernel v2
        shell: bash
        run: |
          set -euo pipefail
          kaggle competitions submit name-that-llm \
            -f submission.parquet \
            -k "$KERNEL_REF" \
            -v "$KERNEL_VERSION" \
            -m 'two-stage-lora24-v1 plain final fit' \
            --wait 3600 \
            --poll-interval 15
      - name: Show result
        if: always()
        run: kaggle competitions submissions name-that-llm -v || true
