name: Phase 14 audit public 0.622 components

on:
  push:
    branches:
      - exp/first-kaggle-submission
    paths:
      - .github/workflows/phase14-audit-public-0622-components.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: cosmorin/name-that-llm-public620-reproduction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle client
        run: python -m pip install 'kaggle==2.2.5'
      - name: Pull public notebook source
        shell: bash
        run: |
          set -euo pipefail
          : "${KAGGLE_API_TOKEN:?KAGGLE_API_TOKEN secret is not available}"
          rm -rf /tmp/public-0622
          mkdir -p /tmp/public-0622
          kaggle kernels pull "$KERNEL_REF" -p /tmp/public-0622 -m
          find /tmp/public-0622 -maxdepth 2 -type f -printf '%P\t%s bytes\n' | sort
      - name: Extract compact component map
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, json, re
          from pathlib import Path

          root=Path('/tmp/public-0622')
          notebooks=sorted(root.glob('*.ipynb')); scripts=sorted(root.glob('*.py'))
          if not notebooks and not scripts: raise SystemExit('no notebook/script source pulled')
          cells=[]; headings=[]
          for path in notebooks:
              nb=json.loads(path.read_text(encoding='utf-8'))
              for idx,cell in enumerate(nb.get('cells',[])):
                  src=cell.get('source',''); src=''.join(src) if isinstance(src,list) else src
                  if cell.get('cell_type')=='code': cells.append((idx,src))
                  elif cell.get('cell_type')=='markdown':
                      for line in src.splitlines():
                          if line.lstrip().startswith('#'): headings.append({'cell':idx,'text':line.strip()[:240]})
          for path in scripts: cells.append((-1,path.read_text(encoding='utf-8')))
          code='\n\n'.join(src for _,src in cells); lines=code.splitlines()
          keywords=('svc','tfidf','lora','qwen','llama','hungarian','linear_sum_assignment','cache','blend','ensemble','softmax','prompt','group','two-stage','stage1','stage2','adapter','classifier','margin')
          cell_map=[]
          for idx,src in cells:
              hits=sorted({k for k in keywords if k in src.lower()})
              if hits:
                  nonempty=[x.strip() for x in src.splitlines() if x.strip()]
                  cell_map.append({'cell':idx,'first_line':nonempty[0][:240] if nonempty else '', 'signals':hits})
          assigns=[]; tokens=('WEIGHT','TEMP','ALPHA','BETA','LORA','SVC','TFIDF','MODEL','PATH','CACHE','FOLD','STAGE','QWEN','LLAMA','THRESH','TOP','K')
          for idx,src in cells:
              try: tree=ast.parse(src)
              except SyntaxError: continue
              for node in tree.body:
                  names=[]; value=None
                  if isinstance(node,ast.Assign): names=[t.id for t in node.targets if isinstance(t,ast.Name)]; value=node.value
                  elif isinstance(node,ast.AnnAssign) and isinstance(node.target,ast.Name): names=[node.target.id]; value=node.value
                  if not names or value is None: continue
                  for name in names:
                      if not any(tok in name.upper() for tok in tokens): continue
                      try: val=ast.literal_eval(value)
                      except Exception: continue
                      if len(repr(val))<=2500: assigns.append({'cell':idx,'name':name,'value':val})
          calls=[]
          for lineno,line in enumerate(lines,1):
              s=line.strip()
              if any(p in s.lower() for p in ('decision_function','predict_proba','linear_sum_assignment','softmax','from_pretrained','load_model','load_adapter','joblib.load','pickle.load','np.load')) and len(s)<=500:
                  calls.append({'line':lineno,'text':s})
          paths=sorted(set(re.findall(r'/kaggle/input/[A-Za-z0-9_./\-]+',code)))
          report={'kernel_ref':'cosmorin/name-that-llm-public620-reproduction','scope':'static_only_no_execution_no_training_no_submission','headings':headings,'cell_map':cell_map,'literal_assignments':assigns,'interesting_calls':calls,'input_paths':paths}
          Path('/tmp/phase14_public_0622_components.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2,ensure_ascii=False))
          PY
      - name: Upload component audit
        uses: actions/upload-artifact@v4
        with:
          name: phase14-public-0622-components
          path: /tmp/phase14_public_0622_components.json
          retention-days: 30
