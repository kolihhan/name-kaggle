name: NTL paper prompt-invariant SupCon real algorithm smoke
on:
  push:
    branches: [exp/ntl-paper-supcon-strongreadout-20261123]
    paths:
      - .github/workflows/ntl-paper-supcon-smoke-20261123.yml
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install CPU-only PyTorch and NumPy
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check numpy==2.3.4
          python -m pip install -q --disable-pip-version-check 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Fixed SupCon prompt-pair and loss gradient tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/ntl_paper_prompt_supcon_20261123.py
          python -m scripts.ntl_paper_prompt_supcon_20261123 --smoke
          echo NTL_SOTA_PAPER_SMOKE_ONLY_NO_SCORED_RESULT_NO_GPU_NO_QLORA=TRUE
