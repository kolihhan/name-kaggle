name: NTL Frozen Geometry CPU Recovery
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/pretrained-source-geometry-cpu-recovery.yml]
permissions: {contents: read, actions: read}
concurrency:
  group: ntl-frozen-geometry-cpu
  cancel-in-progress: false
jobs:
  frozen:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install frozen CPU packages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q "torch==2.6.0+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q "numpy==1.26.4" "pandas==2.2.3" "pyarrow==19.0.1" "scipy==1.15.2" "scikit-learn==1.6.1" "transformers==4.48.3" "tokenizers==0.21.0" "huggingface_hub==0.28.1" "safetensors==0.5.3" "kaggle==2.2.5" "six==1.17.0" pytest
      - name: Verify pinned test controls
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/pretrained_source_geometry.py
          python -m pytest -q tests/test_pretrained_source_geometry.py
          python - <<'PY'
          import torch, transformers, sklearn
          assert torch.__version__=='2.6.0+cpu'
          assert transformers.__version__=='4.48.3'
          assert sklearn.__version__=='1.6.1'
          print('CPU_RUNTIME_LOCK_VERIFIED')
          PY
      - name: Restore pinned pool and original LoRA24 OOF privately
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          mkdir -p /tmp/ntl/pool /tmp/ntl/anchor /tmp/ntl/assets /tmp/ntl/cache /tmp/ntl/reports /tmp/ntl/private
          kaggle datasets download -d nishantdahal/ntl-handwriting-blend -f pool_v4.parquet -p /tmp/ntl/pool --unzip -q
          gh run download 41398543856 --repo kolihhan/name-kaggle --name two-stage-lora24-gate-b-evidence --dir /tmp/ntl/anchor
          python - <<'PY'
          from pathlib import Path
          from scripts.pretrained_source_geometry import sha256_file,FINGERPRINTS
          assert sha256_file(Path('data/train.csv'))==FINGERPRINTS['official']
          assert sha256_file(Path('artifacts/phase1/folds.csv'))==FINGERPRINTS['folds']
          assert sha256_file(Path('/tmp/ntl/pool/pool_v4.parquet'))==FINGERPRINTS['pool']
          paths=list(Path('/tmp/ntl/anchor').rglob('gate_b_candidate_oof.csv'))
          assert len(paths)==1,f'Expected one original LoRA24 archive, got {len(paths)}'
          Path('/tmp/ntl/anchor_path').write_text(str(paths[0]))
          print('PINNED_PRIVATE_INPUTS_VERIFIED')
          PY
      - name: Restore exact pretrained checkpoints from pinned public revisions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from huggingface_hub import snapshot_download,hf_hub_download
          from scripts.pretrained_source_geometry import SPECS,sha256_file
          refs=[
            ('simcse','princeton-nlp/unsup-simcse-roberta-base','db28710348cf9f33a2be25c505f98f0fbbbfe768'),
            ('detective','heyongxin233/DeTeCtive','cefc9833290189b414a683d0775edb900c1832c1'),
            ('lusr','rrivera1849/LUSR','ab7852825ad1be40112bbfdaf1f9e2315a1727b7'),
          ]
          for name,ref,revision in refs:
            target=Path('/tmp/ntl/assets')/SPECS[name][0]
            if name=='detective':
              hf_hub_download(repo_id=ref,revision=revision,filename=SPECS[name][1],local_dir=target)
            else:
              snapshot_download(repo_id=ref,revision=revision,local_dir=target,
                allow_patterns=[SPECS[name][1],'config.json','tokenizer.json',
                  'tokenizer_config.json','vocab.json','merges.txt','special_tokens_map.json'])
            assert sha256_file(target/SPECS[name][1])==SPECS[name][2],name
            print('PRETRAINED_WEIGHT_SHA_VERIFIED',name)
          PY
      - name: DeTeCtive source contrastive geometry H-M exact scoring
        shell: bash
        run: |
          set -euo pipefail
          for model in simcse detective; do
            python -m scripts.pretrained_source_geometry encode --model "$model" --pool /tmp/ntl/pool/pool_v4.parquet --assets /tmp/ntl/assets --cache /tmp/ntl/cache
          done
          python -m scripts.pretrained_source_geometry evaluate --stage hm --pool /tmp/ntl/pool/pool_v4.parquet --assets /tmp/ntl/assets --cache /tmp/ntl/cache --anchor "$(cat /tmp/ntl/anchor_path)" --output /tmp/ntl/reports/hm.json --predictions /tmp/ntl/private/hm.npz
      - name: Only if H-M fails, execute frozen reconstruction H-R
        shell: bash
        run: |
          set -euo pipefail
          decision="$(python -c "import json;print(json.load(open('/tmp/ntl/reports/hm.json'))['decision'])")"
          echo "H_M_DECISION=$decision"
          if test "$decision" = PROMOTE_PENDING_PREFLIGHT; then
            echo 'H_M_PASSED__NO_H_R_PIVOT'
            exit 0
          fi
          test "$decision" = REJECT_CANDIDATE
          python -m scripts.pretrained_source_geometry encode --model lusr --pool /tmp/ntl/pool/pool_v4.parquet --assets /tmp/ntl/assets --cache /tmp/ntl/cache
          python -m scripts.pretrained_source_geometry evaluate --stage hr --pool /tmp/ntl/pool/pool_v4.parquet --assets /tmp/ntl/assets --cache /tmp/ntl/cache --anchor "$(cat /tmp/ntl/anchor_path)" --output /tmp/ntl/reports/hr.json --predictions /tmp/ntl/private/hr.npz
      - name: Upload aggregate-only metrics, NEVER per-row outputs/checkpoints
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-geometry-aggregate-only
          path: /tmp/ntl/reports/*.json
          if-no-files-found: warn
          retention-days: 14
