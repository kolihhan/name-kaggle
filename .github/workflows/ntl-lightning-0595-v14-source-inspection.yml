name: NTL Lightning 0.595 V14 Exact Sample Path Inspection
on:
  push:
    branches: [exp/dct-temporal-fingerprint-v3]
    paths: [.github/workflows/ntl-lightning-0595-v14-source-inspection.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q 'kaggle==2.2.5' 'six==1.17.0'
      - name: Pin V14 and show all sample shortcuts
        run: |
          set -euo pipefail
          mkdir -p /tmp/v14
          kaggle kernels pull lightningv08/0-595-two-stage-lora-gaussian-olmo2/14 -p /tmp/v14 -m >/dev/null
          python - <<'PY'
          import pathlib,hashlib,json,re
          d=pathlib.Path('/tmp/v14')
          n=list(d.glob('*.ipynb'))[0]; nb=json.loads(n.read_text()); cells=nb['cells']
          print('PINNED_V14_NOTEBOOK_SHA256',hashlib.sha256(n.read_bytes()).hexdigest())
          for i,c in enumerate(cells):
              if c.get('cell_type')!='code':continue
              s=''.join(c['source']) if isinstance(c['source'],list) else c['source']
              lines=s.splitlines()
              for j,line in enumerate(lines):
                  if re.search(r'preview|fixture|fast.commit|smoke|len\(test\)|len\(TE\)|submission.parquet|to_parquet|if .*(test|size|rows)|run_all|if not|return True|source_cache|model.fit|\.fit\(',line,re.I):
                      print('CODE_CONTEXT',i,j,' | '.join(x[:260] for x in lines[max(0,j-1):min(len(lines),j+2)]),flush=True)
          PY
      - name: Preserve Apache-2 public V14 code only (no official data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ntl-public-lightning-v14-source
          path: |
            /tmp/v14/*.ipynb
            /tmp/v14/kernel-metadata.json
          retention-days: 1
          if-no-files-found: error
