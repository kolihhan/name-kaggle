name: NTL Short TRACE Official Submission 58093864 Check
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-short-trace-submission-58093864-status.yml]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q 'kaggle==2.2.5' 'six==1.17.0'
      - name: Read exact official submission 58093864 status (read-only)
        shell: bash
        run: |
          set -euo pipefail
          : "${KAGGLE_API_TOKEN:?missing Kaggle auth}"
          kaggle competitions submission 58093864
