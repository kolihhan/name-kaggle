name: V3 Colab T4 Real-Data Training Pilot

on:
  workflow_dispatch:
  push:
    branches:
      - exp/dct-temporal-fingerprint-v3
    paths:
      - .github/workflows/v3-colab-t4-real-train.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: v3-colab-t4-real-train-pilot
  cancel-in-progress: false

jobs:
  train-real-external-source:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      COLAB_SESSION: v3-real-t4-${{ github.run_id }}
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/colab-adc-${{ github.run_id }}.json
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Validate private Colab OAuth credential
        shell: bash
        env:
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          value = os.environ.get("COLAB_ADC_JSON", "")
          if not value:
              sys.exit("COLAB_ADC_JSON missing. No GPU requested.")
          j = json.loads(value)
          if j.get("type") != "authorized_user" or not all(j.get(k) for k in ("client_id", "client_secret", "refresh_token")):
              sys.exit("Invalid user OAuth ADC. No GPU requested.")
          p = Path(os.environ["GOOGLE_APPLICATION_CREDENTIALS"])
          p.write_text(value, encoding="utf-8")
          p.chmod(0o600)
          print("Private Colab OAuth available; not printed.")
          PY

      - name: Sparse checkout (exclude official competition data)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/dct_v3_colab_t4_train_pilot.py
          sparse-checkout-cone-mode: false

      - name: Static pilot and data safety checks
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/dct_v3_colab_t4_train_pilot.py
          for path in data/train.csv data/test.csv data/sample_submission.parquet; do
            test ! -e "$path"
          done
          python3 -m py_compile scripts/dct_v3_colab_t4_train_pilot.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/dct_v3_colab_t4_train_pilot.py').read_text()
          for x in ('MAX_STEPS = 2','build_transfer_split(safe)','set(selected) & heldout_idx',
                    'paired_v1_vs_v3_transfer_evaluated','scientific_decision_authorized',
                    'model.save_pretrained','TRAINING_PILOT_SUCCESS'):
              assert x in s, x
          for x in ('kaggle datasets download','KAGGLE_API_TOKEN','pd.read_csv(', 'train_test_split('):
              assert x not in s, x
          print('Real-data bounded pilot static checks PASS')
          PY

      - name: Download immutable Phase14 public-source safe subset only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v3-public-source
          gh api /repos/kolihhan/name-kaggle/actions/artifacts/13067907516/zip > /tmp/v3-public-source/data.zip
          unzip -q /tmp/v3-public-source/data.zip -d /tmp/v3-public-source
          test -s /tmp/v3-public-source/conservative_public_subset.parquet
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          p=Path('/tmp/v3-public-source/data.zip')
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              assert 'conservative_public_subset.parquet' in names
              assert not any('train.csv' in n or 'test.csv' in n or 'sample_submission' in n for n in names)
          print('Public-source-only artifact verified:',p.stat().st_size,'compressed bytes')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install official Colab CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q google-colab-cli==0.7.5
          colab version

      - name: Allocate T4, upload external training subset, train and collect checkpoint
        shell: bash
        run: |
          set -euo pipefail
          colab --auth adc new -s "$COLAB_SESSION" --gpu T4
          colab --auth adc upload -s "$COLAB_SESSION" \
            /tmp/v3-public-source/conservative_public_subset.parquet \
            /content/conservative_public_subset.parquet
          colab --auth adc exec -s "$COLAB_SESSION" --timeout 1200 \
            -f scripts/dct_v3_colab_t4_train_pilot.py
          colab --auth adc download -s "$COLAB_SESSION" \
            /content/dct_v3_t4_real_train/result.json ./real_train_result.json
          colab --auth adc download -s "$COLAB_SESSION" \
            /content/dct_v3_t4_real_train_checkpoint.zip ./real_train_checkpoint.zip
          python3 - <<'PY'
          import json,zipfile
          from pathlib import Path
          d=json.loads(Path('real_train_result.json').read_text())
          assert d['scope']=='real_external_train_only_t4_lora_pilot'
          assert d['scientific_decision_authorized'] is False
          assert d['paired_v1_vs_v3_transfer_evaluated'] is False
          assert d['official_rows_scored']==0
          assert d['competition_test_rows_used']==0
          assert d['public_lb_tuning'] is False
          assert d['optimizer_steps_completed']==2
          assert d['head_parameter_delta_l2']>0
          with zipfile.ZipFile('real_train_checkpoint.zip') as z:
              names=z.namelist()
              assert any(n.startswith('checkpoint/adapter/') and n.endswith('.safetensors') for n in names),names
              assert 'checkpoint/heads.safetensors' in names,names
              assert 'result.json' in names,names
          print("VERIFIED_REAL_T4_TRAINING",json.dumps(d,sort_keys=True))
          PY

      - name: Release Colab runtime and securely remove OAuth credential
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if command -v colab >/dev/null 2>&1 && [[ -s "$GOOGLE_APPLICATION_CREDENTIALS" ]]; then
            colab --auth adc stop -s "$COLAB_SESSION" || true
          fi
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Preserve real training result and trainable-only checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dct-v3-real-t4-train-pilot-${{ github.run_id }}
          path: |
            real_train_result.json
            real_train_checkpoint.zip
          if-no-files-found: warn
          retention-days: 14
