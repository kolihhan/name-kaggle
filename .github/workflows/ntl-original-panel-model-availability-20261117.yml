name: NTL original prompt panel live Kaggle model identity
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-original-panel-model-availability-20261117.yml]
permissions:
  contents: read
jobs:
  source_admission:
    if: "${{ github.event.head_commit.message == 'Probe actual Kaggle Model Proxy returned models for NTL' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Request one fixed public probe per label and measure actual returned IDs
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python -m pip -q install --disable-pip-version-check kaggle==2.2.5 six==1.17.0
          python scripts/ntl_probe_kaggle_served_models.py
