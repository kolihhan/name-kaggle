name: NTL V47 Kaggle Model Source Access Check (Read Only)
on:
  push:
    branches: [exp/dct-temporal-fingerprint-v3]
    paths: [.github/workflows/ntl-v47-model-sources-access.yml]
permissions: {contents: read}
jobs:
  model-access:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q 'kaggle==2.2.5' 'six==1.17.0'
      - name: Probe read-only model version metadata and files
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          refs=[
            'qwen-lm/qwen-3/Transformers/14b-base/1',
            'qwen-lm/qwen-3/Transformers/8b-base/1',
            'qwen-lm/qwen-3/Transformers/4b-base/1',
            'qwen-lm/qwen2.5/Transformers/7b/1',
            'qwen-lm/qwen2.5/Transformers/14b/1'
          ]
          for ref in refs:
              for cmd in (['models','instances','versions','files',ref],):
                  p=subprocess.run(['kaggle',*cmd],capture_output=True,text=True,timeout=90)
                  body=(p.stderr+'\n'+p.stdout).strip()
                  print('MODEL_VERSION_ACCESS',ref,'OK' if p.returncode==0 else 'BLOCKED','error',body[:280] if p.returncode else '',flush=True)
          PY
