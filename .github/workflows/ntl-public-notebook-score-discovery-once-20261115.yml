name: NTL Apex702 one authorized GPU production run and official scoring
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-public-notebook-score-discovery-once-20261115.yml]
permissions: {contents: read}
concurrency:
  group: ntl-apex702-one-authorized-private-gpu-20261118
  cancel-in-progress: false
jobs:
  launch_wait_score:
    if: "${{ github.event.head_commit.message == 'GO_NTL_APEX702_ONE_AUTHORIZED_PRIVATE_GPU_20261118' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/ntl_apex702_official_once.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Preflight existing 0.702 public source, account quota and single GPU authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
          python -m py_compile scripts/ntl_apex702_official_once.py
          python -m scripts.ntl_apex702_official_once quota
          python -m scripts.ntl_apex702_official_once prepare
      - name: LAUNCH exactly one source-hash-pinned private T4 production run (v2 only)
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.ntl_apex702_official_once start_gpu_once
          echo 'NTL_PRIVATE_GPU_LAUNCH_OPERATOR_TERMINAL=TRUE'
      - name: Observe completion and submit v2 once if genuine submission.parquet exists
        shell: bash
        run: |
          set -euo pipefail
          python -u -m scripts.ntl_apex702_official_once wait_finish_once
          echo 'NTL_OFFICIAL_PROGRESS_END_NO_DUPLICATE_SUBMIT=TRUE'
# Owner-authorized one GPU; preflight showed identical 9 model refs except order. One real launch allowed.
# No retries, no new model training, no benchmark tuning, no paid external API.
# Preserve the frozen code SHA and original public model/data mounts.
