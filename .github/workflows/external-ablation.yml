name: Frozen-CV external data ablation

on:
  push:
    paths:
      - .github/workflows/external-ablation.yml
      - scripts/run_external_ablation.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ablation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pyarrow

      - name: Recreate frozen folds
        run: python scripts/make_folds.py

      - name: Run baseline reproduction and external-data ablation
        run: python scripts/run_external_ablation.py

      - name: Commit ablation report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/phase1/folds.csv artifacts/phase2/gpt_gemini_char_ablation.json
          if git diff --cached --quiet; then
            echo 'No ablation changes.'
            exit 0
          fi
          git commit -m 'Run frozen-CV GPT Gemini external ablation'
          git push
