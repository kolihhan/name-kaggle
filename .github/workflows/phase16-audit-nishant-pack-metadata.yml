name: Phase 16 audit Nishant asset pack metadata

on:
  push:
    branches:
      - exp/first-kaggle-submission
    paths:
      - .github/workflows/phase16-audit-nishant-pack-metadata.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      DATASET_REF: nishantdahal/ntl-handwriting-blend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle client
        run: python -m pip install 'kaggle==2.2.5'
      - name: Read metadata and inventory
        shell: bash
        run: |
          set -euo pipefail
          : "${KAGGLE_API_TOKEN:?KAGGLE_API_TOKEN secret is not available}"
          rm -rf /tmp/p16pack
          mkdir -p /tmp/p16pack/meta
          kaggle datasets metadata "$DATASET_REF" -p /tmp/p16pack/meta
          kaggle datasets files "$DATASET_REF" -v > /tmp/p16pack/files.csv
          cat /tmp/p16pack/files.csv
          cat /tmp/p16pack/meta/dataset-metadata.json
      - name: Build compact metadata report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path('/tmp/p16pack')
          meta=json.loads((root/'meta/dataset-metadata.json').read_text())
          rows=list(csv.DictReader((root/'files.csv').open()))
          report={
            'dataset_ref':'nishantdahal/ntl-handwriting-blend',
            'scope':'read_only_metadata_inventory',
            'metadata':meta,
            'files':rows,
          }
          out=root/'phase16_nishant_pack_metadata.json'
          out.write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(report,indent=2,ensure_ascii=False))
          PY
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: phase16-nishant-pack-metadata
          path: /tmp/p16pack/phase16_nishant_pack_metadata.json
          retention-days: 30
