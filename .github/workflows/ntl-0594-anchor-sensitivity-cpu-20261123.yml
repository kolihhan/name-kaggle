name: NTL 0.594 synthetic strong-anchor and weak-score override falsifier CPU
on:
  push:
    branches: [research/ntl-0594-mechanism-forensics-20261123]
    paths:
      - .github/workflows/ntl-0594-anchor-sensitivity-cpu-20261123.yml
permissions: {contents: read}
jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Run five-fold actual charSVC weak OOF and synthetic .715-anchor causal controls
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.13,<2' 'scikit-learn>=1.4,<2' 'pandas>=2,<3' threadpoolctl
          python -m scripts.ntl_0594_counterfactual_anchor_forensics_20261123
          echo NTL_0594_COUNTERFACTUAL_NO_GPU_NO_KAGGLE_SUBMISSION=TRUE
