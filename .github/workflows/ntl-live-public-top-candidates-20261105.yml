name: NTL Live Top Kaggle Public Notebook Recon Read Only
on:
  push:
    branches: [exp/dct-temporal-fingerprint-v3]
    paths: [.github/workflows/ntl-live-public-top-candidates-20261105.yml]
permissions: {contents: read}
jobs:
  public-kernel-recon:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q kaggle==2.2.5 six==1.17.0
      - name: Inspect ranked PUBLIC Kaggle code entries, no submissions, no data, no GPU
        shell: bash
        run: |
          set -euo pipefail
          : "${KAGGLE_API_TOKEN:?Kaggle token missing}"
          for page in 1 2 3; do
            echo "::group::RANKED_PAGE_${page}"
            kaggle kernels list --competition name-that-llm --sort-by scoreDescending --page-size 50 -p "$page" -v || true
            echo "::endgroup::"
          done
          echo "::group::RECENT_RUNS"
          kaggle kernels list --competition name-that-llm --sort-by dateRun --page-size 50 -p 1 -v || true
          echo "::endgroup::"
