name: NTL Kimi 80 matched protocol frozen champion preflight (no GPU)
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-kimi-protocol80-no-gpu-preflight.yml]
permissions: {contents: read}
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/
            artifacts/research/ntl-kimi-protocol80/CONTRACT.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Guard no official training or test rows in public checkout
        shell: bash
        run: |
          set -euo pipefail
          test ! -e data/train.csv
          test ! -e data/test.csv
          test -f artifacts/research/ntl-kimi-protocol80/CONTRACT.md
          python -m py_compile scripts/ntl_0679_transfer_private_once.py \
            scripts/ntl_kimi_protocol80_source.py \
            scripts/ntl_kimi_protocol80_private_once.py
      - run: python -m pip install --disable-pip-version-check -q kaggle==2.2.5 six==1.17.0 nbformat==5.10.4
      - name: Build exact 0.679 protected private Notebook and 80-pair capsule, no push
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python -u scripts/ntl_kimi_protocol80_private_once.py --preflight
          echo NTL_KIMI80_FROZEN_PREVIEW_SOURCE_PASS_NO_MODEL_NO_GPU_NO_SUBMISSION
