name: NTL identity-stability new mechanism (CPU real 18-way OOF)
on:
  push:
    branches: [research/identity-stability-gate-20261122]
    paths:
      - scripts/ntl_identity_stability_20261122.py
      - .github/workflows/ntl_identity_stability_cpu_20261122.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  cpu-official-grouped-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU tools only
        run: |
          python -m pip install --disable-pip-version-check -q 'numpy<3' 'scipy<2' 'scikit-learn>=1.4,<2' 'pandas>=2,<3' threadpoolctl
      - name: Verify no official dataset is exported; validate synthetic identity signal
        run: |
          python -m scripts.ntl_identity_stability_20261122 --synthetic-only --summary /tmp/unused.json
      - name: Run actual 18-class fixed prompt-disjoint DEV experiment
        run: |
          test -f data/train.csv
          test -f artifacts/phase1/folds.csv
          python -m scripts.ntl_identity_stability_20261122 --summary /tmp/ntl_identity_stability_aggregate.json
          python - <<'PY'
          import json
          o=json.load(open('/tmp/ntl_identity_stability_aggregate.json'))
          assert o['rows']==2699 and o['prompts']==150 and o['classes']==18
          assert set(o['arms'])=={'all','supervised_chi2','stable_prompt','shuffled_prompt'}
          print('NTL_IDENTITY_STABILITY_CPU_REAL_DEV_COMPLETE='+json.dumps({
            'arms':o['arms'], 'mechanism_gate_pass':o['mechanism_gate_pass'],
            'comparisons':o['comparisons']
          },sort_keys=True))
          PY
      - name: Verify aggregate-only output, no text/IDs
        if: always()
        run: |
          if [ -f /tmp/ntl_identity_stability_aggregate.json ]; then
            python - <<'PY'
          from pathlib import Path
          import json
          p=Path('/tmp/ntl_identity_stability_aggregate.json')
          o=json.loads(p.read_text())
          assert not any(k in o for k in ('text','id','predictions','train_rows'))
          print('NTL_NO_RAW_COMPETITION_EXPOSURE_IN_NEW_ARTIFACT=TRUE')
          PY
          fi
