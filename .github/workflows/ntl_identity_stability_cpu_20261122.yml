name: NTL identity-stability new mechanism (CPU real 18-way OOF)
on:
  push:
    branches: [research/identity-stability-gate-20261122]
    paths:
      - scripts/ntl_identity_stability_20261122.py
      - .github/workflows/ntl_identity_stability_cpu_20261122.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  cpu-official-grouped-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU tools only
        run: python -m pip install --disable-pip-version-check -q 'numpy<3' 'scipy<2' 'scikit-learn>=1.4,<2' 'pandas>=2,<3' threadpoolctl
      - name: Synthetic directional-signal test
        run: python -m scripts.ntl_identity_stability_20261122 --synthetic-only --summary /tmp/unused.json
      - name: Real 18-way prompt-disjoint DEV OOF
        run: |
          test -f data/train.csv
          test -f artifacts/phase1/folds.csv
          python -m scripts.ntl_identity_stability_20261122 --summary /tmp/ntl_identity_stability_aggregate.json
          python -c 'import json; o=json.load(open("/tmp/ntl_identity_stability_aggregate.json")); assert o["rows"]==2699 and o["prompts"]==150 and o["classes"]==18; print("NTL_REAL_RESULT="+json.dumps({"arms":o["arms"],"comparisons":o["comparisons"],"gate":o["mechanism_gate_pass"]},sort_keys=True))'
      - name: Assert output contains aggregate scores only
        if: always()
        run: |
          if [ -f /tmp/ntl_identity_stability_aggregate.json ]; then
            python -c 'import json; o=json.load(open("/tmp/ntl_identity_stability_aggregate.json")); assert not any(k in o for k in ("text","id","predictions","train_rows")); print("NEW_OUTPUT_AGGREGATE_ONLY=TRUE")'
          fi
