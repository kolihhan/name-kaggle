name: NTL highest scoring public kernels read-only structural gap Nov20
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-highscore-public-kernel-ranked-audit-20261120.yml]
permissions: {contents: read}
jobs:
  public_ranked:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Official public notebook leaderboard score sorting
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
          for page in 1 2 3 4; do
            echo "NTL_PUBLIC_KERNEL_RANKING_PAGE_BEGIN=$page"
            kaggle kernels list --competition name-that-llm --sort-by scoreDescending --page "$page" --page-size 50 -v | head -n 56
            echo "NTL_PUBLIC_KERNEL_RANKING_PAGE_END=$page"
          done
          echo "NTL_KAGGLE_PUBLIC_KERNEL_SCORE_RANKING_READONLY_COMPLETE=TRUE"
