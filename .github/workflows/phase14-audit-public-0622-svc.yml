name: Phase 14 audit public 0.622 SVC recipe

on:
  push:
    branches:
      - exp/first-kaggle-submission
    paths:
      - .github/workflows/phase14-audit-public-0622-svc.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: cosmorin/name-that-llm-public620-reproduction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle client
        run: python -m pip install 'kaggle==2.2.5'
      - name: Pull notebook source
        run: |
          set -euo pipefail
          : "${KAGGLE_API_TOKEN:?missing Kaggle token}"
          rm -rf /tmp/public-0622 && mkdir -p /tmp/public-0622
          kaggle kernels pull "$KERNEL_REF" -p /tmp/public-0622 -m
      - name: Audit SVC recipe statically
        run: |
          python - <<'PY'
          import ast, json, re
          from pathlib import Path

          root=Path('/tmp/public-0622')
          meta=json.loads((root/'kernel-metadata.json').read_text(encoding='utf-8'))
          nb=json.loads(next(root.glob('*.ipynb')).read_text(encoding='utf-8'))
          code='\n\n'.join(''.join(c.get('source',[])) if isinstance(c.get('source',''),list) else c.get('source','') for c in nb.get('cells',[]) if c.get('cell_type')=='code')

          tree=ast.parse(code)
          vectorizers=[]; classifiers=[]; literal_assignments=[]
          for node in ast.walk(tree):
              if isinstance(node,ast.Call):
                  fn=''
                  if isinstance(node.func,ast.Name): fn=node.func.id
                  elif isinstance(node.func,ast.Attribute): fn=node.func.attr
                  if fn in {'TfidfVectorizer','CountVectorizer','HashingVectorizer'}:
                      kwargs={}
                      for kw in node.keywords:
                          try: kwargs[kw.arg]=ast.literal_eval(kw.value)
                          except Exception: kwargs[kw.arg]='<dynamic>'
                      vectorizers.append({'type':fn,'kwargs':kwargs})
                  if fn in {'LinearSVC','LogisticRegression','SGDClassifier','RidgeClassifier'}:
                      kwargs={}
                      for kw in node.keywords:
                          try: kwargs[kw.arg]=ast.literal_eval(kw.value)
                          except Exception: kwargs[kw.arg]='<dynamic>'
                      classifiers.append({'type':fn,'kwargs':kwargs})

          for node in tree.body:
              if not isinstance(node,(ast.Assign,ast.AnnAssign)): continue
              if isinstance(node,ast.Assign):
                  names=[t.id for t in node.targets if isinstance(t,ast.Name)]; value=node.value
              else:
                  names=[node.target.id] if isinstance(node.target,ast.Name) else []; value=node.value
              if value is None: continue
              for name in names:
                  if not any(k in name.upper() for k in ('SVC','TFIDF','VEC','CACHE','WORD','CHAR','NGRAM','MIN_DF','MAX_FEATURE','ANALYZER','LOWER')): continue
                  try: val=ast.literal_eval(value)
                  except Exception: continue
                  if len(repr(val))<=2000: literal_assignments.append({'name':name,'value':val})

          cache_refs=[]
          for lineno,line in enumerate(code.splitlines(),1):
              s=line.strip()
              if ('cache[' in s or 'cache.get' in s or 'joblib.load' in s or 'hstack(' in s) and len(s)<=500:
                  cache_refs.append({'line':lineno,'text':s})

          # Identify lookup filenames passed to find(...), which reveal mounted asset structure.
          find_args=sorted(set(re.findall(r'find\([\"\']([^\"\']+)[\"\']\)',code)))

          # Keep only source metadata; no execution of external pickle/model artifacts.
          report={
              'kernel_ref':'cosmorin/name-that-llm-public620-reproduction',
              'scope':'static_recipe_audit_no_external_pickle_execution',
              'kernel_metadata':meta,
              'vectorizer_constructors':vectorizers,
              'classifier_constructors':classifiers,
              'literal_assignments':literal_assignments,
              'cache_references':cache_refs,
              'find_arguments':find_args,
          }
          Path('/tmp/phase14_public_0622_svc.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase14-public-0622-svc
          path: /tmp/phase14_public_0622_svc.json
          retention-days: 30
