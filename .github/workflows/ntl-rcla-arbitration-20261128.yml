name: NTL RCLA submission decision layer CPU tests
on:
  push:
    branches: [research/ntl-rcma-20261127]
    paths:
      - scripts/ntl_rcla_arbitration.py
      - tests/test_ntl_rcla_arbitration.py
      - .github/workflows/ntl-rcla-arbitration-20261128.yml
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ntl_rcla_arbitration.py
            tests/test_ntl_rcla_arbitration.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          python -m pip install -q numpy==2.3.4
          python -m unittest discover -s tests -p test_ntl_rcla_arbitration.py -v
