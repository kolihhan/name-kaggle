name: Phase 15 second Kaggle submission

on:
  push:
    branches:
      - exp/first-kaggle-submission
    paths:
      - .github/workflows/phase15-second-kaggle-submit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: kolihhan/name-that-llm-phase15-terms-clean
      EXPECTED_EXISTING_REF: '57838845'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'kaggle==2.2.5' 'pytest>=8,<10'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.48,<6'

      - name: Fresh full test verification
        run: python -m pytest -q

      - name: Fresh read-only submission guard
        shell: bash
        run: |
          set -euo pipefail
          : "${KAGGLE_API_TOKEN:?KAGGLE_API_TOKEN secret is not available}"
          kaggle competitions submissions name-that-llm -v -q > /tmp/submissions-before.csv
          cat /tmp/submissions-before.csv
          python - <<'PY'
          import csv
          import os
          from pathlib import Path
          rows = list(csv.DictReader(Path('/tmp/submissions-before.csv').open()))
          assert len(rows) == 1, f'expected exactly one existing submission, found {len(rows)}'
          assert rows[0]['ref'] == os.environ['EXPECTED_EXISTING_REF'], rows
          assert rows[0]['status'].endswith('COMPLETE'), rows
          assert rows[0]['publicScore'] == '0.369', rows
          print('submission guard passed:', rows[0]['ref'], rows[0]['publicScore'])
          PY

      - name: Build frozen Phase 15 Kaggle notebook bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/name-that-llm-phase15
          python scripts/build_phase15_kaggle_kernel.py --output-dir /tmp/name-that-llm-phase15
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/name-that-llm-phase15')
          meta = json.loads((root / 'kernel-metadata.json').read_text())
          notebook = json.loads((root / meta['code_file']).read_text())
          assert meta['id'] == 'kolihhan/name-that-llm-phase15-terms-clean'
          assert meta['enable_internet'] is False
          assert meta['competition_sources'] == ['name-that-llm']
          assert meta['dataset_sources'] == ['nishantdahal/ntl-handwriting-blend']
          assert notebook['nbformat'] == 4
          source = ''.join(notebook['cells'][0]['source'])
          for needle in [
              '/kaggle/working/submission.parquet',
              'EXPECTED_RAW_ROWS = 75783',
              'EXPECTED_PHASE14_EXTERNAL_ROWS = 43781',
              'EXPECTED_TERMS_CLEAN_ROWS = 26025',
              'EXPECTED_TERMS_CLEAN_PROMPTS = 2801',
          ]:
              assert needle in source, needle
          print(json.dumps(meta, indent=2))
          PY

      - name: Push and run Phase 15 Kaggle notebook
        shell: bash
        run: |
          set -euo pipefail
          push_output="$(kaggle kernels push -p /tmp/name-that-llm-phase15 --timeout 32400)"
          echo "$push_output"
          kernel_version="$(printf '%s\n' "$push_output" | sed -nE 's/.*Kernel version ([0-9]+) successfully pushed.*/\1/p' | tail -n1)"
          test -n "$kernel_version"
          echo "KERNEL_VERSION=$kernel_version" >> "$GITHUB_ENV"

      - name: Wait for Kaggle notebook completion
        shell: bash
        run: |
          set -euo pipefail
          completed=0
          for attempt in $(seq 1 240); do
            status="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            echo "[$attempt] $status"
            if printf '%s\n' "$status" | grep -Eqi '(^|[^a-z])(complete|completed|success|succeeded)([^a-z]|$)'; then
              completed=1
              break
            fi
            if printf '%s\n' "$status" | grep -Eqi '(^|[^a-z])(error|failed|failure|cancelled|canceled)([^a-z]|$)'; then
              echo '--- Kaggle kernel logs ---'
              kaggle kernels logs "$KERNEL_REF" || true
              exit 1
            fi
            sleep 30
          done
          if [ "$completed" -ne 1 ]; then
            echo 'Kernel did not reach COMPLETE within the polling window.' >&2
            kaggle kernels logs "$KERNEL_REF" || true
            exit 1
          fi

      - name: Verify saved notebook output
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels files "$KERNEL_REF" -v
          rm -rf /tmp/kernel-output
          mkdir -p /tmp/kernel-output
          kaggle kernels output "$KERNEL_REF" -p /tmp/kernel-output --file-pattern '.*submission\.parquet$' -q
          test -f /tmp/kernel-output/submission.parquet
          python - <<'PY'
          import pandas as pd
          output = pd.read_parquet('/tmp/kernel-output/submission.parquet')
          train = pd.read_csv('data/train.csv')
          allowed = set(train['model'].astype(str))
          assert output.columns.tolist() == ['id', 'model']
          assert len(output) >= 1
          assert output['id'].is_unique
          assert not output.isna().any().any()
          assert set(output['model'].astype(str)) <= allowed
          print('saved output rows:', len(output))
          print(output['model'].value_counts().sort_index().to_string())
          PY

      - name: Recheck duplicate guard immediately before submit
        shell: bash
        run: |
          set -euo pipefail
          kaggle competitions submissions name-that-llm -v -q > /tmp/submissions-before-submit.csv
          cat /tmp/submissions-before-submit.csv
          python - <<'PY'
          import csv
          import os
          from pathlib import Path
          rows = list(csv.DictReader(Path('/tmp/submissions-before-submit.csv').open()))
          assert len(rows) == 1, f'submission state changed while kernel ran: {rows}'
          assert rows[0]['ref'] == os.environ['EXPECTED_EXISTING_REF'], rows
          PY

      - name: Submit Phase 15 notebook version
        shell: bash
        run: |
          set -euo pipefail
          : "${KERNEL_VERSION:?KERNEL_VERSION was not captured from kaggle kernels push}"
          kaggle competitions submit name-that-llm \
            -f submission.parquet \
            -k "$KERNEL_REF" \
            -v "$KERNEL_VERSION" \
            -m 'Phase 15 terms-clean public sparse submission' \
            --wait 3600 \
            --poll-interval 15

      - name: Show final Kaggle submission state
        if: always()
        shell: bash
        run: |
          echo '--- submissions ---'
          kaggle competitions submissions name-that-llm -v || true
