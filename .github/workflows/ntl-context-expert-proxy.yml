name: NTL explicit score proxy cross-prompt calibration CPU
on:
  push:
    branches: [research/ntl-ensemble-decomposition-20261127]
    paths: ['.github/workflows/ntl-context-expert-proxy.yml']
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ntl_context_expert_calibration_proxy_20261127.py
            scripts/ntl_decompose_historical_oof_20261127.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Explicit transformed-score diagnostic, no native probability claims
        run: |
          set -euo pipefail
          test ! -e data/train.csv
          python -m pip install -q kaggle==2.2.5 six==1.17.0 numpy pandas
          python -m py_compile scripts/ntl_context_expert_calibration_proxy_20261127.py
          python scripts/ntl_context_expert_calibration_proxy_20261127.py
