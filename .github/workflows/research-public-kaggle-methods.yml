name: Research current public Kaggle methods

on:
  push:
    branches:
      - exp/first-kaggle-submission
    paths:
      - .github/workflows/research-public-kaggle-methods.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle client
        run: pip install 'kaggle==2.2.5' six
      - name: Pull source notebooks independently
        shell: bash
        run: |
          set -euo pipefail
          : "${KAGGLE_API_TOKEN:?KAGGLE_API_TOKEN secret is not available}"
          rm -rf /tmp/ntl-method-audit
          mkdir -p /tmp/ntl-method-audit/repro636 /tmp/ntl-method-audit/original

          pull_one() {
            local ref="$1"
            local dir="$2"
            echo "=== PULL $ref ==="
            if kaggle kernels pull "$ref" -p "$dir" -m; then
              echo "PULL_OK $ref"
            else
              echo "PULL_UNAVAILABLE $ref"
            fi
          }

          pull_one cosmorin/name-that-llm-how-to-reproduce-0-636 /tmp/ntl-method-audit/repro636
          pull_one nishantdahal/two-stage-lora-part-two /tmp/ntl-method-audit/original
          find /tmp/ntl-method-audit -maxdepth 2 -type f -printf '%p\n' | sort

      - name: Print training and inference method evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          roots = [
              ('repro636', Path('/tmp/ntl-method-audit/repro636')),
              ('original_two_stage', Path('/tmp/ntl-method-audit/original')),
          ]
          keywords = (
              'stage', 'lora', 'adapter', 'qwen', 'deberta', 'train', 'valid',
              'external', 'official', 'competition', 'prompt_id', 'groupkfold',
              'fold', 'pool_v4', 'head', 'center', 'centered', 'sinkhorn',
              'loss', 'epoch', 'checkpoint', 'dataset', 'max_len', 'layers',
              'keep', 'eos_id', 'plain.weight', 'centered.weight', 'svc',
              'weight', 'public', 'private', 'fit', 'freeze', 'label',
          )

          def extract(path: Path) -> str:
              if path.suffix == '.ipynb':
                  nb = json.loads(path.read_text(encoding='utf-8'))
                  blocks = []
                  for i, cell in enumerate(nb.get('cells', [])):
                      src = ''.join(cell.get('source', []))
                      if src.strip():
                          blocks.append(f'\n# CELL {i} [{cell.get("cell_type")}]\n{src}')
                  return '\n'.join(blocks)
              return path.read_text(encoding='utf-8', errors='replace')

          for name, root in roots:
              candidates = sorted([p for p in root.rglob('*') if p.suffix in {'.py', '.ipynb'}])
              print(f'\n===== {name} FILES =====')
              for p in candidates:
                  print(p)
              if not candidates:
                  print('NO_SOURCE_AVAILABLE')
                  continue
              source = '\n'.join(extract(p) for p in candidates)
              lines = source.splitlines()
              hit_lines = set()
              for i, line in enumerate(lines):
                  low = line.lower()
                  if any(k in low for k in keywords):
                      hit_lines.update(range(max(0, i - 5), min(len(lines), i + 6)))
              ordered = sorted(hit_lines)
              print(f'===== {name} SOURCE_CHARS {len(source)} MATCHED_LINES {len(ordered)} =====')
              last = -2
              printed = 0
              for i in ordered:
                  if printed >= 1800:
                      print(f'... TRUNCATED after {printed} evidence lines ...')
                      break
                  if i != last + 1:
                      print(f'\n--- around source line {i+1} ---')
                  print(f'{i+1:05d}: {lines[i]}')
                  printed += 1
                  last = i
          PY
