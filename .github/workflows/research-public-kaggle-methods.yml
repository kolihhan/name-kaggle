name: Research current public Kaggle methods

on:
  push:
    branches:
      - exp/first-kaggle-submission
    paths:
      - .github/workflows/research-public-kaggle-methods.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle client
        run: pip install 'kaggle==2.2.5' six
      - name: Pull training notebook sources independently
        shell: bash
        run: |
          set -euo pipefail
          : "${KAGGLE_API_TOKEN:?KAGGLE_API_TOKEN secret is not available}"
          rm -rf /tmp/ntl-training-audit
          mkdir -p /tmp/ntl-training-audit/first /tmp/ntl-training-audit/lightning /tmp/ntl-training-audit/lucas

          pull_one() {
            local ref="$1"
            local dir="$2"
            echo "=== PULL $ref ==="
            if kaggle kernels pull "$ref" -p "$dir" -m; then
              echo "PULL_OK $ref"
            else
              echo "PULL_UNAVAILABLE $ref"
            fi
          }

          pull_one nishantdahal/two-stage-lora-on-the-public-pool /tmp/ntl-training-audit/first
          pull_one lightningv08/ntl-lora24-fivefold-training /tmp/ntl-training-audit/lightning
          pull_one lucasboesen/name-that-llm-train-lora24-s7 /tmp/ntl-training-audit/lucas
          find /tmp/ntl-training-audit -maxdepth 2 -type f -printf '%p\n' | sort

      - name: Print exact training-contract evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          roots = [
              ('nishant_first_two_stage', Path('/tmp/ntl-training-audit/first')),
              ('lightning_fivefold', Path('/tmp/ntl-training-audit/lightning')),
              ('lucas_seed7', Path('/tmp/ntl-training-audit/lucas')),
          ]
          keywords = (
              'stage', 'fold', 'groupkfold', 'prompt_id', 'train_idx', 'valid_idx',
              'public', 'pool', 'external', 'official', 'competition', 'lora',
              'rank', 'alpha', 'dropout', 'target_modules', 'epoch', 'lr',
              'learning_rate', 'scheduler', 'warmup', 'batch', 'grad', 'keep',
              'layers', 'head', 'centered', 'plain', 'loss', 'class_weight',
              'max_len', 'eos', 'checkpoint', 'adapter', 'seed', 'freeze',
              'train.csv', 'pool_v', 'similarity', 'cosine', '0.3', 'filter',
          )

          def extract(path: Path) -> str:
              if path.suffix == '.ipynb':
                  nb = json.loads(path.read_text(encoding='utf-8'))
                  out = []
                  for i, cell in enumerate(nb.get('cells', [])):
                      src = ''.join(cell.get('source', []))
                      if src.strip():
                          out.append(f'\n# CELL {i} [{cell.get("cell_type")}]\n{src}')
                  return '\n'.join(out)
              return path.read_text(encoding='utf-8', errors='replace')

          for name, root in roots:
              files = sorted(p for p in root.rglob('*') if p.suffix in {'.py', '.ipynb'})
              print(f'\n===== {name} FILES =====')
              for p in files: print(p)
              if not files:
                  print('NO_SOURCE_AVAILABLE')
                  continue
              source = '\n'.join(extract(p) for p in files)
              lines = source.splitlines()
              hits = set()
              for i, line in enumerate(lines):
                  if any(k in line.lower() for k in keywords):
                      hits.update(range(max(0, i-6), min(len(lines), i+7)))
              ordered = sorted(hits)
              print(f'===== {name} SOURCE_CHARS {len(source)} MATCHED_LINES {len(ordered)} =====')
              last = -2
              printed = 0
              for i in ordered:
                  if printed >= 2200:
                      print(f'... TRUNCATED after {printed} evidence lines ...')
                      break
                  if i != last + 1:
                      print(f'\n--- around source line {i+1} ---')
                  print(f'{i+1:05d}: {lines[i]}')
                  printed += 1
                  last = i
          PY
