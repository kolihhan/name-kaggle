name: NTL CDA v2 Standby After Original Monitor
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-cda-v2-timeout-standby-once.yml]
permissions: {contents: read}
concurrency:
  group: ntl-cda-v2-exactly-one-private-to-official-result
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q kaggle==2.2.5 six==1.17.0
      - name: Verify no duplicate or partial official release
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          test ! -e data/train.csv
          python - <<'PY'
          import os, subprocess
          from scripts.cda_l24_v2_run_once import (
              DESCRIPTION, DATASET_REF, KERNEL_REF, official_submissions
          )
          prior = [x for x in official_submissions()
                   if x.get("description") == DESCRIPTION]
          if prior:
              print("STANDBY_ALREADY_OFFICIALLY_SUBMITTED", len(prior), flush=True)
              proceed = "no"
          else:
              for kind, args in (
                  ("private-checkpoint", ["kaggle","datasets","status",
                                          DATASET_REF,"--format","json"]),
                  ("final-kernel", ["kaggle","kernels","status",KERNEL_REF]),
              ):
                  p = subprocess.run(args, capture_output=True, text=True)
                  response = (p.stdout + "\n" + p.stderr).lower()
                  if p.returncode == 0:
                      raise RuntimeError("STANDBY_PARTIAL_STATE: "+kind)
                  # On Kaggle CLI 2.2.5 missing private slugs return rc=1
                  # without the expected '404' or 'not found' text.
                  # Verify against an authenticated owned-resource inventory.
                  if kind == "private-checkpoint":
                      inventory_cmd = ["kaggle","datasets","list","-m",
                                       "-s","ntl-cda-l24-v2-c1-weights","-v"]
                      expected = DATASET_REF
                  else:
                      inventory_cmd = ["kaggle","kernels","list","-m",
                                       "-s","ntl-cda-l24-v2-final","-v"]
                      expected = KERNEL_REF
                  inventory = subprocess.run(
                      inventory_cmd, capture_output=True, text=True)
                  if inventory.returncode != 0:
                      raise RuntimeError("STANDBY_INVENTORY_UNAVAILABLE: "+kind)
                  if expected.lower() in inventory.stdout.lower():
                      raise RuntimeError("STANDBY_PARTIAL_STATE_IN_INVENTORY: "+kind)
              proceed = "yes"
              print("STANDBY_RESUME_SAME_FROZEN_C0_C1", flush=True)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("proceed="+proceed+"\n")
          PY
  static:
    needs: preflight
    if: needs.preflight.outputs.proceed == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/
            tests/test_cda_l24_v2_finish_package.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify private model package and final launcher code
        shell: bash
        run: |
          set -euo pipefail
          test ! -e data/train.csv
          python -m pip install -q numpy==1.26.4 pandas==2.2.3 scipy==1.15.2 scikit-learn==1.6.1 pyarrow==19.0.1 pytest
          python -m py_compile scripts/cda_l24_v2_finish_package.py scripts/cda_l24_v2_run_once.py
          python -m pytest -q tests/test_cda_l24_v2_finish_package.py
          python -m scripts.cda_l24_v2_run_once --help > /tmp/ntl-runner-help.txt
          echo "NTL_FULL_OFFICIAL_SUBMISSION_LAUNCHER_STATIC_PASS"
  stage-a:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      checkpoint_sha: ${{ steps.freeze.outputs.checkpoint_sha }}
      source_sha: ${{ steps.freeze.outputs.source_sha }}
      transfer_decision: ${{ steps.freeze.outputs.transfer_decision }}
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install Kaggle private-output client and CPU-only source transfer verification
        run: python -m pip install -q kaggle==2.2.5 six==1.17.0 numpy==1.26.4 pandas==2.2.3 scipy==1.15.2 scikit-learn==1.6.1 pyarrow==19.0.1
      - name: Check only fixed C1 version2 and C0 r1 version1 until complete then freeze private checkpoint
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          python -u -m scripts.cda_l24_v2_run_once stage-a
      - name: Upload aggregate 18-label transfer diagnostics only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cda-v2-18label-c0-c1-original-prompt-transfer-aggregates
          path: /tmp/ntl-cda-once/aggregate.json
          if-no-files-found: error
          retention-days: 30
  final:
    needs: stage-a
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      STAGE_A_SHA256: ${{ needs.stage-a.outputs.checkpoint_sha }}
      SOURCE_SHA256: ${{ needs.stage-a.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install Kaggle client and frozen offline Code Competition Notebook builder
        run: python -m pip install -q kaggle==2.2.5 six==1.17.0 numpy==1.26.4 pandas==2.2.3
      - name: Publish pinned C1 Kaggle notebook then official code submission exactly once
        shell: bash
        run: |
          set -euo pipefail
          python -u -m scripts.cda_l24_v2_run_once final \
            --stage-a-checkpoint-sha256 "$STAGE_A_SHA256" \
            --source-manifest-sha256 "$SOURCE_SHA256"
