name: NTL PRO exact new #58375806 official score receipt (read only)
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-pro-58375806-score-20261116.yml]
permissions: {contents: read}
jobs:
  check:
    if: "${{ github.event.head_commit.message != 'READ_NTL_OLEG216_FINAL_ONCE_20261117' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Read only frozen Kaggle submission receipts
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
          python - <<'PY'
          import csv,io,json,subprocess
          comp='name-that-llm'
          p=subprocess.run(['kaggle','competitions','submissions',comp,'-v','-q'],text=True,
               capture_output=True,timeout=90,check=True)
          rows=list(csv.DictReader(io.StringIO(p.stdout.lstrip('\ufeff'))))
          refs=['58375806','58295802']
          out=[]
          for ref in refs:
              matches=[r for r in rows if str(r.get('ref'))==ref]
              if len(matches)!=1: raise SystemExit('UNVERIFIED_OFFICIAL_REF_'+ref)
              v=matches[0]
              out.append({'ref':ref,'status':str(v.get('status') or ''),
               'publicScore':str(v.get('publicScore') or ''),
               'description':str(v.get('description') or '')[:130]})
          print('PRO_EXACT_OFFICIAL_SUBMISSION_RECEIPTS='+json.dumps(out,sort_keys=True),flush=True)
          new,base=out
          if new['publicScore']:
              delta=float(new['publicScore'])-float(base['publicScore'])
              print('PRO_AUTHENTICATED_SCORE_DELTA_VS_BEST='+str(round(delta,7)),flush=True)
          else:
              print('PRO_NEW_SCORE_STILL_UNAVAILABLE=TRUE',flush=True)
          print('PRO_NO_NEW_GPU_NO_TRAINING_NO_SUBMISSION=TRUE',flush=True)
          PY
      - name: Inspect frozen Lightning V2 final scoring surface (CPU only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ntl-owned-v2-src
          kaggle kernels pull kolihhan/lightning-0-694-authentic-no-fit-inference \
            -p /tmp/ntl-owned-v2-src -m >/tmp/ntl-v2-pull.log 2>&1
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          root=Path("/tmp/ntl-owned-v2-src")
          files=list(root.glob("*.ipynb"))
          assert len(files)==1, "EXACT_ONE_KAGGLE_NOTEBOOK_REQUIRED"
          nb=json.loads(files[0].read_text(encoding="utf-8"))
          cells=[c for c in nb["cells"] if c.get("cell_type")=="code"]
          assert len(cells)==50,"CODE_CELL_COUNT_DRIFT"
          source=lambda c: ''.join(c.get("source",[])) if isinstance(c.get("source"),list) else str(c.get("source",""))
          allcode="\n".join(map(source,cells))
          sha=hashlib.sha256(allcode.encode()).hexdigest()
          assert sha=="cae1074e9cea0b3c5f03e221b93e622858c4cbd8183309ba0a9a02e0ee73558c","CHAMPION_SOURCE_SHA_DRIFT"
          meta=json.loads((root/"kernel-metadata.json").read_text(encoding="utf-8"))
          assert meta["id"]=="kolihhan/lightning-0-694-authentic-no-fit-inference"
          print("NTL_FROZEN_V2_CODE_SHA="+sha,flush=True)
          print("NTL_FROZEN_V2_NOTEBOOK_METADATA="+json.dumps({"slug":meta["id"],"enable_gpu":meta["enable_gpu"],"model_mounts":len(meta.get("model_sources",[]))},sort_keys=True),flush=True)
          for i,c in enumerate(cells):
              s=source(c)
              lines=s.splitlines()
              head=lines[0].strip() if lines else ""
              path=head.split(" ",1)[1] if head.startswith("%%writefile ") else "NOTEBOOK_CELL"
              if re.search(r"(?i)(secret|credential|password|token|api_key|os\.environ)",path):
                  path="REDACTED"
              matches=[]
              for n,line in enumerate(lines,1):
                  z=line.strip()
                  if re.search(r"(?i)(secret|credential|password|api.key|bearer|os\.environ)",z):continue
                  if re.search(r"\bargmax\b|np\.argmax|\.idxmax\(|\bsoftmax\b|\blogits\b|\bensemble\b|submission\.parquet|\.predict\(|\bproba\b|score_matrix|\bfinal_scores\b|\bfinal_pred\b",z):
                      matches.append({"line":n,"code":z[:180]})
              if matches:
                  print("NTL_SCORING_SOURCE="+json.dumps({"cell":i,"module":path,"matches":matches[:20],"remaining_matches":max(0,len(matches)-20)},ensure_ascii=False),flush=True)
          print("NTL_SOURCE_ONLY_NO_GPU_NO_SUBMISSION=TRUE",flush=True)
          PY
      - name: Inspect post-ensemble V1 last writer, no model execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ntl-v2-final-writer
          kaggle kernels pull kolihhan/lightning-0-694-authentic-no-fit-inference \
            -p /tmp/ntl-v2-final-writer -m >/tmp/ntl-v2-final-pull.log 2>&1
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          p=list(Path('/tmp/ntl-v2-final-writer').glob('*.ipynb'))
          assert len(p)==1
          nb=json.loads(p[0].read_text())
          cells=[c for c in nb['cells'] if c.get('cell_type')=='code']
          src=lambda cell: ''.join(cell['source']) if isinstance(cell['source'],list) else str(cell['source'])
          assert hashlib.sha256('\n'.join(map(src,cells)).encode()).hexdigest()=='cae1074e9cea0b3c5f03e221b93e622858c4cbd8183309ba0a9a02e0ee73558c'
          for idx in (8,41,47,48,49):
              lines=src(cells[idx]).splitlines()
              if idx==8:
                  chosen=[(i,x) for i,x in enumerate(lines,1) if i>=65 and i<=170]
              elif idx==41:
                  chosen=[(i,x) for i,x in enumerate(lines,1) if i>=155 and i<=200]
              else:
                  chosen=list(enumerate(lines,1))
              for line_no, line in chosen:
                  if re.search(r'(?i)(password|secret|api.key|bearer|credential|kaggle_api_token)',line):continue
                  print('NTL_EXACT_FINAL_CODE='+json.dumps({'cell':idx,'line':line_no,'source':line[:220]},ensure_ascii=False),flush=True)
          print('NTL_LAST_WRITER_CPU_SOURCE_ONLY=PASS',flush=True)
          PY
      - name: CPU sanity build exact Oleg216 post-V1 18-class diagnostic (no GPU)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pandas==2.3.3 pyarrow==22.0.0 numpy==2.3.4
          mkdir -p /tmp/ntl-v2-build-src /tmp/ntl-v2-old-baseline
          kaggle kernels pull kolihhan/lightning-0-694-authentic-no-fit-inference \
            -p /tmp/ntl-v2-build-src -m >/tmp/ntl-v2-build-src.log 2>&1
          kaggle kernels output kolihhan/ntl-oleg18-frozen0691-probe-nov16 \
            -p /tmp/ntl-v2-old-baseline -o >/tmp/ntl-v2-old-baseline.log 2>&1
          find /tmp/ntl-v2-old-baseline -type f -name submission.parquet \
            | tee /tmp/ntl-v2-previous-preds-files
          test "$(wc -l < /tmp/ntl-v2-previous-preds-files)" -eq 1
          baseline="$(cat /tmp/ntl-v2-previous-preds-files)"
          python -m scripts.ntl_oleg18_logit_diagnostic_once_20261117 \
            --source /tmp/ntl-v2-build-src --baseline "$baseline" \
            --out /tmp/ntl-v2-diagnostic-output
          test -e /tmp/ntl-v2-diagnostic-output/kernel-metadata.json
          echo "NTL_FINAL18_DIAGNOSTIC_CPU_BUILD_SANITY=PASS"
      - name: Verify CPU Oleg216 evaluator on deterministic 18-label synthetic cases
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q scikit-learn==1.7.2 scipy==1.16.3
          python - <<'PY'
          from pathlib import Path
          import json,tempfile,subprocess,sys
          import numpy as np,pandas as pd
          with tempfile.TemporaryDirectory() as d:
              d=Path(d)
              labels=[f'c{i:02}' for i in range(18)]
              ids=[f'syn_{i:04}' for i in range(216)]
              truth=[labels[i//12] for i in range(216)]
              logits=np.full((216,18),-4,dtype=np.float32)
              prediction=[]
              for i in range(216):
                  t=i//12
                  if i<120:
                      logits[i,t]=3.
                      logits[i,(t+1)%18]=2.
                      prediction.append(labels[t])
                  else:
                      logits[i,(t+1)%18]=.8
                      logits[i,t]=.7
                      prediction.append(labels[(t+1)%18])
              with (d/'scores.jsonl').open('w') as f:
                  for i in range(216):
                      f.write(json.dumps(dict(sample_id=ids[i],labels=labels,
                          logits=logits[i].tolist(),argmax=prediction[i]))+'\n')
              pd.DataFrame({'id':ids,'model':prediction}).to_csv(d/'baseline.csv',index=False)
              pd.DataFrame({'id':ids,'model':truth}).to_csv(d/'truth.csv',index=False)
              p=subprocess.run([sys.executable,'-m','scripts.ntl_oleg_offline_eval_20261117',
                  '--dump',str(d/'scores.jsonl'),'--baseline',str(d/'baseline.csv'),
                  '--truth',str(d/'truth.csv')],text=True,capture_output=True,check=True,timeout=120)
              j=json.loads(p.stdout.split('NTL_OLEG216_GLOBAL_CPU_AUDIT=',1)[1])
              assert j['n']==216 and j['n_classes']==18
              assert j['first5_match'] and j['baseline_agreement']==1
              assert j['margin_correctness_AUROC']>=.65
              assert len(j['global_one_parameter_rank_switch'])==4
              assert 'repeated_CV' in j
              print('NTL_OLEG216_CPU_EVALUATOR_SYNTHETIC_18CLASS=PASS',flush=True)
          PY

  read_oleg216_final_once:
    if: "${{ github.event.head_commit.message == 'READ_NTL_OLEG216_FINAL_ONCE_20261117' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Read exact one-off Kaggle private kernel; never push or infer
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0 pandas==2.3.3 pyarrow==22.0.0 numpy==2.3.4 scipy==1.16.3 scikit-learn==1.7.2
          ref='kolihhan/ntl-oleg216-final18-diagnostic-nov17'
          set +e
          status="$(kaggle kernels status "$ref" 2>&1)"
          status_rc=$?
          set -e
          echo "NTL_KAGGLE_STATUS_CLI_EXIT=$status_rc"
          NTL_STATUS_SANITIZE_INPUT="$status" python - <<'PY'
          import os,re
          s=os.environ.get('NTL_STATUS_SANITIZE_INPUT','')
          s=re.sub(r'(?i)(key|token|secret|password|authorization)[=: ]+\\S+',r'\\1=[REDACTED]',s)
          s=' '.join(s.split())[:420]
          print('NTL_KAGGLE_STATUS_SAFE_RESPONSE='+s,flush=True)
          PY
          state="$(printf '%s' "$status" | grep -oE 'KernelWorkerStatus[.][A-Z_]+' | head -1 || true)"
          if [ -n "$state" ]; then
            echo "NTL_EXACT_PRIVATE_GPU_WORKER_ENUM=$state"
          else
            echo "NTL_EXACT_PRIVATE_GPU_WORKER_ENUM=UNKNOWN_OR_CLI_ERROR"
          fi
          if [[ "$status" == *KernelWorkerStatus.COMPLETE* ]]; then
            echo 'NTL_EXACT_PRIVATE_GPU_STATUS=COMPLETE'
          elif [[ "$status" == *KernelWorkerStatus.ERROR* || "$status" == *KernelWorkerStatus.FAILED* || "$status" == *KernelWorkerStatus.CANCELLED* ]]; then
            echo 'NTL_EXACT_PRIVATE_GPU_STATUS=ERROR_OR_FAILED_SELECT_B'
            echo 'NTL_OFFICIAL_BEST_STILL=0.691;NEW_SUBMISSION=NONE'
            exit 0
          else
            echo 'NTL_EXACT_PRIVATE_GPU_STATUS=NOT_TERMINAL'
            echo 'NTL_216_FINAL18_LOGITS_VALIDITY=UNOBSERVED'
            exit 0
          fi
          mkdir -p /tmp/ntl-diag-result /tmp/ntl-prev-oleg-preds /tmp/ntl-truth
          kaggle kernels output "$ref" -p /tmp/ntl-diag-result -o >/tmp/ntl-kernel-output.log 2>&1
          echo "NTL_PRIVATE_OUTPUT_FILE_BASENAMES=$(find /tmp/ntl-diag-result -type f -printf '%f ' | head -c 350)"
          if [ -f /tmp/ntl-diag-result/ntl_oleg216_diag_timeout.json ]; then
            echo 'NTL_80PCT_WATCHDOG_EXITED_WITHOUT_FINAL_LOGITS=CHOOSE_B'
            exit 0
          fi
          if [ ! -f /tmp/ntl-diag-result/ntl_oleg216_final18_logits.jsonl ]; then
            echo 'NTL_216_FINAL18_LOGITS_MISSING=CHOOSE_B'
            exit 0
          fi
          kaggle kernels output kolihhan/ntl-oleg18-frozen0691-probe-nov16 -p /tmp/ntl-prev-oleg-preds -o >/tmp/ntl-previous.log 2>&1
          for f in external_short_wide.parquet external_cell_metadata.parquet; do
            kaggle datasets download olegzholobov/name-that-llm-response-corpus -f "$f" -p /tmp/ntl-truth --unzip -o -q >/tmp/ntl-external.log 2>&1
          done
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from scripts.ntl_oleg18_frozen_selector_20261116 import ntl_oleg18_select,NTL_OLEG18_SHA
          import hashlib
          raw=Path('/tmp/ntl-truth')
          for name,sha in NTL_OLEG18_SHA.items():
              assert hashlib.sha256((raw/name).read_bytes()).hexdigest()==sha
          truth=ntl_oleg18_select(pd.read_parquet(raw/'external_short_wide.parquet'),pd.read_parquet(raw/'external_cell_metadata.parquet'))
          assert len(truth)==216
          truth[['id','model']].to_csv('/tmp/ntl-oleg-truth.csv',index=False)
          print('NTL_EXTERNAL_SOURCE_VERIFIED=TRUE',flush=True)
          PY
          python -m scripts.ntl_oleg_offline_eval_20261117 \
            --dump /tmp/ntl-diag-result/ntl_oleg216_final18_logits.jsonl \
            --baseline /tmp/ntl-prev-oleg-preds/submission.parquet \
            --truth /tmp/ntl-oleg-truth.csv
          echo 'NTL_REAL_LOGITS_CPU_AUDIT_FINISHED=TRUE'
# NTL private kernel read-back; no GPU push or model execution.
