name: NTL reset PB115 bank provenance CPU
on:
  push:
    branches: [research/ntl-reset-bank-provenance-20261128]
    paths: [.github/workflows/ntl-reset-bank-provenance-20261128.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Audit algebraic identities across pinned bank tables
        run: |
          set -euo pipefail
          python -m pip install -q kaggle==2.2.5 six==1.17.0 numpy==2.3.4 pandas==2.3.3 pyarrow==22.0.0
          python - <<'PY'
          import hashlib,json,tempfile,subprocess
          from pathlib import Path
          import numpy as np,pandas as pd
          hashes={
            'flash_features.csv':'35c2b383fb45d4797091d401f7e9d951051d68dbed8cb8eb6fd2c66ee5394f36',
            'glm53_features.csv':'882b695788b06fdd5717bcab1cce663ea26628cecc6dcca237c3255f92a9817b',
            'paired_token_features.parquet':'55860b37a488c5a94533524973666b25b2474df1649a86ba11f1c62f1d61210a',
            'spec.json':'8b9513abdd1c07497a7a11daa3fbaa0c551bf22f120b51a974e8129124521488'}
          def log(k,v): print(k+'='+json.dumps(v,sort_keys=True),flush=True)
          def residual(a,b):
              a,b=np.asarray(a,float),np.asarray(b,float)
              assert a.shape==b.shape and np.isfinite(a).all() and np.isfinite(b).all()
              return np.abs(a-b)
          def summarize(x):
              return {'n':len(x),'fail':int((x>1e-5).sum()),'abs_quantiles':np.quantile(x,[0,.5,.9,.99,1]).tolist()} if len(x) else {'n':0}
          def weighted(first,second,n):
              return (first*(n//2)+second*(n-n//2))/n
          assert np.isclose(weighted(-1.,-2.,5),-1.6)
          assert residual([1.,2.],[1.,3.]).tolist()==[0.,1.]
          with tempfile.TemporaryDirectory() as tmp:
              p=subprocess.run(['kaggle','datasets','download','-d','lumibee/ntl-prefixb-full-115','-p',tmp,'--unzip','-q'],capture_output=True,timeout=180)
              assert p.returncode==0,'Kaggle bank download failed'
              paths={k:next(Path(tmp).rglob(k)) for k in hashes}
              assert all(hashlib.sha256(paths[k].read_bytes()).hexdigest()==v for k,v in hashes.items())
              f=pd.read_csv(paths['flash_features.csv'],dtype={'id':str}).set_index('id')
              g=pd.read_csv(paths['glm53_features.csv'],dtype={'id':str}).set_index('id')
              q=pd.read_parquet(paths['paired_token_features.parquet'])
              if 'id' in q:q=q.set_index('id')
              q.index=q.index.astype(str)
              assert all(x.index.is_unique and len(x)==2699 for x in (f,g,q))
              assert set(f.index)==set(g.index)==set(q.index)
              g=g.loc[f.index];q=q.loc[f.index];n=f.n_tok.to_numpy()
              assert np.array_equal(n,g.n_tok.to_numpy()) and np.min(n)>=2
              def c(k):return q['p:'+k].to_numpy()
              checks={
                'within54_flash_lp_halves':residual(f.lp_mean,weighted(f.lp_mean_first,f.lp_mean_second,n)),
                'within54_glm_lp_halves':residual(g.lp_mean,weighted(g.lp_mean_first,g.lp_mean_second,n)),
                'within61_pair_lp_halves':residual(c('dlp_mean'),weighted(c('dlp_first'),c('dlp_second'),n)),
                'within61_top1_exclusive':residual(c('excl_t1_diff'),c('excl_t1_f')-c('excl_t1_g')),
                'within61_top5_exclusive':residual(c('excl_t5_diff'),c('excl_t5_f')-c('excl_t5_g')),
                'cross_lp_mean':residual(c('dlp_mean'),f.lp_mean-g.lp_mean),
                'cross_lp_first':residual(c('dlp_first'),f.lp_mean_first-g.lp_mean_first),
                'cross_lp_second':residual(c('dlp_second'),f.lp_mean_second-g.lp_mean_second),
                'cross_entropy_mean':residual(c('dent_mean'),f.ent_mean-g.ent_mean),
                'cross_logrank_mean':residual(c('dlrk_mean'),f.logrank_mean-g.logrank_mean),
                'cross_z_mean':residual(c('dz_mean'),f.z_mean-g.z_mean),
                'cross_top1':residual(c('excl_t1_diff'),f.top1-g.top1),
                'cross_top5':residual(c('excl_t5_diff'),f.top5-g.top5),
                'within61_head32':residual(c('dlp_head32'),q['flash:lp_head32']-q['glm53:lp_head32']),
                'within61_tail32':residual(c('dlp_tail32'),q['flash:lp_tail32']-q['glm53:lp_tail32'])}
              log('BANK_IDENTITY_AUDIT',{k:summarize(v) for k,v in checks.items()})
              bad=checks['cross_lp_mean']>1e-5
              log('BANK_MISMATCH_CONCORDANCE',{k:{'both_fail':int(((v>1e-5)&bad).sum()),'only_this':int(((v>1e-5)&~bad).sum()),'only_lp':int(((v<=1e-5)&bad).sum())} for k,v in checks.items()})
              log('BANK_LENGTH_STRATA',{str(lo)+'-'+str(hi):{'n':int(((n>=lo)&(n<=hi)).sum()),'fail':int(((n>=lo)&(n<=hi)&bad).sum())} for lo,hi in [(2,63),(64,95),(96,127),(128,159),(160,160)]})
              log('BANK_ROW_ORDER_STRATA',[{'n':len(a),'fail':int(bad[a].sum())} for a in np.array_split(np.arange(len(n)),10)])
              log('BANK_VERDICT',{'scope':'pinned feature bank only; no labels, no fitted model, no raw IDs or values exported','mismatch_count':int(bad.sum()),'promotion':False,'gpu':False,'submission':False,'root_cause_confirmed':False})
          PY
