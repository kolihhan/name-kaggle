name: Phase 12 recon HealthBench-Psych Opus 5

on:
  push:
    branches:
      - exp/first-kaggle-submission
    paths:
      - .github/workflows/phase12-recon-healthbench-opus5.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install recon dependencies
        run: python -m pip install 'datasets>=3,<5' 'huggingface_hub>=0.30,<3' 'pandas>=2,<3' 'pyarrow>=15,<27'

      - name: Resolve immutable v1.0.0 revision and inspect Opus 5 responses
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from collections import Counter
          from datasets import load_dataset
          from huggingface_hub import HfApi

          repo_id = 'mindbench-ai/healthbench-psych'
          revision = 'v1.0.0'
          api = HfApi()
          info = api.dataset_info(repo_id, revision=revision)
          print('resolved_sha:', info.sha)
          print('last_modified:', info.last_modified)
          print('tags:', info.tags)

          ds = load_dataset(repo_id, 'responses', split='train', revision=revision)
          print('responses_total_rows:', len(ds))
          print('columns:', ds.column_names)

          model_counts = Counter(str(x) for x in ds['model'])
          print('model_count:', len(model_counts))
          print('claude-opus-5 count:', model_counts.get('claude-opus-5', 0))
          print('all_models:', dict(sorted(model_counts.items())))

          opus = ds.filter(lambda row: row['model'] == 'claude-opus-5')
          empty = sum(
              1 for text in opus['response_text']
              if not isinstance(text, str) or not text.strip()
          )
          print('opus_rows:', len(opus))
          print('opus_empty_response_rows:', empty)
          print('opus_nonempty_response_rows:', len(opus) - empty)
          print('opus_unique_prompt_ids:', len(set(str(x) for x in opus['prompt_id'])))
          print('opus_stop_reasons:', dict(Counter(str(x) for x in opus['stop_reason'])))
          print('opus_refusal_rows:', sum(bool(x) for x in opus['is_refusal']))
          print('opus_corrections_nonnull:', sum(x is not None for x in opus['correction']))

          assert info.sha
          assert len(opus) == 610
          assert len(set(str(x) for x in opus['prompt_id'])) == 610
          PY
