name: NTL Ozertuu 58022340 Official Score Refresh 22:45 MYT Read Only
on:
  push:
    branches: [exp/dct-temporal-fingerprint-v3]
    paths: [.github/workflows/ntl-ozertuu-v3-score-refresh-20261105-2245.yml]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q kaggle==2.2.5 six==1.17.0
      - name: Official Kaggle detail and My Submissions (no mutation)
        shell: bash
        run: |
          set -euo pipefail
          : "${KAGGLE_API_TOKEN:?Missing token}"
          kaggle competitions submission 58022340
          kaggle competitions submissions name-that-llm -v -q >/tmp/submissions.csv
          python - <<'PY'
          import csv,json,datetime
          rows=list(csv.DictReader(open('/tmp/submissions.csv',newline='')))
          matches=[x for x in rows if x.get('ref')=='58022340']
          assert len(matches)==1, 'target absent'
          r=matches[0]
          print('CHECKED_UTC',datetime.datetime.now(datetime.timezone.utc).isoformat())
          print('TARGET',json.dumps({k:r.get(k) for k in ['ref','status','publicScore','privateScore','description','date']},sort_keys=True))
          print('LATEST_REF',max(int(x['ref']) for x in rows),'COUNT',len(rows))
          best=[x for x in rows if x.get('publicScore')]
          if best:
              b=max(best,key=lambda x:float(x['publicScore']))
              print('OWN_SCORED_BEST',b['ref'],b['publicScore'])
          if r.get('publicScore'):
              print('DELTA_VS_0666',round(float(r['publicScore'])-0.666,4))
          else:
              print('PENDING_UNSCORED',r.get('status'))
          PY
