name: Phase 16 audit public 0.622 assets

on:
  push:
    branches:
      - exp/first-kaggle-submission
    paths:
      - .github/workflows/phase16-audit-public-0622-assets.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: cosmorin/name-that-llm-public620-reproduction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle client
        run: python -m pip install 'kaggle==2.2.5'
      - name: Pull public notebook source and metadata
        shell: bash
        run: |
          set -euo pipefail
          : "${KAGGLE_API_TOKEN:?KAGGLE_API_TOKEN secret is not available}"
          rm -rf /tmp/public-0622-assets
          mkdir -p /tmp/public-0622-assets
          kaggle kernels pull "$KERNEL_REF" -p /tmp/public-0622-assets -m
          find /tmp/public-0622-assets -maxdepth 1 -type f -printf '%f\n' | sort
      - name: Extract mounted-asset map
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path

          root = Path('/tmp/public-0622-assets')
          report = {
              'kernel_ref': 'cosmorin/name-that-llm-public620-reproduction',
              'scope': 'static_metadata_only_no_execution_no_training_no_submission',
              'metadata': [],
              'referenced_asset_names': [],
          }

          for p in sorted(root.glob('*metadata*.json')):
              try:
                  obj = json.loads(p.read_text(encoding='utf-8'))
              except Exception:
                  continue
              report['metadata'].append({'file': p.name, 'data': obj})

          chunks=[]
          for p in sorted(root.glob('*.ipynb')):
              nb=json.loads(p.read_text(encoding='utf-8'))
              for c in nb.get('cells',[]):
                  if c.get('cell_type')=='code':
                      s=c.get('source','')
                      if isinstance(s,list): s=''.join(s)
                      chunks.append(s)
          for p in sorted(root.glob('*.py')):
              chunks.append(p.read_text(encoding='utf-8'))
          code='\n'.join(chunks)

          # Compact names that identify mounted checkpoints/caches without copying notebook code.
          names=set()
          for pat in [
              r'find\(["\']([^"\']+)["\']\)',
              r'["\'](lora_[A-Za-z0-9_.\-/]+)["\']',
              r'["\'](ntl620_[A-Za-z0-9_.\-/]+)["\']',
              r'["\'](deberta_v3_large/[A-Za-z0-9_.\-/]+)["\']',
          ]:
              names.update(re.findall(pat, code))
          report['referenced_asset_names']=sorted(names)

          out=Path('/tmp/phase16_public_0622_assets.json')
          out.write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2,ensure_ascii=False))
          PY
      - name: Upload asset audit
        uses: actions/upload-artifact@v4
        with:
          name: phase16-public-0622-assets
          path: /tmp/phase16_public_0622_assets.json
          retention-days: 30
