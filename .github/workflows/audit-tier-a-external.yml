name: Audit accessible external generations

on:
  push:
    paths:
      - .github/workflows/audit-tier-a-external.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install audit dependencies
        run: pip install -r requirements.txt pyarrow

      - name: Download byte-pinned GPT and Gemini generations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/external
          url='https://raw.githubusercontent.com/RohanExploit/kaggle-name-that-llm-top20/main/data/extra_gpt_gemini/ntl_generations.csv'
          curl -fL "$url" -o /tmp/external/ntl_generations.csv
          actual_blob="$(git hash-object /tmp/external/ntl_generations.csv)"
          expected_blob='8dccb6d8f8b8388b134a6aa8f8ea42e99df08c10'
          echo "Git blob: $actual_blob"
          test "$actual_blob" = "$expected_blob"

      - name: Audit raw rows against official train
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          import numpy as np
          import pandas as pd
          from sklearn.feature_extraction.text import TfidfVectorizer
          from sklearn.metrics.pairwise import cosine_similarity

          source_path = Path('/tmp/external/ntl_generations.csv')
          ext = pd.read_csv(source_path)
          train = pd.read_csv('data/train.csv')
          target_labels = set(json.loads(Path('artifacts/phase1/audit.json').read_text())['model_counts'])

          required = {
              'label', 'prompt_id', 'setting', 'target_words', 'text',
              'model_seen', 'finish_reason', 'cost_usd', 'batch'
          }
          missing_cols = sorted(required - set(ext.columns))
          if missing_cols:
              raise RuntimeError(f'Missing expected columns: {missing_cols}')

          ext = ext.rename(columns={'label': 'model'}).copy()
          ext['text'] = ext['text'].astype(str)
          ext['model'] = ext['model'].astype(str)

          def norm(s: str) -> str:
              return re.sub(r'\s+', ' ', s).strip()

          ext_norm = ext['text'].map(norm)
          train_norm = train['text'].astype(str).map(norm)
          train_set = set(train_norm)
          label_counts = ext['model'].value_counts().sort_index()
          invalid_labels = sorted(set(label_counts.index) - target_labels)
          missing_competition_labels = sorted(target_labels - set(label_counts.index))
          word_counts = ext_norm.str.split().map(len)
          exact_overlap_mask = ext_norm.isin(train_set)

          # Independent lexical screen against official passages. This is diagnostic;
          # exact overlap and label identity are hard gates, similarity is reported.
          all_text = pd.concat([train_norm, ext_norm], ignore_index=True)
          vec = TfidfVectorizer(
              lowercase=True,
              analyzer='word',
              ngram_range=(1, 2),
              min_df=1,
              max_features=80000,
              sublinear_tf=True,
          )
          X = vec.fit_transform(all_text)
          X_train = X[: len(train)]
          X_ext = X[len(train) :]
          max_sim = np.zeros(len(ext), dtype=np.float32)
          for start in range(0, len(ext), 256):
              sims = cosine_similarity(X_ext[start:start + 256], X_train, dense_output=True)
              max_sim[start:start + len(sims)] = sims.max(axis=1)

          prompt_counts = ext['prompt_id'].astype(str).value_counts()
          seen = ext['model_seen'].fillna('').astype(str).str.strip()
          finish = ext['finish_reason'].fillna('').astype(str).str.strip()

          audit = {
              'source': {
                  'name': 'Extra GPT and Gemini generations (free Kaggle Benchmarks quota)',
                  'upstream_repo': 'RohanExploit/kaggle-name-that-llm-top20',
                  'upstream_path': 'data/extra_gpt_gemini/ntl_generations.csv',
                  'git_blob_sha1': '8dccb6d8f8b8388b134a6aa8f8ea42e99df08c10',
                  'sha256': hashlib.sha256(source_path.read_bytes()).hexdigest(),
                  'license_reported': 'CC BY 4.0 (best-effort statement in upstream README)',
                  'prompt_bank': 'seyitkaangunes/ntl-extra-api-passages — 1,000 new prompts, CC BY 4.0',
              },
              'shape': {
                  'rows': int(len(ext)),
                  'columns': list(map(str, ext.columns)),
                  'duplicate_full_rows': int(ext.duplicated().sum()),
                  'duplicate_normalized_texts': int(ext_norm.duplicated().sum()),
                  'prompt_ids': int(ext['prompt_id'].nunique()),
                  'prompt_min_rows': int(prompt_counts.min()),
                  'prompt_max_rows': int(prompt_counts.max()),
              },
              'labels': {
                  'n_present': int(label_counts.size),
                  'counts': {str(k): int(v) for k, v in label_counts.items()},
                  'invalid_labels': invalid_labels,
                  'missing_competition_labels': missing_competition_labels,
              },
              'provenance': {
                  'model_seen_blank_rows': int(seen.eq('').sum()),
                  'model_seen_unique': int(seen.replace('', np.nan).dropna().nunique()),
                  'settings': {str(k): int(v) for k, v in ext['setting'].fillna('<NA>').astype(str).value_counts().items()},
                  'finish_reasons': {str(k): int(v) for k, v in finish.replace('', '<blank>').value_counts().items()},
                  'batches': int(ext['batch'].nunique()),
              },
              'protocol': {
                  'word_count_min': int(word_counts.min()),
                  'word_count_p05': float(word_counts.quantile(0.05)),
                  'word_count_median': float(word_counts.median()),
                  'word_count_p95': float(word_counts.quantile(0.95)),
                  'word_count_max': int(word_counts.max()),
                  'fraction_40_to_250_words': float(word_counts.between(40, 250).mean()),
                  'rows_with_newline': int(ext['text'].str.contains(r'\n', regex=True).sum()),
              },
              'official_train_overlap': {
                  'exact_normalized_text_matches': int(exact_overlap_mask.sum()),
                  'tfidf_word_1_2_max_similarity_max': float(max_sim.max()),
                  'tfidf_word_1_2_max_similarity_p99': float(np.quantile(max_sim, 0.99)),
                  'rows_similarity_gt_0_25': int((max_sim > 0.25).sum()),
                  'rows_similarity_gt_0_50': int((max_sim > 0.50).sum()),
                  'rows_similarity_gt_0_80': int((max_sim > 0.80).sum()),
              },
          }

          hard_failures = []
          if invalid_labels:
              hard_failures.append(f'invalid competition labels: {invalid_labels}')
          if int(exact_overlap_mask.sum()) > 0:
              hard_failures.append('exact normalized text overlap with official train')
          if int(seen.eq('').sum()) > 0:
              hard_failures.append('blank model_seen provenance rows')
          audit['gate'] = {
              'hard_failures': hard_failures,
              'passed_raw_identity_gate': not hard_failures,
              'note': 'Missing competition labels are expected for this targeted source and are not a hard failure.'
          }

          out_dir = Path('artifacts/phase2')
          out_dir.mkdir(parents=True, exist_ok=True)
          (out_dir / 'gpt_gemini_raw_audit.json').write_text(json.dumps(audit, indent=2, ensure_ascii=False) + '\n')

          data_dir = Path('data/external')
          data_dir.mkdir(parents=True, exist_ok=True)
          ext.to_parquet(data_dir / 'gpt_gemini_generations.parquet', index=False)

          print(json.dumps({
              'rows': audit['shape']['rows'],
              'prompts': audit['shape']['prompt_ids'],
              'labels': audit['labels']['n_present'],
              'label_counts': audit['labels']['counts'],
              'invalid_labels': invalid_labels,
              'model_seen_blank': audit['provenance']['model_seen_blank_rows'],
              'exact_overlap': audit['official_train_overlap']['exact_normalized_text_matches'],
              'near_gt_0_50': audit['official_train_overlap']['rows_similarity_gt_0_50'],
              'fraction_40_to_250': audit['protocol']['fraction_40_to_250_words'],
              'gate_pass': audit['gate']['passed_raw_identity_gate'],
          }, indent=2))
          PY

      - name: Commit audited snapshot and report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/phase2/gpt_gemini_raw_audit.json data/external/gpt_gemini_generations.parquet
          if git diff --cached --quiet; then
            echo 'No external audit changes.'
            exit 0
          fi
          git commit -m 'Materialize and audit GPT Gemini external generations'
          git push
