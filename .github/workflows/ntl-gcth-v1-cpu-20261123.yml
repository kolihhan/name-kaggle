name: NTL GCTH-v1 real generator-conditioned token heads CPU frozen test
on:
  push:
    branches: [research/ntl-generator-token-head-v1-20261123]
    paths: [.github/workflows/ntl-gcth-v1-cpu-20261123.yml]
permissions: {contents: read}
concurrency:
  group: ntl-generator-token-head-v1-20261123
  cancel-in-progress: false
jobs:
  source-conditional:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      USE_TF: '0'
      USE_FLAX: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Contract and frozen Python source
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/research/ntl-gcth-v1-contract-20261123.md
          python -m py_compile scripts/ntl_generator_conditional_token_head_v1_20261123.py
          python -m pip install -q --disable-pip-version-check 'torch==2.6.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q --disable-pip-version-check 'transformers==4.57.1' 'huggingface_hub>=0.34,<1' 'numpy>=1.26,<3' 'scipy>=1.13,<2' 'scikit-learn>=1.4,<2' 'pandas>=2,<3' 'tokenizers>=0.22,<0.23' safetensors threadpoolctl
          python -c 'import torch; assert not torch.cuda.is_available(); print("NTL_GCTH_V1_CPU_ONLY="+torch.__version__)'
      - name: Real pretrained causal features plus 3-fold-local source-head arms and direct sparse, all five heldout folds
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.ntl_generator_conditional_token_head_v1_20261123
          echo NTL_GCTH_V1_NO_GPU_NO_EXTERNAL_GENERATIONS_NO_TEST_NO_COMPETITION_SUBMISSION=TRUE
