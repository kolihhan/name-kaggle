name: Phase 16 audit stage-one LoRA pack metadata

on:
  push:
    branches:
      - exp/first-kaggle-submission
    paths:
      - .github/workflows/phase16-audit-stage1-pack-metadata.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      DATASET_REF: nishantdahal/ntl-two-stage-lora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle client
        run: python -m pip install 'kaggle==2.2.5'
      - name: Read metadata
        shell: bash
        run: |
          set -euo pipefail
          : "${KAGGLE_API_TOKEN:?KAGGLE_API_TOKEN secret is not available}"
          rm -rf /tmp/p16stage1 && mkdir -p /tmp/p16stage1
          kaggle datasets metadata "$DATASET_REF" -p /tmp/p16stage1
          kaggle datasets files "$DATASET_REF" -v > /tmp/p16stage1/files.csv
          cat /tmp/p16stage1/dataset-metadata.json
          cat /tmp/p16stage1/files.csv
      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: phase16-stage1-pack-metadata
          path: |
            /tmp/p16stage1/dataset-metadata.json
            /tmp/p16stage1/files.csv
          retention-days: 30
