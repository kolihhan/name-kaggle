name: NTL CDA L24 v2 Launch Two Original-Source GPU Training Arms Once
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-cda-l24-v2-launch-training-once.yml, tests/test_cda_l24_v2_packaging.py]
permissions: {contents: read}
concurrency:
  group: ntl-cda-v2-source-training-frozen-once
  cancel-in-progress: false
jobs:
  build-launch:
    # Original frozen v2 C0/C1 kernel versions failed on absent external label.
    # This workflow must never repush older slugs after source edits.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/
            tests/test_cda_l24_v2_packaging.py
            tests/test_conditional_domain_adversarial_lora24.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install fixed lightweight builder and CPU mechanism verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          test ! -e data/train.csv
          test ! -e data/test.csv
          python -m pip install -q "torch==2.6.0+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q numpy==1.26.4 pandas==2.2.3 scipy==1.15.2 scikit-learn==1.6.1 pytest kaggle==2.2.5 six==1.17.0
      - name: Verify model code and full generated runtime script before spending GPU
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/cda_l24_v2_stage_a.py scripts/build_cda_l24_v2_training_kernel.py scripts/conditional_domain_adversarial_lora24.py
          python -m pytest -q tests/test_conditional_domain_adversarial_lora24.py tests/test_cda_l24_v2_packaging.py
          for arm in C1 C0; do
            python -m scripts.build_cda_l24_v2_training_kernel --arm "$arm" --output-dir "/tmp/cda-$arm"
            python -m py_compile "/tmp/cda-$arm/kernel_main.py"
            sha256sum "/tmp/cda-$arm/kernel_main.py"
          done
          echo "ONE_SHOT_CDA_V2_PYTHON_BUILDS_PASS"
      - name: Confirm actual Kaggle GPU allocation before any push
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          kaggle quota
          kaggle datasets status kolihhan/name-that-llm-two-stage-lora24-v1-a1-checkpoint --format json
          kaggle datasets status kolihhan/name-that-llm-two-stage-lora24-v1-runtime-py313-v2 --format json
          for ref in kolihhan/ntl-cda-l24-v2-adversarial kolihhan/ntl-cda-l24-v2-control; do
            if kaggle kernels status "$ref" >/dev/null 2>&1; then
              echo "CDA_V2_EXISTING_KERNEL_REQUIRES_RECONCILIATION $ref"
              exit 1
            fi
          done
          echo "READY_FOR_ONE_SHOT_KAGGLE_GPU_TRAINING"
      - name: Push frozen C1 identity vs source-adversarial learned representation
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p /tmp/cda-C1 --accelerator NvidiaTeslaT4 --timeout 32400
          echo "CDA_C1_KAGGLE_PRIVATE_GPU_TRAINING_PUSHED"
          kaggle kernels status kolihhan/ntl-cda-l24-v2-adversarial
      - name: Push matched frozen C0 control with source head but no reverse gradient
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p /tmp/cda-C0 --accelerator NvidiaTeslaT4 --timeout 32400
          echo "CDA_C0_KAGGLE_PRIVATE_GPU_TRAINING_PUSHED"
          kaggle kernels status kolihhan/ntl-cda-l24-v2-control
      - name: Record only committed versions and job statuses
        shell: bash
        run: |
          set -euo pipefail
          for ref in kolihhan/ntl-cda-l24-v2-adversarial kolihhan/ntl-cda-l24-v2-control; do
            echo "KAGGLE_FROZEN_PRIVATE_MODEL $ref"
            kaggle kernels status "$ref"
          done
          echo "Official competition submission NOT sent by this external-only training job"
