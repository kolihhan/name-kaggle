name: NTL CDA-L24 Fixed Mechanism and Upstream Origin Proof
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-cda-source-provenance-and-tests.yml, scripts/cda_l24_stage_a.py, tests/test_cda_l24_stage_a.py]
permissions: {contents: read}
jobs:
  source_and_code:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install bounded dependencies - no model weights or training
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q "torch==2.6.0+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q "pytest" "kaggle==2.2.5" "six==1.17.0" "numpy==1.26.4" "pandas==2.2.3" "pyarrow==19.0.1" "scipy==1.15.2" "scikit-learn==1.6.1"
      - name: Verify source-conditional gradient mechanism on synthetic tensors
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/conditional_domain_adversarial_lora24.py
          python -m py_compile scripts/cda_l24_stage_a.py
          python -m pytest -q tests/test_conditional_domain_adversarial_lora24.py tests/test_cda_l24_stage_a.py
          python -m scripts.cda_l24_stage_a --help >/dev/null
          echo CDA_L24_GRL_ENGINEERING_TESTS_PASS
      - name: Read publisher ORIGINAL upstream source metadata - no model inference
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          mkdir -p /tmp/cda_source /tmp/origin_a /tmp/origin_b
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          refs=[
            ("reserved_transfer","arxitekton/ntl-claude-gen-v1",pathlib.Path('/tmp/origin_a')),
            ("potential_training","drjcfmd/ntl-generated-v2",pathlib.Path('/tmp/origin_b')),
          ]
          out={"no_model_fit":True,"no_kaggle_submission":True,
               "metadata_only":True,"origins":[]}
          for role,ref,folder in refs:
            p=subprocess.run(['kaggle','datasets','metadata',ref,'-p',str(folder)],
                             capture_output=True,text=True,timeout=75)
            record={"role":role,"ref":ref,
                    "metadata_retrievable":bool(p.returncode==0)}
            if p.returncode==0:
              files=list(folder.rglob('dataset-metadata.json'))
              if len(files)==1:
                j=json.loads(files[0].read_text())
                record.update({"id":j.get("id"),"title":j.get("title"),
                               "licenses":j.get("licenses") or j.get("license"),
                               "source_url":j.get("resources") or j.get("url"),
                               "description_present":bool(j.get("description")),
                               "keywords":j.get("keywords",[])[:12]})
              else:
                record["metadata_json_missing"]=True
            else:
              # Avoid exposing full stderr containing auth/server details.
              record["blocked_reason"]="KAGGLE_METADATA_UNAVAILABLE"
            print("ORIGINAL_SOURCE_METADATA",json.dumps(record,sort_keys=True)[:1700])
            out["origins"].append(record)
          out["both_source_manifests_accessible"]=all(
            a["metadata_retrievable"] for a in out["origins"])
          out["exact_model_version_protocol_proven"]=False
          out["training_authorized_from_this_step"]=False
          pathlib.Path('/tmp/cda_source/manifest.json').write_text(
            json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cda-l24-upstream-origin-metadata-and-test-status
          path: /tmp/cda_source/manifest.json
          if-no-files-found: warn
          retention-days: 14
