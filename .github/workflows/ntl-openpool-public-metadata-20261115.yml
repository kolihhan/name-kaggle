name: "NTL 18-class open pool bounded provenance metadata only"
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-openpool-public-metadata-20261115.yml]
permissions: {contents: read}
jobs:
  public_provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Inspect public dataset metadata, no raw text download, no fitting
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
          python - <<'PY'
          import json,subprocess,re
          ref='crtproduction/name-that-llm-open-pool'
          commands=[
            ['kaggle','datasets','files',ref,'-v'],
            ['kaggle','datasets','files',ref,'--csv'],
          ]
          for cmd in commands:
              try:
                  proc=subprocess.run(cmd,timeout=60,capture_output=True,text=True)
                  # File inventory only; never print data rows or raw dataset text.
                  lines=proc.stdout.splitlines()
                  candidates=[s.strip()[:190] for s in lines
                    if re.search(r'(?i)(name|size|\.parquet|\.csv|\.json|\.md|\.zip|\.txt)',s)]
                  print('NTL_PUBLIC_OPENPOOL_FILE_INVENTORY='+json.dumps({
                    'mode':cmd[-1], 'rc':proc.returncode,
                    'line_count':len(lines),'metadata_lines':candidates[:40],
                    'stderr_class':'command_rejected' if proc.returncode else 'none'
                  },sort_keys=True),flush=True)
              except Exception as e:
                  print('NTL_PUBLIC_OPENPOOL_METADATA_EXCEPTION='+type(e).__name__,flush=True)
          from kaggle.api.kaggle_api_extended import KaggleApi
          api=KaggleApi();api.authenticate()
          for method in ('dataset_list_files','datasets_list_files'):
              if not hasattr(api,method): continue
              try:
                  x=getattr(api,method)(ref)
                  d=x.to_dict() if hasattr(x,'to_dict') else (
                      x if isinstance(x,dict) else {})
                  files=d.get('datasetFiles',d.get('files',[]))
                  print('NTL_PUBLIC_OPENPOOL_SDK_FILES='+json.dumps({
                    'method':method,'top_keys':sorted(d.keys()),
                    'file_count':len(files),
                    'entries':[{
                      'name':str(x.get('name',''))[:120],
                      'size':x.get('totalBytes',x.get('size'))}
                      for x in files[:30] if isinstance(x,dict)]
                  },sort_keys=True),flush=True)
              except Exception as e:
                  print('NTL_PUBLIC_OPENPOOL_SDK_ERROR='+type(e).__name__,flush=True)
          print('NTL_DATASET_RAW_ROWS_EXPORTED=FALSE;TRAINING=FALSE;NO_GPU=TRUE;NO_SUBMIT=TRUE')
          PY

      - name: Download small public provenance metadata (not model passages)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ntl-openpool-manifests
          for filename in sources.csv source_protocol.csv per_model.csv removal_summary.csv; do
            kaggle datasets download -d crtproduction/name-that-llm-open-pool -f "$filename" -p /tmp/ntl-openpool-manifests --unzip >/dev/null
          done
          python - <<'PY'
          import csv,json,re
          from pathlib import Path
          root=Path('/tmp/ntl-openpool-manifests')
          safe_keys=re.compile('(source|dataset|origin|provider|license|model|label|rows|count|status|type|id)',re.I)
          allowed=set('abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_./:+@-')
          for name in ('sources.csv','source_protocol.csv','per_model.csv','removal_summary.csv'):
              with (root/name).open(newline='',encoding='utf-8-sig') as f:
                  reader=csv.DictReader(f); data=list(reader); cols=reader.fieldnames or []
              clean=[]
              for row in data[:8]:
                  entry={}
                  for key,value in row.items():
                      if key and safe_keys.search(key) and isinstance(value,str) and 0<len(value)<=120 and all(c in allowed for c in value):
                          entry[key]=value
                  clean.append(entry)
              print('NTL_OPENPOOL_PUBLIC_METADATA_TABLE='+json.dumps({
                'file':name,'rows':len(data),'columns':cols[:40],
                'public_metadata_examples':clean
              },sort_keys=True),flush=True)
          print('NTL_OPENPOOL_PRIVATE_OR_COMPETITION_DATA_READ=FALSE;NO_GPU=TRUE;NO_TRAINING=TRUE',flush=True)
          PY
