name: NTL PRO Oleg 18-model source identity provenance schema read only
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-pro-oleg-18-model-source-metadata-20261116.yml]
permissions: {contents: read}
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Inspect actual current Kaggle dataset version, file sizes and label provenance
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
          python - <<'PY'
          import csv,io,json,subprocess,tempfile
          from pathlib import Path
          slug='olegzholobov/name-that-llm-response-corpus'
          p=subprocess.run(['kaggle','datasets','files',slug,'-v','--page-size','200'],
                 capture_output=True,text=True,timeout=90,check=True)
          out=list(csv.DictReader(io.StringIO(p.stdout.lstrip('\\ufeff'))))
          if not out or len(out)>200:raise SystemExit('STOP_DATASET_FILE_LIST_AMBIGUOUS')
          with tempfile.TemporaryDirectory() as tmp:
              subprocess.run(['kaggle','datasets','metadata',slug,'-p',tmp],
                 capture_output=True,text=True,timeout=90,check=True)
              files=list(Path(tmp).glob('dataset-metadata.json'))
              if len(files)!=1:raise SystemExit('STOP_DATASET_METADATA_NOT_FOUND')
              meta=json.loads(files[0].read_text())
          report={'source':slug,'dataset_id':meta.get('id'),
                  'title':str(meta.get('title') or '')[:100],
                  'licenses':meta.get('licenses'),
                  'metadata_resource_count':len(meta.get('resources') or []),
                  'version_file_count':len(out),
                  'files':out[:75],
                  'resource_columns':[
                   {'name':str(r.get('path'))[:130],
                    'schema_fields':[str(col.get('name'))[:80] for col in
                      ((r.get('schema') or {}).get('fields') or [])][:80]}
                    for r in (meta.get('resources') or [])][:75]}
          report['metadata_id_equals_requested_slug']=(report['dataset_id']==slug)
          report['metadata_id_no']=meta.get('id_no')
          # The files and metadata were requested with the same exact dataset slug.
          # A numeric Kaggle id or version-level alias is not cause to reject
          # the authentic API-returned metadata; do not infer content identity.
          print('NTL_PRO_18MODEL_OLeg_SOURCE_VERSION_AND_FILE_LIST='+
                json.dumps(report,sort_keys=True,default=str),flush=True)
          print('NTL_PRO_SOURCE_METADATA_IS_NOT_INDEPENDENT_18LABEL_VALIDATION=TRUE',flush=True)
          print('NTL_PRO_NEW_TRAINING_FALSE;GPU_FALSE;SUBMIT_FALSE',flush=True)
          PY
