name: NTL GPU slot latest user-owned active Kaggle kernels read only
on:
  push:
    branches: [research/ntl-fable252-nameerror-recovery-20261125]
    paths: [.github/workflows/ntl-31b-gpu-slot-current-20261126.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Read actual session blocker without interfering with other notebooks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q kaggle==2.2.5 six==1.17.0
          python - <<'PY'
          import subprocess,json,csv,io
          from kaggle.api.kaggle_api_extended import KaggleApi
          api=KaggleApi();api.authenticate()
          def call(*a):
              return subprocess.run(["kaggle",*a],capture_output=True,text=True,timeout=45)
          dest="kolihhan/ntl-gemma4-31b-ensemble-no-train-20261126"
          p=call("kernels","status",dest)
          print("CANDIDATE="+json.dumps({"exit":p.returncode,"status":(p.stdout+p.stderr)[-500:]}))
          lim=api.competition_get_submission_limits("name-that-llm")
          p=call("competitions","submissions","name-that-llm","-v")
          rows=list(csv.DictReader(io.StringIO(p.stdout))) if p.returncode==0 else []
          print("LEDGER="+json.dumps({"slots":int(lim.num_allowed_now),"exit":p.returncode,"candidate":[r for r in rows if "Gemma4 31B Q4 zero-finetune" in str(r)],"active":[r for r in rows if str(r.get("status","")).upper() in ("PENDING","RUNNING","QUEUED","PROCESSING")]}))
          p=call("kernels","list","--mine","--sort-by","dateRun","-v")
          rows=list(csv.DictReader(io.StringIO(p.stdout))) if p.returncode==0 else []
          print("RECENT="+json.dumps({"exit":p.returncode,"rows":[{"ref":r.get("ref"),"last":r.get("lastRunTime")} for r in rows[:20]]}))
          for r in rows[:12]:
              if not r.get("ref"):continue
              q=call("kernels","status",r["ref"])
              print("SESSION="+json.dumps({"ref":r["ref"],"status":(q.stdout+q.stderr)[-300:]}),flush=True)
          PY
