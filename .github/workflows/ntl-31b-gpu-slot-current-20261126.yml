name: NTL GPU slot latest user-owned active Kaggle kernels read only
on:
  push:
    branches: [research/ntl-fable252-nameerror-recovery-20261125]
    paths: [.github/workflows/ntl-31b-gpu-slot-current-20261126.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Read actual session blocker without interfering with other notebooks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q kaggle==2.2.5 six==1.17.0
          python - <<'PY'
          import subprocess,json,csv,io
          for query in ["gemma","ntl","kaggle"]:
              p=subprocess.run(["kaggle","kernels","list","--mine","--search",query,"-v"],
                               capture_output=True,text=True,timeout=70)
              rows=list(csv.DictReader(io.StringIO(p.stdout.lstrip("\ufeff")))) if p.returncode==0 else []
              out=[{"ref":r.get("ref"),"status":r.get("status"),"lastRunTime":r.get("lastRunTime")}
                   for r in rows if str(r.get("ref","")).startswith("kolihhan/")]
              print("NTL31_GPU_SESSIONS="+json.dumps({"query":query,"exit":p.returncode,
                    "owner_count":len(out),"owner_kernels":out[:60]},sort_keys=True),flush=True)
          print("NTL31_READ_ONLY_NO_CANCEL_NO_PUSH=TRUE",flush=True)
          PY
