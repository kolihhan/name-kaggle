name: NTL five-fold train-time prompt contrast

on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths:
      - .github/workflows/ntl-blind-prompt-contrast-cpu.yml
      - scripts/blind_prompt_contrast.py
      - artifacts/research/blind-prompt-contrast-20261118/PREREG.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /data/train.csv
            /artifacts/phase1/folds.csv
            /scripts/blind_prompt_contrast.py
            /scripts/audit_lora24_sibling_holdout.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the CPU environment used for the local run
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3 scikit-learn==1.8.0 threadpoolctl==3.6.0 joblib==1.5.3
      - name: Run all 15 fits on the fixed grouped folds
        run: python -u -m scripts.blind_prompt_contrast --summary result/prompt-contrast-aggregate.json
      - name: Publish aggregate metrics
        uses: actions/upload-artifact@v4
        with:
          name: ntl-blind-prompt-contrast-aggregate
          path: result/prompt-contrast-aggregate.json
          if-no-files-found: error
          retention-days: 14
