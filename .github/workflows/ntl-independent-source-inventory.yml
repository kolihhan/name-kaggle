name: NTL Independent Source Inventory (Metadata Only)

on:
  push:
    branches:
      - research/sibling-information-probe-20261105
    paths:
      - scripts/audit_sibling_dataset_inventory.py
      - .github/workflows/ntl-independent-source-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/audit_sibling_dataset_inventory.py
            .github/workflows/ntl-independent-source-inventory.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: test ! -e data/train.csv && test ! -e data/test.csv
      - run: python -m pip install --disable-pip-version-check kaggle==2.2.5
      - name: List public dataset metadata, no content download
        run: python scripts/audit_sibling_dataset_inventory.py --out /tmp/sibling-source-inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: sibling-source-inventory-metadata-only
          path: /tmp/sibling-source-inventory.json
          retention-days: 14
