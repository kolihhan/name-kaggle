name: V2 Freeze Transfer Split

on:
  push:
    branches:
      - exp/prompt-invariant-contrastive-v2
    paths:
      - .github/workflows/v2-freeze-transfer-split.yml

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      POOL_DATASET: nishantdahal/ntl-handwriting-blend
      EXPECTED_POOL_SHA256: 37750e899ff6634c147daa7888bfed048e92d3fb1381fe5d21f93bf72a84e8ec
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/prompt-invariant-contrastive-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install tooling
        run: python -m pip install -q 'kaggle==2.2.5' six pandas pyarrow numpy scipy scikit-learn
      - name: Download exact frozen v1 pool
        shell: bash
        run: |
          set -euo pipefail
          : "${KAGGLE_API_TOKEN:?KAGGLE_API_TOKEN secret is not available}"
          rm -rf /tmp/v2-transfer-split && mkdir -p /tmp/v2-transfer-split
          kaggle datasets download -d "$POOL_DATASET" -f pool_v4.parquet -p /tmp/v2-transfer-split --unzip
          observed="$(sha256sum /tmp/v2-transfer-split/pool_v4.parquet | awk '{print $1}')"
          echo "pool_sha256=$observed"
          test "$observed" = "$EXPECTED_POOL_SHA256"
      - name: Freeze split without scoring any model
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from scripts.run_phase14_public_sparse import build_conservative_subset
          from scripts.prompt_invariant_v2_transfer_split import build_transfer_split

          pool_path=Path('/tmp/v2-transfer-split/pool_v4.parquet')
          raw=pd.read_parquet(pool_path)
          safe=build_conservative_subset(raw, validate_full_contract=True).reset_index(drop=True)
          split=build_transfer_split(safe)
          serial={k:v for k,v in split.items() if k not in {'train_idx','heldout_idx'}}
          serial['phase14_rows']=int(len(safe))
          serial['phase14_prompt_ids']=int(safe['prompt_id'].astype(str).nunique())
          serial['phase14_sources']=sorted(safe['source'].astype(str).unique().tolist())
          serial['phase14_source_counts']={str(k):int(v) for k,v in safe['source'].astype(str).value_counts().sort_index().items()}
          out=Path('/tmp/v2-transfer-split/TRANSFER_SPLIT_LOCK.json')
          out.write_text(json.dumps(serial,indent=2,sort_keys=True),encoding='utf-8')
          print(out.read_text())
          if not serial['valid_for_transfer_gate']:
              raise SystemExit('alternate whole-source transfer split failed frozen coverage/leakage gate')
          PY
      - name: Upload immutable split lock
        uses: actions/upload-artifact@v4
        with:
          name: v2-transfer-split-lock
          path: /tmp/v2-transfer-split/TRANSFER_SPLIT_LOCK.json
          if-no-files-found: error
          retention-days: 30
