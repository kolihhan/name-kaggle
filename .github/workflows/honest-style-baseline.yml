name: Honest style baseline

on:
  push:
    branches:
      - exp/honest-style-baseline
    paths:
      - scripts/run_honest_style_baseline.py
      - tests/test_honest_style_baseline.py
      - .github/workflows/honest-style-baseline.yml
      - artifacts/phase5/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight dependencies
        run: pip install pytest numpy pandas scipy scikit-learn
      - name: Run Phase 5 contract tests
        run: python -m pytest -q tests/test_honest_style_baseline.py

  full:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[phase5-run]')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: pip install numpy pandas scipy scikit-learn
      - name: Run honest style baseline
        run: python -m scripts.run_honest_style_baseline
      - name: Verify result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/phase5/honest_style_baseline.json').read_text())
          assert report['validation']['fold_fingerprint'] == 'bf6f47bfaeebdf817a1f7972b54deabbe5e54fb087c77753b6361970d0c9ee0d'
          assert report['data']['official_rows'] == 2699
          assert report['data']['external_rows'] == 0
          assert report['validation']['phase1_reproduction_delta'] <= 0.002
          assert len(report['candidates']['multiview_style_svm']['folds']) == 5
          print('char sanity:', report['candidates']['char_sanity']['balanced_accuracy'])
          print('multiview:', report['candidates']['multiview_style_svm']['balanced_accuracy'])
          print('delta vs Phase1:', report['delta_vs_phase1_reference'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase5-honest-style-baseline
          path: |
            artifacts/phase5/honest_style_baseline.json
            artifacts/phase5/honest_style_oof.csv
