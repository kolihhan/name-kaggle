name: "NTL Lightning 0.694 new private GPU state/output one-shot read only"
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-lightning-0694-state-readonly.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Read existing kernel state; no GPU launch, no training or competition submission
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
          TARGET=kolihhan/ntl-lightning0694-real-no-fit-nov15
          raw="$(kaggle kernels status "$TARGET" 2>&1 || true)"
          if [[ "$raw" == *KernelWorkerStatus.COMPLETE* ]]; then state=COMPLETE
          elif [[ "$raw" == *KernelWorkerStatus.RUNNING* ]]; then state=RUNNING
          elif [[ "$raw" == *KernelWorkerStatus.QUEUED* || "$raw" == *KernelWorkerStatus.PENDING* ]]; then state=QUEUED
          elif [[ "$raw" == *KernelWorkerStatus.ERROR* || "$raw" == *KernelWorkerStatus.FAILED* ]]; then state=ERROR
          else state=UNKNOWN; fi
          echo "NTL_0694_PRIVATE_ACTUAL_STATE=$state"
          # The Kaggle CLI may expose unfamiliar intermediate enums or an API error.
          # Categorize only, do not emit token-bearing untrusted HTTP bodies.
          export KERNEL_STATUS_OUTPUT="$raw"
          python - <<'PY'
          import os,json,re
          v=os.environ.get('KERNEL_STATUS_OUTPUT','')
          flags={name:bool(re.search(pat,v,re.I)) for name,pat in {
            'not_found':r'not found|404|does not exist',
            'permission_denied':r'permission|forbidden|403',
            'rate_limited':r'too many requests|429|rate limit',
            'queued_words':r'queued|pending|waiting',
            'running_words':r'running|active',
            'finished_words':r'complete|success',
            'error_words':r'error|failed|invalid',
          }.items()}
          flags['enum_tokens']=re.findall(r'KernelWorkerStatus\\.[A-Z_]+',v)[:4]
          print('NTL_0694_UNKNOWN_STATUS_DIAG='+json.dumps(flags,sort_keys=True),flush=True)
          PY
          python - <<'PY'
          import json
          from kaggle.api.kaggle_api_extended import KaggleApi
          api=KaggleApi();api.authenticate()
          try:
              s=api.kernels_status('kolihhan/ntl-lightning0694-real-no-fit-nov15')
              if hasattr(s,'to_dict'): v=s.to_dict()
              elif isinstance(s,dict):v=s
              else:v={}
              out={str(k):str(v[k])[:70] for k in ('status','status_name','version','versionNumber') if k in v}
              print('NTL_0694_PRIVATE_SDK_STATUS='+json.dumps(out,sort_keys=True),flush=True)
          except Exception as exc:
              print('NTL_0694_PRIVATE_SDK_STATUS_UNAVAILABLE='+type(exc).__name__,flush=True)
          # Compare against known previously accessible owned private kernel.
          import subprocess
          old=subprocess.run(['kaggle','kernels','status',
                  'kolihhan/ntl-areeb8-prefit-only-nov13'],
                  text=True,capture_output=True,timeout=40)
          t=old.stdout+old.stderr
          print('NTL_KAGGLE_EXISTING_PRIVATE_CONTROL='+json.dumps({
            'rc':old.returncode,'has_kernel_status':('KernelWorkerStatus.' in t),
            'permission_denied':('403' in t or 'permission' in t.lower()),
            'not_found':('404' in t or 'not found' in t.lower())
          },sort_keys=True),flush=True)
          try:
              owned=api.kernels_list(user='kolihhan',page_size=100,page=1)
              refs=[str(getattr(x,'ref','')) for x in owned]
              print('NTL_0694_OWN_KERNEL_LIST_DIAG='+json.dumps({
                'listed':len(refs),'target_found':('kolihhan/ntl-lightning0694-real-no-fit-nov15' in refs),
                'control_found':('kolihhan/ntl-areeb8-prefit-only-nov13' in refs),
              },sort_keys=True),flush=True)
          except Exception as exc:
              print('NTL_0694_OWN_KERNEL_LIST_UNAVAILABLE='+type(exc).__name__,flush=True)
          hits=[]
          for page in (1,2,3,4):
              try:
                  page_list=api.kernels_list(user='kolihhan',page_size=100,page=page)
                  for entry in page_list:
                      ref=str(getattr(entry,'ref',''))
                      if 'lightning0694' in ref or 'ntl-lightning' in ref:
                          hits.append({'ref':ref[:100], 'page':page})
              except Exception:
                  break
          print('NTL_0694_OWN_KERNEL_SEARCH_PAGES='+json.dumps(hits[:20],sort_keys=True),flush=True)
          print('NTL_0694_READ_ONLY=TRUE;NEW_GPU_TASKS=0;TRAINING=FALSE;SUBMISSION=FALSE',flush=True)
          PY
