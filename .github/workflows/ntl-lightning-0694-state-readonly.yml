name: "NTL Lightning 0.694 new private GPU state/output one-shot read only"
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-lightning-0694-state-readonly.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Read existing kernel state; no GPU launch, no training or competition submission
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
          TARGET=kolihhan/ntl-lightning0694-real-no-fit-nov15
          raw="$(kaggle kernels status "$TARGET" 2>&1 || true)"
          if [[ "$raw" == *KernelWorkerStatus.COMPLETE* ]]; then state=COMPLETE
          elif [[ "$raw" == *KernelWorkerStatus.RUNNING* ]]; then state=RUNNING
          elif [[ "$raw" == *KernelWorkerStatus.QUEUED* || "$raw" == *KernelWorkerStatus.PENDING* ]]; then state=QUEUED
          elif [[ "$raw" == *KernelWorkerStatus.ERROR* || "$raw" == *KernelWorkerStatus.FAILED* ]]; then state=ERROR
          else state=UNKNOWN; fi
          echo "NTL_0694_PRIVATE_ACTUAL_STATE=$state"
          python - <<'PY'
          import json
          from kaggle.api.kaggle_api_extended import KaggleApi
          api=KaggleApi();api.authenticate()
          try:
              s=api.kernels_status('kolihhan/ntl-lightning0694-real-no-fit-nov15')
              if hasattr(s,'to_dict'): v=s.to_dict()
              elif isinstance(s,dict):v=s
              else:v={}
              out={str(k):str(v[k])[:70] for k in ('status','status_name','version','versionNumber') if k in v}
              print('NTL_0694_PRIVATE_SDK_STATUS='+json.dumps(out,sort_keys=True),flush=True)
          except Exception as exc:
              print('NTL_0694_PRIVATE_SDK_STATUS_UNAVAILABLE='+type(exc).__name__,flush=True)
          print('NTL_0694_READ_ONLY=TRUE;NEW_GPU_TASKS=0;TRAINING=FALSE;SUBMISSION=FALSE',flush=True)
          PY
