name: NTL Short TRACE Public Offline BNB Wheel
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-short-trace-offline-bnb-wheel.yml]
permissions: {contents: read}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -q kaggle==2.2.5 six==1.17.0
      - name: Fetch official publicly released wheel and validate vendor digest
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          mkdir -p /tmp/ntl-bnb
          python -m pip download --no-deps --only-binary=:all: "bitsandbytes==0.50.2" -d /tmp/ntl-bnb
          file="/tmp/ntl-bnb/bitsandbytes-0.50.2-py3-none-manylinux_2_24_x86_64.whl"
          test -f "$file"
          echo "55348a9a4a21bfd99cf8c7b32fe67b4030ae5c2a05738e03c1747f65fa6ec283  $file" | sha256sum -c
          cat > /tmp/ntl-bnb/dataset-metadata.json <<'JSON'
          {
            "title":"NTL Short TRACE Offline bitsandbytes 0.50.2",
            "id":"kolihhan/ntl-short-trace-offline-bnb-0502",
            "licenses":[{"name":"MIT"}],
            "subtitle":"Unmodified public PyPI release wheel, SHA256-pinned for internet-disabled Kaggle code submissions",
            "description":"Public wheel from the official bitsandbytes PyPI release; no model weights, competition data or personal files."
          }
          JSON
      - name: Publish vendor wheel as public reproducible Kaggle input (no GPU)
        shell: bash
        run: |
          set -euo pipefail
          if kaggle datasets status kolihhan/ntl-short-trace-offline-bnb-0502 >/tmp/dataset_existing.log 2>&1; then
            echo "OFFLINE_BNB_DATASET_EXISTS"
            cat /tmp/dataset_existing.log
          else
            kaggle datasets create -p /tmp/ntl-bnb --public -q -t
            echo "OFFLINE_BNB_DATASET_CREATED"
            kaggle datasets status kolihhan/ntl-short-trace-offline-bnb-0502 || true
          fi
