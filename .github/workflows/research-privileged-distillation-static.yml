name: Research privileged distillation static test

on:
  push:
    branches:
      - research/v1-mechanism-audit-2026-11-03
    paths:
      - scripts/research_privileged_distillation_loss.py
      - tests/test_research_privileged_distillation_loss.py
      - .github/workflows/research-privileged-distillation-static.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test runtime
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q pytest
      - name: Run synthetic-only privileged distillation tests
        run: PYTHONPATH=. pytest -q tests/test_research_privileged_distillation_loss.py
