name: NTL Sibling Length Transfer Frozen Test
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-sibling-length-transfer-20261107.yml, scripts/audit_sibling_length_transfer_20261107.py]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/audit_sibling_length_transfer_20261107.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q kaggle==2.2.5 six==1.17.0
      - name: Frozen external transfer test no training no competition data
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN" || { echo 'No credential'; exit 2; }
          python -m py_compile scripts/audit_sibling_length_transfer_20261107.py
          mkdir -p /tmp/ntl-length
          kaggle datasets download -d zakirkhanaleemi/name-that-llm-benchmarks-proxy-generations -p /tmp/ntl-length --unzip -q
          python scripts/audit_sibling_length_transfer_20261107.py /tmp/ntl-length/ntl_proxy_generations.csv
