name: Audit NTL 0.622 Asset Version and Manifests (Read Only)

on:
  push:
    branches:
      - exp/dct-temporal-fingerprint-v3
    paths:
      - .github/workflows/audit-public-ntl-inputs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asset-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle metadata client
        run: python -m pip install --disable-pip-version-check -q 'six==1.17.0' 'kaggle==2.2.5'
      - name: Inspect 0.622 dataset versions and small JSON only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json,subprocess,re,hashlib
          from kaggle.api.kaggle_api_extended import KaggleApi
          from pathlib import Path
          refs=[
            "cosmorin/name-that-llm-0-622-reproduction-svc-cache",
            "nishantdahal/ntl-handwriting-blend",
          ]
          json_paths={
            refs[0]:["ntl620_svc_prefit_v1/manifest.json"],
            refs[1]:["lora_qwen3_14b/meta.json","lora_qwen25_14b/meta.json",
                     "deberta_v3_large/meta.json",
                     "lora_qwen3_14b/adapter/adapter_config.json",
                     "lora_qwen25_14b/adapter/adapter_config.json"],
          }
          out=[]
          root=Path("/tmp/ntl-asset-meta")
          root.mkdir(parents=True,exist_ok=True)
          api=KaggleApi();api.authenticate()
          for i,ref in enumerate(refs):
            d=root/f"asset-{i}"
            d.mkdir()
            meta=subprocess.run(["kaggle","datasets","metadata",ref,"-p",str(d)],
                                text=True,capture_output=True,timeout=50)
            files=subprocess.run(["kaggle","datasets","files",ref,"-v"],
                                 text=True,capture_output=True,timeout=50)
            mpath=d/"dataset-metadata.json"
            m={}
            if mpath.is_file():
              m=json.loads(mpath.read_text())
            names=[]
            if files.returncode==0:
              lines=files.stdout.splitlines()
              try:
                rows=list(csv.DictReader(lines))
                names=[str(row.get("name") or row.get("Name") or "") for row in rows][:80]
              except Exception:
                names=[]
            info=m.get("info",{}) if isinstance(m.get("info"),dict) else {}
            item={
              "metadata_info_keys":sorted(info.keys())[:70],
              "metadata_info_selected":{k:info.get(k) for k in
                  ("title","id","licenses","license","licenseName","currentVersionNumber",
                   "latestVersionNumber","currentVersion","isPrivate","size","totalBytes")},
              "ref":ref,"metadata_ok":meta.returncode==0,
              "files_listing_ok":files.returncode==0,
              "files_count_listed":len(names),
              "file_names":names,
              "title":m.get("title"),
              "licenses":m.get("licenses"),
              "is_private_declared":m.get("isPrivate",None),
              "metadata_keys":sorted(m.keys())[:80]
            }

            try:
              ds=api.dataset_view(ref)
              item["api_details"]={}
              for key in ("title","licenseName","currentVersionNumber","lastUpdated","isPrivate","totalBytes"):
                val=getattr(ds,key,None)
                item["api_details"][key]=val if val is None or isinstance(val,(str,int,float,bool)) else str(val)[:120]
              item["view_ok"]=True
            except Exception as exc:
              item["view_ok"]=False
              item["view_error_type"]=type(exc).__name__
            item["small_public_json"]={}
            for j,file in enumerate(json_paths[ref]):
              fd=d/f"json-{j}"
              fd.mkdir()
              p=subprocess.run(["kaggle","datasets","download","-d",ref,"-f",file,
                                "-p",str(fd),"--unzip"],
                                capture_output=True,text=True,timeout=90)
              z={"single_file_requested":file,"download_ok":p.returncode==0}
              if p.returncode==0:
                matches=list(fd.rglob(Path(file).name))
                if len(matches)==1 and matches[0].stat().st_size<2_000_000:
                  payload=matches[0].read_bytes()
                  try: data=json.loads(payload)
                  except Exception: data={}
                  z["json_ok"]=bool(data)
                  z["sha256"]=hashlib.sha256(payload).hexdigest()
                  z["selected"]={key:data.get(key) for key in (
                    ("schema","source_version","cache_sha256","source_code_sha256",
                     "sample_cache_reload_exact","fit_used_test_rows","versions")
                     if file.endswith("manifest.json") else
                    ("r","lora_alpha","lora_dropout","target_modules","base_model_name_or_path")
                     if file.endswith("adapter_config.json") else
                    ("labels","cfg","max_len")
                  )}
                else:
                  z["json_error"]="not-exactly-one-small-JSON"
              item["small_public_json"][file]=z

            # Kaggle CLI supports a read-only dataset version/status probe.
            status=subprocess.run(["kaggle","datasets","status",ref,"--format","json"],
                                  text=True,capture_output=True,timeout=40)
            item["status_ok"]=status.returncode==0
            if status.returncode==0:
              try:
                sj=json.loads(status.stdout)
                item["status_json"]=sj if isinstance(sj,(dict,list,str,int,float)) else None
              except Exception:
                item["status_parse_error"]=True
            owner,slug=ref.split("/",1)
            listing=subprocess.run(["kaggle","datasets","list","--user",owner,"-s",slug,"-v"],
                                   text=True,capture_output=True,timeout=40)
            item["list_ok"]=listing.returncode==0
            if listing.returncode==0:
              try:
                rows=list(csv.DictReader(listing.stdout.splitlines()))
                item["list_matches"]=[row for row in rows if row.get("ref")==ref][:2]
              except Exception:
                item["list_parse_error"]=True
            out.append(item)
            print("ASSET_META",ref,"metadata",item["metadata_ok"],"files",item["files_listing_ok"],"count",len(names),flush=True)
          report={
            "scope":"read_only_0.622_metadata_and_small_json",
            "small_public_json_downloaded":True,
            "official_competition_data_downloaded":False,
            "weights_downloaded":False,
            "training_or_inference_performed":False,
            "public_to_anonymous_verified":False,
            "results":out,
          }
          (root/"summary.json").write_text(json.dumps(report,indent=2,ensure_ascii=False)+"\n")
          if sum(x["files_listing_ok"] for x in out)==0:
            raise SystemExit("Dataset files enumeration unavailable; report retained")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ntl-0622-asset-meta-${{ github.run_id }}
          path: /tmp/ntl-asset-meta/summary.json
          if-no-files-found: warn
          retention-days: 30
