name: NTL Lightning 0.681 Resume Exact Saved v1 Without Training Once
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-public-lightning-0681-run-saved-v1-once.yml]
permissions: {contents: read}
concurrency:
  group: ntl-public-lightning-0681-one-submission-exactly-once
  cancel-in-progress: false
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ntl_public_lightning_0681_one_shot.py
            scripts/ntl_public_lightning_0681_resume_saved_v1.py
            artifacts/candidates/public-lightning-0681-no-neural-training-repro/CONTRACT.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Check immutable source pins and hard no-new-training gates
        shell: bash
        run: |
          set -euo pipefail
          test ! -e data/train.csv && test ! -e data/test.csv
          python -m py_compile scripts/ntl_public_lightning_0681_one_shot.py scripts/ntl_public_lightning_0681_resume_saved_v1.py
          python -m scripts.ntl_public_lightning_0681_one_shot --static-only
          grep -q 'source_meta.pop("id_no", None)' scripts/ntl_public_lightning_0681_one_shot.py
          grep -q 'NO_NEW_TRAINING: supervised Gaussian fit forbidden' scripts/ntl_public_lightning_0681_one_shot.py
          grep -q 'NO_NEW_TRAINING: Atlas train mode forbidden' scripts/ntl_public_lightning_0681_one_shot.py
          grep -q 'PINNED_ORIGINAL_SHA256' scripts/ntl_public_lightning_0681_resume_saved_v1.py
          echo PUBLIC_0681_RESUME_SAVED_V1_STATIC_AND_NO_TRAINING_PASS
  run-inference-and-submit:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ntl_public_lightning_0681_one_shot.py
            scripts/ntl_public_lightning_0681_resume_saved_v1.py
            artifacts/candidates/public-lightning-0681-no-neural-training-repro/CONTRACT.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q kaggle==2.2.5 six==1.17.0
      - name: Run exact saved Kaggle v1 as guarded pretrained inference v2 and submit only if complete
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          test ! -e data/train.csv && test ! -e data/test.csv
          python -u -m scripts.ntl_public_lightning_0681_resume_saved_v1
