name: NTL Frozen Style Cross-Source 18-Label Pivot CPU
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths:
      - .github/workflows/ntl-frozen-style-source-transfer-20261118.yml
permissions: {contents: read}
concurrency:
  group: ntl-frozen-style-source-transfer-v1
  cancel-in-progress: false
jobs:
  source_and_grouped_oof:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /data/train.csv
            /artifacts/phase1/folds.csv
            /scripts/ntl_source_robust_18_trainprep_20261117.py
            /scripts/ntl_source_shift_linear_control_20261117.py
            /scripts/ntl_prompt_residual_sparse_v1_20261118.py
            /scripts/ntl_style_source_transfer_frozen_20261118.py
            /scripts/run_style_baseline.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned CPU dependencies
        run: python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0 numpy==2.3.5 scipy==1.17.0 pandas==2.3.3 scikit-learn==1.8.0 threadpoolctl==3.6.0 pyarrow==22.0.0
      - name: Prepare frozen SHA-checked public external source-disjoint files
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          mkdir -p /tmp/ntl-style-pool
          for f in sources.csv source_protocol.csv per_model.csv ntl_open_pool.parquet; do
            kaggle datasets download -d crtproduction/name-that-llm-open-pool -f "$f" -p /tmp/ntl-style-pool --unzip -q
          done
          python -m scripts.ntl_source_robust_18_trainprep_20261117 --input /tmp/ntl-style-pool --out /tmp/ntl-style-frozen-v1
      - name: Style features vs char model and shuffled-style null on separate sources plus grouped OOF
        run: |
          set -euo pipefail
          python -m py_compile scripts/ntl_style_source_transfer_frozen_20261118.py
          python -u -m scripts.ntl_style_source_transfer_frozen_20261118 --data-dir /tmp/ntl-style-frozen-v1
      - name: Delete all downloaded public raw passages and fitted data
        if: always()
        run: |
          rm -rf /tmp/ntl-style-pool /tmp/ntl-style-frozen-v1
          echo NTL_EXTERNAL_RAW_TEXT_NOT_EXPORTED=TRUE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ntl-style-source-transfer-frozen-aggregates-only
          path: result/ntl-style-source-transfer.json
          if-no-files-found: warn
          retention-days: 30
