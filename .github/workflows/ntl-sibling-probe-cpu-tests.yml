name: NTL Sibling Probe CPU Synthetic Tests

on:
  push:
    branches:
      - research/sibling-information-probe-20261105
    paths:
      - scripts/run_sibling_information_probe.py
      - tests/test_sibling_information_probe.py
      - artifacts/research/sibling-information-probe-v1/CONTRACT.md
      - .github/workflows/ntl-sibling-probe-cpu-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/run_sibling_information_probe.py
            tests/test_sibling_information_probe.py
            artifacts/research/sibling-information-probe-v1/CONTRACT.md
            .github/workflows/ntl-sibling-probe-cpu-tests.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assert competition files were not fetched
        shell: bash
        run: |
          test ! -e data/train.csv
          test ! -e data/test.csv
          test ! -e data/sample_submission.parquet
      - name: Install CPU test requirements
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 scipy==1.16.3 scikit-learn==1.6.1 pandas==2.2.3 pytest==8.4.2
      - name: Run focused synthetic tests
        run: python -m pytest -q tests/test_sibling_information_probe.py
      - name: Compile probe
        run: python -m py_compile scripts/run_sibling_information_probe.py
