name: NTL Official Pilot Identity Gate

on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths:
      - scripts/ntl_official_pilot_input_20261121.py
      - tests/test_ntl_official_pilot_input_20261121.py
      - notebooks/ntl_wordchoice_c0_c1_c2_official_pilot_20261121.ipynb
      - .github/workflows/ntl-official-pilot-identity-cpu.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-input-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install loader test dependency
        run: python -m pip install 'pandas>=2,<3'
      - name: Test train-to-frozen fold/model alignment
        run: python -m unittest discover -s tests -p 'test_ntl_official_pilot_input_20261121.py' -v
      - name: Compile and inspect notebook wiring (NO official data)
        run: |
          python -m py_compile scripts/ntl_official_pilot_input_20261121.py
          python - <<'PY'
          import json,ast
          p='notebooks/ntl_wordchoice_c0_c1_c2_official_pilot_20261121.ipynb'
          cells=json.load(open(p))['cells']
          for c in cells:
              if c['cell_type']=='code': ast.parse(''.join(c['source']))
          body='\n'.join(''.join(c['source']) for c in cells)
          assert 'pilot(official,frozen,real_families)' in body
          assert "FOLDS=REPO/'artifacts/phase1/folds.csv'" in body
          print('NOTEBOOK_WIRING_VALID; no official data, model fit or BA measured')
          PY
