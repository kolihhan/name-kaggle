name: NTL Public 0.681 Frozen Inference Feasibility Audit (No Training)
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-stronger-public-0681-readonly-audit.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q kaggle==2.2.5 six==1.17.0
      - name: Read public 0.681 Kaggle Notebook and all assets without executing it
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python - <<'PY'
          import json,pathlib,re,subprocess,tempfile
          ref="lightningv08/0-681-qwen3-embedding-lora-qwen3-8-27b"
          with tempfile.TemporaryDirectory() as tmp:
              p=subprocess.run(["kaggle","kernels","pull",ref,"-p",tmp,"-m"],
                              capture_output=True,text=True)
              if p.returncode:
                  print("LIGHTNING0681_PULL_ERROR",json.dumps({
                      "return_code":p.returncode,"details":(p.stdout+"\n"+p.stderr)[-450:]
                  }),flush=True)
                  raise RuntimeError("public notebook unavailable")
              root=pathlib.Path(tmp)
              meta=json.loads((root/"kernel-metadata.json").read_text())
              files=sorted(root.glob("*.ipynb"))
              if len(files)!=1:raise RuntimeError("expected one public .ipynb")
              notebook=json.loads(files[0].read_text())
              codecells=["".join(c.get("source",[])) for c in notebook.get("cells",[])
                        if c.get("cell_type")=="code"]
              text="\n".join(codecells)
              checks={
                  "fit_calls":r"\.(?:fit|fit_transform|partial_fit)\s*\(",
                  "train_mode_calls":r"\.(?:train|backward|step|zero_grad)\s*\(",
                  "optimizer_construction":r"(?:torch\.optim|SFTTrainer|TrainingArguments|LoRAConfig|LoraConfig)\b",
                  "prefit_loads":r"(?:torch\.load|joblib\.load|pickle\.load|from_pretrained|load_file)\s*\(",
                  "output":r"submission\.parquet",
                  "read_train":r"train\.csv",
                  "read_hidden":r"test\.csv",
              }
              callsites=[]
              pat=re.compile(r"\.(?:fit|fit_transform|partial_fit|train|backward|step|zero_grad)\s*\(")
              for ci,source in enumerate(codecells):
                  for i,ln in enumerate(source.splitlines()):
                      if pat.search(ln):
                          callsites.append({"cell":ci,"line":i+1,
                              "site":ln.strip()[:220],"prev":source.splitlines()[i-1].strip()[:120] if i>0 else ""})
              status=subprocess.run(["kaggle","kernels","status",ref],
                        capture_output=True,text=True)
              print("LIGHTNING_0681_READONLY_AUDIT",json.dumps({
                  "ref":ref,
                  "metadata":{k:meta.get(k) for k in
                      ("id","title","is_private","enable_internet","competition_sources",
                       "dataset_sources","model_sources","kernel_type","machine_shape")},
                  "status_return_code":status.returncode,
                  "status_tail":(status.stdout+"\n"+status.stderr)[-220:],
                  "source_chars":len(text),"code_cells":len(codecells),
                  "static_patterns":{k:len(re.findall(v,text)) for k,v in checks.items()},
                  "fit_callsites":callsites[:30],
                  "written_output":"submission.parquet" in text
              },sort_keys=True),flush=True)
          PY
      - name: Verify final Lightning 0.681 training branch activation without executing code
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,re,subprocess,tempfile
          ref="lightningv08/0-681-qwen3-embedding-lora-qwen3-8-27b"
          with tempfile.TemporaryDirectory() as tmp:
              proc=subprocess.run(["kaggle","kernels","pull",ref,"-p",tmp,"-m"],
                                  capture_output=True,text=True)
              if proc.returncode:raise RuntimeError("read only source pull failed")
              n=json.loads(next(pathlib.Path(tmp).glob("*.ipynb")).read_text())
              rows=[]
              pattern=re.compile(r"train.final|train_final|gauss|\.fit\(|\.fit_transform\(|model\.train\(|optimizer|torch\.optim|subprocess\.|submission.parquet",re.I)
              for ci,cell in enumerate(n.get("cells",[])):
                  if cell.get("cell_type")!="code":continue
                  ls="".join(cell.get("source",[])).splitlines()
                  for i,line in enumerate(ls):
                      if not pattern.search(line):continue
                      if len(rows)>=115:break
                      rows.append({"cell":ci,"line":i+1,"code":line.strip()[:200]})
              print("LIGHTNING_0681_OFFICIAL_PATH_LINES",
                    json.dumps(rows[:115],sort_keys=True),flush=True)
          PY
      - name: Prove frozen Lightning 0.681 final entrypoint excludes train-final and fitting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast,json,pathlib,re,subprocess,tempfile
          ref="lightningv08/0-681-qwen3-embedding-lora-qwen3-8-27b"
          with tempfile.TemporaryDirectory() as tmp:
              pr=subprocess.run(["kaggle","kernels","pull",ref,"-p",tmp,"-m"],
                                capture_output=True,text=True)
              if pr.returncode:raise RuntimeError("read-only pull failed")
              n=json.loads(next(pathlib.Path(tmp).glob("*.ipynb")).read_text())
              cells={i:"".join(c.get("source",[])).splitlines()
                     for i,c in enumerate(n.get("cells",[])) if c.get("cell_type")=="code"}
              marks=[]
              for ci,ls in cells.items():
                  for i,ln in enumerate(ls):
                      if any(k in ln for k in ("--train-final","train_final=True","train_final=False",
                         "if training:","source-test-conditioned","fixed-no-test-redo",
                         "subprocess.Popen","--train","train-final","gaussian-train-features.npz")):
                          marks.append({"cell":ci,"line":i+1,"text":ln.strip()[:185]})
              config=None
              for ci,ls in cells.items():
                  for ln in ls:
                      if ln.startswith("CONFIG = "):
                          try: config=ast.literal_eval(ln.split("=",1)[1].strip())
                          except Exception:pass
              configview={}
              if isinstance(config,dict):
                  models=config.get("models") or []
                  configview={
                      "release_ready":config.get("RELEASE_READY"),
                      "models":len(models),
                      "gauss_weights":[(x.get("name"),x.get("gauss")) for x in models
                                         if isinstance(x,dict) and x.get("gauss",0)],
                      "train_flag":{k:v for k,v in config.items()
                          if any(q in str(k).lower() for q in ("train","redo","fixed"))}
                  }
              # Print representative short excerpts of actual entry-point commands
              excerpts={}
              for ci in (26,38,41,49):
                  ls=cells.get(ci,[])
                  snippets=[]
                  for i,ln in enumerate(ls):
                      if any(x in ln for x in ("def main","--train-final",
                           "training =","if training","subprocess.Popen",
                           "subprocess.call","ensemble.py","cmd =","command =",
                           "worker.py","--member","--train","model.train()")):
                          snippets.append({"line":i+1,
                             "context":[z.strip()[:145] for z in ls[max(0,i-2):min(len(ls),i+3)]]})
                  excerpts[str(ci)]=snippets[:18]
              print("LIGHTNING0681_STATIC_FINAL_ROUTE",json.dumps({
                  "config":configview,"branch_markers":marks[:85],
                  "entrypoint_contexts":excerpts
              },sort_keys=True),flush=True)
          PY
