name: Phase 7 gated specialist

on:
  push:
    branches:
      - exp/phase7-gated-specialist
    paths:
      - scripts/run_gated_specialist.py
      - tests/test_gated_specialist.py
      - artifacts/phase7/**
      - .github/workflows/gated-specialist.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install -r requirements.txt pytest
      - name: Run Phase 7 contract tests
        run: python -m pytest -q tests/test_gated_specialist.py

  full:
    if: contains(github.event.head_commit.message, '[phase7-run]') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install experiment dependencies
        run: pip install -r requirements.txt
      - name: Recreate permanent folds
        run: python scripts/make_folds.py
      - name: Run Phase 7 gated specialist
        run: python -m scripts.run_gated_specialist --output artifacts/phase7/gated_specialist.json --oof-output artifacts/phase7/gated_specialist_oof.csv
      - uses: actions/upload-artifact@v4
        with:
          name: phase7-gated-specialist
          path: |
            artifacts/phase7/gated_specialist.json
            artifacts/phase7/gated_specialist_oof.csv
