name: Two-stage LoRA24 Gate B checkpoint

on:
  push:
    branches:
      - exp/first-kaggle-submission
    paths:
      - .github/workflows/two-stage-lora24-gate-b-checkpoint.yml
      - tests/test_two_stage_lora24_gate_b_checkpoint_workflow.py
      - scripts/run_two_stage_lora24_gate_b.py
      - artifacts/candidates/two-stage-lora24-v1/GATE_B_CHECKPOINT_REQUEST.md
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  contract-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install checkpoint-contract test dependencies
        run: pip install -r requirements.txt pytest
      - name: Run Gate B checkpoint workflow contract tests
        run: python -m pytest -q tests/test_two_stage_lora24_gate_b_checkpoint_workflow.py tests/test_two_stage_lora24_gate_b.py

  materialize-private-checkpoint:
    if: contains(github.event.head_commit.message, '[gate-b-checkpoint]')
    needs: contract-test
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      SOURCE_RUN_ID: '41333631967'
      SOURCE_ARTIFACT_ID: '13094069155'
      SOURCE_ARTIFACT_NAME: two-stage-lora24-gate-a-a1-checkpoint
      SOURCE_ARTIFACT_DIGEST: sha256:a2c4dca4ca5de2b283e5e6806526485f0d92377584d7e621b35a717770c95e66
      DATASET_REF: kolihhan/name-that-llm-two-stage-lora24-v1-a1-checkpoint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install materialization dependencies
        run: pip install -r requirements.txt 'kaggle==2.2.5' six pytest

      - name: Download exact Gate-A A1 checkpoint artifact
        uses: actions/download-artifact@v4
        with:
          name: two-stage-lora24-gate-a-a1-checkpoint
          path: gate-b-checkpoint/source
          run-id: 41333631967
          github-token: ${{ github.token }}

      - name: Verify exact Gate-A artifact and checkpoint lineage
        shell: bash
        run: |
          set -euo pipefail
          : "${KAGGLE_API_TOKEN:?KAGGLE_API_TOKEN secret is not available}"
          actual_digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" --jq '.digest')"
          actual_name="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" --jq '.name')"
          source_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" --jq '.workflow_run.id')"
          test "$actual_digest" = "$SOURCE_ARTIFACT_DIGEST"
          test "$actual_name" = "$SOURCE_ARTIFACT_NAME"
          test "$source_run" = "$SOURCE_RUN_ID"

          test -d gate-b-checkpoint/source/adapter
          test -s gate-b-checkpoint/source/adapter/adapter_model.safetensors
          test -s gate-b-checkpoint/source/heads.safetensors
          test -s gate-b-checkpoint/source/meta.json
          test -d gate-b-checkpoint/source/tokenizer

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from scripts.run_two_stage_lora24_gate_b import validate_gate_a_checkpoint_meta

          root = Path('gate-b-checkpoint/source')
          meta = json.loads((root / 'meta.json').read_text(encoding='utf-8'))
          validate_gate_a_checkpoint_meta(meta)

          files = []
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              rel = path.relative_to(root).as_posix()
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              files.append({'path': rel, 'sha256': digest, 'size': path.stat().st_size})
          manifest_bytes = json.dumps(files, sort_keys=True, separators=(',', ':')).encode('utf-8')
          file_manifest_sha256 = hashlib.sha256(manifest_bytes).hexdigest()
          lineage = {
              'candidate': 'two-stage-lora24-v1',
              'source_run_id': 41333631967,
              'source_artifact_id': 13094069155,
              'source_artifact_name': 'two-stage-lora24-gate-a-a1-checkpoint',
              'source_artifact_digest': 'sha256:a2c4dca4ca5de2b283e5e6806526485f0d92377584d7e621b35a717770c95e66',
              'model_id': meta['model_id'],
              'model_revision': meta['model_revision'],
              'labels': meta['labels'],
              'implementation_invariants': meta['implementation_invariants'],
              'files': files,
              'file_manifest_sha256': file_manifest_sha256,
          }
          out = Path('gate-b-checkpoint/package')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'checkpoint_lineage.json').write_text(
              json.dumps(lineage, indent=2, sort_keys=True), encoding='utf-8'
          )
          print('file_manifest_sha256', file_manifest_sha256)
          print('checkpoint_file_count', len(files))
          PY

          python - <<'PY'
          import gzip
          import pathlib
          import tarfile

          source = pathlib.Path('gate-b-checkpoint/source')
          target = pathlib.Path('gate-b-checkpoint/package/a1-checkpoint.tar.gz')
          with target.open('wb') as raw:
              with gzip.GzipFile(filename='', mode='wb', fileobj=raw, mtime=0) as gz:
                  with tarfile.open(fileobj=gz, mode='w') as tar:
                      for path in sorted(p for p in source.rglob('*') if p.is_file()):
                          rel = path.relative_to(source).as_posix()
                          info = tar.gettarinfo(str(path), arcname=rel)
                          info.mtime = 0
                          info.uid = 0
                          info.gid = 0
                          info.uname = ''
                          info.gname = ''
                          with path.open('rb') as handle:
                              tar.addfile(info, handle)
          print('transport_sha256', __import__('hashlib').sha256(target.read_bytes()).hexdigest())
          PY

          python - <<'PY'
          import json
          from pathlib import Path
          payload = {
              'title': 'Name That LLM LoRA24 v1 A1 checkpoint',
              'id': 'kolihhan/name-that-llm-two-stage-lora24-v1-a1-checkpoint',
              'licenses': [{'name': 'other'}],
          }
          Path('gate-b-checkpoint/package/dataset-metadata.json').write_text(
              json.dumps(payload, indent=2), encoding='utf-8'
          )
          PY

      - name: Refuse to overwrite or version an existing checkpoint dataset
        shell: bash
        run: |
          set -euo pipefail
          existing="$(kaggle datasets list -s 'name-that-llm-two-stage-lora24-v1-a1-checkpoint' --csv 2>/dev/null || true)"
          if grep -Fq "$DATASET_REF" <<<"$existing"; then
            echo "Checkpoint dataset already exists; refusing overwrite/version: $DATASET_REF"
            exit 1
          fi

      - name: Create private immutable Kaggle checkpoint dataset
        shell: bash
        run: |
          set -euo pipefail
          kaggle datasets create -p gate-b-checkpoint/package
          echo "DATASET_REF $DATASET_REF"
          kaggle datasets files "$DATASET_REF"

      - name: Upload checkpoint lineage evidence
        uses: actions/upload-artifact@v4
        with:
          name: two-stage-lora24-gate-b-checkpoint-lineage
          path: gate-b-checkpoint/package/checkpoint_lineage.json
          retention-days: 90

  recover-existing-checkpoint-dataset:
    if: contains(github.event.head_commit.message, '[gate-b-checkpoint-recover]')
    needs: contract-test
    runs-on: ubuntu-latest
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      DATASET_REF: kolihhan/name-that-llm-two-stage-lora24-v1-a1-checkpoint
      CREATION_RUN_ID: '41373243039'
      SOURCE_RUN_ID: '41333631967'
      SOURCE_ARTIFACT_ID: '13094069155'
      SOURCE_ARTIFACT_DIGEST: sha256:a2c4dca4ca5de2b283e5e6806526485f0d92377584d7e621b35a717770c95e66
      FILE_MANIFEST_SHA256: c9ba8f77cc0ec84800a8d3508c15939396353772189c573c597bdcf223eaafc0
      TRANSPORT_SHA256: 8f3c6dabe6a3d910b80b6acafce6155ae6350dafb28b1b987f7cdb7eff7bf32a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install recovery dependencies
        run: pip install 'kaggle==2.2.5' six

      - name: Poll existing dataset until terminal status
        shell: bash
        run: |
          set -euo pipefail
          : "${KAGGLE_API_TOKEN:?KAGGLE_API_TOKEN secret is not available}"
          status=''
          for attempt in $(seq 1 60); do
            status="$(kaggle datasets status "$DATASET_REF" 2>&1 | tail -n 1 | tr '[:upper:]' '[:lower:]' | xargs)"
            echo "dataset_status attempt=${attempt} status=${status}"
            case "$status" in
              ready)
                break
                ;;
              pending)
                sleep 10
                ;;
              error)
                echo "Kaggle dataset entered error state"
                exit 1
                ;;
              *)
                echo "Unexpected Kaggle dataset status: $status"
                exit 1
                ;;
            esac
          done
          test "$status" = ready

      - name: Verify existing dataset bytes and write recovery evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gate-b-checkpoint/recovery/download
          status_json="$(kaggle datasets status "$DATASET_REF" --format json)"
          files_csv="$(kaggle datasets files "$DATASET_REF" --csv)"
          echo "$status_json"
          echo "$files_csv"
          grep -Fq 'a1-checkpoint/adapter/adapter_model.safetensors' <<<"$files_csv"
          grep -Fq 'a1-checkpoint/heads.safetensors' <<<"$files_csv"
          grep -Fq 'a1-checkpoint/meta.json' <<<"$files_csv"
          grep -Fq 'a1-checkpoint/tokenizer/' <<<"$files_csv"
          grep -Fq 'checkpoint_lineage.json' <<<"$files_csv"

          kaggle datasets download "$DATASET_REF" -p gate-b-checkpoint/recovery/download --unzip

          STATUS_JSON="$status_json" FILES_CSV="$files_csv" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('gate-b-checkpoint/recovery/download/a1-checkpoint')
          if not root.is_dir():
              raise RuntimeError(f'missing downloaded checkpoint root: {root}')
          required = [
              root / 'adapter' / 'adapter_model.safetensors',
              root / 'heads.safetensors',
              root / 'meta.json',
              root / 'tokenizer',
          ]
          for path in required:
              if not path.exists():
                  raise RuntimeError(f'missing downloaded checkpoint path: {path}')

          files = []
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              rel = path.relative_to(root).as_posix()
              files.append(
                  {
                      'path': rel,
                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                      'size': path.stat().st_size,
                  }
              )
          manifest_bytes = json.dumps(files, sort_keys=True, separators=(',', ':')).encode('utf-8')
          observed_manifest_sha256 = hashlib.sha256(manifest_bytes).hexdigest()
          expected_manifest_sha256 = os.environ['FILE_MANIFEST_SHA256']
          if observed_manifest_sha256 != expected_manifest_sha256:
              raise RuntimeError(
                  f'checkpoint manifest drift: {observed_manifest_sha256} != {expected_manifest_sha256}'
              )

          lineage_path = Path('gate-b-checkpoint/recovery/download/checkpoint_lineage.json')
          lineage = json.loads(lineage_path.read_text(encoding='utf-8'))
          if lineage.get('file_manifest_sha256') != expected_manifest_sha256:
              raise RuntimeError('downloaded lineage manifest digest mismatch')
          if int(lineage.get('source_run_id', -1)) != int(os.environ['SOURCE_RUN_ID']):
              raise RuntimeError('downloaded lineage source run mismatch')
          if int(lineage.get('source_artifact_id', -1)) != int(os.environ['SOURCE_ARTIFACT_ID']):
              raise RuntimeError('downloaded lineage source artifact mismatch')
          if lineage.get('source_artifact_digest') != os.environ['SOURCE_ARTIFACT_DIGEST']:
              raise RuntimeError('downloaded lineage source artifact digest mismatch')

          status = json.loads(os.environ['STATUS_JSON'])
          if status.get('status') != 'ready':
              raise RuntimeError(f'unexpected terminal dataset status: {status}')
          if int(status.get('current_version_number', -1)) != 1:
              raise RuntimeError(f'unexpected dataset version: {status}')

          payload = {
              'candidate': 'two-stage-lora24-v1',
              'dataset_ref': os.environ['DATASET_REF'],
              'dataset_version': 1,
              'creation_run_id': int(os.environ['CREATION_RUN_ID']),
              'source_run_id': int(os.environ['SOURCE_RUN_ID']),
              'source_artifact_id': int(os.environ['SOURCE_ARTIFACT_ID']),
              'source_artifact_digest': os.environ['SOURCE_ARTIFACT_DIGEST'],
              'file_manifest_sha256': expected_manifest_sha256,
              'observed_manifest_sha256': observed_manifest_sha256,
              'transport_sha256': os.environ['TRANSPORT_SHA256'],
              'checkpoint_file_count': len(files),
              'status': status,
              'files_csv': os.environ['FILES_CSV'],
              'attach_only_recovery': True,
              'dataset_create_called': False,
              'dataset_version_called': False,
              'gate_b_training_called': False,
          }
          out = Path('gate-b-checkpoint/recovery/checkpoint_dataset_recovery.json')
          out.write_text(json.dumps(payload, indent=2, sort_keys=True), encoding='utf-8')
          print('observed_manifest_sha256', observed_manifest_sha256)
          print('checkpoint_file_count', len(files))
          PY

      - name: Upload attach-only recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: two-stage-lora24-gate-b-checkpoint-recovery
          path: gate-b-checkpoint/recovery/checkpoint_dataset_recovery.json
          retention-days: 90
