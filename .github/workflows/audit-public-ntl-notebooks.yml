name: Audit Public NTL Submission Notebooks (Read Only)

on:
  push:
    branches:
      - exp/dct-temporal-fingerprint-v3
      - research/attribution-bottleneck-review-20261106
    paths:
      - .github/workflows/audit-public-ntl-notebooks.yml
      - scripts/audit_public_notebooks.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/audit_public_notebooks.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify public-only static audit and no official data
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/audit_public_notebooks.py
          for f in data/train.csv data/test.csv data/sample_submission.parquet; do
            test ! -e "$f" || { echo "Official data unexpectedly present"; exit 1; }
          done
      - name: Install Kaggle client (not ML runtime)
        run: python -m pip install --disable-pip-version-check -q 'six==1.17.0' 'kaggle==2.2.5'
      - name: Pull public notebook source and extract static manifests
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "research/attribution-bottleneck-review-20261106" ]; then
            python scripts/audit_public_notebooks.py --ref xiewenwei29/name-that-llm --output /tmp/ntl-public-audit/public-notebook-audit.json
          else
            python scripts/audit_public_notebooks.py --output /tmp/ntl-public-audit/public-notebook-audit.json
          fi
      - name: Preserve publicly published Apache-2 notebook source for audit
        if: ${{ always() && github.ref_name != 'research/attribution-bottleneck-review-20261106' }}
        uses: actions/upload-artifact@v4
        with:
          name: ntl-public-source-${{ github.run_id }}
          path: |
            /tmp/ntl-public-notebooks/*/*.ipynb
            /tmp/ntl-public-notebooks/*/*.py
            /tmp/ntl-public-notebooks/*/kernel-metadata.json
          if-no-files-found: warn
          retention-days: 2
      - name: Preserve sanitized manifest only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ntl-public-notebooks-readonly-${{ github.run_id }}
          path: /tmp/ntl-public-audit/public-notebook-audit.json
          if-no-files-found: warn
          retention-days: 30
