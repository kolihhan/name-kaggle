name: NTL Short-TRACE 8B One-Shot Status
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-short-trace-8b-one-shot-status.yml]
permissions: {contents: read}
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -q kaggle==2.2.5 six==1.17.0
      - name: Read only kernel status and aggregate-only result when available
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN" || { echo "MISSING_AUTH"; exit 2; }
          status="$(kaggle kernels status kolihhan/ntl-short-trace-8b-frozen-representation-pilot 2>&1 || true)"
          echo "SHORT_TRACE_STATUS $status"
          if grep -Eqi "Cannot access kernel|Permission .* denied" <<<"$status"; then
            echo "SHORT_TRACE_STATUS_QUERY_DENIED"
            exit 3
          fi
          if grep -Eqi "KernelWorkerStatus\.(ERROR|FAILED|CANCELLED)|\"error\"|\"failed\"" <<<"$status"; then
            echo "SHORT_TRACE_KERNEL_FAILED"
            kaggle kernels logs kolihhan/ntl-short-trace-8b-frozen-representation-pilot 2>&1 | tail -c 6000 || true
            exit 1
          fi
          if grep -Eqi '(^|[^a-z])(complete|completed|success|succeeded)([^a-z]|$)' <<<"$status"; then
            mkdir -p /tmp/ntl-short-trace-output
            kaggle kernels output kolihhan/ntl-short-trace-8b-frozen-representation-pilot -p /tmp/ntl-short-trace-output -q || true
            if test -f /tmp/ntl-short-trace-output/short_trace_8b_result.json; then
              python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/ntl-short-trace-output/short_trace_8b_result.json')
          d=json.loads(p.read_text())
          assert d["data_scope"]=="public_external_only"
          assert d["eligible_labels"]==17 and d["train_count"]==340 and d["heldout_count"]==204
          print("SHORT_TRACE_EXPERIMENT_AGGREGATE",json.dumps(d,sort_keys=True))
          PY
            else
              echo "SHORT_TRACE_SCORE_FILE_NOT_AVAILABLE"
              kaggle kernels logs kolihhan/ntl-short-trace-8b-frozen-representation-pilot || true
            fi
          fi
