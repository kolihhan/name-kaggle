name: NTL Public Lightning 0.681 Guarded Inference-Only Submission Once
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-public-lightning-0681-guarded-submit-once.yml]
permissions: {contents: read}
concurrency:
  group: ntl-public-lightning-0681-one-submission-exactly-once
  cancel-in-progress: false
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ntl_public_lightning_0681_one_shot.py
            artifacts/candidates/public-lightning-0681-no-neural-training-repro/CONTRACT.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Frozen contract and no-training guard compile only
        shell: bash
        run: |
          set -euo pipefail
          test ! -e data/train.csv && test ! -e data/test.csv
          python -m py_compile scripts/ntl_public_lightning_0681_one_shot.py
          python -m scripts.ntl_public_lightning_0681_one_shot --static-only
          grep -q "NO_NEW_TRAINING: supervised Gaussian fit forbidden" scripts/ntl_public_lightning_0681_one_shot.py
          grep -q "NO_NEW_TRAINING: Atlas train mode forbidden" scripts/ntl_public_lightning_0681_one_shot.py
          echo PUBLIC_0681_STATIC_NO_NEW_TRAINING_GATES_PASS
  submit:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ntl_public_lightning_0681_one_shot.py
            artifacts/candidates/public-lightning-0681-no-neural-training-repro/CONTRACT.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q kaggle==2.2.5 six==1.17.0
      - name: Frozen public pretrained weights only, one notebook + one official submission
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          test ! -e data/train.csv && test ! -e data/test.csv
          python -u -m scripts.ntl_public_lightning_0681_one_shot
