name: NTL PCCL HF exact 1.7B pinned license metadata CPU probe Nov20
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-pccl-hf-metadata-no-gpu-20261120.yml]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Inspect exact full SHA and revision-specific card license without GPU
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check huggingface-hub==0.36.0
          python - <<'PY'
          from huggingface_hub import HfApi
          import json
          model='Qwen/Qwen3-1.7B-Base'
          revision='658b6ee46470b73f3e0e04e57fc9fb7031fd7daa'
          info=HfApi().model_info(model,revision=revision)
          card=info.card_data
          r={'model':model,'requested_revision':revision,'returned_sha':info.sha,
             'same_sha':str(info.sha)==revision,
             'card_type':type(card).__name__,
             'card_license_getattr':getattr(card,'license',None),
             'card_to_dict_license':(card.to_dict().get('license') if card is not None else None),
             'top_level_license_tags':[s for s in (info.tags or []) if str(s).startswith('license:')]}
          print('NTL_PCCL_HF_PINNED_METADATA='+json.dumps(r,sort_keys=True),flush=True)
          from huggingface_hub import hf_hub_download
          from pathlib import Path
          p=Path(hf_hub_download(model,'README.md',revision=revision))
          s=p.read_text(encoding='utf-8')
          lines=[line.strip() for line in s.splitlines() if 'licens' in line.lower() or 'apache' in line.lower()]
          print('NTL_PCCL_PINNED_README_LICENSE_EVIDENCE='+json.dumps({
            'readme_bytes':len(s.encode()),'license_lines':lines[:9],
            'readme_sha256':__import__('hashlib').sha256(s.encode()).hexdigest(),
          },sort_keys=True),flush=True)
          current=HfApi().model_info(model,files_metadata=True)
          old=HfApi().model_info(model,revision=revision,files_metadata=True)
          def weights(m):
            out={}
            for s in (m.siblings or []):
              if s.rfilename.endswith('.safetensors'):
                l=getattr(s,'lfs',None)
                out[s.rfilename]=getattr(l,'sha256',None) if l else None
            return out
          evidence={'old_revision':old.sha,'current_revision':current.sha,
              'old_weight_blob_sha':weights(old),
              'current_weight_blob_sha':weights(current),
              'same_weight_file_hashes':bool(weights(old)) and weights(old)==weights(current) and all(weights(old).values()),
              'current_license_metadata':getattr(current.card_data,'license',None) if current.card_data else None,
              'current_license_tags':[t for t in (current.tags or []) if t.startswith('license:')]}
          print('NTL_PCCL_PINNED_VS_HEAD_WEIGHTS_LICENSE='+json.dumps(evidence,sort_keys=True),flush=True)
          PY
