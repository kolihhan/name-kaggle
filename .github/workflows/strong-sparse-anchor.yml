name: Reference style reproduction

on:
  push:
    branches:
      - exp/reference-style-repro
    paths:
      - scripts/run_reference_style_repro.py
      - scripts/run_strong_sparse_anchor.py
      - tests/test_reference_style_repro.py
      - .github/workflows/strong-sparse-anchor.yml
      - artifacts/phase5c/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install pytest numpy pandas scipy scikit-learn
      - name: Run reference-style contract tests
        run: python -m pytest -q tests/test_reference_style_repro.py

  full:
    if: contains(github.event.head_commit.message, '[phase5c-run]') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install experiment dependencies
        run: pip install numpy pandas scipy scikit-learn
      - name: Recreate permanent folds
        run: python scripts/make_folds.py
      - name: Run reference-style reproduction
        run: python -m scripts.run_reference_style_repro --output artifacts/phase5c/reference_style_repro.json --oof-output artifacts/phase5c/reference_style_repro_oof.csv
      - uses: actions/upload-artifact@v4
        with:
          name: phase5c-reference-style-repro
          path: |
            artifacts/phase5c/reference_style_repro.json
            artifacts/phase5c/reference_style_repro_oof.csv
