name: Strong sparse anchor

on:
  push:
    branches:
      - exp/strong-sparse-anchor
    paths:
      - scripts/run_strong_sparse_anchor.py
      - tests/test_strong_sparse_anchor.py
      - .github/workflows/strong-sparse-anchor.yml
      - artifacts/phase5b/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install pytest numpy pandas scipy scikit-learn
      - name: Run contract tests
        run: python -m pytest -q tests/test_strong_sparse_anchor.py

  full:
    if: contains(github.event.head_commit.message, '[phase5b-run]') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install experiment dependencies
        run: pip install numpy pandas scipy scikit-learn
      - name: Recreate permanent folds
        run: python scripts/make_folds.py
      - name: Run strong sparse anchor
        run: python -m scripts.run_strong_sparse_anchor --output artifacts/phase5b/strong_sparse_anchor.json --oof-output artifacts/phase5b/strong_sparse_anchor_oof.csv
      - uses: actions/upload-artifact@v4
        with:
          name: phase5b-strong-sparse-anchor
          path: |
            artifacts/phase5b/strong_sparse_anchor.json
            artifacts/phase5b/strong_sparse_anchor_oof.csv
