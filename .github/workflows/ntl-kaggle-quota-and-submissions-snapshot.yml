name: NTL Kaggle Quota and Submission Snapshot (Read Only)
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-kaggle-quota-and-submissions-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q 'kaggle==2.2.5' 'six==1.17.0'
      - name: Inspect GPU quota and official submission records only
        shell: bash
        run: |
          set -euo pipefail
          : "${KAGGLE_API_TOKEN:?Kaggle token missing}"
          echo '--- KAGGLE_QUOTA ---'
          kaggle quota || true
          echo '--- OFFICIAL_COMPETITION_RECORDS ---'
          kaggle competitions submissions name-that-llm -v -q >/tmp/ntl-submissions.csv
          python - <<'PY'
          import csv,json
          with open('/tmp/ntl-submissions.csv',newline='') as f:
              rows=list(csv.DictReader(f))
          rows.sort(key=lambda r:int(r['ref']),reverse=True)
          print('OFFICIAL_TOTAL',len(rows))
          for r in rows[:10]:
              print('OFFICIAL_SUBMISSION_RECORD',json.dumps({k:r.get(k) for k in ('ref','status','publicScore','privateScore','description','date')},sort_keys=True))
          PY

      - name: Discover current strongest public NTL Notebook candidates without model GPU
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels list --competition name-that-llm --sort-by scoreDescending --page-size 100 -v > /tmp/ntl-top-public-kernels.csv
          python - <<'PY'
          import csv,json
          with open("/tmp/ntl-top-public-kernels.csv",encoding="utf-8-sig",newline="") as f:
            rows=list(csv.DictReader(f))
          print("NTL_PUBLIC_KERNEL_LIST_COLUMNS="+json.dumps(list(rows[0]) if rows else [],sort_keys=True),flush=True)
          print("NTL_PUBLIC_KERNELS_TOP_COUNT="+str(len(rows)),flush=True)
          for rank,rec in enumerate(rows[:35],1):
            allowed={k:str(v)[:180] for k,v in rec.items() if k.lower() in
              ("ref","title","author","last_run_time","version","totalvotes","vote_count","score")}
            print("NTL_PUBLIC_KERNEL_RANKED="+json.dumps({"rank":rank,"record":allowed},sort_keys=True),flush=True)
          print("NO_TRAINING_NO_GPU_NO_SUBMISSION=TRUE",flush=True)
          PY

      - name: Compare distinct public source architectures without inference or official submission
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ntl-public-method-audit
          python - <<'PY'
          import hashlib,json,re,subprocess
          from pathlib import Path
          targets=[
            "areebbb/0-684-i-m-better",
            "kirilltym/lora-trained27-evidence-for-close-calls",
            "alexchilton/name-that-llm-0-684-all-public-what-failed",
            "heliosli/name-that-llm-lv683-a15",
            "ozertuu/0-683-0-682-qwen3-8-27b-gsq-15-mix-0-52",
          ]
          for i,ref in enumerate(targets):
            root=Path("/tmp/ntl-public-method-audit")/str(i);root.mkdir()
            p=subprocess.run(["kaggle","kernels","pull",ref,"-p",str(root),"-m"],
                             capture_output=True,text=True,timeout=120)
            if p.returncode:
              print("NTL_PUBLIC_ARCHITECTURE="+json.dumps({"ref":ref,"pull":"FAILED"},sort_keys=True),flush=True)
              continue
            nb=list(root.glob("*.ipynb"))
            meta_path=root/"kernel-metadata.json"
            if len(nb)!=1 or not meta_path.is_file():
              print("NTL_PUBLIC_ARCHITECTURE="+json.dumps({"ref":ref,"source":"NOT_ONE_NOTEBOOK"},sort_keys=True),flush=True)
              continue
            data=json.loads(nb[0].read_text())
            m=json.loads(meta_path.read_text())
            src="\n".join("".join(c.get("source",[])) if isinstance(c.get("source"),list)
                          else str(c.get("source","")) for c in data.get("cells",[]) if c.get("cell_type")=="code")
            names=[str(s) for s in (m.get("dataset_sources") or [])]
            out={"ref":ref,"notebook_sha256":hashlib.sha256(nb[0].read_bytes()).hexdigest(),
                 "code_sha256":hashlib.sha256(src.encode()).hexdigest(),
                 "total_cells":len(data.get("cells",[])),"code_lines":len(src.splitlines()),
                 "model_sources_count":len(m.get("model_sources") or []),
                 "kernel_sources_count":len(m.get("kernel_sources") or []),
                 "dataset_sources_count":len(names),"gpu":bool(m.get("enable_gpu")),
                 "internet":bool(m.get("enable_internet")),
                 "pretrained_lora_asset_refs":sum(bool(re.search("lora|adapter|pretrain|checkpoint",s,re.I)) for s in names),
                 "runtime_fit_call_sites":len(re.findall(r"\.(?:fit|fit_transform|partial_fit)\s*\(",src)),
                 "train_mode_call_sites":len(re.findall(r"\.train\s*\(",src)),
                 "train_final_mentions":src.count("train_final")+src.count("train-final"),
                 "gaussian_mentions":src.lower().count("gaussian"),
                 "embeddings_mentions":src.lower().count("embedding"),
                 "architecture_diff_from_ozertuu_unknown":True}
            print("NTL_PUBLIC_ARCHITECTURE="+json.dumps(out,sort_keys=True),flush=True)
          print("PUBLIC_SOURCE_READONLY_NO_TRAINING_NO_GPU_NO_SUBMISSION=TRUE",flush=True)
          PY

      - name: Inspect best-source data provenance, fit call sites, and public runtime before selection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ntl-audit-inference
          python - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          specs=["areebbb/0-684-i-m-better","kirilltym/lora-trained27-evidence-for-close-calls",
                 "alexchilton/name-that-llm-0-684-all-public-what-failed",
                 "heliosli/name-that-llm-lv683-a15"]
          for j,slug in enumerate(specs):
            folder=Path("/tmp/ntl-audit-inference")/str(j);folder.mkdir()
            p=subprocess.run(["kaggle","kernels","pull",slug,"-p",str(folder),"-m"],
                             capture_output=True,text=True,timeout=110)
            if p.returncode:
              print("NTL_SOURCE_METHOD_DETAIL="+json.dumps({"ref":slug,"fetch_ok":False},sort_keys=True));continue
            nb=json.loads(next(folder.glob("*.ipynb")).read_text())
            meta=json.loads((folder/"kernel-metadata.json").read_text())
            calls=[];paths=[]
            for ix,cell in enumerate(nb["cells"]):
              if cell.get("cell_type")!="code":continue
              src="".join(cell.get("source",[])) if isinstance(cell.get("source"),list) else str(cell.get("source",""))
              lines=src.splitlines()
              for li,ln in enumerate(lines):
                if re.search(r"\b(?:\.fit\s*\(|\.fit_transform\s*\(|\.train\s*\(|train_final|test_csv|submission.parquet)",ln):
                  st=" ".join(ln.strip().split())[:170]
                  if re.search(r"(?i)(secret|token|password|bearer|api_key)",st):st="<redacted>"
                  if "/kaggle/input" in st:st=re.sub(r"/kaggle/input/[^\s'\x22]+","<SOURCE_MOUNT>",st)
                  calls.append({"cell":ix,"line":li+1,"code":st})
            keys=("competition_sources","dataset_sources","kernel_sources","model_sources")
            out={"ref":slug,"notebook_cells":len(nb["cells"]),
                 "metadata_sources":{key:meta.get(key) if key!="dataset_sources" else
                         [x for x in meta.get(key,[]) if re.search("prefit|lora|model|svm|svc|gauss|artifacts",x,re.I)]
                         for key in keys},
                 "fit_training_or_input_sites":calls[:70],
                 "fit_site_count":len(calls)}
            print("NTL_SOURCE_METHOD_DETAIL="+json.dumps(out,sort_keys=True),flush=True)
            s=subprocess.run(["kaggle","kernels","status",slug],capture_output=True,text=True,timeout=60)
            print("NTL_SOURCE_PUBLISHED_KERNEL_STATUS="+json.dumps({"ref":slug,"status":" ".join((s.stdout+s.stderr).split())[:140]},sort_keys=True),flush=True)
          print("NO_NEW_TRAINING_OR_GPU_OR_OFFICIAL_SUBMISSION=TRUE",flush=True)
          PY

      - name: Identify exact supervised fitting reachability in best Areeb public candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ntl-areeb-training-reachability
          kaggle kernels pull areebbb/0-684-i-m-better -p /tmp/ntl-areeb-training-reachability -m >/tmp/ntl-areeb-source-fetch.log 2>&1
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path("/tmp/ntl-areeb-training-reachability")
          nb=json.loads(next(root.glob("*.ipynb")).read_text())
          for ix,c in enumerate(nb.get("cells",[])):
            if c.get("cell_type")!="code":continue
            raw=c.get("source",[])
            code="".join(raw) if isinstance(raw,list) else str(raw)
            lines=code.splitlines()
            hits=[i for i,line in enumerate(lines) if
                  any(s in line for s in ("_svc.fit(","_ga.fit(","def main(","__main__",
                      "emit_known_preview","preview =","TRAIN_FINAL","train_final",
                      "test.csv","train.csv","from_pretrained","competition.submit"))]
            preview=[]
            for at in hits[:30]:
              snippet=[]
              for j in range(max(0,at-5),min(len(lines),at+6)):
                x=" ".join(lines[j].strip().split())[:200]
                x=re.sub(r"/kaggle/input/[^\s'\x22]+","<INPUT_MOUNT>",x)
                if re.search("(?i)(token|password|secret|bearer|api_key)",x):x="<redacted>"
                snippet.append({"line":j+1,"code":x})
              preview.append({"target":at+1,"region":snippet})
            if hits:
              print("NTL_AREEB_CONTROL_REACHABILITY="+json.dumps({"cell":ix,"cell_lines":len(lines),
                "start_lines":[x[:120] for x in lines[:3]],"matched_regions":preview},sort_keys=True),flush=True)
          print("NTL_AREEB_NO_NEW_GPU_OR_TRAINING_OR_SUBMISSION=TRUE",flush=True)
          PY

      - name: Pin Areeb source inference switches for no-fit 8-model alternative
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ntl-areeb-switches
          kaggle kernels pull areebbb/0-684-i-m-better -p /tmp/ntl-areeb-switches -m >/dev/null 2>&1
          python - <<'PY'
          import json,re
          from pathlib import Path
          nb=json.loads(next(Path("/tmp/ntl-areeb-switches").glob("*.ipynb")).read_text())
          for i in (2,23,28,30):
            c=nb["cells"][i]; s=c.get("source",[])
            t=("".join(s) if isinstance(s,list) else str(s)).splitlines()
            if i==2:ranges=[(35,54),(100,136)]
            elif i==23:ranges=[(36,67),(165,220),(340,387),(615,635)]
            elif i==28:ranges=[(1,30)]
            else:ranges=[(1,9)]
            for start,end in ranges:
              lines=[]
              for n in range(start,min(end,len(t))+1):
                v=" ".join(t[n-1].strip().split())[:220]
                v=re.sub(r"/kaggle/input/[^\s'\x22]+","<INPUT_MOUNT>",v)
                if re.search("(?i)(token|secret|password|api_key|bearer)",v):v="<redacted>"
                lines.append({"line":n,"code":v})
              print("NTL_AREEB_EXACT_INFERENCE_SWITCHES="+json.dumps({"cell":i,"span":f"{start}-{end}","lines":lines},sort_keys=True),flush=True)
          PY


      - name: Compare Kirill Close-Calls against verified Areeb 0.683 - frozen-source DIFFERENCES ONLY
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ntl-sibling-diff/a /tmp/ntl-sibling-diff/k
          kaggle kernels pull areebbb/0-684-i-m-better -p /tmp/ntl-sibling-diff/a -m >/dev/null
          kaggle kernels pull kirilltym/lora-trained27-evidence-for-close-calls -p /tmp/ntl-sibling-diff/k -m >/dev/null
          python - <<'PY'
          from pathlib import Path
          import difflib, hashlib, json, re
          root=Path("/tmp/ntl-sibling-diff")
          specs=[("a","5d053f49005df0b2511e07bfb154faf53f22bca130761ac4a17b61aa5939cb00"),("k","00a82826c69820a4962e7dd4bd7f9c80a86529a65096f7ef5f810f577ee53ede")]
          nbs={}
          for key,sha in specs:
              p=list((root/key).glob("*.ipynb"))
              assert len(p)==1 and hashlib.sha256(p[0].read_bytes()).hexdigest()==sha,"upstream drift; stop"
              meta=json.loads((root/key/"kernel-metadata.json").read_text())
              assert meta.get("is_private") is False
              nbs[key]=json.loads(p[0].read_text())
          def cells(nb):
              return ["".join(c.get("source",[])) if isinstance(c.get("source"),list) else str(c.get("source",""))
                      for c in nb["cells"] if c.get("cell_type")=="code"]
          def module(code):
              z=[c for c in code if c.startswith("%%writefile infer.py")]
              assert len(z)==1,"inference module inventory drift"
              return z[0].splitlines()
          a,k=map(lambda x:cells(nbs[x]),("a","k"))
          aa,kk=module(a),module(k)
          ops=difflib.SequenceMatcher(None,aa,kk,autojunk=False).get_opcodes()
          changed=[(op,i1,i2,j1,j2) for op,i1,i2,j1,j2 in ops if op!="equal"]
          terms=re.compile(r"(?i)trained27|sibling|lora|logit|expert|close|weight|head|embedding|gauss|fit\s*\(|svc|rerank|new_|model_|confidence|fallback")
          sensitive=re.compile(r"(?i)token|password|secret|api[_-]?key|bearer|authorization")
          adds=[]
          for op,i1,i2,j1,j2 in changed:
              for line in kk[j1:j2]:
                  s=" ".join(line.strip().split())
                  if terms.search(s) and not sensitive.search(s) and len(adds)<40:
                      s=re.sub(r"/kaggle/input/[^\s\x22']+","<PUBLIC_INPUT_MOUNT>",s)
                      adds.append({"new_line":j1+1,"code":s[:170]})
          def allcode(z):
              return "\n".join(z)
          for key,val in [("areeb",a),("kirill",k)]:
              t=allcode(val)
              print("NTL_DISTINCT_SIBLING_STATIC_INVENTORY="+json.dumps({
                  "ref":key,"cells":len(val),"model_train_related_hits":len(re.findall(r"\.(?:fit|partial_fit|train)\s*\(",t)),
                  "trained27_mentions":t.lower().count("trained27"),"lora_mentions":t.lower().count("lora"),
                  "public_source_only":True},sort_keys=True),flush=True)
          print("NTL_KIRILL_INFER_MODULE_DIFF="+json.dumps({
              "base_lines":len(aa),"variant_lines":len(kk),
              "change_hunks":len(changed),"changed_inserted_lines":sum(j2-j1 for _,_,_,j1,j2 in changed),
              "sibling_signal_candidate_lines":adds},sort_keys=True),flush=True)
          print("NTL_NO_TRAINING_NO_GPU_NO_PUBLIC_LB_TUNING_OR_SUBMISSION=TRUE",flush=True)
          PY


      - name: Classify all five Kirill public source diffs and dependency deltas no training
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ntl-kirill-recheck/{base,variant}
          kaggle kernels pull areebbb/0-684-i-m-better -p /tmp/ntl-kirill-recheck/base -m >/dev/null
          kaggle kernels pull kirilltym/lora-trained27-evidence-for-close-calls -p /tmp/ntl-kirill-recheck/variant -m >/dev/null
          python - <<'PY'
          import hashlib,json,difflib,re
          from pathlib import Path
          roots={x:Path("/tmp/ntl-kirill-recheck")/x for x in ("base","variant")}
          expect={"base":"5d053f49005df0b2511e07bfb154faf53f22bca130761ac4a17b61aa5939cb00","variant":"00a82826c69820a4962e7dd4bd7f9c80a86529a65096f7ef5f810f577ee53ede"}
          src={};inputs={};nb={}
          for k,root in roots.items():
              p=next(root.glob("*.ipynb"))
              assert hashlib.sha256(p.read_bytes()).hexdigest()==expect[k]
              nb[k]=json.loads(p.read_text())
              inputs[k]=json.loads((root/"kernel-metadata.json").read_text())
              def extract(c):
                  v=c.get("source",[])
                  return "".join(v) if isinstance(v,list) else str(v)
              found=[extract(c) for c in nb[k]["cells"] if c.get("cell_type")=="code" and extract(c).startswith("%%writefile infer.py")]
              assert len(found)==1
              src[k]=found[0].splitlines()
          deps=["model_sources","kernel_sources","dataset_sources","competition_sources"]
          print("NTL_KIRILL_DEPENDENCY_DELTAS="+json.dumps({k:{"equal":inputs["base"].get(k)==inputs["variant"].get(k),
              "base_count":len(inputs["base"].get(k) or []),"variant_count":len(inputs["variant"].get(k) or []),
              "added":sorted(set(inputs["variant"].get(k) or [])-set(inputs["base"].get(k) or [])),
              "removed":sorted(set(inputs["base"].get(k) or [])-set(inputs["variant"].get(k) or []))}
              for k in deps},sort_keys=True),flush=True)
          sensitive=re.compile(r"(?i)token|password|secret|api[_-]?key|bearer|authorization")
          for index,(op,i1,i2,j1,j2) in enumerate(difflib.SequenceMatcher(None,src["base"],src["variant"],autojunk=False).get_opcodes(),1):
              if op=="equal":continue
              def safe(line):
                  s=" ".join(line.strip().split())
                  if sensitive.search(s):return "<redacted>"
                  return re.sub(r"/kaggle/input/[^\s\x22']+","<PUBLIC_MOUNT>",s)[:195]
              print("NTL_KIRILL_COMPLETE_DIFF_HUNK="+json.dumps({
                  "hunk":index,"kind":op,"base_lines":[i1+1,i2],"variant_lines":[j1+1,j2],
                  "added_lines":[safe(v) for v in src["variant"][j1:j2]][:45],
                  "removed_lines":[safe(v) for v in src["base"][i1:i2]][:12]},
                  ensure_ascii=False,sort_keys=True),flush=True)
          print("KIRILL_PUBLIC_SOURCE_DIFF_ONLY_ZERO_GPU_ZERO_TRAINING=TRUE",flush=True)
          PY


      - name: Check three structurally different public pretrained model stacks for new frozen sibling evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess,json,hashlib,re
          refs=["areebbb/0-684-i-m-better",
                "krshs90/qwen-embedding-clean-lora-ensemble-v14",
                "omkarpattanaik123/name-that-llm-v28-sovereign-titan-apex",
                "ruixidai/ntl-v32-apex-sovereign"]
          top=Path("/tmp/ntl-new-pretrained-public-readonly");top.mkdir(exist_ok=True)
          fetched=[]
          for index,ref in enumerate(refs):
              target=top/str(index);target.mkdir(exist_ok=True)
              p=subprocess.run(["kaggle","kernels","pull",ref,"-p",str(target),"-m"],capture_output=True,text=True,timeout=120)
              if p.returncode:
                  fetched.append((ref,None,None,None,"PULL_FAILED"))
                  continue
              nb=list(target.glob("*.ipynb"));m=target/"kernel-metadata.json"
              if len(nb)!=1 or not m.exists():
                  fetched.append((ref,None,None,None,"NOTEBOOK_OR_METADATA_MISSING"));continue
              src=json.loads(nb[0].read_text())
              meta=json.loads(m.read_text())
              if meta.get("is_private") is not False:
                  fetched.append((ref,None,None,None,"NOT_PUBLIC"));continue
              code="\n".join(("".join(c.get("source",[])) if isinstance(c.get("source"),list)
                          else str(c.get("source",""))) for c in src["cells"] if c.get("cell_type")=="code")
              fetched.append((ref,meta,code,hashlib.sha256(nb[0].read_bytes()).hexdigest(),"OK"))
          baseline=fetched[0][1]
          assert baseline is not None,"baseline not readable"
          for ref,meta,code,sha,status in fetched[1:]:
              if meta is None:
                  print("NTL_FROZEN_MODEL_NEW_SOURCE_SCAN="+json.dumps({"ref":ref,"status":status},sort_keys=True),flush=True)
                  continue
              a=set(baseline.get("model_sources") or [])
              b=set(meta.get("model_sources") or [])
              # source inventory: public metadata only, no data texts or tokens
              record={"ref":ref,"status":status,"sha256":sha,"public_only":True,
                 "model_source_count":len(b),
                 "new_model_sources":sorted(b-a)[:12],
                 "same_model_sources_as_0683":a==b,
                 "kernel_source_count":len(meta.get("kernel_sources") or []),
                 "dataset_source_count":len(meta.get("dataset_sources") or []),
                 "code_fit_callsite_count":len(re.findall(r"\.(?:fit|partial_fit|fit_transform)\s*\(",code)),
                 "code_train_mode_count":len(re.findall(r"\.train\s*\(",code)),
                 "notebook_code_cells":sum(c.get("cell_type")=="code" for c in json.loads(next((top/str(refs.index(ref))).glob("*.ipynb")).read_text())["cells"]),
                 "true_hidden_runtime_unknown":True}
              print("NTL_FROZEN_MODEL_NEW_SOURCE_SCAN="+json.dumps(record,sort_keys=True),flush=True)
          print("NTL_PUBLIC_MODEL_SCAN_READONLY_NO_GPU_NO_FIT_NO_SUBMISSION=TRUE",flush=True)
          PY
