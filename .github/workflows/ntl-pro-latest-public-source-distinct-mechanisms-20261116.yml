name: NTL 0.702 Apex and V1 actual decision logic CPU source audit
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-pro-latest-public-source-distinct-mechanisms-20261116.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Examine exact scored Apex/V1/ATLAS decision code, no inference
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
          python - <<'PY'
          import hashlib,json,subprocess,tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as root:
              p=subprocess.run(['kaggle','kernels','pull','kolihhan/ntl-0702-apex-pinned-nov18','-p',root,'-m'],capture_output=True,text=True,timeout=80)
              if p.returncode:raise RuntimeError('CANNOT_PULL_0702')
              nb=json.loads(next(Path(root).glob('*.ipynb')).read_text())
              cells=[''.join(c.get('source',[])) if isinstance(c.get('source'),list) else str(c.get('source','')) for c in nb['cells'] if c.get('cell_type')=='code']
              code='\n'.join(cells)
              assert hashlib.sha256(code.encode()).hexdigest()=='2343b692d9fbadccd585cd1f7149986f8130be4e8aacffb6cc9902d356b05ffc'
              scopes={}
              for ic in (15,23,27):
                  c=cells[ic]
                  lines=c.splitlines()
                  if ic==15:
                      selected=lines[480:616]
                  elif ic==23:
                      selected=lines[82:]
                  else:
                      selected=lines
                  scopes[str(ic)]={'name':lines[0].strip()[:80],
                                  'selected_code':[(i+(480 if ic==15 else 82 if ic==23 else 0)+1,line.strip()[:205])
                                      for i,line in enumerate(selected)]}
              print('NTL_APEX702_DIRECT_DECISION_SOURCE='+json.dumps({
                  'scored_source_sha256':'2343b692d9fbadccd585cd1f7149986f8130be4e8aacffb6cc9902d356b05ffc',
                  'actual_inference_modules':scopes,
                  'source_only_no_predictions_no_training_no_gpu_no_submission':True
              },sort_keys=True),flush=True)
          PY
