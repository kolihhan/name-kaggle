name: NTL Apex702 actual selective stage execution and decision trace CPU read-only
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-pro-latest-public-source-distinct-mechanisms-20261116.yml]
permissions: {contents: read}
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Determine actual scored V2 paths, margins, selected-row counts, and Apex output status
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
          python - <<'PY'
          import csv,io,hashlib,json,subprocess,re,tempfile
          from pathlib import Path
          ref='kolihhan/ntl-0702-apex-pinned-nov18'
          def ck(*args,timeout=80):
              return subprocess.run(['kaggle',*args],capture_output=True,text=True,timeout=timeout)
          with tempfile.TemporaryDirectory(prefix='ntl-0702-code-') as root:
              p=ck('kernels','pull',ref,'-p',root,'-m')
              if p.returncode:raise RuntimeError('CANNOT_PULL_PINNED_CHAMPION')
              paths=list(Path(root).glob('*.ipynb'))
              if len(paths)!=1:raise RuntimeError('NOTEBOOK_COUNT_INVALID')
              nb=json.loads(paths[0].read_text())
              cells=[''.join(c.get('source',[])) if isinstance(c.get('source'),list) else str(c.get('source','')) for c in nb['cells'] if c.get('cell_type')=='code']
              full='\n'.join(cells)
              if hashlib.sha256(full.encode()).hexdigest()!='2343b692d9fbadccd585cd1f7149986f8130be4e8aacffb6cc9902d356b05ffc':
                  raise RuntimeError('SCORED_CODE_DRIFT')
              # Executable top-level launch cells; no passages and no test rows printed.
              operational=[]
              for ic,c in enumerate(cells):
                  if c.startswith('%%writefile '):continue
                  lines=c.splitlines()
                  hits=[]
                  for il,line in enumerate(lines):
                      if re.search(r'!\s*python|subprocess\.|os\.system|runpy|%run|exec\s*\(|subprocess\.run|Popen|apex_postprocess|v1_stage|atlas_margin|save_final_logits|post-glm|--max-cover|--max-changed|--strength|--corrected|S10|FINAL_LOGITS|isfile|TIME|time.time|deadline|OUT',line,re.I):
                          hits.append({'line':il+1,'code':line.strip()[:235]})
                  if hits:
                      operational.append({'cell':ic,'nlines':len(lines),'callsite_lines':hits[:58]})
              log=ck('kernels','logs',ref,timeout=80)
              if log.returncode:raise RuntimeError('CANNOT_FETCH_SCORED_KERNEL_LOGS')
              raw=log.stdout+log.stderr
              selected=[]
              for line in raw.splitlines():
                  if re.search(r'APEX|V1\s|GLM.*(?:stage|row|select|cover)|ATLAS|GSQ|candidate|fallback|margin|blended|final.*(?:save|write|model)|final.*logits|score.*rows|native.*fold|submission',line,re.I):
                      # No row text. Filter any line that appears to include a generated passage.
                      if len(line)>350 or re.search(r'(^|[,{])\s*text\s*[:=]|^text[:=]|prompt\s*[:=]',line,re.I):continue
                      selected.append(line.strip()[:240])
              print('NTL_APEX702_SELECTIVE_TRACE='+json.dumps({
                  'actual_source_sha256':'2343b692d9fbadccd585cd1f7149986f8130be4e8aacffb6cc9902d356b05ffc',
                  'executed_callsite_lines':operational,
                  'scored_kernel_logs_bytes':len(raw),
                  'stage_evidence_lines_count':len(selected),
                  'stage_evidence_lines_tail':selected[-95:],
                  'no_private_row_text_logged':True,
                  'no_inference_training_gpu_or_submission':True
              },sort_keys=True),flush=True)
          PY
