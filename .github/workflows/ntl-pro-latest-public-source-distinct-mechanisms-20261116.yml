name: NTL scored Apex702 parse actual terminal stage stdout and decision CPU only
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-pro-latest-public-source-distinct-mechanisms-20261116.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Decode authentic scored notebook stdout and actual final postprocess call, never run it
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
          python - <<'PY'
          import json,subprocess,hashlib,re,tempfile
          from pathlib import Path
          ref='kolihhan/ntl-0702-apex-pinned-nov18'
          def ck(*args):
              return subprocess.run(['kaggle',*args],capture_output=True,text=True,timeout=90)
          with tempfile.TemporaryDirectory() as root:
              p=ck('kernels','pull',ref,'-p',root,'-m')
              if p.returncode:raise RuntimeError('NOTEBOOK_PULL_FAILURE')
              n=json.loads(next(Path(root).glob('*.ipynb')).read_text())
              cs=[''.join(c.get('source',[])) if isinstance(c.get('source'),list) else str(c.get('source','')) for c in n['cells'] if c.get('cell_type')=='code']
              joined='\n'.join(cs)
              if hashlib.sha256(joined.encode()).hexdigest()!='2343b692d9fbadccd585cd1f7149986f8130be4e8aacffb6cc9902d356b05ffc':raise RuntimeError('CODE_SHA_DRIFT')
              p=ck('kernels','logs',ref)
              if p.returncode:raise RuntimeError('CANNOT_ACCESS_SCORED_LOG')
              raw=p.stdout+p.stderr
              records=[]
              parse_mode='none'
              try:
                  items=json.loads(raw.lstrip('\ufeff'))
                  if isinstance(items,list):
                      records=items;parse_mode='json_array'
                  elif isinstance(items,dict):
                      records=items.get('logs',[]) or items.get('data',[]) or [];parse_mode='json_object'
              except (ValueError,TypeError):
                  # Preserve data string objects; may be NDJSON-style with comma prefixes.
                  for line in raw.splitlines():
                      line=line.strip().lstrip(',').strip()
                      if not line.startswith('{'):continue
                      try:
                          obj=json.loads(line)
                          if isinstance(obj,dict):records.append(obj)
                      except ValueError:pass
                  parse_mode='json_line_objects'
              decoded=[]
              for rec in records:
                  if not isinstance(rec,dict):continue
                  val=rec.get('data') or rec.get('message') or ''
                  if isinstance(val,str):decoded.extend(val.splitlines())
              key_pat=re.compile(r'v1|glm|apex|stage|selected|blend|candidate|GSQ|native|atlas|total\s+[0-9]|changed|postproc|logits|rows|fallback|error|finish|time[s]?|margin',re.I)
              whitelist=[]
              for line in decoded:
                  if not key_pat.search(line):continue
                  if len(line)>340 or re.search(r'(^|[,{])\s*(?:text|prompt)\s*[:=]',line,re.I):continue
                  # Allowed low-risk stage lifecycle facts only.
                  whitelist.append(line.strip()[:260])
              stage_counts={key:int(sum(bool(re.search(pat,line,re.I)) for line in whitelist)) for key,pat in {
                  'apex':r'apex','v1':r'\bv1\b','glm':r'glm','native':r'native','atlas':r'atlas',
                  'selected':r'selected|scoring\s+\d+|coverage|cover\s+\d+',
                  'changed':r'changed|correction|override','skip':r'skip|fallback',
                  'error':r'error|exception|traceback'}.items()}
              last=[(ic,c) for ic,c in enumerate(cs) if 'apply_postprocessing(' in c and not c.startswith('%%writefile')]
              final_call=[{'cell':ic,'source':c.splitlines()} for ic,c in last]
              vv=[(ic,c) for ic,c in enumerate(cs) if 'v1_stage.py' in c and not c.startswith('%%writefile')]
              print('NTL_0702_ACTUAL_SELECTIVE_SCORER='+json.dumps({
                  'raw_log_prefix':raw[:160],
                  'parsed_records':len(records),'parse_mode':parse_mode,
                  'decoded_text_lines':len(decoded),
                  'stage_matching_lines':len(whitelist),
                  'stage_counts':stage_counts,
                  'stage_lines_tail':whitelist[-90:],
                  'full_apex_call':final_call,
                  'v1_stage_calls':[{'cell':ic,'source':c.splitlines()} for ic,c in vv],
                  'no_training_no_GPU_no_submission':True
              },sort_keys=True),flush=True)
          PY
