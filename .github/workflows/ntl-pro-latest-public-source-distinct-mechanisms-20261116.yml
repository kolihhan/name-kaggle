name: NTL inspect 3 genuinely different 0.702 aggregator mechanisms
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-pro-latest-public-source-distinct-mechanisms-20261116.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Parse only public helper module signatures and model consumption, no raw passages
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
          python - <<'PY'
          import ast,hashlib,json,re,subprocess,tempfile
          from pathlib import Path
          refs={
            'tensura911/name-that-llm-apex-sota-v83':['comp_stack.py','gsq_stage.py','infer.py','native_q8.py'],
            'areebbb/0-702-read-the-fingerprints':['spec_worker.py','apex_postprocess.py'],
            'ozertuu/residual-sibling-gating-apex-better':['pngy_residual.py','infer.py','pipe.py'],
          }
          out=[]
          with tempfile.TemporaryDirectory() as root:
            for idx,(ref,target) in enumerate(refs.items()):
              dest=Path(root)/str(idx);dest.mkdir()
              p=subprocess.run(['kaggle','kernels','pull',ref,'-p',str(dest),'-m'],capture_output=True,text=True,timeout=90)
              if p.returncode:
                out.append({'ref':ref,'pull_ok':False});continue
              meta=json.loads((dest/'kernel-metadata.json').read_text())
              nb=json.loads((dest/meta['code_file']).read_text())
              code=[''.join(c.get('source',[])) if isinstance(c.get('source',[]),list) else str(c.get('source','')) for c in nb['cells'] if c.get('cell_type')=='code']
              modules={}
              for cell in code:
                if not cell.startswith('%%writefile '):continue
                name=cell.splitlines()[0].split()[-1].split('/')[-1]
                if name in target:
                  raw='\n'.join(cell.splitlines()[1:])
                  try: tree=ast.parse(raw)
                  except SyntaxError:modules[name]={'parse':'unavailable'};continue
                  defs=[n.name for n in tree.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef,ast.ClassDef))]
                  calls=[n.func.id if isinstance(n.func,ast.Name) else n.func.attr for n in ast.walk(tree) if isinstance(n,ast.Call) and isinstance(n.func,(ast.Name,ast.Attribute))]
                  module_names=sorted(set(calls))
                  module_name_hits=[x for x in module_names if any(w in x.lower() for w in ('score','logit','predict','softmax','sibling','likelihood','rank','blend','route','cluster','spectral','fit','train','torch','load','transform'))]
                  modules[name]={'sha256':hashlib.sha256(raw.encode()).hexdigest(),'functions':defs[:35],'interesting_calls':module_name_hits[:65],'line_count':len(raw.splitlines()),'model_ref_tokens':sorted(set(re.findall(r'(?:gemini|claude|gpt|qwen|glm|kimi)[a-zA-Z0-9_.-]{2,25}',raw,re.I)))[:20],
                     'has_pretrained_load':bool(re.search(r'load|from_pretrained|torch\.load|joblib',raw)),
                     'has_supervised_fit':bool(re.search(r'\.fit\(|backward\(|optimizer\.step',raw)),
                     'has_candidate_postprocess':bool(re.search(r'blend|rerank|prior|gating|threshold|temperature|weight',raw,re.I))}
              out.append({'ref':ref,'modules':modules,'full_18_label_model_assets':len(meta.get('model_sources') or []),'no_source_or_weights_logged':True})
          print('NTL_ORTHOGONAL_STRONG_CANDIDATE_MODULES='+json.dumps(out,sort_keys=True),flush=True)
          PY
