name: NTL Gemma4 public candidate five kernel completion census CPU
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-pro-latest-public-source-distinct-mechanisms-20261116.yml]
permissions: {contents: read}
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Verify five Gemma 12B notebooks' public latest execution outcomes, no running
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
          python - <<'PY'
          import json,subprocess,csv,io
          refs=['kirderf/name-that-llm-v17a','kirderf/name-that-llm-v17c','kirderf/name-that-llm-v17d','kirderf/name-that-llm-v17e','kirderf/name-that-llm-v18a']
          result=[]
          for ref in refs:
            p=subprocess.run(['kaggle','kernels','status',ref],capture_output=True,text=True,timeout=35)
            q=subprocess.run(['kaggle','kernels','files',ref,'-v','--page-size','200'],capture_output=True,text=True,timeout=35)
            rows=list(csv.DictReader(io.StringIO(q.stdout.lstrip('\ufeff')))) if q.returncode==0 else []
            names=[r.get('name','') for r in rows]
            result.append({'ref':ref,'status':(p.stdout+p.stderr).strip()[-180:],
              'status_success':p.returncode==0,
              'files_list_success':q.returncode==0,
              'visible_output_count':len(names),
              'submission_parquet_visible':'submission.parquet' in names,
              'cousin_result_visible':any('cousin' in name.lower() and (name.endswith('.csv') or name.endswith('.npz')) for name in names),
              'all_output_files_incomplete':bool('Next Page Token =' in q.stdout),
              'not_evidence_of_hidden_full_run':True})
          print('NTL_GEMMA4_PUBLIC_FIVE_TERMINAL='+json.dumps(result,sort_keys=True),flush=True)
          PY
