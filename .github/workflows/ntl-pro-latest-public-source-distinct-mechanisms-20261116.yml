name: NTL top-ranked novel expert mount discovery CPU only
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-pro-latest-public-source-distinct-mechanisms-20261116.yml]
permissions: {contents: read}
jobs:
  source_novelty:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Scan ranked published notebooks for novel model mounts; no inference
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
          python - <<'PY'
          import csv,hashlib,io,json,subprocess,tempfile
          from pathlib import Path
          base_ref="kolihhan/ntl-0702-apex-pinned-nov18"
          def call(args,timeout=70):
              return subprocess.run(['kaggle',*args],capture_output=True,text=True,timeout=timeout)
          def get_src(ref,root):
              root.mkdir(parents=True,exist_ok=True)
              x=call(['kernels','pull',ref,'-p',str(root),'-m'],timeout=90)
              if x.returncode:return None
              mpath=root/'kernel-metadata.json'
              if not mpath.exists():return None
              try:
                  metadata=json.loads(mpath.read_text())
                  fp=root/metadata['code_file']
                  code=fp.read_text(errors='replace')
                  if fp.suffix=='.ipynb':
                      nb=json.loads(code)
                      code='\n'.join(''.join(c.get('source',[])) if isinstance(c.get('source',[]),list)
                              else str(c.get('source','')) for c in nb['cells'] if c.get('cell_type')=='code')
                  return metadata,code
              except (KeyError,ValueError,OSError):return None
          with tempfile.TemporaryDirectory() as tmp:
              base=get_src(base_ref,Path(tmp)/'base')
              if base is None:raise RuntimeError('VERIFIED_CHAMPION_CANNOT_BE_READ')
              base_meta,_=base
              old={k:set(base_meta.get(k) or []) for k in ('model_sources','dataset_sources','kernel_sources')}
              ranked=[]
              for page in (1,2):
                  p=call(['kernels','list','--competition','name-that-llm','--sort-by','scoreDescending','--page-size','50','--page',str(page),'--csv'])
                  if p.returncode:raise RuntimeError('KAGGLE_PUBLIC_RANKED_LIST_FAILED')
                  ranked.extend(list(csv.DictReader(io.StringIO(p.stdout.lstrip('\ufeff')))))
              visited=set();out=[];errors=0;scanned=0
              for rank,row in enumerate(ranked[:100],start=1):
                  ref=(row.get('ref') or '').strip()
                  if not ref or ref in visited or '/' not in ref:continue
                  visited.add(ref)
                  if ref.startswith('kolihhan/'):continue
                  got=get_src(ref,Path(tmp)/str(rank))
                  if got is None:errors+=1;continue
                  m,code=got;scanned+=1
                  if 'submission.parquet' not in code:continue
                  novel={k:sorted(set(m.get(k) or [])-old[k]) for k in old}
                  if novel['model_sources']:
                      out.append({'rank_in_public_notebook_sort_not_actual_score':rank,
                        'ref':ref,'title':(row.get('title') or '')[:120],
                        'new_model_sources':novel['model_sources'][:16],
                        'new_dataset_sources':novel['dataset_sources'][:14],
                        'new_kernel_sources':novel['kernel_sources'][:12],
                        'model_count':len(m.get('model_sources') or []),
                        'dataset_count':len(m.get('dataset_sources') or []),
                        'inference_code_sha256':hashlib.sha256(code.encode()).hexdigest(),
                        'public':m.get('is_private') is False,
                        'true_scored_ba_unknown':True,'code_has_expected_output':True})
              print('NTL_RANKED_NEW_EXPERT_CANDIDATES='+json.dumps({
                'searched_rank_slots':min(100,len(ranked)),'public_code_pulled':scanned,
                'unpullable':errors,'with_new_model_mounts':len(out),
                'novel_model_mount_candidates':out[:18],
                'champion_existing_models':sorted(old['model_sources']),
                'no_GPU':True,'no_training':True,'no_competition_data_accessed':True,
                'no_submission':True,'NOT_official_kaggle_scores':True},sort_keys=True),flush=True)
          PY
