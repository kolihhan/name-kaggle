name: NTL independent GPT served-ID source access and eligibility CPU one-off
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-pro-latest-public-source-distinct-mechanisms-20261116.yml]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Test renewed public Kaggle source access; count original served GPT IDs only if freely downloadable
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0 pandas==2.3.3 pyarrow==22.0.0
          mkdir -p /tmp/ntl-new-verified-served
          python - <<'PY'
          import json,subprocess,csv,io,zipfile,os
          from pathlib import Path
          ref='maniceet/name-that-llm-openrouter-openai-generations'
          out=Path('/tmp/ntl-new-verified-served')
          def kaggle(*args):
              return subprocess.run(['kaggle',*args],text=True,capture_output=True,timeout=130)
          listing=kaggle('datasets','list','-s','name that llm openrouter openai','-v','--page-size','100')
          discovered=list(csv.DictReader(io.StringIO(listing.stdout.lstrip('\ufeff')))) if listing.returncode==0 else []
          titles=[(x.get('ref'),x.get('title','')[:80]) for x in discovered if 'maniceet' in str(x.get('ref',''))]
          files=kaggle('datasets','files',ref,'-v','--page-size','100')
          print('NTL_MANICEET_PUBLIC_ACCESS_PREFLIGHT='+json.dumps({
            'listed':titles,'dataset_list_call_ok':listing.returncode==0,
            'files_call_ok':files.returncode==0,
            'file_metadata':list(csv.DictReader(io.StringIO(files.stdout.lstrip('\ufeff'))))[:15] if files.returncode==0 else [],
            'files_failure_suffix':files.stderr[-180:] if files.returncode else '',
            'no_mirror_or_auth_bypass':True},sort_keys=True),flush=True)
          if files.returncode!=0:
              print('NTL_MANICEET_SOURCE_ACCESS=NOT_AVAILABLE_STOP; NO_TRAINING',flush=True)
              raise SystemExit(0)
          archive=kaggle('datasets','download',ref,'-p',str(out),'-q')
          if archive.returncode:
              print('NTL_MANICEET_SOURCE_DOWNLOAD_FAILED_NO_BYPASS='+json.dumps({'error_suffix':archive.stderr[-180:]}),flush=True)
              raise SystemExit(0)
          zips=list(out.glob('*.zip'))
          if len(zips)!=1:raise RuntimeError('UNEXPECTED_ARCHIVE_COUNT')
          import pandas as pd
          summary=[]
          with zipfile.ZipFile(zips[0]) as f:
              for name in f.namelist():
                  if not name.endswith(('.csv','.parquet')):continue
                  if f.getinfo(name).file_size>85_000_000:continue
                  if name.endswith('.csv'):
                      fields=list(pd.read_csv(f.open(name),nrows=0).columns)
                      selection=[x for x in fields if x.lower() in ('model','served_model','api_route','provider','source_tag','prompt_id','prompt_exact','record_id')]
                      if 'model' not in selection or 'served_model' not in selection:continue
                      df=pd.read_csv(f.open(name),usecols=selection,dtype=str).fillna('')
                  else:
                      import io,pyarrow.parquet as pq,pyarrow as pa
                      meta=pq.ParquetFile(io.BytesIO(f.read(name)))
                      selection=[x for x in meta.schema.names if x.lower() in ('model','served_model','api_route','provider','source_tag','prompt_id','prompt_exact','record_id')]
                      if 'model' not in selection or 'served_model' not in selection:continue
                      df=meta.read(columns=selection).to_pandas().fillna('')
                  targets=['gpt-5.5','gpt-5.6-luna','gpt-5.6-sol','gpt-5.6-terra','gpt-6-astra']
                  counts={}
                  for target in targets:
                      p=df[df.model.astype(str).str.lower().eq(target)]
                      actual=p.served_model.astype(str).str.lower().str.strip()
                      counts[target]={'raw_rows':len(p),
                        'nonempty_server_model_id':int(actual.ne('').sum()),
                        'server_model_exact_label':int(actual.eq(target).sum()),
                        'source_tag_counts':p.source_tag.astype(str).value_counts().to_dict() if 'source_tag' in p else {}}
                  summary.append({'file_basename':Path(name).name,'source_sha_not_logged':True,'rows_total':len(df),
                    'gpt_served_id_evidence':counts,'has_prompt_exact':'prompt_exact' in df,
                    'available_fields':selection})
          print('NTL_MANICEET_GPT_ACTUAL_SERVED_PROVENANCE='+json.dumps({
              'dataset':ref,'files_inspected':summary,'no_raw_passages_logged':True,
              'no_inference_or_training':True,'no_GPU_or_submission':True,
              'not_yet_compared_against_prefit_sources':True},sort_keys=True),flush=True)
          PY
