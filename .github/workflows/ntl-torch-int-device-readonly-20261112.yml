name: NTL Torch Integer Device Canary Result (read only)
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-torch-int-device-readonly-20261112.yml]
permissions: {contents: read}
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q 'kaggle==2.2.5' 'six==1.17.0'
      - name: Read only exact integer-device failure observation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python - <<'PY'
          import json,re,subprocess,time
          ref='kolihhan/ntl-wemm-int-device-probe-20261112'
          def run(args):
              return subprocess.run(args,capture_output=True,text=True,timeout=80)
          for i in range(30):
              p=run(['kaggle','kernels','status',ref])
              m=re.search(r'KernelWorkerStatus\.([A-Z_]+)',p.stdout+'\n'+p.stderr)
              state=m.group(1) if m else 'UNKNOWN'
              if state in ('COMPLETE','ERROR','CANCELLED','FAILED'):break
              time.sleep(6)
          print('NTL_INT_DEVICE_STATE',json.dumps({'state':state,'ref':ref,'polls':i+1}),flush=True)
          log=run(['kaggle','kernels','logs',ref])
          reports=[]
          try:
              events=json.loads(log.stdout)
              chunks=[]
              if isinstance(events,list):
                  for e in events:
                      if not isinstance(e,dict):continue
                      d=e.get('data','')
                      chunks.extend(map(str,d) if isinstance(d,list) else [str(d)])
              else:chunks=[log.stdout]
          except (TypeError,ValueError):
              chunks=[log.stdout]
          for chunk in chunks:
              for line in chunk.splitlines():
                  if 'NTL_INT_DEVICE_PROBE' not in line:continue
                  try:reports.append(json.loads(line.split('NTL_INT_DEVICE_PROBE',1)[1].strip()))
                  except ValueError:pass
          print('NTL_INT_DEVICE_FACTS',json.dumps({'reports':reports[-1:],
              'matched_count':len(reports),'logs_return_code':log.returncode},sort_keys=True),flush=True)
          PY
