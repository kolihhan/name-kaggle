name: NTL Omkar frozen-head no-training source decision ONCE
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-omkar-frozen-head-audit-once-20261113.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q kaggle==2.2.5 six==1.17.0
      - name: Inspect pinned public Kaggle source control flow and frozen classifier provenance ONLY
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ntl-omkar-frozen-audit
          kaggle kernels pull omkarpattanaik123/name-that-llm-v28-sovereign-titan-apex -p /tmp/ntl-omkar-frozen-audit -m >/dev/null
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          root=Path("/tmp/ntl-omkar-frozen-audit")
          notebooks=list(root.glob("*.ipynb"))
          assert len(notebooks)==1
          sha=hashlib.sha256(notebooks[0].read_bytes()).hexdigest()
          assert sha=="1702ea2b9c6101c78244ddbf169cc25c87fef61fcaca05937a24822e1b2e71a8", "public author SHA drift"
          nb=json.loads(notebooks[0].read_text())
          meta=json.loads((root/"kernel-metadata.json").read_text())
          def source(c):
              x=c.get("source",[])
              return "".join(x) if isinstance(x,list) else str(x)
          def norm(s):return " ".join(s.strip().split())[:220]
          danger=re.compile(r"(?i)(token|password|bearer|secret|api_key|credential)")
          def safe(s):
              if danger.search(s):return "<redacted>"
              return re.sub(r"/kaggle/input/[^\s'\x22]+", "<PUBLIC_MOUNT>",norm(s))
          selected=re.compile(r"(?i)(wemm|qwen2\.5|2\.5.*7b|gaussian|gauss\.fit|model\.fit|model\.train|logistic|ridge|lightgbm|xgboost|\.predict_proba|\.predict\(|load_file|\.joblib|\.pkl|\.pickle|\.npz|train_final|--train-final|train.*csv|test.*csv|score|weights|classifier|submission|FAST_COMMIT|pretrained|freeze|embedding|torch\.no_grad|inference_mode)")
          for ix,c in enumerate(nb["cells"]):
              if c.get("cell_type")!="code":continue
              lines=source(c).splitlines()
              hits=[(ii,safe(v)) for ii,v in enumerate(lines) if selected.search(v) and not danger.search(v)]
              if not hits:continue
              print("OMKAR_FROZEN_HEAD_CELL="+json.dumps({
                  "cell":ix,"lines":len(lines),"head":[safe(v) for v in lines[:3]],
                  "critical":[{"line":ii+1,"code":snippet} for ii,snippet in hits[:60]],
                  "more_hits_omitted":max(0,len(hits)-60)
              },sort_keys=True),flush=True)
          print("OMKAR_FROZEN_HEAD_META="+json.dumps({
             "public_ref":meta["id"],
             "kernel_sources":meta.get("kernel_sources"),
             "model_sources":meta.get("model_sources"),
             "dataset_sources":meta.get("dataset_sources"),
             "expected_sha":sha,
             "num_code_cells":sum(c.get("cell_type")=="code" for c in nb["cells"])
          },sort_keys=True),flush=True)
          print("OMKAR_STATIC_ONLY_NO_FIT_NO_TRAIN_NO_GPU_NO_SUBMISSION=TRUE",flush=True)
          PY


      - name: Classify active Omkar WeMM branch and dormant fitting helpers without execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ntl-omkar-branchgate
          kaggle kernels pull omkarpattanaik123/name-that-llm-v28-sovereign-titan-apex -p /tmp/ntl-omkar-branchgate -m >/dev/null
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          files=list(Path("/tmp/ntl-omkar-branchgate").glob("*.ipynb"))
          assert len(files)==1 and hashlib.sha256(files[0].read_bytes()).hexdigest()=="1702ea2b9c6101c78244ddbf169cc25c87fef61fcaca05937a24822e1b2e71a8"
          nb=json.loads(files[0].read_text())
          def src(c):
              a=c.get("source",[])
              return "".join(a) if isinstance(a,list) else str(a)
          sources={i:src(c) for i,c in enumerate(nb["cells"]) if c.get("cell_type")=="code"}
          def safe(x):
              if re.search(r"(?i)(password|secret|token|bearer|api.?key)",x):return "<redacted>"
              return re.sub(r"/kaggle/input/[^\s\x22']+","<PUBLIC_MOUNT>"," ".join(x.strip().split())[:210])
          def near(c,regex,n=3,max_hits=26):
              ls=sources[c].splitlines()
              hits=[j for j,x in enumerate(ls) if re.search(regex,x,re.I)]
              out=[]
              for j in hits[:max_hits]:
                  out.append({"at":j+1,"context":[{"line":k+1,"code":safe(ls[k])} for k in range(max(0,j-n),min(len(ls),j+n+1))]})
              return {"hits":len(hits),"excerpts":out}
          for cell in [44,51,53,54]:
              if cell not in sources:continue
              expr=(
                r"wemm|native_|sibling_style|\.fit\s*\(|gauss\.fit|config\[|train_texts|train_labels|run\(|fuse|finish_|score|feature|deadline|share|train_final"
                if cell==44 else
                r"trainable|load_file|\.fit\s*\(|state|head|checkpoint|torch.no_grad|autocast|predict|fold|ready|deadline|readout|config\[|share"
              )
              if cell==54:expr=r"."
              print("OMKAR_ACTIVE_PATH_AUDIT="+json.dumps({"cell":cell,**near(cell,expr,1,40)},sort_keys=True),flush=True)
          name_check={}
          for name in ("sibling_style","gauss.fit","train_final","train-final","wemm_embedding","sequence_classifiers"):
              where=[i for i,s in sources.items() if name in s]
              name_check[name]={"cells":where,"only_in_generated_module":all(sources[i].startswith("%%writefile") for i in where)}
          print("OMKAR_INVOKED_FIT_SITES="+json.dumps(name_check,sort_keys=True),flush=True)
          print("OMKAR_STATIC_PATH_ONLY_NO_FIT_NO_TRAIN_NO_GPU_NO_SUBMISSION=TRUE",flush=True)
          PY


      - name: Determine WeMM active config, finalizer supervision and deadline without evaluating any rows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ntl-omkar-actual-path
          kaggle kernels pull omkarpattanaik123/name-that-llm-v28-sovereign-titan-apex -p /tmp/ntl-omkar-actual-path -m >/dev/null
          python - <<'PY'
          import json,re,hashlib
          from pathlib import Path
          p=next(Path("/tmp/ntl-omkar-actual-path").glob("*.ipynb"))
          assert hashlib.sha256(p.read_bytes()).hexdigest()=="1702ea2b9c6101c78244ddbf169cc25c87fef61fcaca05937a24822e1b2e71a8"
          nb=json.loads(p.read_text())
          code={}
          for i,c in enumerate(nb["cells"]):
              if c.get("cell_type")!="code":continue
              v=c.get("source",[])
              code[i]="".join(v) if isinstance(v,list) else str(v)
          def safe(s):
              if re.search(r"(?i)(password|bearer|secret|api.?key|credential)",s):return "<redacted>"
              return re.sub(r"/kaggle/input/[^\s\x22']+","<PUBLIC_MOUNT>"," ".join(s.strip().split())[:250])
          print("OMKAR_REACHABLE_WEIGHTS="+json.dumps({
              "config_wemm_literal":[safe(s) for s in code[54].splitlines() if "wemm_embedding" in s],
              "config_native_literal":[safe(s) for s in code[54].splitlines() if "native_embedding" in s],
              "config_activations":[safe(s) for s in code[54].splitlines() if
                any(x in s for x in ("sequence_classifiers","additional_sparse","gsq_share","gauss","deadline","submit"))],
              "wemm_share_matches":re.findall(r"(?i)['\x22]share['\x22]\s*:\s*([.\d]+)",code[54]),
              "wemm_deadline_seconds":re.findall(r"(?i)['\x22]deadline_seconds['\x22]\s*:\s*([.\d]+)",code[54]),
          },sort_keys=True),flush=True)
          e=code[44].splitlines()
          for lo,hi in [(140,179),(179,205)]:
              print("OMKAR_ENSEMBLE_EXECUTED_STAGE="+json.dumps({"start":lo,"end":hi,
                 "lines":[{"line":i,"code":safe(e[i-1])} for i in range(lo,min(len(e),hi)+1)]},
                 sort_keys=True),flush=True)
          for i,s in code.items():
              if not s.startswith("%%writefile") or not re.search(r"(?i)(core_math|native_fusion|sibling_style)",s.splitlines()[0]):continue
              hits=[(j+1,safe(t)) for j,t in enumerate(s.splitlines())
                    if re.search(r"(?i)(def finalize|def finish_native|\.fit\s*\(|fit_transform|train_labels|train_texts|typography|sibling_style|gauss\.fit|fit\()",t)]
              print("OMKAR_FINALIZER_TRAIN_LABEL_CALLS="+json.dumps({"cell":i,"file":safe(s.splitlines()[0]),
                "hits":[{"line":j,"code":t} for j,t in hits[:35]]},sort_keys=True),flush=True)
          all_sources="\n".join(code.values())
          print("OMKAR_SOURCE_PATH_INVENTORY="+json.dumps({
              "weMM_workers_and_true_heads": "trainables.safetensors" in all_sources and "wemm_embedding_worker.py" in all_sources,
              "active_wemm_enabled_in_config": bool(re.search(r"['\x22]share['\x22]\s*:\s*0\.[0-9]*[1-9]",code[54])),
              "sequence_classifiers_explicitly_off": "CONFIG['sequence_classifiers'] = []" in code[54],
              "sibling_style_external_call_excluding_module": any("sibling_style" in s for i,s in code.items()
                  if i!=43 and not s.startswith("%%writefile")),
              "static_only":True},sort_keys=True),flush=True)
          print("OMKAR_NO_TRAIN_NO_GPU_NO_SUBMISSION_READONLY=TRUE",flush=True)
          PY
