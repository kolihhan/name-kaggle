name: NTL Public Notebook Frontier Discovery (read only)
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-public-frontier-notebooks-readonly.yml]
permissions: {contents: read}
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install Kaggle client without model runtime
        run: python -m pip install --disable-pip-version-check -q 'six==1.17.0' 'kaggle==2.2.5'
      - name: Read only public competition notebooks ordered by observed score
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python - <<'PY'
          import csv, io, json, math, re, subprocess
          COMP="name-that-llm"
          rows=[]
          for page in (1, 2, 3):
              args=["kaggle","kernels","list","--competition",COMP,
                    "--sort-by","scoreDescending","--page-size","100",
                    "--page",str(page),"-v"]
              p=subprocess.run(args,capture_output=True,text=True,timeout=90)
              if p.returncode:
                  raise RuntimeError("Kaggle kernels list failed; page="+str(page)+
                                     ",returncode="+str(p.returncode))
              clean=p.stdout.lstrip("\ufeff").strip()
              parsed=list(csv.DictReader(io.StringIO(clean)))
              if not parsed:
                  if page==1:raise RuntimeError("No public Kaggle kernels returned")
                  break
              fields=parsed[0].keys()
              print("NTL_KAGGLE_PUBLIC_FIELDS",json.dumps(sorted(fields)),flush=True)
              rows.extend(parsed)
          def score(row):
              for k in ("score","publicScore"):
                  try:
                      v=float(str(row.get(k,"")).strip())
                      if math.isfinite(v) and 0<=v<=1:return v
                  except (ValueError,TypeError):pass
              return None
          distinct={}
          for row in rows:
              ref=(row.get("ref") or row.get("kernelRef") or "").strip()
              if not re.fullmatch(r"[A-Za-z0-9_-]+/[A-Za-z0-9_-]+",ref):
                  continue
              x=score(row)
              if x is None:continue
              data={"ref":ref,"public_score":x,
                    "title":str(row.get("title") or "")[:160],
                    "author":str(row.get("author") or "")[:90],
                    "last_run":str(row.get("lastRunTime") or "")[:60]}
              if ref not in distinct or x>distinct[ref]["public_score"]:
                  distinct[ref]=data
          ordered=sorted(distinct.values(),
                        key=lambda x:(-x["public_score"],x["ref"]))
          if not ordered:
              # CLI CSV omits score despite server-side scoreDescending sorting.
              # Expose only public refs, not invented numeric scores.
              unscored=[]
              used=set()
              for row in rows:
                  ref=str(row.get("ref") or "").strip()
                  if not re.fullmatch(r"[A-Za-z0-9_-]+/[A-Za-z0-9_-]+",ref) or ref in used:
                      continue
                  used.add(ref)
                  unscored.append({"ref":ref,
                     "title":str(row.get("title") or "")[:160],
                     "author":str(row.get("author") or "")[:90]})
              print("NTL_PUBLIC_SORTED_REFS_WITHOUT_SCORES",
                    json.dumps(unscored[:75],ensure_ascii=False),flush=True)
              # Check whether the Python API object carries a score field hidden
              # by CLI. Only print explicitly allowlisted public attributes.
              try:
                  from kaggle.api.kaggle_api_extended import KaggleApi
                  api=KaggleApi();api.authenticate()
                  response=api.kernels_list(
                      competition=COMP,sort_by="scoreDescending",
                      page=1,page_size=50)
                  print("NTL_API_OBJECT_SCORE_PROBE",json.dumps([{
                      "ref":str(getattr(v,"ref","")),
                      "score":getattr(v,"score",None),
                      "public_score":getattr(v,"public_score",None),
                      "type":type(v).__name__,
                      "fields":[k for k in ("ref","score","public_score",
                              "evaluation_metric","evaluationMetric",
                              "title") if hasattr(v,k)]
                  } for v in response[:20]],default=str),flush=True)
              except Exception as e:
                  print("NTL_API_OBJECT_PROBE_BLOCKED",type(e).__name__,
                        flush=True)
              print("NTL_NO_VERIFIED_NUMERIC_SCORES",
                    "CLI did not expose a score column; refs above are only sorted metadata",
                    flush=True)
              raise SystemExit(0)
          print("NTL_FRONTIER_COUNTS",json.dumps({
              "entries_returned":len(rows),"unique_scored_notebooks":len(ordered),
              "above_0668":sum(x["public_score"]>0.668 for x in ordered),
              "at_least_068":sum(x["public_score"]>=0.680 for x in ordered)
          },sort_keys=True),flush=True)
          print("NTL_FRONTIER_TOP",json.dumps(ordered[:45],ensure_ascii=False),flush=True)
          print("NTL_FRONTIER_LICENSE_NOTE","Kaggle score metadata does not establish notebook license, input accessibility, or independent score reproduction",flush=True)
          PY
      - name: Static inspect three shortlisted public notebooks (no execution)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,re,subprocess,tempfile
          candidates=[
            "ozertuu/0-683-0-682-qwen3-8-27b-gsq-15-mix-0-52",
            "alexchilton/name-that-llm-0-682-all-public-what-failed",
            "omerfarukmerey/0-682-0-681-qwen3-8-27b-gsq-12-mix-0-50"
          ]
          for i,ref in enumerate(candidates):
              manifest={"ref":ref,"static_only":True,"model_execution":False,
                        "submission":False,"competition_data_downloaded":False}
              d=pathlib.Path(tempfile.mkdtemp(prefix="ntl-public-source-"))
              try:
                  st=subprocess.run(["kaggle","kernels","status",ref],capture_output=True,text=True,timeout=45)
                  match=re.search(r"KernelWorkerStatus\.([A-Z_]+)",st.stdout+"\n"+st.stderr)
                  manifest["upstream_kernel_status"]=match.group(1) if match else "UNKNOWN"
                  manifest["status_rc"]=st.returncode
                  p=subprocess.run(["kaggle","kernels","pull",ref,"-p",str(d),"-m"],capture_output=True,text=True,timeout=120)
                  if p.returncode:
                      manifest["pulled"]=False
                      manifest["pull_returncode"]=p.returncode
                  else:
                      manifest["pulled"]=True
                      mdfile=d/"kernel-metadata.json"
                      md=json.loads(mdfile.read_text()) if mdfile.is_file() else {}
                      manifest["inputs"]={k:{"count":len(md.get(k) or []),
                                               "refs":(md.get(k) or [])[:12]}
                                          for k in ("competition_sources","dataset_sources","model_sources","kernel_sources")}
                      manifest["settings"]={k:md.get(k) for k in (
                          "id","is_private","enable_internet","machine_shape",
                          "kernel_type","enable_gpu","enable_tpu")}
                      notebooks=list(d.glob("*.ipynb"))
                      manifest["notebook_count"]=len(notebooks)
                      if len(notebooks)==1:
                          b=notebooks[0].read_bytes()
                          nb=json.loads(b)
                          code="\n".join("".join(c.get("source",[])) if isinstance(c.get("source",[]),list)
                                else str(c.get("source","")) for c in nb.get("cells",[])
                                if c.get("cell_type")=="code")
                          manifest["sha256"]=hashlib.sha256(b).hexdigest()
                          manifest["code_bytes"]=len(code.encode())
                          manifest["code_cells"]=sum(c.get("cell_type")=="code" for c in nb.get("cells",[]))
                          # These are string markers, NOT evidence that fit/train
                          # actually executes on the hidden scoring path.
                          manifest["markers"]={
                              k:len(re.findall(pattern,code,re.I))
                              for k,pattern in {
                                  "fit_calls":r"\.fit\s*\(",
                                  "fit_transform_calls":r"\.fit_transform\s*\(",
                                  "train_calls":r"\.train\s*\(",
                                  "backward_calls":r"\.backward\s*\(",
                                  "submission_parquet":r"submission\.parquet",
                                  "gsq_references":r"\bGSQ\b",
                                  "qwen27_references":r"27b",
                              }.items()}
              except Exception as e:
                  manifest["inspection_blocked"]=type(e).__name__
              print("NTL_PUBLIC_CANDIDATE_STATIC_AUDIT",
                    json.dumps(manifest,ensure_ascii=False,sort_keys=True),flush=True)
          PY
      - name: Compare candidate code cells and preview artifacts (read only)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,subprocess,tempfile
          refs={
            "oz":"ozertuu/0-683-0-682-qwen3-8-27b-gsq-15-mix-0-52",
            "omer":"omerfarukmerey/0-682-0-681-qwen3-8-27b-gsq-12-mix-0-50",
            "alex":"alexchilton/name-that-llm-0-682-all-public-what-failed",
          }
          cells={}
          for key,ref in refs.items():
              dest=pathlib.Path(tempfile.mkdtemp(prefix="ntl-comparison-"))
              p=subprocess.run(["kaggle","kernels","pull",ref,"-p",str(dest),"-m"],
                               capture_output=True,text=True,timeout=120)
              if p.returncode:
                  print("NTL_CODE_DIFF_BLOCKED",json.dumps({"name":key,"returncode":p.returncode}),flush=True)
                  continue
              nbfile=list(dest.glob("*.ipynb"))
              if len(nbfile)!=1:continue
              nb=json.loads(nbfile[0].read_text())
              cells[key]=["".join(c.get("source",[])) if isinstance(c.get("source",[]),list)
                          else str(c.get("source",""))
                          for c in nb.get("cells",[]) if c.get("cell_type")=="code"]
              out=subprocess.run(["kaggle","kernels","files",ref,"-v"],
                                 capture_output=True,text=True,timeout=60)
              print("NTL_PREVIEW_FILE_EXISTS",json.dumps({"name":key,
                  "status_code":out.returncode,
                  "submission_parquet_listed":out.returncode==0 and
                    "submission.parquet" in out.stdout}),flush=True)
          for left,right in (("oz","omer"),("oz","alex")):
              if left not in cells or right not in cells:continue
              a,b=cells[left],cells[right]
              shared=sum(hashlib.sha256(x.encode()).digest()==hashlib.sha256(y.encode()).digest()
                         for x,y in zip(a,b))
              changed=[i for i,(x,y) in enumerate(zip(a,b)) if x!=y]
              print("NTL_CODE_CELL_DIFF",json.dumps({
                "pair":[left,right],"cells_a":len(a),"cells_b":len(b),
                "exact_same_index_cells":shared,
                "changed_cell_indexes":changed[:35],
                "changed_cell_count":len(changed),
                "bytes_a":sum(len(x.encode()) for x in a),
                "bytes_b":sum(len(x.encode()) for x in b),
                "common_prefix_chars":sum(1 for _ in []),
              }),flush=True)
          PY
