name: NTL WeMM Dual Embedding Frozen Candidate Preflight (NO GPU)
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths:
      - .github/workflows/ntl-wemm-frozen-source-preflight.yml
      - scripts/ntl_dual_embedding_wemm_preview.py
      - artifacts/candidates/dual-embedding-wemm-frozen-v1/CONTRACT.md
permissions: {contents: read}
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/ntl_dual_embedding_wemm_preview.py
            artifacts/candidates/dual-embedding-wemm-frozen-v1/CONTRACT.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: No official competition data in public runner
        shell: bash
        run: |
          set -euo pipefail
          test ! -e data/train.csv
          test ! -e data/test.csv
          test ! -e data/sample_submission.parquet
          python -m py_compile scripts/ntl_dual_embedding_wemm_preview.py
      - name: Install Kaggle CLI and notebook validator only
        run: python -m pip install -q --disable-pip-version-check 'kaggle==2.2.5' 'six==1.17.0' 'nbformat==5.10.4'
      - name: Static contract gate and frozen public source guard check
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python scripts/ntl_dual_embedding_wemm_preview.py --static-only
          python scripts/ntl_dual_embedding_wemm_preview.py --source-preflight
          echo NTL_WEMM_SOURCE_PREFLIGHT_VERIFIED_NO_MODEL_TRAINING_NO_SUBMISSION
