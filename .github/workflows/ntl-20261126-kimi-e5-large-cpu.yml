name: NTL real Kimi-GPT frozen E5-large cross-source probe CPU only
on:
  push:
    branches: [research/ntl-fable252-nameerror-recovery-20261125]
    paths: [.github/workflows/ntl-20261126-kimi-e5-large-cpu.yml]
permissions: {contents: read}
concurrency: {group: ntl-e5-kimi-gpt-cpu-20261126-once, cancel-in-progress: false}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_ENABLE_HF_TRANSFER: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/ntl_kimi_e5_frozen_transfer_20261126.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install frozen CPU inference dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q --disable-pip-version-check 'transformers==4.46.3' 'numpy==1.26.4' 'pandas==2.2.3' 'kaggle==2.2.5' 'six==1.17.0' 'safetensors==0.7.0'
          python -m py_compile scripts/ntl_kimi_e5_frozen_transfer_20261126.py
          python - <<'PY'
          import torch
          assert not torch.cuda.is_available()
          print('NTL_E5_CPU_ONLY_VERIFIED=TRUE',flush=True)
          PY
      - name: Frozen 335M E5 Kimi/GPT train/holdout transfer with shuffle control
        shell: bash
        run: |
          set -euo pipefail
          test ! -f data/train.csv
          test ! -f data/test.csv
          python scripts/ntl_kimi_e5_frozen_transfer_20261126.py
          echo NTL_E5_NO_OFFICIAL_SUBMISSION_NO_GPU_NO_FITTING=TRUE
