name: NTL Submission 58008463 Live Status Read Only
on:
  push:
    branches: [exp/dct-temporal-fingerprint-v3]
    paths: [.github/workflows/ntl-v47-score-check-20261105-1517.yml]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q 'kaggle==2.2.5' 'six==1.17.0'
      - name: Read live official Kaggle submission (no new submission)
        shell: bash
        run: |
          set -euo pipefail
          kaggle competitions submission 58008463
          kaggle competitions submissions name-that-llm -v -q > /tmp/ntl-live.csv
          python - <<'PY'
          import csv,json
          rows=list(csv.DictReader(open('/tmp/ntl-live.csv',newline='')))
          matching=[x for x in rows if x.get('ref')=='58008463']
          print('TOTAL_SUBMISSIONS',len(rows))
          assert len(matching)==1, 'Submission ref 58008463 missing'
          print('TARGET_STATUS',json.dumps(matching[0],sort_keys=True),flush=True)
          print('LATEST_SUBMISSION_REF',max(int(x['ref']) for x in rows),flush=True)
          PY
