name: NTL WEMM CUDA Bootstrap V3 Real Path Status Read-Only
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-wemm-q14-v3-status-readonly-20261112.yml]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check -q 'kaggle==2.2.5' 'six==1.17.0'
      - name: Diagnose owned runtime environment and recover fallback evidence without execution
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python - <<'PY'
          import ast, csv, hashlib, json, os, pathlib, re, subprocess, tempfile
          def call(args,timeout=120):
              return subprocess.run(args,text=True,capture_output=True,timeout=timeout)
          def emit(key,data):
              print(key,json.dumps(data,sort_keys=True),flush=True)
          def text(cell):
              v=cell.get("source","")
              return "".join(v) if isinstance(v,list) else str(v)
          def kind(value):
              if isinstance(value,ast.Constant):
                  if value.value in ("","0","1","0,1","-1","cpu","cuda"):return repr(value.value)
                  return type(value.value).__name__
              if isinstance(value,ast.Name):return "variable:"+value.id
              if isinstance(value,ast.Call):return "call"
              return type(value).__name__
          ref="kolihhan/ntl-wemm-q14-cuda-bootstrap-smoke-v3"
          tmp=pathlib.Path(tempfile.mkdtemp(prefix="existing-runtime-evidence-"))
          pulled=call(["kaggle","kernels","pull",ref,"-p",str(tmp),"-m"])
          if pulled.returncode:raise RuntimeError("Owned notebook unavailable; no retry")
          nb=json.loads(next(tmp.glob("*.ipynb")).read_text())
          cells=[text(c) for c in nb["cells"] if c.get("cell_type")=="code"]
          modules={}
          for i,cell in enumerate(cells):
              if not cell.startswith("%%writefile"):continue
              first,body=cell.split("\n",1)
              name=first.rsplit("/",1)[-1]
              if re.fullmatch(r"[A-Za-z0-9_]+[.]py",name):
                  try:modules[name]=(i,body,ast.parse(body))
                  except SyntaxError:pass
          graph={}
          mutations=[]
          for name,(i,body,tree) in modules.items():
              parents={id(child):node for node in ast.walk(tree) for child in ast.iter_child_nodes(node)}
              imports=[]
              for node in ast.walk(tree):
                  if isinstance(node,ast.ImportFrom) and node.module:imports.append(node.module.split(".")[0])
                  if isinstance(node,ast.Import):imports.extend(a.name.split(".")[0] for a in node.names)
                  if isinstance(node,ast.Assign):
                      for target in node.targets:
                          if isinstance(target,ast.Subscript) and isinstance(target.slice,ast.Constant) and target.slice.value in ("CUDA_VISIBLE_DEVICES","PYTHONPATH","LD_LIBRARY_PATH"):
                              contexts=[];p=parents.get(id(node))
                              while p:
                                  if isinstance(p,(ast.FunctionDef,ast.AsyncFunctionDef)):contexts.append("function:"+p.name)
                                  elif isinstance(p,ast.ClassDef):contexts.append("class:"+p.name)
                                  elif isinstance(p,ast.If):contexts.append("conditional")
                                  p=parents.get(id(p))
                              mutations.append({"module":name,"line":node.lineno,"key":target.slice.value,
                                  "value_kind":kind(node.value),"contexts":contexts,
                                  "unconditional_module_scope":not contexts})
                  if isinstance(node,ast.Call) and isinstance(node.func,ast.Attribute) and node.func.attr in ("setdefault","update"):
                      if any(isinstance(x,ast.Constant) and x.value=="CUDA_VISIBLE_DEVICES" for x in ast.walk(node)):
                          mutations.append({"module":name,"line":node.lineno,"method":node.func.attr,
                              "argument_kinds":[kind(x) for x in node.args]})
              graph[name]=sorted(set(x+".py" for x in imports if x+".py" in modules))
          emit("NTL_RUNTIME_IMPORT_GRAPH",graph)
          emit("NTL_ENV_MUTATIONS",mutations)
          # Counterfactual CPU proof only: replay unconditional CUDA mask assignments in a copied env.
          for name,(i,body,tree) in modules.items():
              for node in tree.body:
                  if not isinstance(node,ast.Assign) or not isinstance(node.value,ast.Constant):continue
                  if not isinstance(node.value.value,str):continue
                  exact=[t for t in node.targets if isinstance(t,ast.Subscript) and isinstance(t.value,ast.Attribute)
                      and isinstance(t.value.value,ast.Name) and t.value.value.id=="os"
                      and t.value.attr=="environ" and isinstance(t.slice,ast.Constant) and t.slice.value=="CUDA_VISIBLE_DEVICES"]
                  if len(exact)!=1:continue
                  before="0,1";after=node.value.value
                  emit("NTL_CPU_ENV_COUNTERFACTUAL",{"module":name,"incoming_mask":before,
                      "result_mask":after if after in ("","0","1","0,1","-1") else "nonstandard",
                      "disables_cuda":after in ("","-1"),"model_execution":False})
          # Install statements: package identifiers only, no paths or arbitrary source.
          install=[]
          for name,(i,body,tree) in modules.items():
              for node in ast.walk(tree):
                  if isinstance(node,ast.Call):
                      strings=[n.value for n in ast.walk(node) if isinstance(n,ast.Constant) and isinstance(n.value,str)]
                      if "install" not in strings:continue
                      safe=[s for s in strings if re.fullmatch(r"(?:torch|transformers|accelerate|numpy|scipy|scikit-learn|pandas|safetensors|tokenizers)(?:[<=>!]+[0-9A-Za-z.+_-]+)?",s)]
                      install.append({"module":name,"line":node.lineno,"packages":sorted(set(safe)),
                          "target":"--target" in strings,"no_deps":"--no-deps" in strings})
          emit("NTL_INSTALL_FACTS",install)
          
          from kaggle.api.kaggle_api_extended import KaggleApi
          api=KaggleApi();api.authenticate()
          for competition in ("name-that-llm","gemma-4-developer-agent"):
              try:
                  limits=api.competition_get_submission_limits(competition)
                  emit("KAGGLE_SUBMISSION_LIMIT",{"competition":competition,
                      "allowed_now":limits.num_allowed_now,"limited_by_total":limits.limited_by_total})
              except Exception as exc:emit("KAGGLE_SUBMISSION_LIMIT",{"competition":competition,"error_type":type(exc).__name__})
          p=call(["kaggle","competitions","submissions","gemma-4-developer-agent","-v","-q"])
          rows=list(csv.DictReader(p.stdout.splitlines())) if p.returncode==0 else []
          rows.sort(key=lambda x:int(x["ref"]),reverse=True)
          scores=[]
          for row in rows:
              try:scores.append((float(row["publicScore"]),row["ref"]))
              except (KeyError,ValueError,TypeError):pass
          emit("GEMMA_OFFICIAL_LEDGER",{"rc":p.returncode,"best":max(scores) if scores else None,
              "latest":[{k:r.get(k) for k in ("ref","status","publicScore","privateScore","date")} for r in rows[:7]],
              "attributed_v10_receipts":sum(r.get("description")=="attributed-scored-v10-exact-one-shot-20261112" for r in rows)})
          for arm in ("v2-12b","v2-31b"):
              kernel="kolihhan/gemma4-realclean-capacity-43078269086-"+arm
              p=call(["kaggle","kernels","status",kernel])
              m=re.search(r"KernelWorkerStatus\.([A-Z_]+)",p.stdout+p.stderr)
              state=m.group(1) if m else "NOT_FOUND_OR_UNKNOWN"
              emit("GEMMA_CAPACITY_STATUS",{"arm":arm,"state":state,"rc":p.returncode})
              if state not in ("ERROR","COMPLETE","FAILED","CANCELLED"):continue
              out=tmp/arm
              p=call(["kaggle","kernels","output",kernel,"--file-pattern",r".*capacity_.*_results[.]json$","-p",str(out),"-q"],150)
              for f in out.rglob("capacity_*_results.json"):
                  d=json.loads(f.read_text())
                  error=str(d.get("error",""));trace=str(d.get("traceback",""))
                  result=d.get("results",[])
                  emit("GEMMA_CAPACITY_RECOVERED",{"arm":arm,"status":d.get("status"),
                      "error_type":d.get("error_type"),"requested":d.get("requested"),
                      "records_count":len(result),"resolved":d.get("resolved"),
                      "gpu_visible":d.get("visible_gpus"),
                      "missing_model_weights":"model weights not found" in error,
                      "missing_module":re.findall(r"No module named '([a-zA-Z0-9_.]+)'",error),
                      "unexpected_keyword":re.findall(r"unexpected keyword argument '([a-zA-Z0-9_]+)'",error),
                      "missing_import":re.findall(r"cannot import name '([a-zA-Z0-9_]+)'",error),
                      "undefined_name":re.findall(r"name '([a-zA-Z0-9_]+)' is not defined",error),
                      "server_startup_failure":"server" in error.lower() and ("failed" in error.lower() or "timeout" in error.lower()),
                      "cuda_unavailable":"no visible GPU" in error,
                      "runtime_phase":("install" if "install_official_wheelhouse" in trace else
                          "server_start" if "server.start" in trace else
                          "task_evaluation" if "evaluate_task" in trace else "pre_evaluation"),
                      "records":[{k:r.get(k) for k in ("instance_id","status","resolved","has_patch","patch_chars","tool_calls","duration_seconds","test_exit_code","error_type")} for r in result],
                      "raw_traces_exported":False})
              p=call(["kaggle","kernels","logs",kernel])
              try:events=json.loads(p.stdout)
              except ValueError:events=[]
              joined="\n".join(str(x.get("data","")) for x in events if isinstance(x,dict)) if isinstance(events,list) else ""
              emit("GEMMA_CAPACITY_LOG_FACTS",{"arm":arm,"rc":p.returncode,
                  "elapsed_seconds":max([float(e.get("time",0)) for e in events if isinstance(e,dict) and isinstance(e.get("time"),(int,float))],default=0) if isinstance(events,list) else None,
                  "server_ready":"vLLM ready" in joined,"task_start_count":len(re.findall(r"\[\d{2}/\d{2}\] baseline",joined)),
                  "has_results":"BASELINE_RESULT" in joined,"has_summary":"BASELINE_SUMMARY" in joined,
                  "missing_module":sorted(set(re.findall(r"No module named '([a-zA-Z0-9_.]+)'",joined))),
                  "unexpected_keyword":sorted(set(re.findall(r"unexpected keyword argument '([a-zA-Z0-9_]+)'",joined))),
                  "undefined_name":sorted(set(re.findall(r"name '([a-zA-Z0-9_]+)' is not defined",joined))),
                  "error_classes":sorted(set(re.findall(r"\b(?:RuntimeError|TypeError|ValueError|ImportError|ModuleNotFoundError|FileNotFoundError|TimeoutError|AssertionError)\b",joined))),
                  "raw_traces_exported":False})
          emit("SESSION_RESOURCE_USE",{"new_gpu_runs":0,"new_submissions":0,"training":False,"polls_per_kernel":1})
          
          PY
