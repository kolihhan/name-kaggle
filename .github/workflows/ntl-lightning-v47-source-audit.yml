name: NTL Lightning V47 Exact Source Audit (Read Only)
on:
  push:
    branches: [exp/dct-temporal-fingerprint-v3]
    paths: [.github/workflows/ntl-lightning-v47-source-audit.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      SOURCE: lightningv08/0-666-qwen3-8-27b-lora-weighted-ensemble
      VERSION: '47'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q 'kaggle==2.2.5' 'six==1.17.0'
      - name: Fetch fixed upstream version and verify full-inference switch
        shell: bash
        run: |
          set -euo pipefail
          : "${KAGGLE_API_TOKEN:?No Kaggle token}"
          mkdir -p /tmp/ntl-v47
          kaggle kernels pull "$SOURCE/$VERSION" -p /tmp/ntl-v47 -m
          python - <<'PY'
          import hashlib,json,os,re,pathlib
          d=pathlib.Path('/tmp/ntl-v47')
          md=json.loads((d/'kernel-metadata.json').read_text())
          n=list(d.glob('*.ipynb'))
          assert len(n)==1,(len(n),[x.name for x in d.iterdir()])
          nb=json.loads(n[0].read_text())
          codes=[''.join(c['source']) if isinstance(c['source'],list) else c['source'] for c in nb['cells'] if c['cell_type']=='code']
          code='\n'.join(codes)
          rx=r'(?m)^\s*preview\s*=\s*emit_known_preview\(DATA\s*,\s*None\s*,\s*OUTPUT\)\s*$'
          previews=len(re.findall(rx,code))
          print('EXACT_SOURCE',json.dumps({'ref':os.environ['SOURCE'],'version':os.environ['VERSION'],'sha256':hashlib.sha256(n[0].read_bytes()).hexdigest(),'code_sha256':hashlib.sha256(code.encode()).hexdigest(),'notebook_id':md.get('id'),'code_cells':len(codes),'preview_switches':previews,'enable_internet':md.get('enable_internet'),'enable_gpu':md.get('enable_gpu'),'competition_sources':md.get('competition_sources'),'dataset_sources_count':len(md.get('dataset_sources',[])),'kernel_sources_count':len(md.get('kernel_sources',[])),'model_sources_count':len(md.get('model_sources',[])),'has_ensemble_main':"RUNTIME/'ensemble.py'" in code,'has_to_parquet':'.to_parquet(' in code,'offline':md.get('enable_internet')==False,'has_training_backward':bool(re.search(r'\.backward\s*\(|optimizer\.step\s*\(|trainer\.train\s*\(',code))},sort_keys=True))
          assert md['id']==os.environ['SOURCE']
          assert md['enable_internet'] is False and md['enable_gpu'] is True
          assert md['competition_sources']==['name-that-llm']
          assert previews == 1, 'Cannot force exact V47 real inference: preview switch not uniquely identified'
          assert not re.search(r'\.backward\s*\(|optimizer\.step\s*\(|trainer\.train\s*\(',code), 'Contains train calls'
          print('V47_FULL_INFERENCE_PATCH_FEASIBLE')
          PY
      - name: Retain exact public Apache-2 V47 source temporarily for mechanism audit
        uses: actions/upload-artifact@v4
        with:
          name: ntl-lightning-v47-source-only-20261105
          path: |
            /tmp/ntl-v47/*.ipynb
            /tmp/ntl-v47/kernel-metadata.json
          retention-days: 1
          if-no-files-found: error
