name: NTL GLM frozen 64-pair vs official paired source drift CPU audit, NO TRAIN
on:
  push:
    branches: [research/ntl-glm-family-source-shift-audit-20261123]
    paths: [.github/workflows/ntl-glm-matched-source-shift-audit-20261123.yml]
permissions: {contents: read}
concurrency:
  group: ntl-glm-source-shift-v1-20261123
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ntl_glm_matched_source_shift_audit_20261123.py
            scripts/run_style_baseline.py
            kaggle/ntl_glm_crosssource_private.py
            docs/research/ntl-glm-family-source-shift-v1-contract-20261123.md
            data/train.csv
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify script and locked no-training tests
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/research/ntl-glm-family-source-shift-v1-contract-20261123.md
          python -m py_compile scripts/ntl_glm_matched_source_shift_audit_20261123.py
          python -m pip install -q --disable-pip-version-check 'kaggle==2.2.5' 'six==1.17.0' 'numpy>=1.26,<3' 'scipy>=1.13,<2' 'scikit-learn>=1.4,<2' 'pandas>=2,<3'
          python -m scripts.ntl_glm_matched_source_shift_audit_20261123 --selftest
      - name: Download original authenticated public dataset to ephemeral /tmp, print ONLY numeric source-shift aggregations
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          mkdir -p /tmp/ntl-glm-drift-source
          kaggle datasets download -d lxdlxdlxd/ntl-synth-generations-v1 \
            -p /tmp/ntl-glm-drift-source --unzip >/tmp/ntl-glm-drift-download.log 2>&1
          python -m scripts.ntl_glm_matched_source_shift_audit_20261123 \
            --official data/train.csv \
            --external /tmp/ntl-glm-drift-source/generations.csv
          rm -rf /tmp/ntl-glm-drift-source /tmp/ntl-glm-drift-download.log
          echo NTL_GLM_DRIFT_AUDIT_NO_TRAINING_NO_GPU_NO_PUBLIC_DATA_EXPORT_NO_KAGGLE_SUBMISSION=TRUE
