name: NTL Frozen Lightning 0.681 Live Kaggle Status Readonly
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-public-lightning-0681-status-once.yml]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q kaggle==2.2.5 six==1.17.0
      - name: Read only current v2 inference and official score state
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python - <<'PY'
          import csv,json,subprocess
          REF="kolihhan/ntl-public-lightning-0681-frozen-no-train"
          desc="Frozen public Lightning 0.681 reproduction no new supervised training 20261109"
          p=subprocess.run(["kaggle","kernels","status",REF],
                           capture_output=True,text=True)
          response=p.stdout+"\n"+p.stderr
          status=next((x for x in (
              "KernelWorkerStatus.COMPLETE","KernelWorkerStatus.RUNNING",
              "KernelWorkerStatus.QUEUED","KernelWorkerStatus.ERROR",
              "KernelWorkerStatus.CANCELLED",
          ) if x in response),None)
          print("PUBLIC_0681_KAGGLE_LIVE_STATUS",json.dumps({
              "status":status,"return_code":p.returncode
          },sort_keys=True),flush=True)
          q=subprocess.run(["kaggle","competitions","submissions",
                             "name-that-llm","-v","-q"],capture_output=True,text=True)
          if q.returncode:raise RuntimeError("official Kaggle ledger unavailable")
          rows=list(csv.DictReader(q.stdout.splitlines()))
          hits=[{k:item.get(k) for k in
                 ("ref","status","publicScore","description","date")}
                for item in rows if item.get("description")==desc]
          print("PUBLIC_0681_OFFICIAL_LIVE_SUBMISSIONS",
                json.dumps(hits,sort_keys=True),flush=True)
          PY
