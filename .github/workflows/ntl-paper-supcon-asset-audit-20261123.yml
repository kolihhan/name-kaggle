name: NTL SOTA paper SupCon strong 0.715 feature availability audit
on:
  push:
    branches: [exp/ntl-paper-supcon-strongreadout-20261123]
    paths:
      - .github/workflows/ntl-paper-supcon-asset-audit-20261123.yml
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Kaggle metadata client
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
      - name: Check existing 0.715 real strong embeddings source contracts
        run: |
          set -euo pipefail
          python -m scripts.ntl_paper_scl_strong_assets_audit_20261123
          echo NTL_ASSETS_READONLY_NO_MODEL_INFERENCE_TRAIN_GPU_OR_SUBMISSION=TRUE
