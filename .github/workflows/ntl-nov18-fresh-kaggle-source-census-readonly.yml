name: NTL Fresh External Kaggle Source Census (No Inference)
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-nov18-fresh-kaggle-source-census-readonly.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Enumerate new/updated public NTL corpora, publisher metadata only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
          python - <<'PY'
          import csv,io,subprocess,json,re
          listings={}
          for term in ("name-that-llm","name that llm","ntl"):
              args=["kaggle","datasets","list","--search",term,"--sort-by","updated",
                    "--page-size","100","-v"]
              proc=subprocess.run(args,text=True,capture_output=True,timeout=80)
              if proc.returncode:
                  listings[term]={"status":"CLI_FAILED","exit":proc.returncode,
                                  "reason":proc.stderr[-260:]}
                  continue
              lines=proc.stdout.splitlines()
              idx=next((i for i,line in enumerate(lines)
                  if line.strip().lower().startswith("ref,") and
                     ("license" in line.lower() or "last" in line.lower())),None)
              if idx is None:
                  listings[term]={"status":"NO_CSV_HEADER","first":lines[:3]}
                  continue
              raw=list(csv.DictReader(lines[idx:]))
              results=[]
              for z in raw:
                  ref=z.get("ref") or z.get("Ref")
                  if not ref:continue
                  results.append({
                    "ref":str(ref)[:140],
                    "updated":str(z.get("lastUpdated") or z.get("last_updated") or z.get("lastUpdatedDate") or "")[:36],
                    "license":str(z.get("licenseName") or z.get("license") or "")[:85],
                    "size":str(z.get("totalBytes") or z.get("totalSize") or "")[:24],
                  })
              listings[term]={"status":"OK","rows":results}
          distinct={}
          for q,v in listings.items():
              for rec in v.get("rows",[]):
                  if rec.get("ref"):distinct[rec["ref"]]=rec
          data=sorted(distinct.values(),key=lambda r:r["updated"],reverse=True)
          print("NTL_KAGGLE_NOV18_FRESH_PUBLIC_SOURCE_CENSUS="+json.dumps({
            "source":"authenticated Kaggle datasets list CSV",
            "queries":{k:{"status":v.get("status"),
                           "count":len(v.get("rows",[])),
                           "reason":v.get("reason") if v.get("status")!="OK" else None,
                           "header":v.get("first") if v.get("status")=="NO_CSV_HEADER" else None}
                       for k,v in listings.items()},
            "distinct_catalog_sources":len(distinct),
            "recent_datasets":data[:65],
            "model_identity_attested":False,
            "no_gpu_no_training_no_submission":True,
          },sort_keys=True),flush=True)
          PY
