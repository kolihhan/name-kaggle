name: "NTL zero-fit representation classes on historical prompt-disjoint train"
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-zero-fit-representation-20261115.yml]
permissions: {contents: read}
jobs:
  representation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install CPU-only research dependencies
        run: python -m pip install -q --disable-pip-version-check numpy scipy scikit-learn
      - name: Execute tests and real official training-data representation experiment
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/ntl_zero_fit_prompt_disjoint_representations_20261115.py
          python scripts/ntl_zero_fit_prompt_disjoint_representations_20261115.py --smoke
          python scripts/ntl_zero_fit_prompt_disjoint_representations_20261115.py --input data/train.csv
          echo "NTL_NEW_TRAINING=FALSE;NEW_GPU=FALSE;OFFICIAL_SUBMISSION=FALSE;INDEPENDENT_HOLDOUT=FALSE"
