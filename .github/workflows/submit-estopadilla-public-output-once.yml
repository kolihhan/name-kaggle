name: Submit Estopadilla completed public notebook output directly once
on:
  push:
    branches: [ops/submit-estopadilla-glm053-20261122]
    paths: [.github/workflows/submit-estopadilla-public-output-once.yml]
permissions:
  contents: read
concurrency:
  group: ntl-estopadilla-direct-submit-once
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q 'kaggle==2.2.5' 'pyarrow>=17,<25' 'six==1.17.0'
      - name: Download source submission.parquet and attempt official competition submission
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess,pathlib,os,sys,re,pyarrow.parquet as pq
          comp='name-that-llm'; marker='estopadilla-glm53-0716-20261122'
          source='estopadilla/0-716-robust-glm-5-3-likelihood-user-prefix'
          def call(args,checked=True):
              p=subprocess.run(args,capture_output=True,text=True,timeout=240)
              if checked and p.returncode:
                  err=p.stderr.replace(os.environ.get('KAGGLE_API_TOKEN','<missing>'),'[REDACTED]')
                  print('CLI_FAILED',args[:4],'exit',p.returncode,'reason',err[-1000:])
                  sys.exit(1)
              return p
          prev=call(['kaggle','competitions','submissions',comp,'-v']).stdout
          if marker in prev:
              print('ALREADY_SUBMITTED exact marker; no duplicate')
              sys.exit(0)
          status=call(['kaggle','kernels','status',source]).stdout
          print('SOURCE_STATUS',status)
          if 'COMPLETE' not in status.upper():
              raise SystemExit('Source notebook not complete, no submit')
          files=call(['kaggle','kernels','files',source,'-v']).stdout
          if not any(line.startswith('submission.parquet,') for line in files.splitlines()):
              raise SystemExit('Source submission.parquet not listed')
          dest=pathlib.Path('/tmp/estopadilla-output');dest.mkdir(exist_ok=True)
          p=call(['kaggle','kernels','output',source,'-p',str(dest),'-o'])
          print('DOWNLOAD_RESULT',p.stdout[-800:])
          file=dest/'submission.parquet'
          if not file.exists():
              print('DOWNLOADED_FILES',sorted(str(p.relative_to(dest)) for p in dest.rglob('*') if p.is_file())[:50])
              raise SystemExit('SOURCE_FILE_NOT_DOWNLOADED')
          meta=pq.ParquetFile(file)
          print('FILE_VALIDATION',{'bytes':file.stat().st_size,'rows':meta.metadata.num_rows,'columns':meta.schema.names})
          if meta.metadata.num_rows<100:
              raise SystemExit('Source output unexpectedly small; no submission')
          if marker in call(['kaggle','competitions','submissions',comp,'-v']).stdout:
              print('ALREADY_SUBMITTED second guard')
              sys.exit(0)
          sub=call(['kaggle','competitions','submit',comp,'-f',str(file),'-m','Public Estopadilla GLM5.3 likelihood original output '+marker],checked=False)
          print('SUBMIT_RETURN_CODE',sub.returncode)
          print('SUBMIT_STDOUT',sub.stdout[-1500:])
          if sub.returncode:
              print('SUBMIT_ERROR',re.sub(r'KGAT_[A-Za-z0-9_-]+','[REDACTED]',sub.stderr)[-1400:])
              raise SystemExit('Official file submission was rejected; no accepted ID')
          print('COMPETITION_SUBMISSION_ACCEPTED')
          print('LEDGER',call(['kaggle','competitions','submissions',comp,'-v']).stdout[:2200])
          PY
