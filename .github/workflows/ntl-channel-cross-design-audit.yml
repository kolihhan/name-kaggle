name: NTL Channel Cross-Design External Data Audit
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths:
      - .github/workflows/ntl-channel-cross-design-audit.yml
      - scripts/audit_channel_cross_design.py
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/audit_channel_cross_design.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install lightweight dataset tools
        run: python -m pip install -q 'kaggle==2.2.5' 'six==1.17.0'
      - name: Obtain only public external corpus and inspect schema, no samples
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo 'Missing Kaggle token'; exit 1; }
          mkdir -p /tmp/ntl-cross-source
          kaggle datasets download -d zakirkhanaleemi/name-that-llm-benchmarks-proxy-generations -p /tmp/ntl-cross-source --unzip -q
          python scripts/audit_channel_cross_design.py /tmp/ntl-cross-source/ntl_proxy_generations.csv
