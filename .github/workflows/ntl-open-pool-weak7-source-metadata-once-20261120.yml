name: NTL Open Pool 7 omitted model provenance risk screen once
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-open-pool-weak7-source-metadata-once-20261120.yml]
permissions: {contents: read}
jobs:
  metadata_only:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/ntl_open_pool_weak7_metadata_screen_20261120.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Pin metadata-only CPU packages
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0 pandas==2.3.3 pyarrow==22.0.0 numpy==2.3.4
          python -m py_compile scripts/ntl_open_pool_weak7_metadata_screen_20261120.py
      - name: Pull published current Open Pool parquet only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ntl-pool-weak7
          kaggle datasets download -d crtproduction/name-that-llm-open-pool -f ntl_open_pool.parquet -p /tmp/ntl-pool-weak7 --unzip -q >/dev/null
      - name: Evaluate source provenance and routing fields without training
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ntl_open_pool_weak7_metadata_screen_20261120.py \
            --pool /tmp/ntl-pool-weak7/ntl_open_pool.parquet \
            --out ntl-pool-weak7-aggregate.json
      - name: Erase downloaded public passages
        if: always()
        run: rm -rf /tmp/ntl-pool-weak7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ntl-pool-weak7-metadata-only-${{ github.run_id }}
          path: ntl-pool-weak7-aggregate.json
          if-no-files-found: warn
          retention-days: 10
