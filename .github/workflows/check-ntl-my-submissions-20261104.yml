name: NTL My Submissions Snapshot (Read Only)
on:
  push:
    branches: [exp/dct-temporal-fingerprint-v3]
    paths: [.github/workflows/check-ntl-my-submissions-20261104.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI
        run: python -m pip install -q 'six==1.17.0' 'kaggle==2.2.5'
      - name: Read recent competition submissions only
        shell: bash
        run: |
          set -euo pipefail
          : "${KAGGLE_API_TOKEN:?Kaggle token missing}"
          kaggle competitions submissions name-that-llm -v -q > /tmp/ntl-my-submissions.csv
          python - <<'PY'
          import csv,json
          with open('/tmp/ntl-my-submissions.csv', newline='') as fh:
              rows=list(csv.DictReader(fh))
          rows.sort(key=lambda r: int(r['ref']), reverse=True)
          print('SUBMISSION_COUNT',len(rows))
          for row in rows[:30]:
              print('SUBMISSION_SNAPSHOT',json.dumps({
                  k:row.get(k) for k in ('ref','status','publicScore','privateScore','description','date')
              },sort_keys=True))
          print('BASELINE_0520_COUNT',sum(r.get('publicScore')=='0.520' for r in rows))
          PY
