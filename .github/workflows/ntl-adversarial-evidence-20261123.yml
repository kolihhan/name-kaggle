name: NTL Adversarial Evidence Gate - 18-Class Source and Champion
on:
  push:
    branches: [research/ntl-adversarial-evidence-gate-20261123]
    paths:
      - .github/workflows/ntl-adversarial-evidence-20261123.yml
permissions: {contents: read}
concurrency:
  group: ntl-adversarial-evidence-20261123
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install CPU metadata reader and run standalone smoke
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check 'kaggle==2.2.5' 'six==1.17.0' 'pandas>=2,<3'
          python -m py_compile scripts/ntl_adversarial_source_and_champion_audit_20261123.py
          python -m scripts.ntl_adversarial_source_and_champion_audit_20261123 --smoke
      - name: Real read-only source and scored source-code adversarial check
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m scripts.ntl_adversarial_source_and_champion_audit_20261123
          echo NTL_ADVERSARIAL_NO_NEW_MODEL_NO_GPU_NO_SUBMISSION=TRUE
