name: NTL Public 0.680 Notebook Static Dependency Audit (No Training)
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-stronger-public-0680-readonly-audit.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q kaggle==2.2.5 six==1.17.0
      - name: Inspect exact public Alex Chilton kernel and inputs, never run it
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python - <<'PY'
          import collections, json, pathlib, re, subprocess, tempfile
          refs = [
              "alexchilton/name-that-llm-0-680-all-public-what-failed",
              "alexchilton/name-that-llm-0-663-all-public-what-failed",
              "alexchilton/name-that-llm-0-662-all-public-what-failed",
          ]
          with tempfile.TemporaryDirectory() as temp:
              root=pathlib.Path(temp)
              for ref in refs:
                  dst=root/("candidate-"+str(refs.index(ref)))
                  dst.mkdir()
                  p=subprocess.run(["kaggle","kernels","pull",ref,"-p",str(dst),"-m"],
                                   capture_output=True,text=True)
                  if p.returncode:
                      print("PUBLIC_CANDIDATE_PULL_FAILED",json.dumps({
                          "ref":ref, "return_code":p.returncode,
                          "stderr_tail":(p.stdout+"\n"+p.stderr)[-260:]
                      }),flush=True)
                      continue
                  metadata=dst/"kernel-metadata.json"
                  meta=json.loads(metadata.read_text()) if metadata.exists() else {}
                  sourcefiles=[]
                  for file in dst.iterdir():
                      if file.suffix in (".ipynb",".py"):
                          sourcefiles.append(file)
                  codes=[]
                  for file in sourcefiles:
                      if file.suffix==".py":codes.append(file.read_text(errors="replace"))
                      else:
                          try:
                              n=json.loads(file.read_text(errors="replace"))
                              for c in n.get("cells",[]):
                                  if c.get("cell_type")=="code":
                                      src=c.get("source",[])
                                      codes.append("".join(src) if isinstance(src,list) else str(src))
                          except Exception:
                              pass
                  code="\n".join(codes)
                  patterns = {
                      "sklearn_or_library_fit_calls":r"\.(?:fit|fit_transform|partial_fit|train)\s*\(",
                      "torch_optimizer_updates":r"\.(?:backward|step|zero_grad)\s*\(",
                      "keras_fit_calls":r"(?:model|net)\.fit\s*\(",
                      "pretrained_loads":r"(?:joblib\.load|torch\.load|pickle\.load|load_model|from_pretrained)\s*\(",
                      "prediction_calls":r"\.(?:predict|predict_proba|decision_function)\s*\(",
                      "submit_write":r"submission\.parquet",
                      "external_sources":r"(?i)(?:dataset_sources|model_sources)",
                  }
                  matches={}
                  for k,v in patterns.items():
                      hits=re.findall(v,code)
                      matches[k]=len(hits)
                  funcs=re.findall(r"(?m)^\s*(?:def|class)\s+([A-Za-z_][A-Za-z0-9_]*)",code)
                  print("PUBLIC_0680_AUDIT",json.dumps({
                      "ref":ref, "metadata":{k:meta.get(k) for k in
                          ("id","title","is_private","enable_internet","kernel_type",
                           "competition_sources","dataset_sources","model_sources",
                           "machine_shape")},
                      "source_files":[x.name for x in sourcefiles],
                      "source_chars":len(code),"static_patterns":matches,
                      "functions":funcs[:55],
                      "has_competition_train_reader":bool(re.search(r"train\\.csv",code)),
                      "has_external_datasets":len(meta.get("dataset_sources") or []),
                  },sort_keys=True),flush=True)
                  break
              else:
                  print("PUBLIC_0680_NOT_PULLABLE",flush=True)
          PY
      - name: Identify public 0.680 notebook active fit-call sites only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,re,subprocess,tempfile
          ref="alexchilton/name-that-llm-0-680-all-public-what-failed"
          with tempfile.TemporaryDirectory() as tmp:
              p=subprocess.run(["kaggle","kernels","pull",ref,"-p",tmp,"-m"],
                  capture_output=True,text=True)
              if p.returncode:
                  raise RuntimeError("unable to read public 0.680 notebook")
              srcs=list(pathlib.Path(tmp).glob("*.ipynb"))
              if len(srcs)!=1:raise RuntimeError("expected one public notebook")
              nb=json.loads(srcs[0].read_text())
              sites=[]
              reader=[]
              for ci,c in enumerate(nb.get("cells",[])):
                  if c.get("cell_type")!="code":continue
                  text="".join(c.get("source",[]))
                  lines=text.splitlines()
                  for i,line in enumerate(lines):
                      if re.search(r"\.(?:fit|fit_transform|partial_fit|train)\s*\(",line):
                          sites.append({"cell":ci,"line":i+1,
                                        "preceding":[s.strip()[:130] for s in lines[max(0,i-2):i]],
                                        "site":line.strip()[:250]})
                      if re.search(r"(?:read_csv|train\.csv|train_df|fit_predict|load_weights|joblib\.load|pickle\.load)",line,re.I):
                          reader.append({"cell":ci,"line":i+1,"site":line.strip()[:160]})
              print("ALEX0680_ACTIVE_FIT_CALL_SITES",json.dumps(sites[:30],sort_keys=True),flush=True)
              print("ALEX0680_TRAIN_AND_PREFIT_EVIDENCE",json.dumps({
                  "count":len(reader),"samples":reader[:35],
                  "fit_call_count":len(sites),
                  "code_cells":sum(c.get("cell_type")=="code" for c in nb.get("cells",[]))
              },sort_keys=True),flush=True)
          PY
      - name: Trace whether 0.680 Notebook calls supervised fitting in official path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,re,subprocess,tempfile
          with tempfile.TemporaryDirectory() as tmp:
              s=subprocess.run(["kaggle","kernels","pull",
                "alexchilton/name-that-llm-0-680-all-public-what-failed","-p",tmp,"-m"],
                capture_output=True,text=True)
              if s.returncode:raise RuntimeError("Notebook pull failed")
              files=list(pathlib.Path(tmp).glob("*.ipynb"))
              nb=json.loads(files[0].read_text())
              spots=[]
              pattern=re.compile(r"(?:\.fit\s*\(|fit_transform\s*\(|model\.train\s*\(|train_final|gauss\.fit\s*\(|--train-final|submission\.parquet|gaussian-train-features|__main__)",re.I)
              for ci,c in enumerate(nb["cells"]):
                  if c.get("cell_type")!="code":continue
                  ls="".join(c.get("source",[])).splitlines()
                  hits=[(i,ln.strip()) for i,ln in enumerate(ls) if pattern.search(ln)]
                  if ci not in (11,15,17,20,28,31,46,52,54) and not hits:continue
                  for i,line in hits[:18]:
                      if len(spots)>=105:break
                      spots.append({"cell":ci,"line":i+1,"text":line[:230],
                                    "prev":ls[i-1].strip()[:110] if i else "",
                                    "next":ls[i+1].strip()[:110] if i+1<len(ls) else ""})
              print("ALEX0680_FINAL_PATH_STATIC_CALL_TRACE",
                    json.dumps(spots,sort_keys=True),flush=True)
              helptext=subprocess.run(["kaggle","kernels","list","--help"],
                                     capture_output=True,text=True)
              help_lines=helptext.stdout.splitlines()
              picked=[x.strip()[:160] for x in help_lines
                      if any(s in x.lower() for s in ("sort-by","page-size","search","competition"))]
              print("KAGGLE_KERNEL_DISCOVERY_FLAGS",json.dumps({
                  "return_code":helptext.returncode,"flags":picked[:24]
              },sort_keys=True),flush=True)
          PY
      - name: Discover highest public Kaggle competition kernels by score descending
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json,subprocess
          for sort in ("scoreDescending","hotness"):
              cmd=["kaggle","kernels","list","--competition","name-that-llm",
                   "--sort-by",sort,"--page-size","60","-v"]
              p=subprocess.run(cmd,capture_output=True,text=True)
              if p.returncode:
                  print("PUBLIC_COMPETITION_NOTEBOOK_DISCOVERY_ERROR",json.dumps({
                      "sort":sort,"return_code":p.returncode,
                      "stderr_tail":(p.stdout+"\n"+p.stderr)[-350:]
                  },sort_keys=True),flush=True)
                  continue
              lines=[line for line in p.stdout.splitlines() if line.strip()]
              start=next((i for i,s in enumerate(lines)
                         if s.lower().strip().startswith("ref,")),None)
              rows=list(csv.DictReader(lines[start:])) if start is not None else []
              print("PUBLIC_COMPETITION_KERNEL_SCORE_DISCOVERY",json.dumps({
                  "sort":sort,"total_rows":len(rows),
                  "columns":list(rows[0]) if rows else [],
                  "first_45":[{k:str(v)[:115] for k,v in r.items()
                              if k in ("ref","title","bestScore","score","status","lastRunTime","totalVotes")}
                              for r in rows[:45]],
                  "has_next":"Next Page Token" in p.stdout,
              },sort_keys=True),flush=True)
          PY
