name: NTL uncertain matching marginal exactness and invariants CPU
on:
  push:
    branches: [research/ntl-reset-bank-provenance-20261128]
    paths: [.github/workflows/ntl-uncertain-matching-marginals-20261129.yml]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/ntl_uncertain_matching_marginals.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          set -euo pipefail
          python -m pip install -q numpy==2.3.4
          python - <<'PY'
          import itertools,json
          import numpy as np
          from scripts.ntl_uncertain_matching_marginals import marginalize,propose
          rng=np.random.default_rng(29)
          p=rng.dirichlet(np.full(18,.7),size=5)
          e=[(0,1,3.),(0,2,1.),(1,2,2.),(2,3,.5),(3,4,4.),(1,4,1.5)]
          # Independent exhaustive oracle: enumerate every subset and reject overlap.
          mass=0.;expected=np.zeros_like(p);match_mass=0.
          for flags in itertools.product([0,1],repeat=len(e)):
              selected=[edge for edge,f in zip(e,flags) if f]
              nodes=[v for i,j,w in selected for v in (i,j)]
              if len(set(nodes))!=len(nodes):continue
              w=float(np.prod([x[2] for x in selected]));q=p.copy()
              for i,j,_ in selected:
                  joint=np.outer(p[i],p[j]);np.fill_diagonal(joint,0);joint/=joint.sum()
                  q[i]=joint.sum(1);q[j]=joint.sum(0)
              expected+=w*q;mass+=w;match_mass+=w*len(selected)
          q,s=marginalize(p,e)
          error=float(np.max(np.abs(q-expected/mass)))
          assert error<1e-12
          assert abs(s['expected_matched_pairs']-match_mass/mass)<1e-12
          q0,_=marginalize(p,[])
          assert np.array_equal(q0,p)
          perm=np.array([4,2,0,3,1]);inv=np.argsort(perm)
          qp,_=marginalize(p[perm],[(int(inv[i]),int(inv[j]),w) for i,j,w in e])
          assert np.allclose(qp[inv],q,atol=1e-12,rtol=0)
          skipped,ss=marginalize(p,e,max_component=4)
          assert np.array_equal(skipped,p) and ss['rows_skipped']==5
          one=np.zeros((2,18));one[:,0]=1
          deg,ds=marginalize(one,[(0,1,4.)])
          assert np.array_equal(deg,one) and ds['degenerate_edges']==1
          old=p.argmax(1);old[0]=(old[0]+1)%18
          new,stats=propose(p,e,old)
          assert new[0]==old[0] and stats['score_decision_disagreements']==1
          def rejected(fn):
              try:fn()
              except ValueError:return
              raise AssertionError('expected ValueError')
          rejected(lambda:marginalize(p,[(0,1,1.),(1,0,1.)]))
          rejected(lambda:marginalize(p,[(0,0,1.)]))
          rejected(lambda:marginalize(p,[(0,1,float('inf'))]))
          rejected(lambda:marginalize(p*2,[]))
          print('UNCERTAIN_MATCHING_SYNTHETIC='+json.dumps({'checks':'PASS','brute_force_max_error':error,'matching_mass_verified':True,'permutation_invariant':True,'oversized_fallback':True,'degenerate_fallback':True,'baseline_disagreement_abstain':True,'actual_scorer_evaluated':False,'gpu':False,'submission':False,'promotion':False},sort_keys=True),flush=True)
          PY
