name: Submit exact Estopadilla v5 scored kernel to Name That LLM
on:
  push:
    branches: [ops/submit-estopadilla-glm053-20261122]
    paths: [.github/workflows/submit-estopadilla-v5-code-once.yml]
permissions:
  contents: read
concurrency:
  group: ntl-estopadilla-v5-direct-code-official-submit-20261122
  cancel-in-progress: false
jobs:
  code-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q 'kaggle==2.2.5' 'six==1.17.0'
      - name: Submit exact scored public author v5 kernel as Code Competition entry
        shell: bash
        run: |
          python - <<'PY'
          import os,subprocess,re,sys
          comp="name-that-llm"
          kernel="estopadilla/0-716-robust-glm-5-3-likelihood-user-prefix"
          marker="estopadilla-original-v5-0716-20261122"
          def call(args):
              p=subprocess.run(["kaggle",*args],capture_output=True,text=True,timeout=180)
              def clean(s):
                  return re.sub(r"KGAT_[A-Za-z0-9_-]+","[REDACTED]",s.replace(os.environ.get('KAGGLE_API_TOKEN') or '<missing>','[REDACTED]'))
              return p.returncode,clean(p.stdout),clean(p.stderr)
          code,ledger,err=call(["competitions","submissions",comp,"-v"])
          if code:
              print("LEDGER_QUERY_FAILED",err[-700:]);sys.exit(1)
          if marker in ledger:
              print("ALREADY_SUBMITTED",marker);sys.exit(0)
          code,status,err=call(["kernels","status",kernel])
          print("SOURCE_STATUS",status[:300])
          if code or 'COMPLETE' not in status.upper():
              raise SystemExit("Source latest version not COMPLETE; no submission")
          cmd=["competitions","submit",comp,"-k",kernel,"-v","5","-f","submission.parquet","-m","Exact public Estopadilla v5 GLM5.3 likelihood reproduction "+marker]
          code,out,err=call(cmd)
          print("OFFICIAL_SUBMIT_EXIT",code)
          print("OFFICIAL_SUBMIT_RESPONSE",out[-1400:])
          if code:
              print("OFFICIAL_SUBMIT_REJECTED",err[-1400:])
              sys.exit(1)
          print("OFFICIAL_SUBMISSION_REQUEST_ACCEPTED")
          code,ledger,err=call(["competitions","submissions",comp,"-v"])
          if code:
              print("LEDGER_RECHECK_ERROR",err[-400:])
          else:
              print("OFFICIAL_LEDGER_MATCHES", '\n'.join([x for x in ledger.splitlines() if marker in x])[-1500:])
          PY
