name: NTL Lightning 0.681 Model Input Permission and Session Readonly Check
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-public-lightning-0681-model-gates-readonly.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q kaggle==2.2.5 six==1.17.0
      - name: Check read-only model variation access and active kernels
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python - <<'PY'
          import csv,json,subprocess,tempfile,pathlib
          refs=[
            "qwen-lm/qwen-3/Transformers/8b-base/1",
            "qwen-lm/qwen-3/Transformers/4b-base/1",
            "qwen-lm/qwen-3/Transformers/14b-base/1",
            "qwen-lm/qwen-3-embedding/Transformers/8b/1",
            "qwen-lm/qwen2.5/Transformers/14b/1",
            "qwen-lm/qwen2.5/Transformers/7b/1",
          ]
          results=[]
          with tempfile.TemporaryDirectory() as tmp:
            for i,ref in enumerate(refs):
              p=pathlib.Path(tmp)/str(i);p.mkdir()
              variation="/".join(ref.split("/")[:4])
              ret=subprocess.run(["kaggle","models","variations","get",
                            variation,"-p",str(p)],
                            capture_output=True,text=True)
              metadata=p/"model-instance-metadata.json"
              j={}
              if metadata.exists():
                try:j=json.loads(metadata.read_text())
                except ValueError:pass
              results.append({
                "ref":ref,"variation_get_ok":ret.returncode==0,
                "metadata_fields":sorted(j)[:20],
                "is_gated":j.get("isGated") or j.get("is_gated"),
                "license":j.get("licenseName") or j.get("license"),
                "error_code":next((k for k in ("403","404","forbidden","unauthorized","permission")
                                  if k in (ret.stdout+ret.stderr).lower()),None),
                "error_tail":(ret.stdout+ret.stderr)[-160:] if ret.returncode else ""
              })
          print("LIGHTNING_0681_MODEL_VARIATION_ACCESS",json.dumps(results,sort_keys=True),flush=True)
          # The API cannot prove remaining GPU quota. List the user's latest
          # notebook states only, never run, cancel or reset anything.
          p=subprocess.run(["kaggle","kernels","list","-m","-v",
                           "--sort-by","dateRun","--page-size","35"],
                            capture_output=True,text=True)
          lines=[s for s in p.stdout.splitlines() if s.strip()]
          idx=next((i for i,s in enumerate(lines) if s.lower().startswith("ref,")),None)
          rows=list(csv.DictReader(lines[idx:])) if idx is not None else []
          print("LIGHTNING_0681_OWN_RECENT_KERNELS",json.dumps({
            "return_code":p.returncode,"num_rows":len(rows),
            "recent":[{k:v for k,v in item.items() if k in
                      ("ref","title","lastRunTime")} for item in rows[:18]]
          },sort_keys=True),flush=True)
          PY
