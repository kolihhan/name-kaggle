name: NTL 31B CUDA13 T4 runtime asset exact file audit
on:
  push:
    branches: [research/ntl-fable252-nameerror-recovery-20261125]
    paths: [.github/workflows/ntl31b-cuda13-runtime-filenames-20261126.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Audit CUDA 13 llama-server paths before Kaggle v3
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q kaggle==2.2.5 six==1.17.0
          python - <<'PY'
          import subprocess,json,csv,io
          for ref in ['shymsk/llama-cpp-cuda13-t4-v3','artp2011/llama-cpp-bin-cuda13-sm75','nixty2/llama-cpp-turing-sm75']:
              p=subprocess.run(['kaggle','datasets','files',ref,'-v'],capture_output=True,text=True,timeout=95)
              lines=p.stdout.splitlines()
              found=[line for line in lines if any(x in line.lower() for x in
                 ['llama-server,','llama-server/','libcudart','libggml-cuda.so','libllama.so','libggml-base.so','readme.md','build_info.json'])]
              print('NTL31_CUDA13_MANIFEST='+json.dumps({'ref':ref,'rc':p.returncode,
                  'matches':found[-90:] if p.returncode==0 else [],
                  'file_count_lines':len(lines)}),flush=True)
          print('NTL31_CUDA13_MANIFEST_READONLY=TRUE',flush=True)
          PY
