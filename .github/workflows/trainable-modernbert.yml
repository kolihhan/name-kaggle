name: Trainable ModernBERT baseline

on:
  push:
    branches:
      - exp/trainable-modernbert-official
    paths:
      - scripts/train_modernbert_cv.py
      - tests/test_train_modernbert_cv.py
      - .github/workflows/trainable-modernbert.yml
      - artifacts/phase4/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: pip install pytest numpy pandas scikit-learn
      - name: Run Phase 4 contract tests
        run: python -m pytest -q tests/test_train_modernbert_cv.py
