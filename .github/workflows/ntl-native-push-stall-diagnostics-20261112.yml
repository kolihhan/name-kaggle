name: NTL native exact kernel push diagnostic no GPU or submission
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-native-push-stall-diagnostics-20261112.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env: {KAGGLE_API_TOKEN: "${{ secrets.KAGGLE_API_TOKEN }}"}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Determine whether target is registered, safely count owned kernels and active quota
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install -q kaggle==2.2.5 six==1.17.0
          python - <<'PY'
          import csv,datetime,io,json,subprocess
          from kaggle.api.kaggle_api_extended import KaggleApi
          slug="kolihhan/ntl-native-frozen-nov12-one-shot"
          all_rows=[]
          for page in range(1,10):
            p=subprocess.run(["kaggle","kernels","list","--user","kolihhan","-v",
                              "--page-size","100","--page",str(page)],
                              capture_output=True,text=True,check=True,timeout=120)
            rows=list(csv.DictReader(io.StringIO(p.stdout.lstrip("\ufeff"))))
            all_rows+=rows
            if len(rows)<100:break
          matches=[{k:x.get(k) for k in ("ref","title","lastRunTime","lastRunStatus","currentVersionNumber")}
                   for x in all_rows if x.get("ref","").lower()==slug]
          recent=[{k:x.get(k) for k in ("ref","title","lastRunTime","lastRunStatus")}
                  for x in all_rows if "native" in (x.get("ref","")+" "+x.get("title","")).lower()][:18]
          print("NTL_NATIVE_PUSH_DIAGNOSTIC="+json.dumps({
             "utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
             "listed_owned":len(all_rows),"exact_owned_slug_matches":matches,
             "native_named_kernel_matches":recent
          },sort_keys=True),flush=True)
          api=KaggleApi();api.authenticate()
          limit=api.competition_get_submission_limits("name-that-llm")
          print("NTL_NATIVE_SUBMISSION_QUOTA="+json.dumps({"allowed_now":limit.num_allowed_now,
            "limited_by_total":limit.limited_by_total},sort_keys=True),flush=True)
          print("NTL_NATIVE_NO_MUTATIONS_NO_GPU_NO_SUBMISSION=TRUE",flush=True)
          PY
