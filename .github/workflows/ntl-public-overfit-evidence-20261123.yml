name: NTL Public 0.715 vs 0.719 - factual LB overfit evidence audit
on:
  push:
    branches: [research/ntl-public-score-overfit-audit-20261123]
    paths:
      - .github/workflows/ntl-public-overfit-evidence-20261123.yml
permissions: {contents: read}
concurrency:
  group: ntl-public-overfit-once-20261123
  cancel-in-progress: false
jobs:
  read_only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install public Kaggle metadata client
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install -q --disable-pip-version-check 'kaggle==2.2.5' six==1.17.0
      - name: Print actual public LB metadata and hypothetical sensitivity, not a model evaluation
        run: |
          set -euo pipefail
          python -m py_compile scripts/ntl_public_lb_overfit_audit_20261123.py
          python -m scripts.ntl_public_lb_overfit_audit_20261123
          echo NTL_NO_TRAINING_NO_INFERENCE_NO_NEW_SUBMISSION_NO_TEST_LABEL_ACCESS=TRUE
