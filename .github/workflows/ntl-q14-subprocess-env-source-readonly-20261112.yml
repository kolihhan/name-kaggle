name: NTL Q14 Subprocess Environment Source Audit (read only)
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-q14-subprocess-env-source-readonly-20261112.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q 'kaggle==2.2.5' 'six==1.17.0'
      - name: Inspect only owned notebook's core worker environment setup and GPU metadata
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python - <<'PY'
          import pathlib,json,tempfile,subprocess,re
          ref='kolihhan/ntl-wemm-fullpath-3row-smoke-v1'
          root=pathlib.Path(tempfile.mkdtemp(prefix='ntl-env-src-'))
          p=subprocess.run(['kaggle','kernels','pull',ref,'-p',str(root),'-m'],
             capture_output=True,text=True,timeout=105)
          if p.returncode:raise RuntimeError('Private source unavailable')
          meta=json.loads((root/'kernel-metadata.json').read_text())
          print('NTL_Q14_ACTUAL_KERNEL_METADATA',json.dumps({
              'id':meta.get('id'),'machine_shape':meta.get('machine_shape'),
              'enable_gpu':meta.get('enable_gpu'),'enable_internet':meta.get('enable_internet'),
              'is_private':meta.get('is_private')
          },sort_keys=True),flush=True)
          notebook=json.loads(next(root.glob('*.ipynb')).read_text())
          found=[]
          for c in notebook['cells']:
              if c.get('cell_type')!='code':continue
              s=c.get('source',[])
              txt=''.join(s) if isinstance(s,list) else str(s)
              lines=txt.splitlines()
              if not lines or not lines[0].startswith('%%writefile'):continue
              target=lines[0].split('/')[-1]
              if target not in ('core_worker.py','ensemble.py'):continue
              keep=range(1,min(78,len(lines))+1) if target=='core_worker.py' else list(range(17,28))+list(range(78,86))
              fragment=[]
              for i in keep:
                  line=lines[i-1]
                  if re.search(r'(?:token\s*[=:]|password|secret|Bearer |api[_-]?key\s*[=:])',line,re.I):line='[REDACTED]'
                  if len(line)>300:line=line[:300]
                  fragment.append({'line':i,'source':line})
              found.append({'file':target,'lines':len(lines),'fragment':fragment})
          print('NTL_Q14_ENV_AND_WORKER_CODE',json.dumps(found,ensure_ascii=False),flush=True)
          PY
