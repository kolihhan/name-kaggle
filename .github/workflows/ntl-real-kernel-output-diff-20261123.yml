name: NTL existing 0.715 vs highscore kernel outputs: real disagreement only
on:
  push:
    branches: [research/ntl-highscore-realprediction-drift-20261123]
    paths:
      - .github/workflows/ntl-real-kernel-output-diff-20261123.yml
permissions: {contents: read}
concurrency:
  group: ntl-real-output-drift-20261123
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install metadata/Parquet reader only
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0 'pandas>=2,<3' 'pyarrow>=15,<25'
      - name: Compare exact existing kernel outputs by ID, aggregate only
        run: |
          set -euo pipefail
          python -m py_compile scripts/ntl_real_existing_kernel_output_disagreement_20261123.py
          python -m scripts.ntl_real_existing_kernel_output_disagreement_20261123
          echo NTL_NEVER_TRAIN_OR_INFER_OR_SUBMIT_TO_KAGGLE=TRUE
