name: NTL Apex typography original vs disabled source-faithful smoke CPU
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths:
      - .github/workflows/ntl-apex-typography-paired-20261119.yml
      - scripts/ntl_apex_typography_paired_20261119.py
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Inspect historical final18 diagnostic outputs without executing inference
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
          python - <<'PY'
          import subprocess, csv, io, json
          refs=['kolihhan/ntl-oleg216-final18-diagnostic-nov17',
                'kolihhan/ntl-oleg18-frozen0691-probe-nov16',
                'kolihhan/ntl-0702-apex-pinned-nov18']
          info=[]
          for ref in refs:
              s=subprocess.run(['kaggle','kernels','status',ref],capture_output=True,text=True,timeout=30)
              files=subprocess.run(['kaggle','kernels','files',ref,'-v','--page-size','200'],capture_output=True,text=True,timeout=35)
              rows=list(csv.DictReader(io.StringIO(files.stdout.lstrip('\ufeff')))) if files.returncode==0 else []
              names=[x.get('name','') for x in rows]
              info.append({'ref':ref,'status':(s.stdout+s.stderr).strip()[-220:],
                'files_accessible':files.returncode==0,
                'all_names':names[:65],
                'has_final18_logits':any('ntl_oleg216_final18_logits' in n for n in names),
                'has_final18_receipt':any('ntl_oleg216_final18_receipt' in n for n in names),
                'has_post_glm_npz':any(n.endswith('post-glm.npz') for n in names),
                'truncated':bool('Next Page Token =' in files.stdout),
                'no_Kaggle_GPU_or_scoring':True
              })
          print('NTL_APEX_PAIRED_OLD_REAL_LOGIT_ACCESS='+json.dumps(info,sort_keys=True),flush=True)
          PY
      - name: Verify exact scored Apex function and deterministic typography ON/OFF smoke, not accuracy
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check numpy==2.3.4 pandas==2.3.3 scipy==1.16.3 scikit-learn==1.7.2
          python -m py_compile scripts/ntl_apex_typography_paired_20261119.py
          mkdir -p /tmp/ntl-0702-audit-src
          kaggle kernels pull kolihhan/ntl-0702-apex-pinned-nov18 -p /tmp/ntl-0702-audit-src -m >/dev/null
          NB="$(find /tmp/ntl-0702-audit-src -maxdepth 1 -name '*.ipynb' -type f)"
          test -n "$NB"
          python -u -m scripts.ntl_apex_typography_paired_20261119 --notebook "$NB" --mode smoke
          echo NTL_APEX_NO_GPU_NO_MODEL_SCORING_NO_OFFICIAL_SUBMISSION=TRUE

      - name: Recover any retained nested scored-stage arrays (read-only CPU)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ntl-scored-output-census
          if kaggle kernels output kolihhan/ntl-0702-apex-pinned-nov18 -p /tmp/ntl-scored-output-census -o >/dev/null 2>&1; then
            python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          root=Path('/tmp/ntl-scored-output-census')
          paths=[p for p in root.rglob('*') if p.is_file()]
          staged=[]
          for p in paths:
              rel=p.relative_to(root).as_posix()
              if p.suffix.lower() not in ('.npz','.npy'):
                  continue
              item={'relative_name':rel, 'file_bytes':p.stat().st_size}
              try:
                  obj=np.load(p,allow_pickle=False,mmap_mode='r')
                  if isinstance(obj,np.lib.npyio.NpzFile):
                      item['arrays']=[{'key':k,'shape':list(obj[k].shape),'dtype':str(obj[k].dtype)} for k in obj.files]
                      obj.close()
                  else:
                      item['shape']=list(obj.shape)
                      item['dtype']=str(obj.dtype)
              except Exception as exc:
                  item['read_error_type']=type(exc).__name__
              staged.append(item)
          print('NTL_0702_RETAINED_STAGE_CENSUS='+json.dumps({
              'output_file_count':len(paths),
              'nested_file_count':sum('/' in p.relative_to(root).as_posix() for p in paths),
              'stage_array_count':len(staged),
              'stage_arrays':staged[:25],
              'has_final_logits':any('final-logits' in item['relative_name'] for item in staged),
              'has_post_glm':any('post-glm' in item['relative_name'] for item in staged),
              'NO_RAW_ROWS_OR_PREDICTIONS_LOGGED':True,
              'NO_GPU_NO_NEW_SUBMISSION':True},sort_keys=True),flush=True)
          PY
          else
            echo NTL_0702_RETAINED_OUTPUT=UNAVAILABLE_NO_RETRY_NO_GPU
          fi
          rm -rf /tmp/ntl-scored-output-census
