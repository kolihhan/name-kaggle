name: NTL Gemini observable expert vote diagnostic CPU
on:
  push:
    branches: [research/ntl-rcma-20261127]
    paths: [.github/workflows/ntl-gemini-observable-vote-20261128.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ntl_decompose_historical_oof_20261127.py
            scripts/ntl_gemini_observable_vote_20261128.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Execute fixed non-fitted sibling vote diagnostic
        run: |
          set -euo pipefail
          test ! -e data/train.csv
          python -m pip install -q kaggle==2.2.5 six==1.17.0 numpy pandas
          python -m py_compile scripts/ntl_gemini_observable_vote_20261128.py
          python -m scripts.ntl_gemini_observable_vote_20261128
