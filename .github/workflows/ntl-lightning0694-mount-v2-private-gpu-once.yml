name: "NTL 0694 actual mount-root fixed PRIVATE GPU version 2 one-shot"
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-lightning0694-mount-v2-private-gpu-once.yml]
permissions: {contents: read}
concurrency:
  group: ntl-lightning0694-mount-v2-exactly-once
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Build only from own frozen V1, prove resource fix, push single corrected GPU V2
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          test ! -e data/train.csv && test ! -e data/test.csv
          python -m py_compile scripts/ntl_lightning_0694_mount_repair_v2.py
          python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0
          TARGET=kolihhan/lightning-0-694-authentic-no-fit-inference
          mkdir -p /tmp/ntl-694-v1-freeze
          kaggle kernels pull "$TARGET" -m -p /tmp/ntl-694-v1-freeze >/dev/null
          if grep -lq '/kaggle/input/datasets/dhruvtibarewal/nlm-enc-v5' /tmp/ntl-694-v1-freeze/*.ipynb; then
            echo "NTL0694_PRIVATE_FIXED_V2_ALREADY_PRESENT_NO_DUPLICATE_GPU=TRUE"
            exit 0
          fi
          prior="$(kaggle kernels status "$TARGET" 2>&1 || true)"
          if [[ "$prior" != *KernelWorkerStatus.ERROR* ]]; then
            echo "NTL0694_V2_PREVIOUS_FROZEN_KERNEL_NOT_FAILED_STOP=TRUE"
            exit 1
          fi
          python -m scripts.ntl_lightning_0694_mount_repair_v2 \
              --frozen-own-v1 /tmp/ntl-694-v1-freeze \
              --out /tmp/ntl-694-mount-fixed-v2
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('/tmp/ntl-694-mount-fixed-v2')
          m=json.loads((p/'kernel-metadata.json').read_text())
          n=json.loads((p/m['code_file']).read_text())
          code='\n'.join(''.join(c['source']) for c in n['cells'] if c['cell_type']=='code')
          assert '/kaggle/input/datasets/dhruvtibarewal/nlm-enc-v5' in code
          assert '/kaggle/input/nlm-enc-v5' not in code
          assert 'gauss.fit(' not in code
          assert 'NO_NEW_TRAINING: Gaussian fit blocked' in code
          assert 'NO_NEW_TRAINING: Atlas training blocked' in code
          assert m['id']=='kolihhan/lightning-0-694-authentic-no-fit-inference'
          assert m['enable_gpu'] is True and m['enable_internet'] is False
          assert (len(m['dataset_sources']),len(m['model_sources']),len(m['kernel_sources']))==(23,6,9)
          print('NTL0694_V2_FROZEN_PRIVATE_SOURCE_AND_CPU_STATIC_MOUNTS=PASS',flush=True)
          PY
          kaggle kernels push -p /tmp/ntl-694-mount-fixed-v2 \
              --accelerator NvidiaTeslaT4 --timeout 32400 >/tmp/ntl694-v2-push.log 2>&1
          if ! grep -q 'Kernel version 2 successfully pushed' /tmp/ntl694-v2-push.log; then
            echo "NTL0694_V2_PUSH_VERSION_RECEIPT_NOT_CONFIRMED=TRUE"
            exit 1
          fi
          echo "NTL0694_V2_ONE_PRIVATE_GPU_KERNEL_VERSION_CONFIRMED=TRUE"
          echo "NTL0694_V2_TRAINING=FALSE;WEIGHTS_UNCHANGED=TRUE;OFFICIAL_SUBMISSION=FALSE"
