name: Resolve public Phase 7 external dataset

on:
  push:
    branches:
      - exp/first-kaggle-submission
    paths:
      - .github/workflows/resolve-public-external.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI
        run: python -m pip install 'kaggle==2.2.5'
      - name: Find public external dataset
        run: |
          set -euo pipefail
          kaggle datasets list -s 'extra GPT and Gemini generations' -v
          echo '--- files for likely candidates ---'
          python - <<'PY'
          import csv, subprocess
          out = subprocess.check_output([
              'kaggle','datasets','list','-s','extra GPT and Gemini generations','-v'
          ], text=True)
          rows = list(csv.DictReader(out.splitlines()))
          for row in rows[:10]:
              ref = row.get('ref') or row.get('Ref')
              if ref:
                  print(f'### {ref}')
                  subprocess.run(['kaggle','datasets','files',ref,'-v'], check=False)
          PY
