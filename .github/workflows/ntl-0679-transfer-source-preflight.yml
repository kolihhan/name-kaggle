name: NTL 0679 frozen source-transfer no-GPU preflight
on:
  push:
    branches: [research/attribution-bottleneck-review-20261106]
    paths: [.github/workflows/ntl-0679-transfer-source-preflight.yml]
permissions: {contents: read}
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/ntl_0679_transfer_private_once.py
            artifacts/research/ntl-0679-transfer-diagnostic/CONTRACT.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify public repo contains no official rows in checkout
        shell: bash
        run: |
          set -euo pipefail
          test ! -e data/train.csv
          test ! -e data/test.csv
          python -m py_compile scripts/ntl_0679_transfer_private_once.py
      - run: python -m pip install -q --disable-pip-version-check kaggle==2.2.5 six==1.17.0 nbformat==5.10.4
      - name: Private licensed corpus capsule source smoke check
        run: python -m py_compile scripts/ntl_0679_transfer_private_once.py
      - name: Frozen Kaggle private-source test; no GPU or submission
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python -u scripts/ntl_0679_transfer_private_once.py --preflight
